/* ================= 分支图（可视化节点连线图） ================= */
/* 节点=场景卡（缩略图/id/标记），边=跳转（choice/goto/require_else/check），分层布局+拖拽平移+滚轮缩放 */
function openBranchGraph() {
  $('branch-overlay').classList.remove('hidden');
  renderBranchGraph();
}
function renderBranchGraph() {
  const scenes = script.scenes;
  const ids = new Set(scenes.map(s => s.id));
  const idxOf = {}; scenes.forEach((s, i) => idxOf[s.id] = i);

  /* 收集边：{from, to, label, kind, si, li}  kind: choice/goto/require/check-ok/check-fail */
  const edges = [];
  const ghosts = new Set();
  scenes.forEach((s, si) => {
    const addEdge = (to, label, kind, li, oi, sub) => {
      if (!to) return;
      if (!ids.has(to)) ghosts.add(to);
      edges.push({ from: s.id, to, label, kind, si, li, oi, sub });
    };
    if (s.require_else) addEdge(s.require_else, '条件不满足', 'require', -1);
    (s.script || []).forEach((c, li) => {
      if (c.type === 'goto') addEdge(c.target, '跳转', 'goto', li);
      if (c.type === 'choice') (c.options || []).forEach((o, oi) =>
        addEdge(o.goto, (o.text || '').slice(0, 8) + (o.if ? ' [' + o.if + ']' : ''), 'choice', li, oi));
      if (c.type === 'check') {
        if (c.success && c.success.goto) addEdge(c.success.goto, '✓判定成功', 'check-ok', li, undefined, 'success');
        if (c.fail && c.fail.goto) addEdge(c.fail.goto, '✗判定失败', 'check-fail', li, undefined, 'fail');
      }
    });
  });

  /* 结局场景标记 */
  const endScenes = new Set();
  scenes.forEach(s => (s.script || []).forEach(c => { if (c.type === 'end') endScenes.add(s.id); }));

  /* 分层布局：按关系自然分层（无入边=第0层，其余=源最深+1，带步数上限防环发散）。
     不可达标记单独按「入口 BFS」计算——布局表达关系，标记表达可达性，互不干扰 */
  const adj = {};
  edges.forEach(e => { if (ids.has(e.to)) (adj[e.from] = adj[e.from] || []).push(e.to); });
  /* require 校验失败时会自动落入下一场景（引擎 enterScene 行为），这也是通路 */
  scenes.forEach((s, i) => { if (s.require && i + 1 < scenes.length) (adj[s.id] = adj[s.id] || []).push(scenes[i + 1].id); });
  /* 入口可达性（仅用于「不可达」角标） */
  const seen = new Set([scenes[0].id]);
  const queue = [scenes[0].id];
  while (queue.length) {
    const cur = queue.shift();
    (adj[cur] || []).forEach(nx => { if (!seen.has(nx)) { seen.add(nx); queue.push(nx); } });
  }
  const unreachable = scenes.filter(s => !seen.has(s.id)).map(s => s.id);
  /* 关系分层 */
  const indeg = {};
  edges.forEach(e => { if (ids.has(e.to)) (indeg[e.to] = indeg[e.to] || []).push(e.from); });
  const depth = {};
  scenes.forEach(s => { if (!(indeg[s.id] || []).length) depth[s.id] = 0; });
  let guard = scenes.length * 3, moved = true;
  while (moved && guard-- > 0) {
    moved = false;
    edges.forEach(e => {
      if (!ids.has(e.to) || depth[e.from] === undefined) return;
      const want = Math.min(depth[e.from] + 1, scenes.length);   /* 上限防环 */
      if (depth[e.to] === undefined || depth[e.to] < want) { depth[e.to] = want; moved = true; }
    });
  }
  scenes.forEach(s => { if (depth[s.id] === undefined) depth[s.id] = 0; });
  const maxDepth = Math.max(0, ...Object.values(depth));
  /* 层内行号 */
  const rowOf = {}, layerCount = {};
  scenes.forEach(s => {
    const d = depth[s.id];
    rowOf[s.id] = layerCount[d] || 0;
    layerCount[d] = (layerCount[d] || 0) + 1;
  });
  ghosts.forEach((g, ) => {}); /* 幽灵节点目标不存在的场景：画在源场景下一行 */
  const NW = 170, NH = 74, GAPX = 90, GAPY = 26;
  const pos = {};
  scenes.forEach(s => { pos[s.id] = { x: depth[s.id] * (NW + GAPX), y: rowOf[s.id] * (NH + GAPY) }; });
  /* 幽灵节点定位在源节点下方 */
  const ghostPos = {};
  let ghostSeq = 0;
  edges.filter(e => !ids.has(e.to)).forEach(e => {
    if (!ghostPos[e.to]) ghostPos[e.to] = { x: pos[e.from].x + NW + GAPX / 2, y: pos[e.from].y + NH + 40 + (ghostSeq++) * 30 };
  });

  const world = $('branch-world');
  world.querySelectorAll('.br-node,.br-ghost').forEach(n => n.remove());
  const svg = $('branch-svg');
  const W = (maxDepth + 2) * (NW + GAPX) + 400, H = (Math.max(0, ...Object.values(layerCount)) + 1) * (NH + GAPY) + 200;
  svg.setAttribute('width', W); svg.setAttribute('height', H);
  world.style.width = W + 'px'; world.style.height = H + 'px';

  /* 画边（贝塞尔曲线 + 标签） */
  const COLORS = { choice: '#7fa0d0', goto: '#9ab', require: '#e74c3c', 'check-ok': '#7fd07f', 'check-fail': '#d8b93a' };
  svg.innerHTML = '<defs><marker id="br-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#7fa0d0"/></marker></defs>';
  edges.forEach((e, ei) => {
    const p1 = pos[e.from], p2 = ids.has(e.to) ? pos[e.to] : ghostPos[e.to];
    if (!p1 || !p2) return;
    const x1 = p1.x + NW, y1 = p1.y + NH / 2, x2 = p2.x, y2 = p2.y + NH / 2;
    const mx = (x1 + x2) / 2;
    const col = COLORS[e.kind] || '#7fa0d0';
    const dash = (e.kind === 'require' || !ids.has(e.to)) ? ' stroke-dasharray="5,4"' : '';
    svg.innerHTML += `<path class="br-edge" data-ei="${ei}" d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}"
      fill="none" stroke="${col}" stroke-width="1.6"${dash} marker-end="url(#br-arrow)" style="cursor:pointer">
      <title>${e.from} 第${e.li + 1}条 → ${e.to}（${e.label}）</title></path>` +
      (e.label ? `<text x="${mx}" y="${(y1 + y2) / 2 - 4}" fill="${col}" font-size="10" text-anchor="middle" pointer-events="none">${e.label.slice(0, 14)}</text>` : '');
  });
  /* 边点击：高亮 + 底部信息条显示来源 */
  svg.querySelectorAll('.br-edge').forEach(pe => pe.addEventListener('click', () => {
    svg.querySelectorAll('.br-edge').forEach(x => x.setAttribute('stroke-width', '1.6'));
    pe.setAttribute('stroke-width', '3.5');
    const e = edges[parseInt(pe.dataset.ei, 10)];
    $('branch-info').innerHTML = `边：${e.from} 第${e.li + 1}条 → <b>${e.to}</b>（${e.kind} ${e.label}） ` +
      (e.li >= 0 ? `<a href="javascript:void 0" id="branch-edge-jump" style="color:#ffd75e">跳到该指令</a>` : '') +
      ` <a href="javascript:void 0" id="branch-edge-retarget" style="color:#7fa0d0">✎改目标</a>` +
      ` <a href="javascript:void 0" id="branch-edge-del" style="color:#e74c3c">🗑删除</a>`;
    const j = $('branch-edge-jump');
    if (j) j.onclick = () => {
      $('branch-overlay').classList.add('hidden');
      selectEditorScene(e.si);
      previewLine(script.scenes[e.si], e.li);
    };
    $('branch-edge-retarget').onclick = () => {
      pickJumpTarget($('branch-info'), e.to, v => { brEdgeSetTarget(e, v); brAfterEdit(); });
    };
    $('branch-edge-del').onclick = () => {
      if (!confirm(`删除跳转：${e.from} → ${e.to}（${e.kind}）？`)) return;
      brEdgeDelete(e); brAfterEdit();
    };
  }));

  /* 画节点 */
  scenes.forEach((s, i) => {
    const n = document.createElement('div');
    n.className = 'br-node';
    n.dataset.sid = s.id;
    const isEnd = endScenes.has(s.id), noReach = unreachable.includes(s.id);
    const bg = s.background && s.background !== 'none' ? `background:url('${assetUrl(s.background)}') center/cover` : 'background:#1a2233';
    n.style.cssText = `position:absolute;left:${pos[s.id].x}px;top:${pos[s.id].y}px;width:${NW}px;height:${NH}px;
      border:1px solid ${noReach ? '#666' : '#3a4a63'};border-radius:6px;overflow:hidden;cursor:pointer;
      ${bg};opacity:${noReach ? 0.45 : 1}`;
    n.innerHTML = `<div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,8,15,.25),rgba(5,8,15,.88))"></div>
      <div style="position:absolute;left:6px;right:6px;bottom:4px;font-size:11px;font-weight:bold">${s.id}
        ${s.checkpoint ? ' ★' : ''}${isEnd ? ' 🏁' : ''}${noReach ? ' <span style="color:#d8b93a">不可达</span>' : ''}</div>`;
    /* 连边手柄：拖到别的节点建跳转 */
    const handle = document.createElement('div');
    handle.className = 'br-handle';
    handle.textContent = '▶';
    handle.title = '按住拖到目标场景：创建分支跳转';
    handle.style.cssText = `position:absolute;right:-7px;top:50%;margin-top:-9px;width:18px;height:18px;border-radius:50%;
      background:#4a6da0;color:#fff;font-size:9px;line-height:18px;text-align:center;cursor:crosshair;z-index:3`;
    handle.addEventListener('mousedown', ev => { ev.stopPropagation(); ev.preventDefault(); brLinkStart(s.id, ev); });
    n.appendChild(handle);
    /* 右键菜单：编辑/重命名/删除场景 */
    n.oncontextmenu = ev => { ev.preventDefault(); ev.stopPropagation(); brNodeMenu(s, i, ev.clientX, ev.clientY); };
    n.title = (s.script[0] && (s.script[0].text || '')).slice(0, 40);
    n.onclick = () => {
      world.querySelectorAll('.br-node').forEach(x => x.style.outline = '');
      n.style.outline = '2px solid #ffd75e';
      const chars = (s.chars || []).map(c => (script.characters[c.id] || {}).name || c.id).join('、') || '无';
      $('branch-info').innerHTML = `<b>${s.id}</b> · 指令 ${(s.script || []).length} 条 · 出场 ${chars} · 双击进入编辑`;
    };
    n.ondblclick = () => {
      $('branch-overlay').classList.add('hidden');
      selectEditorScene(i);
    };
    world.appendChild(n);
  });
  /* 幽灵节点（悬空目标） */
  Object.keys(ghostPos).forEach(g => {
    const n = document.createElement('div');
    n.className = 'br-ghost';
    n.style.cssText = `position:absolute;left:${ghostPos[g].x}px;top:${ghostPos[g].y}px;padding:2px 8px;
      border:1px dashed #e74c3c;border-radius:4px;color:#e74c3c;font-size:11px;background:rgba(20,10,10,.8)`;
    n.textContent = '? ' + g;
    n.title = '悬空引用：目标场景不存在';
    world.appendChild(n);
  });

  /* 统计头 + 简表 */
  const dangling = edges.filter(e => !ids.has(e.to)).length;
  $('branch-stats').textContent = `场景 ${scenes.length} · 结局 ${endScenes.size} · 跳转 ${edges.length} · 悬空 ${dangling} · 不可达 ${unreachable.length}`;
  $('branch-simple').innerHTML = buildBranchGraph();

  /* 平移缩放（幂等绑定） */
  const cv = $('branch-canvas');
  if (!cv._brBound) {
    cv._brBound = true;
    let pan = { x: 20, y: 20 }, scale = 1, drag = null;
    const apply = () => { world.style.transform = `translate(${pan.x}px,${pan.y}px) scale(${scale})`; cv._pan = pan; cv._scale = scale; };
    apply();
    cv.addEventListener('mousedown', ev => {
      if (ev.target.closest('.br-node,.br-ghost,.br-edge')) return;
      drag = { x: ev.clientX - pan.x, y: ev.clientY - pan.y };
      cv.style.cursor = 'grabbing';
    });
    window.addEventListener('mousemove', ev => { if (drag) { pan = { x: ev.clientX - drag.x, y: ev.clientY - drag.y }; apply(); } });
    window.addEventListener('mouseup', () => { drag = null; cv.style.cursor = 'grab'; });
    cv.addEventListener('wheel', ev => {
      ev.preventDefault();
      scale = Math.min(1.5, Math.max(0.4, scale * (ev.deltaY < 0 ? 1.12 : 0.89)));
      apply();
    }, { passive: false });
  }
  $('branch-info').innerHTML = '点击节点看摘要 · 双击进入编辑 · 右键节点菜单 · 拖节点▶手柄连边建分支 · 点边可改目标/删除 · 空白拖拽平移 · 滚轮缩放';
}


/* ---- 分支图编辑操作（连边/改目标/删边/节点菜单） ---- */
/* 改目标 / 删边后的统一收尾：重渲编辑器+分支图+入撤销栈 */
function brAfterEdit() {
  if (edSceneIdx >= 0) selectEditorScene(edSceneIdx); else refreshEditorScenes();
  renderBranchGraph();
}
/* 按边类型把目标写回剧本 */
function brEdgeSetTarget(e, v) {
  const sc = script.scenes[e.si];
  if (e.kind === 'require') { if (v) sc.require_else = v; else delete sc.require_else; return; }
  const cmd = sc.script[e.li];
  if (!cmd) return;
  if (e.kind === 'goto') { if (v) cmd.target = v; else delete cmd.target; }
  else if (e.kind === 'choice') { const o = (cmd.options || [])[e.oi]; if (o) { if (v) o.goto = v; else delete o.goto; } }
  else if (e.kind === 'check-ok' || e.kind === 'check-fail') {
    const o = cmd[e.sub]; if (o) { if (v) o.goto = v; else delete o.goto; }
  }
}
/* 删除边对应的跳转（goto=删整条指令；choice=删该选项；check=删分支goto；require=删require_else） */
function brEdgeDelete(e) {
  const sc = script.scenes[e.si];
  if (e.kind === 'require') { delete sc.require_else; return; }
  const cmd = sc.script[e.li];
  if (!cmd) return;
  if (e.kind === 'goto') sc.script.splice(e.li, 1);
  else if (e.kind === 'choice') {
    cmd.options.splice(e.oi, 1);
    if (!cmd.options.length) sc.script.splice(e.li, 1);   /* 选项删光连 choice 一起删 */
  }
  else if (e.kind === 'check-ok' || e.kind === 'check-fail') { if (cmd[e.sub]) delete cmd[e.sub].goto; }
}
/* 拖手柄连边：from → 目标节点，松手弹出建边方式 */
function brLinkStart(fromId, ev0) {
  const cv = $('branch-canvas'), svg = $('branch-svg'), world = $('branch-world');
  const fromEl = [...world.querySelectorAll('.br-node')].find(n => n.dataset.sid === fromId);
  if (!fromEl) return;
  const toWorld = ev => {
    const r = cv.getBoundingClientRect();
    const p = cv._pan || { x: 20, y: 20 }, sc2 = cv._scale || 1;
    return { x: (ev.clientX - r.left - p.x) / sc2, y: (ev.clientY - r.top - p.y) / sc2 };
  };
  const sx = parseFloat(fromEl.style.left) + 170, sy = parseFloat(fromEl.style.top) + 37;
  const tmp = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  tmp.setAttribute('stroke', '#ffd75e'); tmp.setAttribute('stroke-width', '2.5');
  tmp.setAttribute('stroke-dasharray', '6,4'); tmp.setAttribute('fill', 'none');
  svg.appendChild(tmp);
  const move = ev => {
    const w = toWorld(ev);
    tmp.setAttribute('d', 'M' + sx + ',' + sy + ' C' + ((sx + w.x) / 2) + ',' + sy + ' ' + ((sx + w.x) / 2) + ',' + w.y + ' ' + w.x + ',' + w.y);
  };
  const up = ev => {
    window.removeEventListener('mousemove', move); window.removeEventListener('mouseup', up);
    tmp.remove();
    const el = document.elementFromPoint(ev.clientX, ev.clientY);
    const node = el && el.closest('.br-node');
    if (!node || node.dataset.sid === fromId) return;
    brLinkMenu(fromId, node.dataset.sid, ev.clientX, ev.clientY);
  };
  window.addEventListener('mousemove', move);
  window.addEventListener('mouseup', up);
}

function buildBranchGraph() {
  const ids = script.scenes.map(s=>s.id);
  const lines = [];
  script.scenes.forEach((sc, i) => {
    const targets = [];
    (sc.script||[]).forEach(cmd => {
      if (cmd.type==='goto' && cmd.target) targets.push(cmd.target);
      if (cmd.type==='choice') (cmd.options||[]).forEach(o => { if (o.goto) targets.push(o.goto); });
    });
    if (targets.length === 0 && i+1 < ids.length) targets.push(ids[i+1]);
    targets.forEach(t => {
      const cond = '';
      lines.push(`<span style="color:#7fa0d0">${sc.id}</span> → <span style="color:#ffd75e">${t}</span>${cond}`);
    });
  });
  return lines.join('<br>') || '(无分支)';
}

    const b = document.createElement('div'); b.className = 'tl-block ' + cmd.type;
    b.style.left = (idx/total*100)+'%'; b.style.width = Math.max(4, (100/total))+'%';
    b.textContent = cmd.type==='narrate'?'📖'+(cmd.text||'').slice(0,8):cmd.type==='say'?'💬'+(script.characters[cmd.who]||{}).name:cmd.type==='choice'?'🔀'+(cmd.options||[]).length+'选':'';
    b.title = (cmd.text||'').slice(0,40);
    b.dataset.idx = idx;
    /* 色块可拖拽：拖到「剪辑」行的空隙上即重排 */
    b.draggable = true;
    b.ondragstart = ev => { ev.dataTransfer.setData('text/plain', 'cmd:' + idx); b.classList.add('dragging'); };
    b.ondragend = () => b.classList.remove('dragging');
    b.onclick = (ev) => { ev.stopPropagation(); previewLine(sc, idx); };
    b.oncontextmenu = ev => { ev.preventDefault(); sc.script.splice(idx,1); selectEditorScene(edSceneIdx); return false; };
    dBlocks.appendChild(b);
  });
  // Character matrix: dynamic rows per character, 3-state cells
  ensureMatrix(sc);
  const charContainer = $('tl-chars-container');
  if (charContainer) {
    charContainer.innerHTML = '';
    /* 事件委托：整片矩阵格（可达数百个）共用容器上一个监听器，避免逐格绑定 */
    if (!charContainer._delegated) {
      charContainer._delegated = true;
      charContainer.onclick = ev => {
        const cell = ev.target.closest('.tl-block[data-cid]');
        if (!cell) return;
        const sc2 = script.scenes[edSceneIdx];
        if (!sc2 || !sc2._charMatrix || !sc2._charMatrix[cell.dataset.cid]) return;
        ev.stopPropagation();
        const cid = cell.dataset.cid, ix = +cell.dataset.idx;
        sc2._charMatrix[cid][ix] = ((sc2._charMatrix[cid][ix] ?? 0) + 1) % 3;
        edActiveChar = cid;
        edChanged();
        renderTimeline(sc2);
      };
    }
    const cellW = Math.max(4, (100/total));
    (sc.chars||[]).forEach(function(c) {
      const row = document.createElement('div'); row.className = 'tl-char-row';
      row.innerHTML = '<span class="tl-label">'+(script.characters[c.id]||{}).name+'</span><div class="tl-blocks"></div>';
      const blocks = row.querySelector('.tl-blocks');
      for (var idx = 0; idx < total; idx++) {
        const cell = document.createElement('div');
        cell.className = 'tl-block';
        cell.style.left = (idx/total*100)+'%'; cell.style.width = cellW+'%';
        const state = sc._charMatrix[c.id]?.[idx] ?? 0;
        const cmd = sc.script[idx];
        const isSpeaking = cmd && cmd.type==='say' && cmd.who===c.id;
        cell.style.background = state===2 ? (isSpeaking?'#2d6a3d':'rgba(200,200,255,.15)') : state===1 ? 'rgba(100,100,120,.12)' : 'transparent';
        cell.style.border = state>=1 ? '1px solid rgba(255,255,255,.2)' : '1px dotted rgba(80,80,80,.3)';
        cell.textContent = isSpeaking ? '💬' : (state===2?'●':state===1?'○':'·');
        cell.title = (script.characters[c.id]||{}).name+' 第'+idx+'条 | '+(['不出现','暗色','出现'][state])+' | 点击切换';
        cell.style.cursor = 'pointer';
        cell.dataset.cid = c.id; cell.dataset.idx = idx;
        blocks.appendChild(cell);
      }
      charContainer.appendChild(row);
    });
    // Unmatched speakers row
    var unmatched = new Set();
    (sc.script||[]).forEach(function(cmd) { if (cmd.type==='say' && !(sc.chars||[]).some(function(c){return c.id===cmd.who;})) unmatched.add(cmd.who); });
    if (unmatched.size) {
      var urow = document.createElement('div'); urow.className = 'tl-char-row'; urow.style.opacity = '0.5';
      urow.innerHTML = '<span class="tl-label">+添加</span><div class="tl-blocks"></div>';
      var ublocks = urow.querySelector('.tl-blocks');
      unmatched.forEach(function(who) {
        var b = document.createElement('div'); b.className = 'tl-block char-block';
        b.style.border = '1px dashed #fa0'; b.style.left = '0%'; b.style.width = 'auto';
        b.textContent = ' +'+script.characters[who].name;
        b.onclick = function() { ensureCharInScene(sc, who, 'normal'); selectEditorScene(edSceneIdx); };
        ublocks.appendChild(b);
      });
      charContainer.appendChild(urow);
    }
  }
  // Audio track: BGM, SFX
  const aBlocks = document.querySelector('#tl-audio .tl-blocks'); aBlocks.innerHTML = '';
  if (sc.bgm) {
    const b = document.createElement('div'); b.className = 'tl-block bgm-block';
    b.style.left = '0%'; b.style.width = '100%';
    const bsrc = typeof sc.bgm==='object'?sc.bgm.src:sc.bgm;
    b.textContent = '🎵'+(bsrc||'').replace('bgm/','').replace('.mp3','');
    aBlocks.appendChild(b);
  }
  const sfxList = sc.sfx ? (Array.isArray(sc.sfx)?sc.sfx:[sc.sfx]) : [];
  sfxList.forEach((sfx, si) => {
    const b = document.createElement('div'); b.className = 'tl-block sfx-block';
    b.style.left = (si*8)+'%'; b.style.width = '8%';
    const ssrc = typeof sfx==='object'?sfx.src:sfx;
    b.textContent = '🔊'+(ssrc||'').replace('sfx/','').replace('.wav','');
    aBlocks.appendChild(b);
  });
  // Other track: set, goto, end, show, inspect, check
  const oBlocks = document.querySelector('#tl-other .tl-blocks'); oBlocks.innerHTML = '';
  (sc.script||[]).forEach((cmd, idx) => {
    if (!['set','goto','end','show','inspect','check','mark'].includes(cmd.type)) return;
    const b = document.createElement('div'); b.className = 'tl-block ' + cmd.type;
    b.style.left = (idx/total*100)+'%'; b.style.width = Math.max(4, (100/total))+'%';
    b.textContent = cmd.type==='set'?'⚙'+Object.keys(cmd.vars||{}).join(','):cmd.type==='goto'?'⏭'+cmd.target:cmd.type==='end'?'🏁'+cmd.label:cmd.type==='show'?'🖼CG':cmd.type==='inspect'?'🔍':cmd.type==='check'?'🎲'+(cmd.text||cmd.attr||'判定'):cmd.type==='mark'?'⚓'+(cmd.id||''):'';
    b.dataset.idx = idx;
    /* 逻辑轨色块同样可拖拽重排 */
    b.draggable = true;
    b.ondragstart = ev => { ev.dataTransfer.setData('text/plain', 'cmd:' + idx); b.classList.add('dragging'); };
    b.ondragend = () => b.classList.remove('dragging');
    b.onclick = (ev) => { ev.stopPropagation(); previewLine(sc, idx); };
    b.oncontextmenu = ev => { ev.preventDefault(); sc.script.splice(idx,1); selectEditorScene(edSceneIdx); return false; };
    oBlocks.appendChild(b);
  });
}

/* ================= 帧模式胶片条 + 站位系统（设计稿 v1 第四/五节） ================= */
/* 预设五位（y=1.0 底线）与三档景别 */
const ED_POS_PRESETS = [['far-left',0.10],['left',0.28],['center',0.50],['right',0.72],['far-right',0.90]];
const ED_SCALE_PRESETS = [['远',0.75],['中',0.85],['近',1.0]];
/* 场景内锚点清单 */
function sceneMarks(sid) {
  const s = (script.scenes || []).find(x => x.id === sid);
  return s ? (s.script || []).filter(c => c.type === 'mark').map(c => c.id) : [];
}
/* 跳转目标选择器：先选场景，目标场景有 ⚓锚点 时二级选落点（场景头/某锚点）；onDone('')=继续 */
function pickJumpTarget(anchorEl, current, onDone, curSid) {
  /* 本场景锚点在一级网格置顶，同场景跳转一步直达 */
  const localMarks = curSid ? sceneMarks(curSid).map(m => ({ value: curSid + ':' + m, label: '本场景·锚点 ' + m, icon: '⚓' })) : [];
  const items = localMarks.length ? localMarks.concat(sceneGridItems(true)) : sceneGridItems(true);
  openAssetGrid(anchorEl, { title: '选择跳转目标场景' + (localMarks.length ? '（本场景锚点已置顶）' : ''), items, current: current || '',
    onPick: v => {
      if (!v) { onDone(''); return; }
      const marks = sceneMarks(v);
      if (!marks.length) { onDone(v); return; }
      setTimeout(() => openAssetGrid(anchorEl, {
        title: '「' + v + '」的落点',
        items: [{ value: v, label: '从场景头开始', icon: '🎬' }].concat(marks.map(m => ({ value: v + ':' + m, label: '锚点 ' + m, icon: '⚓' }))),
        current: '',
        onPick: v2 => onDone(v2 || v)
      }), 0);
    } });
}
/* 锚点感知的悬空检查：null=正常 */
function jumpErr(curSceneId, ref) {
  if (!ref) return null;
  const pr = String(ref).split(':');
  const sid = pr.length > 1 ? (pr[0] || curSceneId) : pr[0];
  const ts = (script.scenes || []).find(x => x.id === sid);
  if (!ts) return '跳转场景 "' + sid + '" 不存在';
  if (pr.length > 1 && !(ts.script || []).some(c => c.type === 'mark' && c.id === pr[1]))
    return '锚点 "' + pr[1] + '" 在 "' + sid + '" 不存在';
  return null;
}

/* 帧状态推演：每帧在场人物（场景头 chars + say 自动补位，补位规则同引擎：center→left→right 首个空槽） */
function frameStates(sc) {
  const slotX = { left:0.28, center:0.50, right:0.72 };
  const cur = (sc.chars || []).map(c => ({
    id: c.id, sprite: c.sprite || 'normal',
    x: c.x !== undefined ? c.x : (slotX[c.pos] !== undefined ? slotX[c.pos] : 0.5)
  }));
  const states = [];
  (sc.script || []).forEach(cmd => {
    if (cmd.type === 'say' && !cur.some(c => c.id === cmd.who)) {
      const free = [0.50, 0.28, 0.72].find(x => !cur.some(c => c.x === x));
      cur.push({ id: cmd.who, sprite: 'normal', x: free !== undefined ? free : 0.5, auto: true });
    }
    states.push(cur.map(c => ({ ...c })));
  });
  return states;
}
function renderFrameStrip(sc) {
  const wrap = $('tl-frames');
  if (!wrap) return;
  wrap.innerHTML = '';
  const cmds = sc.script || [];
  const sceneIds = new Set(script.scenes.map(s => s.id));
  const states = frameStates(sc);
  const bgPath = sc.background;
  let prevIds = [];
  /* 场景级悬空：require_else 指向不存在的场景 → 第一帧红框 */
  const sceneDangling = sc.require_else && !sceneIds.has(sc.require_else) ? 'require_else "' + sc.require_else + '" 不存在' : '';

  /* 帧间隙：点 += 指令选择盘；拖帧到此 = 重排（逻辑同轨道剪辑行） */
  const mkGap = i => {
    const g = document.createElement('div');
    g.className = 'tl-fgap'; g.dataset.gap = i;
    g.title = '在第 ' + i + ' 条后插入指令（或拖帧到此重排）';
    g.onclick = ev => { ev.stopPropagation(); openCmdPalette(g, i); };
    g.ondragover = ev => { ev.preventDefault(); g.classList.add('drop-hi'); };
    g.ondragleave = () => g.classList.remove('drop-hi');
    g.ondrop = ev => {
      ev.preventDefault(); g.classList.remove('drop-hi');
      const m = ev.dataTransfer.getData('text/plain').match(/^cmd:(\d+)$/);
      if (!m) return;
      const from = parseInt(m[1], 10);
      let to = i;
      if (from === to || from + 1 === to) return; /* 原地不动 */
      const [moved] = sc.script.splice(from, 1);
      if (from < to) to--;
      sc.script.splice(to, 0, moved);
      selectEditorScene(edSceneIdx);
      previewLine(sc, to);
    };
    return g;
  };
  wrap.appendChild(mkGap(0));

  cmds.forEach((cmd, idx) => {
    const fr = document.createElement('div');
    fr.className = 'tl-frame' + (idx === edPreviewLine ? ' sel' : '');
    fr.dataset.idx = idx;
    fr.draggable = true;
    fr.ondragstart = ev => { ev.dataTransfer.setData('text/plain', 'cmd:' + idx); fr.classList.add('dragging'); };
    fr.ondragend = () => fr.classList.remove('dragging');
    fr.onclick = ev => { ev.stopPropagation(); previewLine(sc, idx); };
    fr.oncontextmenu = ev => { ev.preventDefault(); sc.script.splice(idx, 1); selectEditorScene(edSceneIdx); return false; };

    /* 帧画面：背景缩略图 + 在场人物立绘 + 底部文字 */
    const shot = document.createElement('div');
    shot.className = 'fr-shot';
    if (bgPath && bgPath !== 'none') {
      const img = document.createElement('img');
      img.className = 'fr-bg'; img.decoding = 'async'; img.alt = '';
      img.onerror = () => img.remove();
      img.src = assetUrl(bgPath);
      shot.appendChild(img);
    } else if (bgPath === 'none') {
      const d = document.createElement('div'); d.className = 'fr-black'; shot.appendChild(d);
    } else {
      const d = document.createElement('div'); d.className = 'fr-nobg'; shot.appendChild(d);
    }
    (states[idx] || []).forEach(c => {
      const p = spritePath(c.id, c.sprite);
      if (!p) return;
      const img = document.createElement('img');
      img.className = 'fr-char'; img.decoding = 'async'; img.alt = '';
      img.style.left = (c.x * 100) + '%';
      img.onerror = () => img.remove();
      img.src = assetUrl(p);
      shot.appendChild(img);
    });
    /* 变化角标：▲入场 ▼出场（相对上一帧）+ 指令类型角标 */
    const ids = (states[idx] || []).map(c => c.id);
    const entered = ids.filter(id => !prevIds.includes(id));
    const gone = prevIds.filter(id => !ids.includes(id));
    const badges = [];
    if (idx === 0 && ids.length) badges.push('▲×' + ids.length);
    else {
      if (entered.length) badges.push('▲' + entered.map(id => (script.characters[id] || {}).name || id).join(','));
      if (gone.length) badges.push('▼' + gone.map(id => (script.characters[id] || {}).name || id).join(','));
    }
    const typeBadge = { show:'🖼', choice:'🔀', set:'⚙', goto:'⏭', end:'🏁', inspect:'🔍', check:'🎲', mark:'⚓' }[cmd.type];
    if (typeBadge) badges.push(typeBadge);
    prevIds = ids;
    if (badges.length) {
      const b = document.createElement('div');
      b.className = 'fr-badges'; b.textContent = badges.join(' ');
      shot.appendChild(b);
    }
    const txt = cmd.type === 'narrate' ? '📖' + (cmd.text || '') :
      cmd.type === 'say' ? (((script.characters[cmd.who] || {}).name || cmd.who) + ':' + (cmd.text || '')) :
      cmd.type === 'choice' ? '🔀' + (cmd.options || []).map(o => o.text).join('/') :
      cmd.type === 'set' ? '⚙' + Object.keys(cmd.vars || {}).join(',') :
      cmd.type === 'goto' ? '⏭' + (cmd.target || '?') :
      cmd.type === 'end' ? '🏁' + (cmd.label || '') :
      cmd.type === 'show' ? '🖼' + (cmd.image || '').split('/').pop() :
      cmd.type === 'inspect' ? '🔍调查' :
      cmd.type === 'check' ? '🎲' + (cmd.text || cmd.attr || '判定') : cmd.type;
    const te = document.createElement('div');
    te.className = 'fr-text'; te.textContent = txt;
    shot.appendChild(te);
    fr.appendChild(shot);

    /* 帧下跳转 chip：点击弹场景缩略图网格改目标 */
    const chips = document.createElement('div');
    chips.className = 'fr-chips';
    const dangling = [];
    if (idx === 0 && sceneDangling) dangling.push(sceneDangling);
    const mkChip = (label, target, apply) => {
      const c = document.createElement('span');
      c.className = 'fr-chip';
      c.textContent = label;
      const jerr = jumpErr(sc.id, target);   /* 悬空/锚点缺失：chip 标红 + 帧卡红框 */
      if (jerr) {
        dangling.push(jerr);
        c.style.borderColor = '#e74c3c'; c.style.color = '#ff8a7a';
      }
      c.onclick = ev => {
        ev.stopPropagation();
        pickJumpTarget(c, target, v => { apply(v); selectEditorScene(edSceneIdx); previewLine(sc, idx); }, sc.id);
      };
      chips.appendChild(c);
    };
    if (cmd.type === 'goto') {
      const branches = (cmd.branches && cmd.branches.length) ? cmd.branches : [{ target: cmd.target }];
      branches.forEach((b, bi) => mkChip('→ ' + (b.target || '?'), b.target, v => {
        if (cmd.branches && cmd.branches.length) cmd.branches[bi].target = v;
        else { cmd.target = v; if (!v) delete cmd.target; }
      }));
      if (cmd.else_target) mkChip('else→ ' + cmd.else_target, cmd.else_target,
        v => { cmd.else_target = v || undefined; if (!v) delete cmd.else_target; });
    } else if (cmd.type === 'choice') {
      (cmd.options || []).forEach(o => mkChip(o.goto ? '→ ' + o.goto : '继续', o.goto,
        v => { o.goto = v || undefined; if (!v) delete o.goto; }));
    } else if (cmd.type === 'check') {
      /* 判定帧卡：成功/失败两个跳转 chip（无跳转则顺序继续） */
      [['✓', 'success'], ['✗', 'fail']].forEach(([mark, key]) => {
        const o = cmd[key];
        if (o && o.goto) mkChip(mark + '→ ' + o.goto, o.goto, v => { o.goto = v || undefined; if (!v) delete o.goto; });
      });
    } else if (cmd.type === 'end') {
      const c = document.createElement('span');
      c.className = 'fr-chip end'; c.textContent = '🏁' + (cmd.label || '结局');
      chips.appendChild(c);
    }
    if (chips.children.length) fr.appendChild(chips);
    if (dangling.length) { fr.classList.add('dangling'); fr.title = '悬空引用: ' + dangling.join('；'); }
    wrap.appendChild(fr);
    wrap.appendChild(mkGap(idx + 1));
  });
}

/* ---- 站位参考线 / 吸附 / 缩放滑杆 ---- */
function buildGuides() {
  const g = $('se-guides');
  if (!g || g.childElementCount) return;
  ED_POS_PRESETS.forEach(([name, x]) => {
    const v = document.createElement('div');
    v.className = 'se-guide-v'; v.dataset.name = name; v.dataset.x = x;
    v.style.left = (x * 100) + '%';
    g.appendChild(v);
  });
  const b = document.createElement('div'); b.className = 'se-guide-base';
  g.appendChild(b);
}
/* 拖拽经过参考线 ±3% 时高亮最近格 */
function hiGuide(x) {
  document.querySelectorAll('.se-guide-v').forEach(v =>
    v.classList.toggle('hi', Math.abs(parseFloat(v.dataset.x) - x) <= 0.03));
}
/* 松手吸附：±3% 内吸到预设位并对齐 y=1.0 底线；越界夹紧 */
function snapCharPos(c) {
  c.x = Math.min(0.98, Math.max(0.02, c.x));
  c.y = Math.min(1.2, Math.max(0.7, c.y));
  const hit = ED_POS_PRESETS.find(p => Math.abs(p[1] - c.x) <= 0.03);
  if (hit) { c.x = hit[1]; c.y = 1.0; }
}
/* 点选角色后底部缩放滑杆显隐与回填 */
function edUpdateScaleBar() {
  const w = $('se-scale-wrap');
  if (!w) return;
  const c = edCharsList[edCharSel];
  if (edCharSel < 0 || !c) { w.classList.add('hidden'); return; }
  w.classList.remove('hidden');
  $('se-scale-name').textContent = (script.characters[c.id] || {}).name || c.id;
  $('se-scale-slider').value = c.scale;
  $('se-scale-val').textContent = Number(c.scale).toFixed(2);
}
/* 名牌菜单底部：预设站位 + 景别 chips（写入自由坐标 x/y/scale，不动 pos 三槽 schema） */
function stationFooter(cid) {
  const box = document.createElement('div');
  box.style.cssText = 'margin-top:.4em;border-top:1px solid #3a4a63;padding-top:.4em';
  const ec = () => edCharsList.find(c => c.id === cid);
  const mkRow = (label, defs, apply) => {
    const row = document.createElement('div');
    row.style.cssText = 'display:flex;gap:3px;align-items:center;margin:2px 0;flex-wrap:wrap';
    const lb = document.createElement('span');
    lb.style.cssText = 'font-size:.62em;opacity:.6;width:2.6em';
    lb.textContent = label;
    row.appendChild(lb);
    defs.forEach(([name, val]) => {
      const chip = document.createElement('span');
      chip.className = 'opt-chip goto';
      chip.style.fontSize = '.68em';
      chip.textContent = name;
      chip.onclick = ev => {
        ev.stopPropagation();
        const c = ec();
        if (c) apply(c, val);
        syncEditorChars();
        closeAssetGrid();
        selectEditorScene(edSceneIdx);
      };
      row.appendChild(chip);
    });
    box.appendChild(row);
  };
  mkRow('站位', ED_POS_PRESETS, (c, x) => { c.x = x; c.y = 1.0; });
  mkRow('景别', ED_SCALE_PRESETS, (c, s) => { c.scale = s; });
  return box;
}

function previewLine(sc, idx) {
  edPreviewLine = idx;
  const cmd = sc.script[idx];
  if (!cmd) return;

  // -- 画布上的文本预览叠加层 --
  const overlay = $('se-preview-overlay');
  const namebox = $('se-pv-namebox');
  const textel = $('se-pv-text');

  if (cmd.type === 'say') {
    overlay.classList.add('show');
    namebox.classList.add('show');
    namebox.textContent = (script.characters[cmd.who]||{}).name;
    namebox.style.color = (script.characters[cmd.who]||{}).color || '#fff';
    textel.className = 'normal';
    textel.textContent = cmd.text || '';
    textel.contentEditable = 'true';
  } else if (cmd.type === 'narrate') {
    overlay.classList.add('show');
    namebox.classList.remove('show');
    textel.className = '';
    textel.textContent = cmd.text || '';
  } else if (cmd.type === 'choice') {
    overlay.classList.add('show'); namebox.classList.remove('show');
    textel.className = ''; textel.contentEditable = 'false';
    buildChoiceInline(cmd);
  } else if (cmd.type === 'set') {
    overlay.classList.add('show'); namebox.classList.remove('show');
    textel.className = ''; textel.contentEditable = 'false';
    buildSetInline(cmd);
  } else if (cmd.type === 'check') {
    overlay.classList.add('show'); namebox.classList.remove('show');
    textel.className = ''; textel.contentEditable = 'false';
    buildCheckInline(cmd);
  } else if (cmd.type === 'end') {
    overlay.classList.add('show');
    namebox.classList.remove('show');
    textel.className = '';
    textel.innerHTML = `<div style="text-align:center;font-size:1.3em;letter-spacing:.1em">🏁 ${cmd.label||'结局'}</div>`;
  } else if (cmd.type === 'goto') {
    overlay.classList.add('show');
    namebox.classList.remove('show');
    textel.className = '';
    textel.contentEditable = 'false';
    buildGotoInline(cmd);
  } else if (cmd.type === 'mark') {
    /* 锚点标记：直接改名（全场景唯一校验） */
    overlay.classList.add('show'); namebox.classList.remove('show');
    textel.className = ''; textel.contentEditable = 'false';
    textel.innerHTML = '';
    const div = document.createElement('div');
    div.style.cssText = 'font-size:.85em';
    div.innerHTML = '<b>⚓ 标记</b> <span style="opacity:.5;font-size:.8em">跳转落点锚点，可写作 -> ' + sc.id + ':锚点 或 -> :锚点</span><br>';
    const inp = document.createElement('input');
    inp.value = cmd.id || '';
    inp.style.cssText = 'margin-top:4px;padding:3px;background:#0c1120;color:#ffd75e;border:1px solid #5a7bb0;border-radius:3px;font-size:.9em;width:12em';
    inp.onchange = () => {
      const v = inp.value.trim();
      if (!/^[A-Za-z0-9_\-]+$/.test(v)) { alert('锚点 ID 只能含字母、数字、下划线、连字符'); inp.value = cmd.id || ''; return; }
      if (sc.script.some((c, i) => c.type === 'mark' && c.id === v && i !== idx)) { alert('本场景已存在同名锚点「' + v + '」'); inp.value = cmd.id || ''; return; }
      cmd.id = v; edChanged(); renderTimeline(sc);
    };
    div.appendChild(inp);
    textel.appendChild(div);
  } else {
    overlay.classList.remove('show');
  }

  // -- 说话角色高亮，其他人变暗 --
  let highlightWho = null;
  for (let i = 0; i <= idx; i++) {
    const c = sc.script[i];
    if (c && c.type === 'say') highlightWho = c.who;
    else if (c && c.type === 'narrate') highlightWho = null;
  }
  // Apply speaking class to all editor characters
  document.querySelectorAll('.se-ed-char').forEach(el => {
    const cid = el.dataset.cid;
    if (highlightWho && cid === highlightWho) {
      el.classList.add('speaking');
      el.style.outline = '';
    } else {
      el.classList.remove('speaking');
      el.style.outline = '';
    }
  });

  // -- 高亮所有相关UI --
  $('se-audio-info').textContent = '▶ 第'+idx+'条 ' + cmd.type;
  document.querySelectorAll('.tl-block').forEach(b => b.classList.remove('sel'));
  document.querySelectorAll(`.tl-block[data-idx="${idx}"]`).forEach(b => b.classList.add('sel'));
  /* 帧模式胶片条同步选中态 */
  document.querySelectorAll('.tl-frame').forEach(b => b.classList.remove('sel'));
  document.querySelectorAll(`.tl-frame[data-idx="${idx}"]`).forEach(b => b.classList.add('sel'));
  document.querySelectorAll('.se-cmd-row').forEach(r => r.classList.remove('sel'));
  const row = document.querySelector(`.se-cmd-row[data-idx="${idx}"]`);
  if (row) { row.classList.add('sel'); row.scrollIntoView({block:'nearest'}); }
}

/* 把 vars 对象解析为可视化行 [{k,op,val}]（op: = + -） */
function parseSetRows(vars) {
  var rows = [];
  Object.entries(vars||{}).forEach(function(e) {
    var k = e[0], v = e[1];
    if (typeof v === 'string') {
      var m = v.match(/^([A-Za-z_][A-Za-z0-9_]*)\s*([+-])\s*(\d+(\.\d+)?)$/);
      if (m && m[1] === k) { rows.push({ k:k, op:m[2], val:m[3] }); return; }
      rows.push({ k:k, op:'=', val:v }); return;
    }
    rows.push({ k:k, op:'=', val:String(v) });
  });
  return rows;
}
/* 可视化行序列化回 vars 对象（引擎规则：增量写 "k+N" 字符串） */
function serializeSetRows(rows) {
  var out = {};
  rows.forEach(function(r) {
    if (!r.k || r.k === '__custom__') return;
    if (r.op === '=') { var v = r.val; try { v = JSON.parse(r.val); } catch(e) {} out[r.k] = v; }
    else out[r.k] = r.k + r.op + (parseFloat(r.val) || 0);
  });
  return out;
}
/* 属性行 UI：下拉选属性 + 操作符 + 数值（attrs 未声明的变量可自定义） */
function buildSetRowsUI(box, rows, onChange) {
  box.innerHTML = '';
  var attrs = script.attrs || {};
  rows.forEach(function(r, i) {
    var row = document.createElement('div'); row.className = 'set-row';
    var sel = document.createElement('select'); sel.className = 'sr-attr';
    var keys = Object.keys(attrs);
    if (r.k && !keys.includes(r.k) && r.k !== '__custom__') keys.push(r.k);
    if (!keys.length) keys.push('new_var');
    keys.forEach(function(k) { var o=document.createElement('option'); o.value=k; o.textContent=(attrs[k] ? (attrs[k].name||k) : k); if(k===r.k)o.selected=true; sel.appendChild(o); });
    var cust=document.createElement('option'); cust.value='__custom__'; cust.textContent='✎ 自定义…';
    if (r.k==='__custom__') cust.selected=true;
    sel.appendChild(cust);
    sel.onchange=function(){ if(this.value==='__custom__'){ var nk=prompt('变量名(英文小写):', ''); if(nk) r.k=nk.trim(); } else r.k=this.value; onChange(); };
    var op=document.createElement('select'); op.className = 'sr-op';
    [['=','= 设为'],['+','+ 加'],['-','− 减']].forEach(function(p){ var o=document.createElement('option'); o.value=p[0]; o.textContent=p[1]; if(p[0]===r.op)o.selected=true; op.appendChild(o); });
    op.onchange=function(){ r.op=this.value; onChange(); };
    var val=document.createElement('input'); val.className='sr-val'; val.value=r.val; val.placeholder='数值'; val.style.width='70px';
    val.onchange=function(){ r.val=this.value; onChange(); };
    var del=document.createElement('span'); del.textContent='✕'; del.className='opt-del';
    del.onclick=function(){ rows.splice(i,1); onChange(); };
    row.appendChild(sel); row.appendChild(op); row.appendChild(val); row.appendChild(del);
    box.appendChild(row);
  });
}

function saveGotoInline() {
  if (edSceneIdx<0 || edPreviewLine<0) return;
  var sc = script.scenes[edSceneIdx];
  var cmd = sc.script[edPreviewLine];
  if (!cmd || cmd.type!=='goto') return;
  var box = $('se-pv-text');
  var divs = box.querySelectorAll('div[style*="display:flex"]');
  var branches = [];
  divs.forEach(function(d) {
    var inp = d.querySelector('input');
    var sel = d.querySelector('select');
    if (inp && sel && sel.parentNode === d) {
      var ifv = inp.value || '';
      var tv = sel.value || '';
      if (tv) branches.push({if: ifv || undefined, target: tv});
    }
  });
  // Find else select (the one with empty option)
  var allSelects = box.querySelectorAll('select');
  var elseSel = null;
  allSelects.forEach(function(s) { if (s.querySelector('option[value=""]')) elseSel = s; });
  if (branches.length) { cmd.branches = branches; delete cmd.target; delete cmd.if; }
  else { cmd.target = branches[0] ? branches[0].target : ''; delete cmd.branches; }
  if (elseSel) { cmd.else_target = elseSel.value || undefined; if (!cmd.else_target) delete cmd.else_target; }
}

function edAddGotoBranch() {
  if (edSceneIdx<0 || edPreviewLine<0) return;
  var sc = script.scenes[edSceneIdx];
  var cmd = sc.script[edPreviewLine];
  if (!cmd.branches) { cmd.branches = [{if:cmd.if||'', target:cmd.target||''}]; delete cmd.target; delete cmd.if; }
  cmd.branches.push({if:'', target:''});
  selectEditorScene(edSceneIdx);
  previewLine(sc, edPreviewLine);
}

function edDelGotoBranch(i) {
  if (edSceneIdx<0 || edPreviewLine<0) return;
  var sc = script.scenes[edSceneIdx];
  var cmd = sc.script[edPreviewLine];
  if (cmd.branches) { cmd.branches.splice(i, 1); }
  selectEditorScene(edSceneIdx);
  previewLine(sc, edPreviewLine);
}

function navPreview(delta) {
  if (edSceneIdx < 0) return;
  const sc = script.scenes[edSceneIdx];
  const newIdx = Math.max(0, Math.min(sc.script.length-1, (edPreviewLine>=0?edPreviewLine:0) + delta));
  previewLine(sc, newIdx);
}

      case 'show': cmd.image = box.querySelector('#cf-image').value; break;

    addVar.parentElement.appendChild(div);
    div.querySelector('[data-del]').onclick = () => div.remove();
  };
  // Delete buttons
  box.querySelectorAll('[data-del]').forEach(b => b.onclick = () => b.closest('div[style*="border"]')?.remove());
}

// -- 角色管理 --
let edActiveChar = null;
function ensureMatrix(sc) {
  if (!sc._charMatrix) sc._charMatrix = {};
  var total = (sc.script||[]).length || 1;
  (sc.chars||[]).forEach(function(c) {
    if (!sc._charMatrix[c.id] || sc._charMatrix[c.id].length !== total) {
      sc._charMatrix[c.id] = new Array(total).fill(0);
      (sc.script||[]).forEach(function(cmd, idx) {
        if (cmd && cmd.type==='say' && cmd.who===c.id) sc._charMatrix[c.id][idx] = 2;
      });
    }
  });
}
function renderCharChips(sc) {
  var box = $('se-char-chips'); if (!box) return;
  box.innerHTML = '';
  var activeChars = (sc.chars||[]).filter(function(c){return c.id;});
  activeChars.forEach(function(c) {
    var chip = document.createElement('span');
    chip.className = 'se-char-chip on';
    chip.textContent = '👤 ' + ((script.characters[c.id]||{}).name||c.id);
    chip.title = '点击移除';
    chip.onclick = function() { sc.chars = (sc.chars||[]).filter(function(x){return x.id!==c.id;}); selectEditorScene(edSceneIdx); };
    box.appendChild(chip);
  });
  var addBtn = document.createElement('span');
  addBtn.className = 'se-char-chip off'; addBtn.textContent = '+ 加角色'; addBtn.style.cursor = 'pointer';
  addBtn.onclick = function() {
    var avail = Object.keys(script.characters||{}).filter(function(cid){return !(sc.chars||[]).some(function(c){return c.id===cid;});});
    if (!avail.length) return;
    var menu = document.createElement('div');

    avail.forEach(function(cid) {
      var item = document.createElement('div');
      item.style.cssText = 'padding:.3em .6em;cursor:pointer;border-radius:3px;font-size:.8em';

        var p = posXY[list.length] || posXY[4];
        list.push({id:cid, x:p.x, y:p.y, scale:p.scale, sprite:'normal', effect:'fade'});
        menu.remove(); selectEditorScene(edSceneIdx);
      };
      item.onmouseenter = function(){item.style.background='#263652';};
      item.onmouseleave = function(){item.style.background='';};
      menu.appendChild(item);
    });
    document.body.appendChild(menu);
    var r = addBtn.getBoundingClientRect();
    menu.style.left = r.left+'px'; menu.style.top = (r.top-menu.offsetHeight-4)+'px';
    setTimeout(function(){document.addEventListener('click',function(){menu.remove();},{once:true});},0);
  };
  box.appendChild(addBtn);
  if (Object.keys(script.characters||{}).length > activeChars.length + 1) {
    var allBtn = document.createElement('span');
    allBtn.className = 'se-char-chip off'; allBtn.textContent = '全部'; allBtn.style.fontSize = '.6em';
    allBtn.onclick = function() {
      var posXY = [{x:0.85,y:1,scale:1.1},{x:0.15,y:1,scale:1.1},{x:0.5,y:1,scale:1},{x:0.3,y:0.95,scale:0.95},{x:0.7,y:0.95,scale:0.95}];
      var pi = sc.chars.length;
      Object.keys(script.characters||{}).forEach(function(cid) {
        if (!(sc.chars||[]).some(function(c){return c.id===cid;})) {
          var p = posXY[pi] || posXY[4];
          sc.chars.push({id:cid, x:p.x, y:p.y, scale:p.scale, sprite:'normal', effect:'fade'});
          pi++;
        }
      });
      selectEditorScene(edSceneIdx);
    };
    box.appendChild(allBtn);
  }
}

/* ================= 属性编辑器 ================= */
function showAttrEditor() {
  const list = $('attr-editor-list');
  const attrs = script.attrs || (script.attrs = {});
  $('attr-editor-overlay').classList.remove('hidden');

  /* 扫描全剧本的属性引用：set 键/值、if 表达式、check attr、choice 选项 if/set */
  function scanRefs() {
    const counts = {}, locs = {}, undef = {};
    const ident = s => (String(s).match(/[A-Za-z_][A-Za-z0-9_]*/g) || []).filter(w => w !== 'true' && w !== 'false');
    const add = (k, si, li, kind) => {
      if (attrs[k] !== undefined) {
        counts[k] = (counts[k] || 0) + 1;
        (locs[k] = locs[k] || []).push({ si, li, kind });
      } else {
        (undef[k] = undef[k] || []).push({ si, li, kind });
      }
    };
    script.scenes.forEach((s, si) => {
      if (s.require) ident(s.require).forEach(k => add(k, si, -1, '进入条件'));
      (s.script || []).forEach((c, li) => {
        if (c.if) ident(c.if).forEach(k => add(k, si, li, '条件'));
        if (c.type === 'set') Object.entries(c.vars || {}).forEach(([k, v]) => { add(k, si, li, 'set'); ident(v).forEach(x => { if (x !== k) add(x, si, li, 'set表达式'); }); });
        if (c.type === 'check') {
          if (c.attr) add(c.attr, si, li, '判定');
          ['success', 'fail'].forEach(br => { const o = c[br]; if (o && o.set) Object.keys(o.set).forEach(k => add(k, si, li, '判定分支set')); });
        }
        if (c.type === 'choice') (c.options || []).forEach(o => {
          if (o.if) ident(o.if).forEach(k => add(k, si, li, '选项条件'));
          if (o.set) Object.entries(o.set).forEach(([k, v]) => { add(k, si, li, '选项set'); ident(v).forEach(x => { if (x !== k) add(x, si, li, '选项set表达式'); }); });
        });
      });
    });
    return { counts, locs, undef };
  }

  const INP = 'padding:.2em .3em;background:#0c1120;color:#eee;border:1px solid #3a4a63;font-size:.8em;border-radius:3px';
  const ownerOpts = cur =>
    `<option value="player" ${cur === 'player' ? 'selected' : ''}>🧑 主控</option>` +
    Object.keys(script.characters || {}).map(cid =>
      `<option value="${cid}" ${cur === cid ? 'selected' : ''}>❤ ${script.characters[cid].name || cid}</option>`).join('') +
    `<option value="" ${!cur ? 'selected' : ''}>（无归属）</option>`;

  const renderRows = () => {
    const { counts, locs, undef } = scanRefs();
    /* 未定义属性警告区（一键定义补建） */
    const undefKeys = Object.keys(undef);
    $('attr-undef-bar').innerHTML = undefKeys.length
      ? '<span style="color:#e74c3c">⚠ 引用了但未定义的属性：</span>' + undefKeys.map(k =>
          `<span style="display:inline-block;margin:.15em;padding:.15em .5em;background:#3a1a1a;border:1px solid #e74c3c;border-radius:3px;font-size:.8em">${k}（${undef[k].length}处）<a href="javascript:void 0" data-defkey="${k}" style="color:#7fd07f;margin-left:.4em">+定义</a></span>`).join('')
      : '';
    $('attr-undef-bar').querySelectorAll('[data-defkey]').forEach(a => a.onclick = () => {
      attrs[a.dataset.defkey] = { name: a.dataset.defkey, init: 0, min: 0, max: 100, owner: 'player' };
      renderRows();
    });

    /* 分组：主控 → 各角色 → 无归属 */
    const groups = [];
    const byOwner = {};
    Object.keys(attrs).forEach(k => { const o = attrs[k].owner || ''; (byOwner[o] = byOwner[o] || []).push(k); });
    if (byOwner.player) groups.push({ label: '🧑 主控', keys: byOwner.player });
    Object.keys(script.characters || {}).forEach(cid => {
      if (byOwner[cid]) groups.push({ label: '❤ ' + (script.characters[cid].name || cid), color: script.characters[cid].color, keys: byOwner[cid] });
    });
    if (byOwner['']) groups.push({ label: '其它（无归属）', keys: byOwner[''] });

    list.innerHTML = '';
    groups.forEach(g => {
      const head = document.createElement('div');
      head.className = 'attr-group-head';
      head.style.cssText = 'margin:.6em 0 .2em;font-weight:bold;font-size:.85em;' + (g.color ? 'color:' + g.color : '');
      head.textContent = g.label;
      list.appendChild(head);
      g.keys.forEach(key => {
        const a = attrs[key];
        const n = counts[key] || 0;
        const initBad = (a.min !== undefined && a.init < a.min) || (a.max !== undefined && a.init > a.max);
        const pct = Math.round(((a.init || 0) - (a.min || 0)) / Math.max(1, (a.max || 100) - (a.min || 0)) * 100);
        const card = document.createElement('div');
        card.style.cssText = 'border:1px solid #3a4a63;border-radius:6px;padding:.5em .6em;margin:.3em 0;background:#0f1420';
        card.innerHTML =
          `<div style="display:flex;align-items:center;gap:.4em;flex-wrap:wrap">
            <b style="font-size:.85em">${key}</b>
            <span style="flex:0 0 auto;width:54px;height:8px;border-radius:4px;background:#222;position:relative;overflow:hidden" title="进度条预览">
              <span style="position:absolute;inset:0;width:${pct}%;background:${a.bar || '#7fa0d0'}"></span></span>
            ${n === 0 ? '<span style="color:#d8b93a;font-size:.72em">未使用</span>'
                       : `<a href="javascript:void 0" data-refs="${key}" style="color:#7fa0d0;font-size:.72em">被 ${n} 处引用 ▸</a>`}
            <span style="flex:1"></span>
            <button data-del="${key}" style="color:#c44;font-size:.75em;background:none;border:none;cursor:pointer">✕ 删除</button>
          </div>
          <div style="display:flex;flex-wrap:wrap;gap:.3em;margin-top:.35em;align-items:center">
            <input value="${a.name || ''}" data-k="${key}" data-f="name" placeholder="显示名" style="${INP};width:90px">
            <label style="font-size:.72em;opacity:.7">初值</label><input value="${a.init ?? 0}" data-k="${key}" data-f="init" type="number" style="${INP};width:56px;${initBad ? 'border-color:#e74c3c' : ''}" title="${initBad ? '初值超出 [最小,最大] 范围！' : ''}">
            <label style="font-size:.72em;opacity:.7">最小</label><input value="${a.min ?? 0}" data-k="${key}" data-f="min" type="number" style="${INP};width:56px">
            <label style="font-size:.72em;opacity:.7">最大</label><input value="${a.max ?? 100}" data-k="${key}" data-f="max" type="number" style="${INP};width:56px">
            <input type="color" value="${a.bar || '#7fa0d0'}" data-k="${key}" data-f="bar" title="进度条颜色" style="width:34px;height:26px;padding:0;background:#0c1120;border:1px solid #3a4a63">
            <select data-k="${key}" data-f="owner" title="归属" style="${INP}">${ownerOpts(a.owner)}</select>
          </div>
          <div data-bindwrap="${key}" style="margin-top:.3em"></div>
          <div data-reflist="${key}" style="display:none;margin-top:.3em;font-size:.72em;line-height:1.7;max-height:120px;overflow-y:auto"></div>`;
        list.appendChild(card);
        /* 联动（bind）可视化行 */
        const bw = card.querySelector(`[data-bindwrap="${key}"]`);
        const renderBinds = () => {
          const entries = Object.entries(a.bind || {});
          bw.innerHTML = '<span style="font-size:.72em;opacity:.7">联动：</span>' + entries.map(([bk, bv]) =>
            `<span style="font-size:.72em;background:#1a2233;border:1px solid #3a4a63;border-radius:3px;padding:.1em .4em;margin-right:.25em">${bk} ×${bv} <a href="javascript:void 0" data-unbind="${bk}" style="color:#c44">✕</a></span>`).join('') +
            `<a href="javascript:void 0" data-addbind="${key}" style="font-size:.72em;color:#7fa0d0">+加联动</a>`;
          bw.querySelectorAll('[data-unbind]').forEach(x => x.onclick = () => { delete a.bind[x.dataset.unbind]; if (!Object.keys(a.bind).length) delete a.bind; renderBinds(); });
          bw.querySelector('[data-addbind]').onclick = () => {
            const others = Object.keys(attrs).filter(x => x !== key);
            if (!others.length) return;
            const bk = prompt('联动目标属性（' + others.join(' / ') + '）：', others[0]);
            if (!bk || !attrs[bk]) return;
            const bv = parseFloat(prompt('联动系数（如 0.2 表示本属性 +10 时目标 +2）：', '0.2'));
            if (isNaN(bv)) return;
            (a.bind = a.bind || {})[bk] = bv;
            renderBinds();
          };
        };
        renderBinds();
        /* 引用清单（点击跳到对应场景指令） */
        const rl = card.querySelector(`[data-reflist="${key}"]`);
        const refsLink = card.querySelector(`[data-refs="${key}"]`);
        if (refsLink) refsLink.onclick = () => {
          if (rl.style.display === 'none') {
            rl.style.display = 'block';
            rl.innerHTML = (locs[key] || []).map(l =>
              `<a href="javascript:void 0" data-jump="${l.si}:${l.li}" style="color:#7fa0d0;margin-right:.6em">${script.scenes[l.si].id}${l.li >= 0 ? ' 第' + (l.li + 1) + '条' : ''} · ${l.kind}</a>`).join('') || '无';
            rl.querySelectorAll('[data-jump]').forEach(j => j.onclick = () => {
              const [si, li] = j.dataset.jump.split(':').map(Number);
              $('attr-editor-overlay').classList.add('hidden');
              selectEditorScene(si);
              if (li >= 0) previewLine(script.scenes[si], li);
            });
          } else { rl.style.display = 'none'; }
        };
      });
    });

    /* 输入接线 */
    list.querySelectorAll('input[data-f],select[data-f]').forEach(inp => {
      inp.onchange = () => {
        const k = inp.dataset.k, f = inp.dataset.f;
        if (!attrs[k]) return;
        if (f === 'name') attrs[k].name = inp.value;
        else if (f === 'init') attrs[k].init = parseFloat(inp.value) || 0;
        else if (f === 'min') attrs[k].min = parseFloat(inp.value) || 0;
        else if (f === 'max') attrs[k].max = parseFloat(inp.value) || 100;
        else if (f === 'bar') attrs[k].bar = inp.value || undefined;
        else if (f === 'owner') { if (inp.value) attrs[k].owner = inp.value; else delete attrs[k].owner; }
        if (f !== 'name') renderRows();
      };
    });
    list.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { delete attrs[b.dataset.del]; renderRows(); });
  };
  renderRows();

  $('attr-add').onclick = () => {
    const key = prompt('属性ID (英文, 如 gold):');
    if (!key) return;
    if (!/^[A-Za-z_][A-Za-z0-9_]*$/.test(key)) { alert('ID 只能含字母、数字、下划线，且不以数字开头'); return; }
    if (attrs[key]) { alert('属性「' + key + '」已存在'); return; }
    attrs[key] = { name: key, init: 0, min: 0, max: 100, owner: 'player' };
    renderRows();
  };
  /* 常用模板：主控四维 + 各角色好感 */
  const tpl = $('attr-tpl');
  tpl.innerHTML = '<option value="">+ 常用属性模板…</option>' +
    [['hp', '体力'], ['gold', '金钱'], ['charm', '魅力'], ['wisdom', '智慧']].map(x => `<option value="player:${x[0]}:${x[1]}">🧑 ${x[1]}</option>`).join('') +
    Object.entries(script.characters || {}).map(([cid, c]) => `<option value="${cid}:favor_${cid}:${c.name || cid}好感">❤ ${c.name || cid}好感</option>`).join('');
  tpl.onchange = () => {
    if (!tpl.value) return;
    const parts = tpl.value.split(':');
    const owner = parts[0], key = parts[1], name = parts.slice(2).join(':');
    tpl.value = '';
    if (attrs[key]) { alert('属性「' + key + '」已存在'); return; }
    attrs[key] = { name, init: 0, min: 0, max: 100, bar: owner === 'player' ? '#F0E68C' : ((script.characters[owner] || {}).color || '#FFB6C1'), owner };
    renderRows();
  };
  $('attr-editor-close').onclick = () => $('attr-editor-overlay').classList.add('hidden');
}

/* ================= 预览内联编辑 ================= */
function enableInlineEdit() {
  // 点击画布空白 → 隐藏预览
  $('se-canvas-bg').onclick = () => {
    if ($('se-pv-text').contentEditable === 'true' && document.activeElement === $('se-pv-text')) return;
    $('se-preview-overlay').classList.remove('show');
    edPreviewLine = -1;
    edCharsList.forEach(c => {
      const el = document.querySelector(`.se-ed-char[data-cid="${c.id}"]`);
      if (el) el.style.outline = '';
    });
  };
  // 预览文字默认就是可编辑的
  $('se-pv-text').contentEditable = 'true';
  $('se-pv-text').onclick = ev => ev.stopPropagation();
  $('se-pv-text').oninput = () => {
    if (edSceneIdx < 0 || edPreviewLine < 0) return;
    const sc = script.scenes[edSceneIdx];
    const cmd = sc.script[edPreviewLine];
    if (cmd && (cmd.type==='say'||cmd.type==='narrate')) {
      cmd.text = $('se-pv-text').innerText || $('se-pv-text').textContent || '';
      edChanged();
    }
  };
  $('se-pv-namebox').onclick = ev => ev.stopPropagation();
  $('se-preview-overlay').onclick = ev => ev.stopPropagation();
  $('se-pv-text').onkeydown = ev => {
    if (ev.key === 'Escape') { $('se-pv-text').blur(); ev.preventDefault(); }
    if (ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); navPreview(1); }
  };

  // 点击名字框 → 改角色
  $('se-pv-namebox').onclick = () => {
    if (edSceneIdx < 0 || edPreviewLine < 0) return;
    const sc = script.scenes[edSceneIdx];
    const cmd = sc.script[edPreviewLine];
    if (!cmd || cmd.type !== 'say') return;
    quickWhoSelect(cmd);
  };

  // 点击画布角色名牌 → 换表情
  document.querySelectorAll('.se-ed-tag').forEach(tag => {
    tag.onclick = ev => {
      ev.stopPropagation();
      const cid = tag.closest('.se-ed-char')?.dataset.cid;
      if (!cid) return;
      quickSpriteSelect(cid, tag);
    };
  });
}

function quickWhoSelect(cmd) {

    item.onmouseenter = () => item.style.background = '#263652';
    item.onmouseleave = () => item.style.background = '';

  });

  menu.style.left = rect.left + 'px';

function quickSpriteSelect(cid, tagEl) {
  const ch = script.characters[cid];
  if (!ch || !ch.sprites) return;
  const current = (edCharsList.find(c => c.id === cid) || {}).sprite || 'normal';
  const items = spriteKeys(cid).map(s => {
    const p = spritePath(cid, s);
    return { value: s, label: (s.includes('/') ? '👘 ' : '😶 ') + s, img: p ? assetUrl(p) : null, icon: p ? undefined : '✕' };
  });
  openAssetGrid(tagEl, {
    title: (ch.name || cid) + ' · 立绘/表情',
    items, current,
    footer: stationFooter(cid),   /* 底部：预设站位五位 + 景别三档 */
    onPick: s => {
      const ec = edCharsList.find(c => c.id === cid);
      if (ec) ec.sprite = s;
      syncEditorChars();
      selectEditorScene(edSceneIdx);
    }
  });
}

/* ================= 剪辑式编辑扩展（插入盘/chip面板/上传素材） ================= */
/* ---- 通用锚点小弹层 ---- */
let sePop = null;
function closeSePop() { if (sePop) { sePop.remove(); sePop = null; } }
function openSePop(anchorEl, contentEl) {
  closeSePop(); closeAssetGrid();
  const pop = document.createElement('div');
  pop.className = 'se-pop';
  pop.appendChild(contentEl);
  document.body.appendChild(pop);
  const r = anchorEl.getBoundingClientRect();
  pop.style.left = Math.max(4, Math.min(r.left, window.innerWidth - pop.offsetWidth - 8)) + 'px';
  pop.style.top = Math.max(4, Math.min(r.bottom + 4, window.innerHeight - pop.offsetHeight - 8)) + 'px';
  pop.onclick = ev => ev.stopPropagation();
  sePop = pop;
  setTimeout(() => document.addEventListener('click', closeSePop, { once: true }), 0);
  return pop;
}
/* ---- 场景缩略图网格 items（choice/goto chip 点选用） ---- */
function sceneGridItems(withContinue) {
  const items = withContinue ? [{ value:'', label:'(继续下一句)', icon:'⤵' }] : [];
  script.scenes.forEach(s => {
    const bg = s.background && s.background !== 'none' ? assetUrl(s.background) : null;
    items.push({ value: s.id, label: s.id, img: bg || undefined, icon: bg ? undefined : '🎬' });
  });
  return items;
}
/* ---- 剪辑行：指令间空隙 = + 插入盘 / 拖放重排落点 ---- */
function renderInsertGaps(sc) {
  const wrap = document.querySelector('#tl-insert-row .tl-blocks');
  if (!wrap) return;
  wrap.innerHTML = '';
  const n = (sc.script || []).length;
  const N = Math.max(n, 1);
  for (let i = 0; i <= n; i++) {
    const g = document.createElement('div');
    g.className = 'tl-gap';
    g.dataset.gap = i;
    g.style.left = 'calc(' + (i / N * 100) + '% - 7px)';
    g.style.width = '14px';
    g.title = '第 ' + i + ' 条后插入指令（或拖色块到此重排）';
    g.onclick = ev => { ev.stopPropagation(); openCmdPalette(g, i); };
    g.ondragover = ev => { ev.preventDefault(); g.classList.add('drop-hi'); };
    g.ondragleave = () => g.classList.remove('drop-hi');
    g.ondrop = ev => {
      ev.preventDefault(); g.classList.remove('drop-hi');
      const m = ev.dataTransfer.getData('text/plain').match(/^cmd:(\d+)$/);
      if (!m) return;
      const from = parseInt(m[1], 10);
      let to = i;
      if (from === to || from + 1 === to) return; /* 原地不动 */
      const [moved] = sc.script.splice(from, 1);
      if (from < to) to--;
      sc.script.splice(to, 0, moved);
      selectEditorScene(edSceneIdx);
      previewLine(sc, to);
    };
    wrap.appendChild(g);
  }
}
/* ---- 指令选择盘：选类型 → 插入 → 画布直接进入可视化编辑态 ---- */
function openCmdPalette(anchorEl, insertAt) {
  const types = [
    ['💬','对白','say'], ['📖','旁白','narrate'], ['🔀','选项','choice'], ['⚙','变量','set'],
    ['🎲','判定','check'], ['⏭','跳转','goto'], ['⚓','标记','mark'], ['🏁','结局','end'], ['🖼','CG','show'], ['🔍','调查','inspect']
  ];
  openAssetGrid(anchorEl, {

/* 属性下拉分组填充：「❤好感」（归属角色的属性）置顶，「主控」次之，其它最后；
   好感组选项名前加 ❤。供条件构造器/判定编辑等共用。 */
function fillAttrSelectGrouped(sel, attrs, current) {
  const favor = [], player = [], other = [];
  Object.keys(attrs).forEach(k => {
    const a = attrs[k];
    if (a.owner === 'player') player.push(k);
    else if (a.owner && script.characters && script.characters[a.owner]) favor.push(k);
    else other.push(k);
  });
  if (current && !Object.keys(attrs).includes(current)) other.push(current);  /* 未声明变量兜底 */
  const mk = (k, prefix) => { const o = document.createElement('option'); o.value = k; o.textContent = prefix + (attrs[k] ? (attrs[k].name || k) : k); if (k === current) o.selected = true; return o; };
  [['❤好感', favor, '❤ '], ['🧑 主控', player, ''], ['其它', other, '']].forEach(([label, keys, prefix]) => {
    if (!keys.length) return;
    const g = document.createElement('optgroup'); g.label = label;
    keys.forEach(k => g.appendChild(mk(k, prefix)));
    sel.appendChild(g);
  });
}
/* ---- [条件] chip 的条件构造器：属性 比较符 数值，且/或 双条件 ---- */
function openCondBuilder(anchorEl, expr, onSave) {
  const attrs = script.attrs || {};
  const attrKeys = Object.keys(attrs);
  let join = '&&', rows = [];
  String(expr || '').split(/\s*(&&|\|\|)\s*/).forEach(p => {
    if (!p) return;
    if (p === '&&' || p === '||') { join = p; return; }
    const m = p.match(/^\s*([A-Za-z_]\w*)\s*(>=|<=|==|!=|>|<)\s*(.+?)\s*$/);
    if (m && rows.length < 2) rows.push({ k: m[1], op: m[2], v: m[3] });
  });
  if (!rows.length) rows.push({ k: attrKeys[0] || 'favor', op: '>=', v: '5' });
  const box = document.createElement('div');
  box.innerHTML = '<h4>条件构造器</h4>';
  const rowsDiv = document.createElement('div');
  function rebuild() {
    rowsDiv.innerHTML = '';
    rows.forEach((r, i) => {
      if (i === 1) {
        const j = document.createElement('span'); j.className = 'cb-join'; j.id = 'cb-join';
        j.textContent = join === '&&' ? '且 (&&)' : '或 (||)';
        j.title = '点击切换 且/或';
        j.onclick = () => { join = join === '&&' ? '||' : '&&'; rebuild(); };
        rowsDiv.appendChild(j);
      }
      const row = document.createElement('div'); row.className = 'cb-row';
      const as = document.createElement('select'); as.className = 'cb-attr' + (i === 0 ? '' : '2');
      if (i === 0) as.id = 'cb-attr';
      fillAttrSelectGrouped(as, attrs, r.k);   /* 分组：❤好感 → 主控 → 其它 */
      as.onchange = () => r.k = as.value;
      const op = document.createElement('select'); op.className = 'cb-op'; if (i === 0) op.id = 'cb-op';
      ['>=','<=','==','!=','>','<'].forEach(o2 => { const o = document.createElement('option'); o.value = o2; o.textContent = o2; if (o2 === r.op) o.selected = true; op.appendChild(o); });
      op.onchange = () => r.op = op.value;
      const v = document.createElement('input'); v.className = 'cb-val'; if (i === 0) v.id = 'cb-val';
      v.value = r.v; v.placeholder = '数值'; v.style.width = '70px';
      v.onchange = () => r.v = v.value.trim();
      row.appendChild(as); row.appendChild(op); row.appendChild(v);
      if (i === 1) {
        const del = document.createElement('span'); del.textContent = '✕'; del.className = 'opt-del';
        del.onclick = () => { rows.pop(); rebuild(); };
        row.appendChild(del);
      }
      rowsDiv.appendChild(row);
    });
    if (rows.length === 1) {
      const more = document.createElement('button'); more.className = 'btn small'; more.id = 'cb-add';
      more.textContent = '+ 第二条件（且/或）';
      more.onclick = () => { rows.push({ k: attrKeys[0] || 'favor', op: '>=', v: '5' }); rebuild(); };
      rowsDiv.appendChild(more);
    }
  }
  rebuild();
  box.appendChild(rowsDiv);
  const bar = document.createElement('div'); bar.style.cssText = 'margin-top:.5em;text-align:right';
  const clear = document.createElement('button'); clear.className = 'btn small'; clear.id = 'cb-clear'; clear.textContent = '清除条件';
  clear.onclick = () => { closeSePop(); onSave(''); };
  const ok = document.createElement('button'); ok.className = 'btn small'; ok.id = 'cb-save'; ok.textContent = '确定';
  ok.style.background = '#4a6da0';
  ok.onclick = () => {
    const parts = rows.filter(r => r.k && r.v !== '').map(r => r.k + r.op + r.v);
    closeSePop();
    onSave(parts.join(join));
  };
  bar.appendChild(clear); bar.appendChild(ok);
  box.appendChild(bar);
  openSePop(anchorEl, box);
}

/* ================= 素材上传 / 命名规范 / 素材包 ================= */
const CUSTOM_ASSETS_KEY = 'wenyou_custom_assets';
/* 持久化整个自定义素材表；超出 localStorage 容量则只保留本会话 */
function persistCustomAssets() {
  try { localStorage.setItem(CUSTOM_ASSETS_KEY, JSON.stringify(customAssets)); }
  catch (e) {
    alert('素材库超出 localStorage 容量上限（约 5MB）。\n本次上传仅在本次会话内生效，刷新后丢失；\n请用「导出」同时导出的 assets_pack.json 备份素材。');
  }
}
function loadCustomAssets() {
  try { customAssets = JSON.parse(localStorage.getItem(CUSTOM_ASSETS_KEY) || '{}') || {}; }
  catch (e) { customAssets = {}; }
}
/* 命名规范 slug：小写字母/数字/下划线，非法字符归并为下划线 */
function slugify(name) {
  return String(name || '').toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '');
}
/* 图片 canvas 重编码 WebP（背景/CG 限 1920，立绘限 1024）；音频原样 dataURL */
function processAssetFile(file, type, cb, errCb) {
  if (/^image\//.test(file.type)) {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const maxSide = type === 'chars' ? 1024 : 1920;
      let w = img.naturalWidth, h = img.naturalHeight;
      if (Math.max(w, h) > maxSide) { const r = maxSide / Math.max(w, h); w = Math.max(1, Math.round(w * r)); h = Math.max(1, Math.round(h * r)); }
      const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
      cv.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      cb(cv.toDataURL('image/webp', 0.85));
    };
    img.onerror = () => { URL.revokeObjectURL(url); if (errCb) errCb('图片解码失败'); };
    img.src = url;
  } else {
    const r = new FileReader();
    r.onload = () => cb(String(r.result));
    r.onerror = () => { if (errCb) errCb('文件读取失败'); };
    r.readAsDataURL(file);
  }
}
/* 上传后立即生效：背景→当前场景背景；立绘→写入角色表情表并刷新画布 */
function applyUploadedAsset(type, path) {
  if (type === 'bg' && edSceneIdx >= 0) {
    script.scenes[edSceneIdx].background = path;
  } else if (type === 'chars') {
    const m = path.match(/^chars\/([a-z0-9]+)_([a-z0-9_]+)\.webp$/);
    if (m && script.characters[m[1]]) {
      const ch = script.characters[m[1]];
      ch.sprites = ch.sprites || {};
      ch.sprites[m[2]] = path;
    }
  }
  if (edSceneIdx >= 0) selectEditorScene(edSceneIdx);
}

/* ---- 素材包：自定义素材 ⇄ assets_pack.json（dataURL 数组） ---- */

function importAssetsPack(file) {

/* ================= 编辑器撤销/重做（栈深 50） ================= */
let edHist = [], edHistPos = -1, edRestoring = false;
function edSnapshot() {
  return JSON.stringify({ scenes: script.scenes, attrs: script.attrs || null, characters: script.characters });
}
function edHistInit() {
  edHist = [edSnapshot()]; edHistPos = 0;
  edUpdateUndoBtns();
}
/* 每次修改后记录新状态（内容去重：纯场景切换/预览不入栈） */
function edHistPush() {
  if (edRestoring || !edHist.length || edSceneIdx < 0) return;
  const snap = edSnapshot();
  if (snap === edHist[edHistPos]) return;
  edHist = edHist.slice(0, edHistPos + 1);
  edHist.push(snap);
  if (edHist.length > 51) edHist.shift();   /* 基态 + 50 步 */
  edHistPos = edHist.length - 1;
  edUpdateUndoBtns();
  edMarkSaved();
}
function edHistRestore(snap) {
  const d = JSON.parse(snap);
  script.scenes = d.scenes;
  if (d.attrs) script.attrs = d.attrs; else delete script.attrs;
  script.characters = d.characters;
  edSceneIdx = Math.min(edSceneIdx, script.scenes.length - 1);
  if (edSceneIdx < 0 && script.scenes.length) edSceneIdx = 0;
  edRestoring = true;
  try { if (edSceneIdx >= 0) selectEditorScene(edSceneIdx); refreshEditorScenes(); }
  finally { edRestoring = false; }
}
function edUndoDo() { if (edHistPos > 0) { edHistPos--; edHistRestore(edHist[edHistPos]); edUpdateUndoBtns(); edMarkSaved(); } }
function edRedoDo() { if (edHistPos < edHist.length - 1) { edHistPos++; edHistRestore(edHist[edHistPos]); edUpdateUndoBtns(); edMarkSaved(); } }
function edUpdateUndoBtns() {
  const u = $('se-undo'), r = $('se-redo');
  if (u) u.disabled = edHistPos <= 0;
  if (r) r.disabled = edHistPos >= edHist.length - 1;
}
/* 快捷键配套：删除/复制当前预览指令（复用 selectEditorScene 重渲并自动入撤销栈） */
function edDelCmd() {
  if (edSceneIdx < 0 || edPreviewLine < 0) return;
  const arr = script.scenes[edSceneIdx].script;
  if (edPreviewLine >= arr.length) return;
  arr.splice(edPreviewLine, 1);
  selectEditorScene(edSceneIdx);
  if (edPreviewLine >= arr.length) edPreviewLine = arr.length - 1;
}
function edDupCmd() {
  if (edSceneIdx < 0 || edPreviewLine < 0) return;
  const arr = script.scenes[edSceneIdx].script;
  if (edPreviewLine >= arr.length) return;
  arr.splice(edPreviewLine + 1, 0, JSON.parse(JSON.stringify(arr[edPreviewLine])));
  selectEditorScene(edSceneIdx);
  edPreviewLine++;
}
/* 「已自动保存 ✓」淡入淡出 */
let savedToastT = null;
function edMarkSaved() {
  const el = $('se-saved'); if (!el) return;
  el.classList.remove('show'); void el.offsetWidth;
  el.classList.add('show');
  clearTimeout(savedToastT);
  savedToastT = setTimeout(() => el.classList.remove('show'), 1400);
}
/* 不走 selectEditorScene 的修改（打字/拖角色/滚轮缩放等）防抖入栈 */
let edChangeT = null;
function edChanged() {
  clearTimeout(edChangeT);
  edChangeT = setTimeout(edHistPush, 400);
  edMarkSaved();
}

/* ================= Z键/键盘 ================= */
function handleKeyboard(ev) {
  if (ev.target.tagName === 'INPUT' || ev.target.tagName === 'TEXTAREA' || ev.target.tagName === 'SELECT') return;
  // Editor navigation
  if (!$('scene-editor').classList.contains('hidden')) {
    if (ev.ctrlKey || ev.metaKey) {
      const k = ev.key.toLowerCase();
      if (k === 'z' && !ev.shiftKey) { ev.preventDefault(); edUndoDo(); return; }
      if (k === 'y' || (k === 'z' && ev.shiftKey)) { ev.preventDefault(); edRedoDo(); return; }
      if (k === 'd') { ev.preventDefault(); edDupCmd(); return; }
      if (k === 's') { ev.preventDefault(); exportEditorJSON(); return; }
    }
    if ((ev.key === 'Delete' || ev.key === 'Backspace') && edPreviewLine >= 0) { ev.preventDefault(); edDelCmd(); return; }
    if (ev.key === 'ArrowDown') { ev.preventDefault(); navPreview(1); return; }
    if (ev.key === 'ArrowUp') { ev.preventDefault(); navPreview(-1); return; }
    if (ev.key === 'Escape') { exitEditor(); return; }
    if ((ev.key==='a'||ev.key==='A') && edActiveChar && edPreviewLine>=0 && edSceneIdx>=0) {
      ev.preventDefault(); var scA=script.scenes[edSceneIdx]; ensureMatrix(scA);
      scA._charMatrix[edActiveChar][edPreviewLine]=2; renderTimeline(scA); navPreview(1); return;
    }
    if ((ev.key==='s'||ev.key==='S') && edActiveChar && edPreviewLine>=0 && edSceneIdx>=0) {
      ev.preventDefault(); var scS=script.scenes[edSceneIdx]; ensureMatrix(scS);
      scS._charMatrix[edActiveChar][edPreviewLine]=1; renderTimeline(scS); navPreview(1); return;
    }
    if ((ev.key==='d'||ev.key==='D') && edActiveChar && edPreviewLine>=0 && edSceneIdx>=0) {
      ev.preventDefault(); var scD=script.scenes[edSceneIdx]; ensureMatrix(scD);
      scD._charMatrix[edActiveChar][edPreviewLine]=0; renderTimeline(scD); navPreview(1); return;
    }
    if (ev.key==='Tab' && edSceneIdx>=0) {
      ev.preventDefault();
      var scT=script.scenes[edSceneIdx]; var chars=(scT.chars||[]).map(function(c){return c.id;});
      if (chars.length) { var ci=chars.indexOf(edActiveChar); edActiveChar=chars[(ci+1)%chars.length];
        $('se-audio-info').textContent='⌨ '+script.characters[edActiveChar].name+' A=出现 S=暗色 D=不出现 Q=跳过 Tab=跳转'; }
      return;
    }
    if ((ev.key==='q'||ev.key==='Q') && edPreviewLine>=0 && edSceneIdx>=0) {
      ev.preventDefault(); navPreview(1); return;
    }
    return;
  }
  // Game shortcuts
  if (waiting === 'choice' && choiceNav) {
    const { btns } = choiceNav;
    if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') {
      ev.preventDefault();
      btns[choiceNav.sel].classList.remove('kbd-sel');
      choiceNav.sel = (choiceNav.sel + (ev.key === 'ArrowDown' ? 1 : btns.length - 1)) % btns.length;
      btns[choiceNav.sel].classList.add('kbd-sel');
      return;
    }
    if (ev.key === 'Enter') { ev.preventDefault(); btns[choiceNav.sel].click(); return; }
    if (/^[1-9]$/.test(ev.key)) {
      const n = parseInt(ev.key, 10) - 1;
      if (n < btns.length) { ev.preventDefault(); btns[n].click(); }
      return;
    }
  }
  if (ev.key === 'z' || ev.key === 'Z') {
    ev.preventDefault();
    if (!skipAllMode && !skipMode && !autoMode) { skipAllMode = true; $('mb-skipall').style.background = '#c06040'; }
    else stopSkipAuto();
  }
  if (ev.key === 'a' || ev.key === 'A') {
    autoMode = !autoMode; skipMode = false; skipAllMode = false;
    $('mb-auto').style.background = autoMode ? '#4a6da0' : '';
    $('mb-skip').style.background = ''; $('mb-skipall').style.background = '';
    if (autoMode && waiting === 'advance' && !typing) onTextDone();
  }
  if (ev.key === 'F5') { ev.preventDefault(); saveSlot('quicksave'); }
  if (ev.key === 'F9') { ev.preventDefault(); loadSlot('quicksave'); }
  if (ev.key === 'Escape') {
    if (skipAllMode||skipMode||autoMode) { stopSkipAuto(); return; }
    if (!$('sys-menu').classList.contains('hidden')) { $('sys-menu').classList.add('hidden'); return; }
    if (inGameNow()) openSysMenu();
  }
}/* 智能读文本：先 UTF-8（严格），失败按 GBK 解码（Windows 记事本 ANSI 保存的中文 txt） */
function readTextSmart(file, cb) {
  const r = new FileReader();
  r.onload = () => {
    const buf = r.result;
    try { cb(new TextDecoder('utf-8', { fatal: true }).decode(buf)); }
    catch (e) { cb(new TextDecoder('gbk').decode(buf)); }
  };
  r.readAsArrayBuffer(file);
}

function loadScript(sc) {
  try {
    if (!sc.meta || !Array.isArray(sc.scenes)) throw new Error('缺少 meta 或 scenes');
    script = sc;
    settings.speed = sc.meta.defaults && sc.meta.defaults.text_speed !== undefined ? sc.meta.defaults.text_speed : 30;
    settings.bgm = sc.meta.defaults && sc.meta.defaults.bgm_volume !== undefined ? sc.meta.defaults.bgm_volume : 0.6;
    settings.auto_delay = sc.meta.defaults && sc.meta.defaults.auto_delay !== undefined ? sc.meta.defaults.auto_delay : 1800;
    $('set-speed').value = settings.speed; $('speed-label').textContent = settings.speed === 0 ? '瞬间' : settings.speed;
    $('set-bgm').value = settings.bgm;
    $('set-autodelay').value = settings.auto_delay; $('autodelay-label').textContent = (settings.auto_delay/1000).toFixed(1)+'s';
    $('mb-attrs').classList.toggle('hidden', !(sc.attrs && Object.keys(sc.attrs).length));
    refreshTitle();
  } catch (e) { alert('剧本文件无效：' + e.message); }
}

  /* 点选角色的缩放滑杆（0.5-1.2 步进 0.05，实时预览） */
  $('se-scale-slider').oninput = ev => {
    const c = edCharsList[edCharSel];
    if (edCharSel < 0 || !c) return;
    c.scale = parseFloat(ev.target.value);
    $('se-scale-val').textContent = c.scale.toFixed(2);
    const el = document.querySelector('.se-ed-char[data-cid="' + c.id + '"]');
    if (el) el.style.transform = `translate(-50%,-100%) scale(${c.scale})`;
    syncEditorChars();   /* 内部 edChanged 防抖入撤销栈 */
  };
}
function persistSettings() { localStorage.setItem('wenyou_settings', JSON.stringify(settings)); }
function restoreSettings() {
  const raw = localStorage.getItem('wenyou_settings');
  if (raw) { const s = JSON.parse(raw); Object.assign(settings, s); }
  $('set-speed').value = settings.speed; $('speed-label').textContent = settings.speed === 0 ? '瞬间' : settings.speed;
  $('set-bgm').value = settings.bgm;
  $('set-sfx').value = settings.sfx;
  $('set-voice').value = settings.voice;
  $('set-voice-mode').value = settings.voice_mode;
  $('set-autodelay').value = settings.auto_delay; $('autodelay-label').textContent = (settings.auto_delay/1000).toFixed(1)+'s';
}

/* ================= 标题页粒子（花瓣/灯笼，纯手写 canvas，无依赖） ================= */
const TitleFx = {
  cv:null, ctx:null, parts:[], W:0, H:0,
  init() {
    this.cv = $('title-particles');
    if (!this.cv) return;
    this.ctx = this.cv.getContext('2d');
    this.resize();
    window.addEventListener('resize', () => this.resize());
    for (let i = 0; i < 34; i++) this.parts.push(this.petal(true));
    for (let i = 0; i < 6; i++) this.parts.push(this.lantern(true));
    const loop = () => {
      requestAnimationFrame(loop);
      /* 标题页隐藏或页面不可见时不绘制，省电 */
      if (document.hidden || $('title-screen').classList.contains('hidden')) return;
      this.step();
    };
    loop();
  },
  resize() { this.W = this.cv.width = window.innerWidth; this.H = this.cv.height = window.innerHeight; },
  petal(any) {
    return { k:'p', x:Math.random()*this.W, y:any ? Math.random()*this.H : -20 - Math.random()*40,
      s:4+Math.random()*7, vy:.35+Math.random()*.8, ph:Math.random()*6.28, sw:.4+Math.random()*.8,
      r:Math.random()*6.28, vr:(Math.random()-.5)*.03, a:.35+Math.random()*.45 };
  },
  lantern(any) {
    return { k:'l', x:Math.random()*this.W, y:any ? Math.random()*this.H : this.H + 30,
      s:2.5+Math.random()*3.5, vy:.15+Math.random()*.3, ph:Math.random()*6.28, a:.25+Math.random()*.35 };
  },
  step() {
    const c = this.ctx;
    c.clearRect(0, 0, this.W, this.H);
    this.parts.forEach((p, i) => {
      p.ph += .012;
      if (p.k === 'p') {
        /* 花瓣：飘落 + 左右摇摆 + 自旋 */
        p.y += p.vy; p.x += Math.sin(p.ph) * p.sw; p.r += p.vr;
        if (p.y > this.H + 30 || p.x < -40 || p.x > this.W + 40) this.parts[i] = this.petal(false);
        c.save(); c.translate(p.x, p.y); c.rotate(p.r);
        c.fillStyle = 'rgba(255,183,197,' + p.a + ')';
        c.beginPath();
        c.moveTo(0, -p.s);
        c.bezierCurveTo(p.s*.9, -p.s*.5, p.s*.7, p.s*.7, 0, p.s);
        c.bezierCurveTo(-p.s*.7, p.s*.7, -p.s*.9, -p.s*.5, 0, -p.s);
        c.fill(); c.restore();
      } else {
        /* 灯笼光点：缓缓上升 + 暖光闪烁 */
        p.y -= p.vy; p.x += Math.sin(p.ph) * .3;
        if (p.y < -30) this.parts[i] = this.lantern(false);
        c.save();
        c.globalAlpha = p.a * (.7 + .3 * Math.sin(p.ph * 2));
        c.shadowColor = 'rgba(255,170,80,.9)'; c.shadowBlur = 14;
        c.fillStyle = '#ffc373';
        c.beginPath(); c.ellipse(p.x, p.y, p.s, p.s * 1.25, 0, 0, 6.29); c.fill();
        c.restore();
      }
    });
  }
};

/* ================= 启动 ================= */
bindUI();
restoreSettings();
loadScript(EMBEDDED_SCRIPT);
loadCustomAssets();   /* 恢复上次会话上传的自定义素材（localStorage） */
TitleFx.init();
/* ai_gen.js 以 defer 加载，首次 refreshTitle 时 window.AutoNovel 尚不存在；
   DOMContentLoaded 时（defer 脚本已执行）重新判定一次 AI 生成入口的显隐 */
document.addEventListener('DOMContentLoaded', () => {
  const aiBtn = $('btn-ai-gen');
  if (aiBtn) aiBtn.classList.toggle('hidden', !(window.AutoNovel && typeof window.AutoNovel.open === 'function'));
});
document.addEventListener('click', unlockAudio, { once:false });
</script>
