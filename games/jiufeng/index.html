指尖摩挲着断剑上的印子，\"我等着。\""}, {"type": "narrate", "text": "纸钱灰落回地面的时候，谢挽星才从乱葬岗回来。萧盟主的灵堂设在宗祠正殿，白幡垂着，棺木里躺的那个人面如金纸，脖子上有一道剑痕——是昨夜执法堂围剿时，她被迫动的手。"}, {"type": "narrate", "text": "侯征死前还瞪着她，血从指缝往外冒：\"你师尊待你不薄，为什么...\""}, {"type": "narrate", "text": "她没有回答。谢流光说，侯征手里锁着师尊的一缕残魂，逼她出手，是唯一能打散那锁链的法子。"}, {"type": "narrate", "text": "灵堂里挤满了人。谢云雾站在左侧，手里攥着一叠纸钱，指节发白。她昨天还在说她只是谢家的养女，没有资格插手宗主的事。但现在，她眼睛红着，看着棺材的方向，没有移开视线。"}, {"type": "narrate", "text": "谢挽星走过去，接过她手里的纸钱，放进火盆里。火焰窜起来，映出谢云雾的脸——那上面有泪痕，也有某种谢挽星读不懂的光。她没有道谢，只是侧过身，让谢挽星看得见棺材里的人。"}, {"type": "narrate", "text": "\"师姐...\"谢云雀的声音从身后传来，怯生生的。她躲在柱子后面，手里抱着个洗得发白的布娃娃，眼睛盯着棺材，又赶紧移开。"}, {"type": "narrate", "text": "谢挽星走过去，摸了摸她的头。云雀还小，不懂这些。但等她长大了，会知道这宗祠里埋了多少谢家军的冤魂。"}, {"type": "narrate", "text": "等她终于从灵堂抽身出来，天已经擦黑。肩膀还带着乱葬岗的湿气。她站在宗祠后的台阶上，想喘口气。"}, {"type": "narrate", "text": "肩头一暖。谢晚照不知道等了多久，伸手替她摘掉发梢沾着的纸灰。谢挽星任由她动作，忽然握住她的手腕，将人往怀里带了带。"}, {"type": "narrate", "text": "\"晚照，\"她声音压在谢晚照耳廓上，很轻，\"天快亮了。有些账，该一起算了。\""}, {"type": "narrate", "text": "谢晚照没挣，下巴轻轻抵在她肩上。远处传来打更的声音，一下，又一下。"}, {"type": "narrate", "text": "天亮前，她们又去了乱葬岗。不是去挖坟，是去确认昨夜魔修的痕迹。"}, {"type": "narrate", "text": "西槐树下，谢云端和谢云雀已经在那等着了，谢云端手里捧着把香，对着空地上的一点痕迹拜了三拜。旁边丢着半块从侯征身上搜来的令牌。"}, {"type": "narrate", "text": "\"大师姐，\"谢云雀站起来，手里攥着一根狗尾巴草，\"二师姐说，宗主 sock 藏在密室里，有个私生子三日后要继位。她现在正在禁地外围守着，等你呢。\""}, {"type": "narrate", "text": "谢挽星把青铜铃铛和断剑的事说了一遍。谢云雀眼睛亮了亮，又很快暗下去：\"爹和燕将军当年的事，我一直想问...\""}, {"type": "narrate", "text": "\"以后有的是时间问。\"谢挽星打断她，看向谢晚照，\"你呢？\""}, {"type": "narrate", "text": "\"我去禁地。\"谢晚照说得很平静，\"宗主那里的账，我也要算的。\""}, {"type": "narrate", "text": "谢挽星没再劝。她走到 Valk 边，从怀里掏出那只铜环，又摸出三枚铜钱。指尖的血还没干，抹在龟壳上，烫得她一缩手。"}, {"type": "narrate", "text": "\"谢流光，\"她对着腰间的断剑说，\"给我算一卦。看燕家军残部现在的位置，还有师尊残魂到底被侯征藏在哪里。\""}, {"type": "narrate", "text": "剑灵嗡鸣了一声，没有回答。铜环突然发烫，龟壳里的铜钱跳出来，三枚全部立着，指向西北方。"}, {"type": "narrate", "text": "谢云端捡起铜钱，脸色变了：\"这是死卦。斩魔碎片、你师尊的残魂，还有燕家军的余部...全往西北那边去了。那地方是禁地核心。\""}, {"type": "narrate", "text": "\"那我们往禁地去。\"谢挽星把剑穗重新揣好，\"三日后继位典礼，正好。省得我们一个一个找。\""}, {"type": "narrate", "text": "谢云雾从怀里掏出半块鱼符：\"赤峰卫队一半是我的人。戌时三刻，禁地后门。\""}, {"type": "narrate", "text": "谢云雀抱着布娃娃往她怀里"}, {"type": "goto", "target": "ch014"}]}, {"id": "ch014", "background": "bg/town.webp", "checkpoint": true, "chars": [{"id": "c3", "pos": "left", "sprite": "normal"}, {"id": "c7", "pos": "center", "sprite": "normal"}, {"id": "c8", "pos": "right", "sprite": "normal"}], "script": [{"type": "narrate", "text": "灰峰的锻造坊里飘着铁锈和淬火液的味儿，谢挽星把用粗布裹了三层的断剑递到柜台后面时，叶惊秋正举着十二斤重的熟铁锤敲一根半融的寒铁，锤子悬在砧台上方顿了足足三息，虎口被震得渗出血珠都没察觉。"}, {"type": "narrate", "text": "她耳朵边先飘来点极轻的小调，调子是师尊生前教她们的摘桃歌，跑调的地方和她师妹谢流光一模一样，心口猛地一缩，才看向那截露在布外的断刃，就见原本死寂的断刃突然嗡鸣了两下，震得叶惊秋虎口的伤口又裂开些。"}, {"type": "narrate", "text": "谢挽星垂着眼看她反应，耳边除了炼炉的哔剥声，还有断剑里细碎的哼唱，混着剑身本身的震颤，吵得她太阳穴跳。"}, {"type": "narrate", "text": "“你这剑，哪来的？”叶惊秋的声音有点哑，锤子哐当一声砸在砧台上，震得桌上的淬火液晃出半寸。"}, {"type": "narrate", "text": "“捡的。"}, {"type": "narrate", "text": "”谢挽星言简意赅，指尖蹭了蹭腕内侧的月牙疤——那是她前世给剑开光时被剑气划的，和剑契绑在一起，碰这剑的时候总是发烫，袖子里还攥着半块铜板，是昨天帮人刷了十二个恭桶赚的全部家当，“找你修，多少钱我都给。"}, {"type": "narrate", "text": "”"}, {"type": "narrate", "text": "叶惊秋没接钱的话，反倒抬头打量她，发梢被炼炉烤得卷了边，脸上还沾着点灰，只有那双眼睛亮得吓人，和六年前在乱葬岗捡到的小可怜猛地重叠。"}, {"type": "narrate", "text": "她张了张嘴，还没来得及说话，就瞥见谢挽星按在柜台上的指尖动了动，那是下意识摸腕上疤的动作，再看谢挽星的左手腕内侧，也有一道浅浅的月牙印，和她爹当年刻在她腕上的信物严丝合缝。"}, {"type": "narrate", "text": "她还没来得及开口问，锻造坊的门被人一脚踹开，穿黑白执法服的弟子涌进来，带头的是执法长老的大弟子赵沉，手里攥着半张被血晕开的举报信，身后跟着温玉，正面无表情地扫视着坊里的杂役，目光落在谢挽星手里的断剑上，猛地顿了一下。"}, {"type": "narrate", "text": "“谢挽星。”赵沉的声音尖得像淬了毒的针，剑尖直直指向她手里的布包，“有人举报你私藏宗门被盗的重宝斩魔剑残片，还不把赃物交出来？”"}, {"type": "narrate", "text": "谢挽星往前站了半步，把断剑往身后藏了藏，断剑在她怀里震得更厉害，几乎要蹦出来，她往旁边偏了半步，赵沉的剑尖划破了她的衣角，没伤到皮肉。"}, {"type": "narrate", "text": "她当然知道这是有人设计的，三天前宗主刚下了令，要废她的灵根赶出宗门，今天就有人来抢剑，分明是知道这剑是斩魔剑本尊，想毁了它断九州锁链的根。"}, {"type": "narrate", "text": "“什么赃物？”叶惊秋忽然伸手把谢挽星拽到身后，攥着断剑的指节捏得发白，“这是我爹留给我的传家宝，什么时候成她偷的了？”"}, {"type": "narrate", "text": "赵沉像是听到了什么笑话，嗤笑着拔出腰间的佩剑：“叶惊秋，你自己什么身份自己清楚，你爹当年偷学宗门锻造术被处死，留下的破烂也配称传家宝？来人，把剑抢过来，当场销毁，免得留在这祸害人。"}, {"type": "narrate", "text": "”"}, {"type": "narrate", "text": "两个执法弟子冲过来拽叶惊秋的胳膊，她死死把断剑抱在怀里，指甲在剑鞘上划出好几道白印。谢挽星想伸手拉她，被赵沉的剑拦在半路。"}, {"type": "narrate", "text": "温玉却突然上前两步，挡在赵沉面前，声音压得极低，只有他们两个人能听见：“赵沉，宗主三日前特意叮嘱过，斩魔剑残片若是有下落，不可轻毁，须带回宗主殿由他亲自查验。"}, {"type": "narrate", "text": "你现在毁了赃物，是想担着欺君的罪名？”"}, {"type": "narrate", "text": "赵沉脸色变了变，咬了咬牙，狠狠瞪了叶惊秋一眼，才收回佩剑，尖着嗓子喊：“带走！今日先饶你们一次，回头再算这笔账！”"}, {"type": "narrate", "text": "温玉立刻接口，声音冷得没有半分温度：“这剑与谢挽星有缘，我带回去禀告宗主定夺，其他人，散了吧。”"}, {"type": "narrate", "text": "赵沉带着执法弟子走了，锻造坊的门被摔得震天响，其他杂役早躲得没影了，只剩下谢挽星和叶惊秋。叶惊秋靠在柜台边，左手血淌了一地，脸上却带着笑，眼睛红得像浸了血。"}, {"type": "narrate", "text": "“叶惊秋。"}, {"type": "narrate", "text": "”谢挽星走过去，把断剑往怀里一塞，扯了叶惊秋的外衣下摆给她按伤口，指尖碰到她腕内侧的疤，和她的月牙疤挨在一起，烫得她一缩手，低头才看清那疤的形状，和自己的一模一样，“你刚才疯了吗？"}, {"type": "narrate", "text": "真要被废了手，以后谁给我修剑？”"}, {"type": "narrate", "text": "“我爹说了，这剑比你我的手重要。”叶惊秋疼得抽气，却还是扯着嘴角笑，抓着谢挽星袖子的手紧了紧，“而且我赌你会接住。”"}, {"type": "narrate", "text": "谢挽星没说话，把江晚吟上次给她的金疮药掏出来，倒在她伤口上，白色的药粉碰到血，立刻起了细密的泡沫，叶惊秋疼得嘶了一声，也没躲。"}, {"type": "narrate", "text": "她指尖顿了顿，抬眼扫了扫角落那口蒙着灰的旧炉子，才开口：“你爹，是叶锋？”"}, {"type": "narrate", "text": "叶惊秋点了点头，眼睛亮得惊人：“我爹当年是你的贴身侍卫，仙魔大战的时候跟着你一起战死，神魂被宗主打散，只留下一半在断剑里，一半封在这炉子的炉契里。"}, {"type": "narrate", "text": "这斩魔剑，是我爹生前最后铸的，他说剑的主人会来，让我等她。”"}, {"type": "narrate", "text": "谢挽星腕上的月牙疤突然烫得吓人，断剑在她怀里震得厉害，谢流光的笑声突然炸开，带着哭腔喊她：“沈师姐！是她！叶叔叔的女儿！我爹当年把神魂封在炉契里了，就在这！”"}, {"type": "narrate", "text": "斩魔剑的剑意顺着她的经脉炸开，原本只是微光的断刃突然亮得晃眼，她心口处那道当年被宗主剜出来的锁链烙印也跟着发烫，和断剑的震颤同频。"}, {"type": "narrate", "text": "她没犹豫，抬剑便是一道斩魔剑意挥出去，灰色的剑气直直劈在赵沉落下的半截佩剑上，那把用了十年的上品灵剑咔哒一声断了半截，剑尖直直戳进赵沉脚边的地砖里，没至剑柄。"}, {"type": "narrate", "text": "谢挽星喉间涌上一股腥甜，被她硬生生咽了回去，指甲掐进掌心，才没让自己露出端倪。"}, {"type": "narrate", "text": "赵沉吓得脸色煞白，连退三步，结结巴巴地喊：“你……你居然能催动斩魔剑的剑意！你不是个扫洒的杂役吗！”"}, {"type": "narrate", "text": "温玉立刻上前两步，挡在赵沉面前，声音冷得没有半分温度：“赵沉，休得胡言。这剑与谢挽星有缘，我带回去禀告宗主定夺，其他人，散了吧。”"}, {"type": "narrate", "text": "赵沉咬了咬牙，知道温玉是执法长老的独女，惹不起，只得狠狠瞪了叶惊秋一眼，带着执法弟子走了。"}, {"type": "narrate", "text": "锻造坊里的其他杂役早躲得没影了，只剩下谢挽星和叶惊秋，叶惊秋靠在柜台边，左手血淌了一地，脸上却带着笑，眼睛红得像浸了血。"}, {"type": "narrate", "text": "谢挽星走过去，把断剑往怀里一塞，扯了叶惊秋的外衣下摆给她按伤口，指尖碰到她腕内侧的疤，和她的月牙疤挨在一起，烫得她一缩手，低头才看清那疤的形状，和自己的一模一样，“你刚才疯了吗？"}, {"type": "narrate", "text": "真要被废了手，以后谁给我修剑？”"}, {"type": "narrate", "text": "“我爹说了，这剑比你我的手重要。”叶惊秋疼得抽气，却还是扯着嘴角笑，抓着谢挽星袖子的手紧了紧，“而且我赌你会接住。”"}, {"type": "narrate", "text": "谢挽星没说话，把江晚吟上次给她的金疮药掏出来，倒在她伤口上，白色的药粉碰到血，立刻起了细密的泡沫，叶惊秋疼得嘶了一声，也没躲。"}, {"type": "narrate", "text": "她指尖顿了顿，抬眼扫了扫角落那口蒙着灰的旧炉子，才开口：“你爹，是叶锋？”"}, {"type": "narrate", "text": "叶惊秋点了点头，眼睛亮得惊人：“我爹当年是你的贴身侍卫，仙魔大战的时候跟着你一起战死，神魂被宗主打散，只留下一半在断剑里，一半封在这炉子的炉契里。"}, {"type": "narrate", "text": "这斩魔剑，是我爹生前最后铸的，他说剑的主人会来，让我等她。”"}, {"type": "narrate", "text": "谢挽星腕上的月牙疤突然烫得吓人，断剑在她怀里震得厉害，谢流光的笑声突然炸开，带着哭腔喊她：“沈师姐！是她！叶叔叔的女儿！我爹当年把神魂封在炉契里了，就在这！”"}, {"type": "narrate", "text": "斩魔剑的剑意顺着她的经脉炸开，原本只是微光的断刃突然亮得晃眼，她心口处那道当年被宗主剜出来的锁链烙印也跟着发烫，和断剑的震颤同频。"}, {"type": "narrate", "text": "她没犹豫，抬剑便是一道斩魔剑意挥出去，灰色的剑气直直劈在赵沉落下的半截佩剑上，那把用了十年的上品灵剑咔哒一声断了半截，剑尖直直戳进赵沉脚边的地砖里，没至剑柄。"}, {"type": "narrate", "text": "谢挽星喉间涌上一股腥甜，被她硬生生咽了回去，指甲掐进掌心，才没让自己露出端倪。"}, {"type": "narrate", "text": "赵沉吓得脸色煞白，连退三步，结结巴巴地喊：“你……你居然能催动斩魔剑的剑意！你不是个扫洒的杂役吗！”"}, {"type": "narrate", "text": "温玉立刻上前两步，挡在赵沉面前，声音冷得没有半分温度：“赵沉，休得胡言。这剑与谢挽星有缘，我带回去禀告宗主定夺，其他人，散了吧。”"}, {"type": "narrate", "text": "赵沉咬了咬牙，知道温玉是执法长老的独女，惹不起，只得狠狠瞪了叶惊秋一眼，带着执法弟子走了。"}, {"type": "narrate", "text": "锻造坊里的其他杂役早躲得没影了，只剩下谢挽星和叶惊秋，叶惊秋靠在柜台边，左手血淌了一地，脸上却带着笑，眼睛红得像浸了血。"}, {"type": "narrate", "text": "“叶惊秋。”谢挽星走过去，把断剑往怀里一塞，扯了叶惊秋的外衣下摆给她按伤口，指尖碰到她腕内侧的疤，和她的月牙疤挨在一起，烫得她一缩手，“你刚才疯了吗？真要被废了手，以后谁给我修剑？"}, {"type": "narrate", "text": "”"}, {"type": "narrate", "text": "“我爹说了，这剑比你我的手重要。”叶惊秋疼得抽气，却还是扯着嘴角笑，“而且我赌你会接住。”"}, {"type": "narrate", "text": "谢挽星没说话，把江晚吟上次给她的金疮药掏出来，倒在她伤口上，白色的药粉碰到血，立刻起了细密的泡沫。她指尖顿了顿，抬眼扫了扫角落那口蒙着灰的旧炉子，才问：“你爹，是叶锋？”"}, {"type": "narrate", "text": "叶惊秋点了点头，眼睛亮得惊人：“我爹当年是你的贴身侍卫，仙魔大战的时候跟着你一起战死，神魂被宗主打散，只留下一半在断剑里，一半封在这炉子的炉契里。"}, {"type": "narrate", "text": "这斩魔剑，是我爹生前最后铸的，他说剑的主人会来，让我等她。”"}, {"type": "narrate", "text": "谢挽星腕上的月牙疤突然烫得吓人，断剑在她怀里震得厉害，谢流光的碎魂都在哭：“师姐，叶叔叔当年为了护你，被魔物挖去了半颗神魂，宗主还污蔑他偷剑，剁了他的手扔在锻造坊门口，我那时候被封印在剑里，什么都做不了…"}, {"type": "narrate", "text": "…”"}, {"type": "narrate", "text": "她指尖碰了碰叶惊秋腕上的疤，那疤的形状和她的月牙疤刚好能拼成一个完整的圆，是当年她给所有亲传弟子的信物。"}, {"type": "narrate", "text": "“今晚子时，后山乱葬岗的破庙，我带你走。”谢挽星把金疮药塞给叶惊秋，直起身，把断剑往腰里一别，“宗主不会放过你，也不会放过我这把剑。"}, {"type": "narrate", "text": "执法队肯定会在坊外守着，你收拾点能带的东西，我来接你。”"}, {"type": "narrate", "text": "叶惊秋点了点头，直起身子，从柜台底下摸出个油布包，塞给谢挽星：“我爹留下的铸剑图纸，还有当年宗主勾结魔族陷害我爹的证据，都在里面。"}, {"type": "narrate", "text": "还有，要修这剑，得用我爹留下的玄铁，我炼了一根，放在淬火池底下，明天我去拿给你。”"}, {"type": "narrate", "text": "谢挽星接过油布包，沉甸甸的，里面有硬邦邦的铁片，还有摞得整整齐齐的纸，夹层里还摸到一枚刻着“叶锋”二字的青铜印，是她爹当年给贴身属下的专属印，她攥了攥掌心，问：“你这些年，一直留着这些？"}, {"type": "narrate", "text": "”"}, {"type": "narrate", "text": "“我爹说，等剑的主人来了，就把这些都给她。”叶惊秋笑得露出虎牙，左手还在淌血，却举得高高的，像个递了入党申请书的小战士，“以后我的命是你的，谢挽星。你要砸谁的宗门，我帮你铸剑。”"}, {"type": "narrate", "text": "谢挽星转身往门外走，断剑在她腰里震得轻了些，谢流光的碎魂还在叽叽喳喳：“师姐，叶叔叔当年给你铸这把剑的时候，把自己的一半神魂都融进去了，你说他要是知道你找到他女儿了，会不会高兴啊？"}, {"type": "narrate", "text": "”"}, {"type": "narrate", "text": "她摸了摸腰里的断剑，没说话，只是脚步更快了些。灰云压在天上，九峰的锁链在云层里若隐若现，震得人耳朵发麻。"}, {"type": "narrate", "text": "风卷着铁锈味吹过来，断剑的嗡鸣声越来越响，和远处锁链的震颤混在一起，她心口处的烙印还在发烫，袖子里攥着那枚温热的青铜印，掌心还留着叶惊秋刚才抓她的时候的温度。"}, {"type": "narrate", "text": "身后传来叶惊秋的声音，带着点漫不经心的笑：“谢挽星，别忘了，你欠我一顿酒啊！”"}, {"type": "narrate", "text": "她没回头，只是抬了抬手，算是应了。云层里的锁链闪了一下，像在应和着什么。那些被宗主埋了十年的真相，终于要浮出水面了。"}, {"type": "goto", "target": "ch015"}]}, {"id": "ch015", "background": "bg/sect_night.webp", "checkpoint": true, "chars": [{"id": "c1", "pos": "left", "sprite": "normal"}, {"id": "c4", "pos": "center", "sprite": "normal"}, {"id": "c8", "pos": "right", "sprite": "normal"}], "script": [{"type": "narrate", "text": "外门集市的青石板缝里嵌着半块没化的雪碴，谢挽星蹲在墙根扫帚堆后面，刚把沈砚秋半夜塞给她的聚灵丹按进袄子夹层，就听见集市东头炸了锅。"}, {"type": "narrate", "text": "执法队举着的赤色火把晃得人眼晕，领头的筑基期弟子扯着嗓子喊，抓昨日逃走的小罪奴苏砚。"}, {"type": "narrate", "text": "她今天本来就是来找苏砚的。前几日谢流光在断剑里提醒她，苏砚手里有她师父当年留下的勾结魔族的证据，是历任执事峰都不敢碰的硬骨头，宗主前几日把苏砚扔去乱葬岗，就是要把证据找出来毁掉。"}, {"type": "narrate", "text": "她的目标就是趁乱找到苏砚，把证据拿到手。"}, {"type": "narrate", "text": "可执法队已经把集市的三个出口封了，炼气后期的执法弟子挨个搜路人的包袱，谢流光压着声音在断剑里骂她疯了：“宗主今天搞这么大的阵仗就是冲你来的，你别出去送死，那丫头的证据就算拿到手，也没命护着。"}, {"type": "narrate", "text": "”谢挽星没应声，指尖摸了摸袖口里藏的追踪符——那是她前两日偷偷塞给苏砚的，画了听剑的共鸣纹，苏砚若是有危险，符会发烫。"}, {"type": "narrate", "text": "她指尖刚碰到符纸，突然听见断剑里浮起半句不成调的琴音，是她前世师父弹的《清心普善咒》。师尊当年总坐在峰顶弹琴，她和小弟子们就蹲在旁边画符。符纸发烫的方向，正是西侧的荒墙根。"}, {"type": "narrate", "text": "她猫着腰顺着墙根往西摸，刚拐进窄巷，就看见两个执法弟子把苏砚按在枯井沿上。"}, {"type": "narrate", "text": "少女的灰衣被扯得露出肩膀，指缝全是血，怀里那半叠画满朱砂符纸的册子快被筑基期的弟子抢过去，苏砚咬着牙不撒手，嘴唇都被咬破了。"}, {"type": "narrate", "text": "谢挽星弯腰捡起脚边半人高的破扫帚，攥着木柄往巷子口的药筐砸去，晒干的蒲公英顷刻炸得漫天飞，执法弟子被白绒糊了满眼，骂骂咧咧转过头的那瞬，她已经拽着苏砚的后领往窄巷深处窜。"}, {"type": "narrate", "text": "苏砚把怀里塞得皱巴巴的符纸往她怀里塞，指甲划破了她手腕上的皮肤，声音抖得不成样：“符里是我娘写的，宗主和魔族有往来，我爹就是被他们害死的。”"}, {"type": "narrate", "text": "执法弟子反应过来追了两步，见她们跑进杂役院的方向，骂骂咧咧地停了下来：“谅她也跑不出外门，先去搜别的地方，宗主说了，那罪奴手里有要命的东西，找到了一律绞杀。"}, {"type": "narrate", "text": "”苏砚跑得急，左腿踩在碎瓷片上，血顺着洗得发白的裤腿往下淌，疼得直抽气，却还攥着那半块掉出来的白玉佩不撒手。那佩上刻着个小小的“星”字，和她手腕上的月牙疤叠在一起，晃得她眼底发酸。"}, {"type": "narrate", "text": "断剑里突然浮起谢流光带着颤的声音：“那佩……是师姐当年刻了送我的，我们三个一人一块，她刻星，我刻月，师姐刻玉……”"}, {"type": "narrate", "text": "柴房的门被谢挽星反手顶上，她把苏砚塞进柴堆最里面，用破草席盖住，自己坐在柴房门口拿着扫帚扫地，扫帚刮过地面的雪碴发出沙沙的响，装着没事人。"}, {"type": "narrate", "text": "执法队已经开始挨个搜杂役院的柴房，靴底踩在雪碴上的脚步声越来越近，谢流光的语气突然沉了下来：“暗处有宗主的杀手，刚才你出手的时候被眼线看见了，宗主要灭口，你小心。”"}, {"type": "narrate", "text": "脚步声停在柴房门口的时候，谢挽星的心提到了嗓子眼，刚要开口，就听见沈砚秋的声音从院门口飘过来，带着点颐指气使的娇纵：“我让谢挽星帮我收碧落峰专供的烫伤膏，里头的药都是我爹亲手配的，里面没藏逃奴，你们敢搜就是不给整个碧落峰面子。"}, {"type": "narrate", "text": "”执法队领头的看见是宗主看重的小公主，脸色变了变，不敢多问，带着人走了。"}, {"type": "narrate", "text": "谢挽星松了口气，把柴门顶上，转身把苏砚从柴堆里拉出来。她膝上摊开那叠符纸，沾了血的宣纸上字迹虽然模糊，但还是能认出宗主和魔族少主的往来书信，还有陷害前任碧落峰峰主的罪证。"}, {"type": "narrate", "text": "谢流光的声音在断剑里抖得不成样：“师姐，这是师父的笔迹，当年就是宗主勾结魔族，把师父推下斩魔台的，他还把师父的医案改了，说师父是通魔才死的。”"}, {"type": "narrate", "text": "苏砚坐在草堆上，眼尾红得发肿，垂着眼看信的时候，睫毛颤得像暴风雨里的蝶翅，刚才的慌意全散了，只剩烧得发亮的恨意。"}, {"type": "narrate", "text": "她声音哑得像被砂纸磨过，每个字都裹着点血腥气：“我娘是前任峰主治病的医修，她把这些藏在我画的符里，说我要是活不下去，就找听剑的人，只有她能给我家平反。”"}, {"type": "narrate", "text": "谢挽星摸了摸自己手腕上的月牙形旧疤，那是前世她给小弟子刻护身符时，用斩魔剑的剑尖划的，怕小弟子被欺负。"}, {"type": "narrate", "text": "她低头看见苏砚腕上也带着一道一模一样的疤，是她前世削符的时候怕烧到手，刻的印记。"}, {"type": "narrate", "text": "她把苏砚从草堆里拉出来，拍了拍她手上的灰，声音没什么起伏，却像定海针似的落下来，砸得满屋慌意都消了大半：“以后你跟着我，当我的徒弟，没人能动你。”"}, {"type": "narrate", "text": "苏砚愣了两秒，突然就哭了，扑到她怀里，嗓子堵得喊出来的“师父”都带着颤，指腹上的画符茧蹭过她的颈窝，烫得她心头一热。"}, {"type": "narrate", "text": "然后谢挽星听见房顶上有瓦片响，抬头看见一个穿黑袍的人影举着淬了毒的刀，刀尖在窗棂的缝隙里闪着冷光。"}, {"type": "narrate", "text": "她下意识把苏砚护在身后，断剑出鞘，剑鸣声震得房顶的灰往下掉，那黑影见她动了手，扔了个刻着宗主徽记的飞镖，转身就窜进了雪地里。"}, {"type": "narrate", "text": "谢挽星捏着那枚还带着余温的飞镖，指尖的力重得几乎要嵌进飞镖的木柄里，木柄上刻着的宗主徽记像条吐信的蛇，扎得她眼疼。"}, {"type": "narrate", "text": "她低头看见苏砚攥着她的衣角，指节攥得发白，眼睛亮得像浸了火的碎星，刚才的害怕全没了，只剩满眼的依赖。"}, {"type": "narrate", "text": "宗主动手了。那张写着勾结罪证的符纸，是捅破他画皮的第一把刀。"}, {"type": "goto", "target": "ch016"}]}, {"id": "ch016", "background": "bg/sect_day.webp", "checkpoint": true, "chars": [{"id": "c1", "pos": "left", "sprite": "normal"}, {"id": "c2", "pos": "center", "sprite": "normal"}], "script": [{"type": "narrate", "text": "赤峰的风卷着焦土往领口里钻，谢挽星站在半塌的剑碑前，手里还攥着半截被削断的扫帚，扫帚上的竹丝沾了点干涸的血——是刚才避裴照夜那一剑的时候，被剑风刮破的手心蹭的。"}, {"type": "narrate", "text": "袖口洗得发白的外门弟子服磨起了毛，膝盖处的补丁是上个月自己缝的，针脚歪歪扭扭，像她师父以前教她绣剑穗时总说她手笨。"}, {"type": "narrate", "text": "“谢挽星，你还有脸来赤峰？”"}, {"type": "narrate", "text": "赤色劲装的身影从焦土后面走出来，裴照夜眉间的浅疤是六年前仙魔大战逃命时磕在石头上留的，在日光下泛着冷，腰间的旧剑穗晃得哐当响，那是她爹当年亲手给她系的，重剑直接横在她颈前一寸，剑身上还凝着未散的血气，显然是刚才追杀魔物留下的。"}, {"type": "narrate", "text": "腰间的执法牌撞在剑柄上，叮的一声，那是她三年来拼了命完成宗门任务才换来的，就是为了有资格翻她爹的旧案。"}, {"type": "narrate", "text": "“上次偷宗主玄铁剑的账还没算，今天我干脆就废了你，省得你再去偷别峰的宝贝。"}, {"type": "narrate", "text": "”她的声音哑得像磨过砂，目光扫过谢挽星洗得发白的弟子服，恨意几乎要凝成实质——当年柳鹤年把谢无歧偷剑的证据甩出来的时候，她就在旁边看着，那个曾经九峰最清贵的谢峰主，直接被废了灵根扔去外门，连带着整个谢家都被逐出九峰，而她爹，也被说成是被谢无歧连累的通魔叛徒，全族一百多口人，除了她躲在密道里，全被柳鹤年带人屠了。"}, {"type": "narrate", "text": "谢挽星举着半截扫帚挡了挡，指节因为用力泛着白：“我没偷剑，我来拿赤峰的剑意碎片。”"}, {"type": "narrate", "text": "“放屁。”裴照夜的剑直接压过来，扫帚瞬间碎成漫天竹屑，“宗主亲口说你偷了碧落峰的镇峰之宝，把你关在外门三年，你是什么东西，也配碰赤峰的剑意？”"}, {"type": "narrate", "text": "重剑带着风压砸下来，谢挽星侧身滚到一边，焦土蹭得她满脸都是，她抽出身后的断剑横在胸前，断剑嗡鸣了一声，震得裴照夜的剑偏了半分。"}, {"type": "narrate", "text": "这断剑是她师父当年用的佩剑的碎片，她捡回来磨了三年，磨得锋刃发亮，每次握的时候，都像师父扶着她练剑的手。"}, {"type": "narrate", "text": "两人过了十几招，谢挽星的修为比裴照夜低着两个大境界，没一会儿胳膊就被剑风扫得血肉模糊，可她没躲，耳朵全贴在剑碑传来的低鸣上。"}, {"type": "narrate", "text": "她从小就能听见剑碑里的声音，当年她师父告诉她，剑意是不灭的，只要信它，就能听见故人的声音。这六千年，剑碑里封着三道剑意：她师父谢无歧的，裴照夜她爹裴振南的，还有宗主柳鹤年的。"}, {"type": "narrate", "text": "前两道剑意在哭，第三道在笑。"}, {"type": "narrate", "text": "她听见裴振南的剑意裹着血沫喊：“阿照快走！柳鹤年通魔！他要灭我们的口！”紧接着是柳鹤年带着笑的声音：“谢无歧、裴振南叛变通魔，罪该万死，毁其神魂，碎其剑骨，九峰剑意永封。”"}, {"type": "narrate", "text": "谢挽星突然就停了动作，直直地站着，裴照夜的剑尖已经戳到了她胸口，再进半寸就能穿心。"}, {"type": "narrate", "text": "“你找死？"}, {"type": "narrate", "text": "”裴照夜咬着牙，指尖因为用力攥着剑柄而泛白，她本来只想吓退谢挽星，没想到这人居然不躲，三年了，每次在宗门遇见，谢挽星都是低着头绕路走，连她的眼睛都不敢看，今天居然敢站得这么直。"}, {"type": "narrate", "text": "谢挽星没看她，抬手从怀里摸出个磨得发毛的旧剑穗，递到她面前。"}, {"type": "narrate", "text": "剑穗是暗红色的，穗子上的线都磨得起球了，串着个铜制的小剑坠，坠子背面刻着个歪歪扭扭的“裴”字，字迹是她当年刚学写字的时候歪歪扭扭刻的，裴照夜不会认错。"}, {"type": "narrate", "text": "裴照夜的呼吸突然就停了。"}, {"type": "narrate", "text": "这个剑穗她找了六年。"}, {"type": "narrate", "text": "仙魔大战那天她爹把她塞进密道的时候，身上挂的就是这个剑穗，她记得清清楚楚，剑穗上的铜坠是她爹亲手刻的，当年她刚练剑，总握不住剑柄，她爹就给她刻了个小剑坠挂剑上，说等阿照长大了，就能用这把剑替他杀魔。"}, {"type": "narrate", "text": "她还记得铜坠边缘有个小豁口，是她当年贪玩磕在石头上掉的，她爹没舍得扔，用银箔补了，补得歪歪扭扭的。"}, {"type": "narrate", "text": "她爹的剑穗，怎么会在这个人手里？"}, {"type": "narrate", "text": "“你在哪找到的？”裴照夜的声音抖得不成样，重剑“当啷”一声砸在焦土上，剑身上的血珠子溅起来，沾了她一袖子。"}, {"type": "narrate", "text": "“乱葬岗的战场废墟里。"}, {"type": "narrate", "text": "”谢挽星的声音很平，指尖还在渗血，滴在剑穗上，“你爹死的时候手里攥着这个，旁边有我师父的断剑碎片，他神魂还没散，喊了三个时辰你的名字，说柳鹤年污蔑他通魔，要我要是碰见你，告诉你好好活着，替他报仇。"}, {"type": "narrate", "text": "”"}, {"type": "narrate", "text": "裴照夜的眼眶一下子就红了。她一直以为她爹是叛徒，是整个赤峰的耻辱，隐姓埋名进赤峰，修最苦的赤峰剑诀，受了三年罚，就是想查出真相，给她爹平反。"}, {"type": "narrate", "text": "她每次梦见她爹，都是血淋淋的站在那，说她不够努力，没给他报仇。"}, {"type": "narrate", "text": "“你放屁。”裴照夜突然抬剑又要砍过来，眼泪却砸在剑穗上，“宗主不会骗我，你这种外门杂役，懂什么？你说我爹喊我名字，谁知道你是不是找了人来录的声音骗我？"}, {"type": "narrate", "text": "你师父可是通魔的叛徒，谁知道你是不是和他串通好的！”"}, {"type": "narrate", "text": "“那你听剑碑里的剑意啊。"}, {"type": "narrate", "text": "”谢挽星抬了抬下巴，指向半塌的剑碑，她的胳膊在流血，血顺着断剑的纹路往下淌，“你爹的剑意封在这里面六千年了，他要是连自己女儿的声音都认不得，还能当赤峰的峰主？”"}, {"type": "narrate", "text": "裴照夜愣了两秒，转身走到剑碑前面，伸手贴在了焦黑的碑身上。"}, {"type": "narrate", "text": "暖金色的剑意突然从碑身里炸出来，带着她爹熟悉的剑招，是她小时候趴在练兵场看她爹练的第一套赤峰剑诀，每一招她都熟，当年她爹还抱着她的小手，陪她舞过。"}, {"type": "narrate", "text": "紧接着是她爹临死前的声音，带着血，带着不甘：“阿照，别信柳鹤年，通魔的是他，谢大哥是无辜的，镇峰剑被柳鹤年偷了，他污蔑谢大哥偷的，要毁了九峰的剑意，打开上古锁链放魔族进来——阿照，爹对不起你，没护住你…"}, {"type": "narrate", "text": "…”"}, {"type": "narrate", "text": "“阿照”两个字一出口，裴照夜的腿一下子就软了，她扶着剑碑才没跪下去。"}, {"type": "narrate", "text": "只有她爹会这么喊她，柳鹤年平时喊她都是“裴照夜”，甚至长老们都是喊她裴首席，只有她爹，会蹲下来揉她的头发，喊她“我们阿照最棒”。"}, {"type": "narrate", "text": "剑意散的时候，裴照夜已经红了眼，她攥着剑穗的手指节都泛了白，指腹蹭过铜坠上那个银箔补的小豁口，那是她爹当年笨手笨脚补的，边边角角的纹路她都记得。"}, {"type": "narrate", "text": "她转身看向谢挽星，眼睛红得像要滴血，重剑横在两人之间，剑尖还指着谢挽星的喉咙：“你说的要是有一句假的，我下次见你，必定废了你胳膊，挑你灵根，让你求生不得求死不能。”"}, {"type": "narrate", "text": "谢挽星扯了扯嘴角，指尖的血滴在断剑上，那断剑是她师父的，当年她师父被废灵根的时候，把佩剑的碎片扔给她，说“挽星，师父没通魔，你替师父看着，看着柳鹤年怎么身败名裂”。"}, {"type": "narrate", "text": "她的声音很稳：“成啊，裴首席的剑快，我等着。”"}, {"type": "narrate", "text": "她说完就走到剑碑前面，伸手贴在了碑身上。"}, {"type": "narrate", "text": "熟悉的剑意包裹上来，是她师父谢无歧的声音，温温柔柔的，像以前教她练剑的时候，总说她手笨，但是不怕，师父陪着你：“挽星，师父没通魔，剑意在这里，你拿去吧，师父等你拿回属于你的东西。”"}, {"type": "narrate", "text": "剑碑突然裂了一道缝隙，一块指甲盖大的淡金色碎片从裂缝里掉出来，刚好落在谢挽星的掌心，碎片碰到她皮肤就化了，暖流顺着经脉往丹田里钻，她感觉自己的修为硬生生往上跳了一小截，本来卡在筑基后期的瓶颈，居然松动了半分。"}, {"type": "narrate", "text": "这是师父留给她的一点力量，六千年了，师父还在等她。"}, {"type": "narrate", "text": "裴照夜看着她接碎片，沉默了半天，把怀里的剑穗攥得更紧了，指腹蹭过剑穗上磨起的毛球，那是她爹当年天天挂在腰上磨出来的：“你拿剑意碎片，是为了查当年的事？”"}, {"type": "narrate", "text": "“嗯。"}, {"type": "narrate", "text": "”谢挽星把断剑收回鞘，掌心还残留着剑意的温度，暖烘烘的，像师父以前拍她肩膀的感觉，“我师父被污蔑偷剑，废了灵根扔去外门，我找齐九峰的剑意碎片，要给他平反，也要断了柳鹤年勾结魔族的后路。"}, {"type": "narrate", "text": "”"}, {"type": "narrate", "text": "裴照夜咬了咬牙，重剑“咔哒”一声插进焦土里，剑身还在嗡嗡响，像是憋了一肚子火：“我跟你查。"}, {"type": "narrate", "text": "但是我有三个条件：第一，查到柳鹤年勾结魔族的证据，我要亲手杀了他，给我爹和我师父报仇；第二，你拿到的所有证据，都要先给我过目，我要确认我爹的清白；第三，你要是敢耍我，我立马废了你，哦对，你要是再敢收碧落峰沈砚秋的东西，我见一次打你一次。"}, {"type": "narrate", "text": "”"}, {"type": "narrate", "text": "谢挽星抬眼看她，裴照夜别过头，耳尖却红了，显然是不好意思说刚才的狠话，手里的剑穗攥得紧紧的，指节都泛了白。"}, {"type": "narrate", "text": "“成交。”谢挽星笑了笑，转身往赤峰下走，灰衣被风刮得飘起来，露出手腕上个月牙形的旧疤，那是三年前在执法堂罚跪的时候磕的，裴照夜当时还让人在她膝盖下放了碎石，说外门杂役不配跪得舒服。"}, {"type": "narrate", "text": "旧疤在日光下泛着冷意，但她心里是暖的。"}, {"type": "narrate", "text": "裴照夜盯着那道疤看了两秒，突然想起三年前她在执法堂罚谢挽星跪三天，谢挽星膝盖流血，也攥着断剑不认偷剑的罪，那时候她还不明白，为什么这个瘦得像个小鸡子的外门杂役，宁可被打断腿也不认罪。"}, {"type": "narrate", "text": "现在她知道了，她是谢无歧的徒弟，是来替她师父平反的，也是来替她爹报仇的。"}, {"type": "narrate", "text": "她咬了咬牙，追上去半步，重剑在身后拖得哐当响：“谢挽星，下次来赤峰别带扫帚，我赤峰不缺扫地的，缺……缺会听剑碑说话的。”"}, {"type": "narrate", "text": "谢挽星回头，冲她眨了眨眼，脸上的灰蹭得一道一道的，笑起来眼睛弯得像月牙：“那我带点碧落峰的白兰？沈砚秋上次塞给我的，我还没尝过味儿。”"}, {"type": "narrate", "text": "裴照夜的脸一下子红到了耳根，重剑直接砸在她脚边，砸出个半尺深的坑，焦土溅了她一裤腿：“你少提别人！我告诉你，你要是敢骗我，我下次见你，绝对废了你胳膊！还有，不准收沈砚秋的东西！”"}, {"type": "narrate", "text": "谢挽星笑着跑下了山，风把她的笑声吹得很远，裴照夜站在山顶，攥着怀里的剑穗，指尖还残留着刚才碰她断剑时的温度，剑穗在怀里发着烫，像她爹以前拍她肩膀的时候，暖烘烘的。"}, {"type": "narrate", "text": "赤峰的剑意碎片已经到手了，谢挽星摸了摸丹田里的暖流，又想起刚才裴照夜红着眼眶的样子，脚步慢了点。"}, {"type": "narrate", "text": "这个盟友，好像比想象中好说话。"}, {"type": "goto", "target": "ch017"}]}, {"id": "ch017", "background": "bg/sect_day.webp", "checkpoint": true, "chars": [{"id": "c7", "pos": "left", "sprite": "normal"}, {"id": "c8", "pos": "center", "sprite": "normal"}, {"id": "c9", "pos": "right", "sprite": "normal"}], "script": [{"type": "narrate", "text": "谢挽星蹲在黄峰梅林的断墙根，衣襟上沾着扫外门落叶沾的草屑，手里半块冷麦饼啃得满嘴碎渣，今日的差事本该在巳时前交差，她绕了半座峰蹲在这儿，已经等了快一个时辰。"}, {"type": "narrate", "text": "黄峰巡山弟子的皂靴踩得枯枝咔嚓响，她缩了缩脖子把破棉袄的领子竖起来，耳朵贴上冻得硬邦邦的墙根——这是她前阵子摸出来的窍门，整座黄峰的灵剑都归宗主管，剑意顺着墙缝渗出来，她能顺着剑意的波动听见议事殿里的动静。"}, {"type": "narrate", "text": "“柳师妹还在思过洞里关着，我劝你死了这条心。”守门的黄峰弟子声音冷得像冰，“宗主说了，谁要是敢给她递东西，直接杖责三十赶下山。”"}, {"type": "narrate", "text": "谢挽星咬了一口冷麦饼，麦渣呛得她咳了两声。三天前她撞见送饭的弟子嚼舌根，说柳如烟把宗门的巡山令牌给了外门的杂役，被宗主抓了个正着，当场抽了三十鞭子关进了后山思过洞。"}, {"type": "narrate", "text": "她原本是想找柳如烟拿她攒了半年的、关于宗主勾结魔族的证据，现在看来只能打退堂鼓。"}, {"type": "narrate", "text": "她刚把最后一口麦饼咽下去，就听见议事殿的方向传来瓷器砸在地上的脆响，还有宗主暴怒的骂声：“你还敢提她？当年要不是我留了她一命，她早就应该跟你那个谢师叔一起死在锁链崩塌的那场灾祸里！"}, {"type": "narrate", "text": "”"}, {"type": "narrate", "text": "谢挽星的后背瞬间绷紧了，手指猛地收紧，把手里剩的半块麦饼攥得碎成渣，碎渣扎进掌心的裂口里，疼得她轻嘶了一声，却浑然未觉。"}, {"type": "narrate", "text": "她屏住呼吸把耳朵死死贴在墙缝上，听见柳如烟的声音哑得像被砂纸磨过：“你害了谢师叔，害了碧落峰几百条人命，还篡改史书说她是魔头，你会有报应的。”"}, {"type": "narrate", "text": "“冥顽不灵！”宗主冷笑，“来人，把大小姐关去思过崖，没有我的命令，不许任何人探视。”"}, {"type": "narrate", "text": "谢挽星的心沉到了底。思过崖那是宗门关重犯的地方，进去的人没有几个能活着出来，柳如烟要是真被送过去，她手里的线索就彻底断了。"}, {"type": "narrate", "text": "就在她犹豫着要不要先撤的时候，脚下突然被什么东西砸了一下。"}, {"type": "narrate", "text": "她低头一看，是本用宣纸装订的册子，纸边还沾着没干透的墨，封皮上没有任何标记，但摸上去的质感，和她之前在执法殿门口撞见执法弟子用的记罚册一模一样。"}, {"type": "narrate", "text": "她抬头往议事殿的窗户那边看，只看见一个穿白色执法服的背影迅速地拉上了窗棂，发间簪着的羊脂玉簪闪了一下，很快消失在窗棂后面，露出来的半截手腕上有一道新鲜的红痕，像是刚被谁拽过的。"}, {"type": "narrate", "text": "是温玉。"}, {"type": "narrate", "text": "谢挽星几乎是瞬间就明白了。温玉的爹是执法长老，现在肯定被她爹盯着，没法直接出来见她，只能趁着她爹和宗主吵得不可开交的时候，把东西从窗户丢出来。"}, {"type": "narrate", "text": "她迅速把册子塞进贴身的里衣，冰凉的纸贴在皮肤上，冻得她一哆嗦。刚要转身走，就听见议事殿的门被推开，宗主带着人出来的脚步声越来越近，还有巡山弟子的剑鸣声在附近晃荡。"}, {"type": "narrate", "text": "她来不及多想，顺着墙根往梅林外面跑，指甲刮在梅树的枝桠上，掉了几片带雪的梅瓣。"}, {"type": "narrate", "text": "巡逻弟子的剑意扫过来的时候，她几乎是贴着地滚到了一丛灌木后面，等那波剑意过去，才敢爬起来往自己的茅屋跑。"}, {"type": "narrate", "text": "风刮在脸上像刀子，她怀里揣着的册子却滚烫，刚才她接册子的时候瞥见最后一页写着一行小字：“宗主克扣各峰供奉，私通魔族，前任碧落峰峰主谢挽星遇害，黄峰柳氏知情”，落款是温玉的名字。"}, {"type": "narrate", "text": "她跑回去的时候茅屋的门被风吹得哐哐响，断剑摆在床头泛着冷光。"}, {"type": "narrate", "text": "她摸出火折子点了炭盆，一页页翻手里的册子，里面不仅有宗主的贪墨账目，还有他当年给谢师叔下毒的药方子，甚至还有他和魔族往来的书信，字字都是能要了宗主命的证据。"}, {"type": "narrate", "text": "“你刚才在黄峰是不是看见柳如烟了？”断剑里传来谢流光的声音，带着点早饭没吃饱的委屈，“她腰上是不是挂着那半块白玉佩？和你腕上的月牙疤合起来，就是师尊当年给咱们三个的剑形信物。”"}, {"type": "narrate", "text": "谢挽星摸了摸自己手腕上的月牙疤，那是她前世被锁链捅穿神魂的时候师尊拼了命给她留下的印记。"}, {"type": "narrate", "text": "她刚才在议事殿窗外瞥见柳如烟的时候，确实看见她腰间的玉佩碎了一半，边缘的弧度刚好能和她腕上的疤拼在一起。"}, {"type": "narrate", "text": "“还有温玉，”谢流光的声音沉了下来，“你知不知道她今天帮你把册子拿出来，被她爹发现了，现在已经被禁足在执法殿了，她爹说要查清楚她私通外门杂役的罪名，杖责是免不了的。”"}, {"type": "narrate", "text": "谢挽星翻册子的手顿了顿。"}, {"type": "narrate", "text": "她早就知道每次她犯事儿，温玉都会在执法殿的记录上给她打个折扣，上次她偷了半块馒头被抓住，罚她扫三个月外门，温玉给她改成了一个月，她当时以为是温玉看她可怜，原来是从那时候就开始帮她。"}, {"type": "narrate", "text": "她想起刚才议事殿窗边那个白色的背影，温玉平时连说话都不敢大声，今天却敢把整个身家性命都押在她身上，那道手腕上的红痕，估计是被她爹拽的时候蹭的。"}, {"type": "narrate", "text": "窗外的雪越下越大，落在茅草屋顶上沙沙响。谢挽星把册子塞进断剑旁边的暗格，那是她特意让叶惊秋给她打的，只有她自己知道怎么开。"}, {"type": "narrate", "text": "三天后就是宗门大比，宗主要在那天宣布新任碧落峰峰主的人选，顺带把她废了灵根赶出去。她原本还在愁没有证据拆穿他的真面目，现在温玉和柳如烟给她送来了这么个大礼。"}, {"type": "narrate", "text": "她摸了摸腰上的断剑，又想起暖手炉的温度——刚才接册子的时候，温玉顺便塞了个铜暖手炉给她，边角磨得发亮，肯定是温玉平时揣在怀里捂着的。"}, {"type": "narrate", "text": "她把暖手炉贴在冻得发僵的手上，暖意顺着皮肤往骨头里钻。"}, {"type": "narrate", "text": "“报应不会等太久。”她低声说，声音轻得几乎被风刮走。"}, {"type": "narrate", "text": "断剑里的谢流光没说话，只是剑身轻轻震了一下，像在点头。"}, {"type": "narrate", "text": "窗外的雪片砸在窗纸上，簌簌响得像前世的锁链共振声。"}, {"type": "narrate", "text": "谢挽星把炭盆往旁边挪了挪，就听见远处传来执法殿的钟声——那是长老议事的钟声，她抬眼望了望执法殿的方向，炭盆里的火苗晃了晃，映得她眼里的光冷得像剑。"}, {"type": "narrate", "text": "三天后的宗门大比，她要当着九峰所有弟子的面，把这些账本一页页念出来，让所有人都看看，这个满口仁义道德的宗主，到底是个什么东西。"}, {"type": "narrate", "text": "至于思过崖的柳如烟，执法殿的温玉，她一个都不会丢下。"}, {"type": "goto", "target": "ch018"}]}, {"id": "ch018", "background": "bg/sect_day.webp", "checkpoint": true, "chars": [{"id": "c1", "pos": "left", "sprite": "normal"}, {"id": "c3", "pos": "center", "sprite": "normal"}, {"id": "c7", "pos": "right", "sprite": "normal"}], "script": [{"type": "narrate", "text": "谢挽星站在演武台第三块砖的凹缝里，左肩的通脉鞭伤还没结痂，血浸了半片洗得发白的外门杂役衫，台下九峰弟子挤得水泄不通，宗主萧远端坐的玉案正对着擂台，柳如烟垂着手站他身侧，指节捏得发白，指甲缝里还嵌着上个月塞过来那枚疗伤丹的丹衣。"}, {"type": "narrate", "text": "“罪徒谢挽星，偷闯碧落峰禁地，窃取镇峰剑谱，私通魔族，现废去灵根，逐出宗门。"}, {"type": "narrate", "text": "”通主晃了晃手里所谓的物证，那本剑谱边角还沾着禁地的灰，上月守禁地的两个外门弟子被买通后抖得跟筛子似的，话都说不利索，“人证物证俱全，你还有何话说？”"}, {"type": "narrate", "text": "谢挽星按了按怀里震得发烫的断剑，刚要开口，就听见台阶上一声闷响。"}, {"type": "narrate", "text": "本该轮到她上台的碧落峰继承人沈砚秋摔在擂台下方，碧色弟子服蹭了满掌灰，发间簪的白兰滚进泥里，她随手把本命剑扔在台上，剑尖“当啷”一声磕在砖面上：“剑谱是我上月自己从禁地拿的！"}, {"type": "narrate", "text": "上面的古字我看不懂，让她给我译，誰偷了？”"}, {"type": "narrate", "text": "全场哗然。萧远脸色铁青，指节敲了敲玉案：“砚秋，被这妖女迷惑了？那剑谱分明是她偷的，你娘魂印在谱上，你不会认错？”"}, {"type": "narrate", "text": "“我娘的魂印我认不错，谱上的魔气我也闻得出来。"}, {"type": "narrate", "text": "”沈砚秋甩了甩擦破的手肘，月牙形的旧疤蹭出血，她看都没看自己爹，直勾勾盯着台上的谢挽星，“我赶着找她译剑谱，前阵子她还在乱葬岗给我捡了受伤的白 terl，你忘了吗？”"}, {"type": "narrate", "text": "谢挽星指尖顿了顿。她肩上的血顺着衣角往下滴，在第三块砖上晕开一小片红，断剑在她怀里震得越来越厉害，震得她胸口发麻——是谢流光要出来了，她按了按剑柄，没拦。"}, {"type": "narrate", "text": "“千年之前，碧落峰主谢挽星率九峰弟子守上古锁链拒魔，身死魂碎，神魂转世成外门杂役，哪来的偷盗？哪来的私通魔族？"}, {"type": "narrate", "text": "”清亮的少年音从断剑里飘出来，剑身突然泛着淡金色的光，直直插在擂台中央，震得台下的弟子都捂住了耳朵，“现任宗主萧远，当年是你勾结魔族，开禁地放魔物入峰，害死前任碧落峰主，篡改史书栽赃谢挽星，你忘了？"}, {"type": "narrate", "text": "”"}, {"type": "narrate", "text": "萧远“腾”地站起来，一剑劈向断剑，剑意撞在剑身上被弹得老远，虎口震得裂开：“妖言惑众！你是什么东西？”"}, {"type": "narrate", "text": "“我是谢流光的残魂，谢挽星前世的小师弟。”谢流光的音调里带了点笑，却冷得像冰，“当年仙魔大战，我跟着师姐战死，神魂封在这把斩魔剑里，陪了她一千年。你要证据？台下有的是。”"}, {"type": "narrate", "text": "没等萧远发作，执法长老的女儿温玉先站了出来，手里举着块留影石，发间的羊脂玉簪晃得亮：“上月我在禁地见过宗主亲放剑谱进去，留影在此。"}, {"type": "narrate", "text": "”药修江晚吟也站了出来，指尖沾着药草渍，举着个半旧的瓷瓶，声音发颤却稳：“我每月给她治内伤，她若通魔，通脉鞭抽上去早该魔气反噬，她身上半分魔气都没有。”"}, {"type": "narrate", "text": "柳如烟站在台边，看着谢挽星肩上的血顺着衣角往下滴，又看了看萧远冷得像冰的脸，突然把腰间的羊脂玉佩摘下来举得高高的。"}, {"type": "narrate", "text": "那玉佩是她娘的遗物，里面封着去年她偷偷在爹书房找到的传音符，录着萧远和魔族接头，约定锁链崩断就放魔进九峰的对话。"}, {"type": "narrate", "text": "“这是我爹勾结魔族的证据。”柳如烟的声音抖，却没能让她退后半步，“他为了夺宗主之位，害死我娘，害死前任碧落峰主，还想害谢挽星！"}, {"type": "narrate", "text": "六年前我把她从乱葬岗捡回去，他转头就把她关进外门，诬陷她偷剑！”"}, {"type": "narrate", "text": "玉佩砸在擂台上的声音很脆，传音符里的声音清晰得每个字都扎在萧远心上。"}, {"type": "narrate", "text": "他疯了一样要冲上台抢，沈砚秋的碧色剑意扫过去，直接把他劈得退了三步，剑尖指着他喉咙：“勾结魔族，诬栽同门，按九峰律法，该废去宗主之位，囚于思过崖，终身不得出。”"}, {"type": "narrate", "text": "副宗主想站出来求情，断剑的剑意压得他直接跪在地上，抬不起头。"}, {"type": "narrate", "text": "台下的弟子早就憋了一肚子气，这些年宗主打压女修，篡改史书，多少女修被污名化，多少峰主被害死，此刻全站了出来，指证的指证，作证的作证，连之前被萧远抢了剑谱的赤峰弟子都站出来，说他爹当年被萧远污蔑叛变通魔，全族被害，都是萧远为了抢赤峰的剑谱。"}, {"type": "narrate", "text": "“碧落峰峰主之位，暂时由谢挽星代掌。"}, {"type": "narrate", "text": "”沈砚秋收剑，走到谢挽星身边，把腕上摘下来的月牙形银镯子套在她腕上，和她腕上那道旧疤严丝合缝，“我找了她六年，六年前她在乱葬岗救了我，给我吃烤的蘑菇，那时候我就知道，她是谢挽星。”"}, {"type": "narrate", "text": "谢挽星愣了愣，指尖的伤口渗出血，滴在断剑的剑身上，和沈砚秋手肘的血混在一起。她接过沈砚秋递过来的白帕，帕子上绣着几茎兰，是她上月掉在碧落峰禁地里，被沈砚秋捡回去的。"}, {"type": "narrate", "text": "“先平反，再算账。”她按了按肩上的伤，目光扫过台下的九峰弟子，“所有被污名化的女修，所有被害死的峰主的冤屈，一笔一笔，我们慢慢算。”"}, {"type": "narrate", "text": "风卷着演武台上的白兰花瓣往九峰的方向飘，断剑的剑意收进她体内，谢流光的声音很轻，只有她能听见：“师姐，当年没打完的仗，我们接着打。”"}, {"type": "narrate", "text": "沈砚秋站在她身侧，发间簪着刚摘的白兰，碧色弟子服的风袖被风吹得晃了晃，碰了碰她的胳膊：“我陪着你。”"}, {"type": "narrate", "text": "谢挽星没说话，只是把剑柄递到沈砚秋手里，指尖相碰的瞬间，她听见自己心跳的快了一拍——不是动心，是终于不用一个人扛了。"}, {"type": "goto", "target": "ch019"}]}, {"id": "ch019", "background": "bg/battle.webp", "checkpoint": true, "chars": [{"id": "c1", "pos": "left", "sprite": "normal"}, {"id": "c6", "pos": "center", "sprite": "normal"}, {"id": "c8", "pos": "right", "sprite": "normal"}], "script": [{"type": "narrate", "text": "谢挽星的指尖按在碧落峰与赤峰相连的第一道上古锁链上时，远处已经能看见冲山的火光了。"}, {"type": "narrate", "text": "风从九峰之间的缝隙里钻过来，刮得她扫洒弟子的灰布衫猎猎响，袖口磨破的棉絮蹭得她腕骨发疼。"}, {"type": "narrate", "text": "这道锁链卡在两峰之间的断层平台上，距地面三百丈，只有她这种靠听剑辨路的外门杂役才敢摸黑爬上来。"}, {"type": "narrate", "text": "锁链上刻着的上古符文硌得她指腹出血，混着血渗进符文缝隙的瞬间，她听见了剑意里的声音——不是刀剑鸣响，是千年前战士们压着嗓子的嘶吼，有人喊“守住锁链”，有人喊“魔物冲过来了”，还有个女人的声音，清凌凌的，像冰珠砸在剑鞘上，是前世的她自己。"}, {"type": "narrate", "text": "她闭着眼，指尖顺着符文慢慢挪，听着剑意的流向找锁链的弱点。"}, {"type": "narrate", "text": "仙门那些老东西把锁链的禁制改了十八道，外人硬碰只会被反噬成飞灰，可她听得出，当年仙魔大战时有一滴魔血溅在这道锁链的节点上，浸得符文生了锈，那就是唯一的破口。"}, {"type": "narrate", "text": "“谢挽星。”"}, {"type": "narrate", "text": "身后忽然传来刀鞘磕在石头上的声响，她没回头，手已经按在了腰间的断剑上。"}, {"type": "narrate", "text": "阿蛮带着三个魔族残党站在断口边，紫黑色的裙摆被风吹得扬起来，发间的红梅簪晃得人眼疼，左脸那道从眉骨划到下巴的疤在火光里红得刺目——那是三年前宗门大比她亲手划的，当时阿蛮偷袭赤峰的弟子，她挡了那一刀，反手用剑脊拍的。"}, {"type": "narrate", "text": "“锁链给我。”阿蛮手里的魔刀还滴着血，显然是刚杀完冲山的人，“我放你走，不伤你的碧落峰。”"}, {"type": "narrate", "text": "谢挽星终于转过头，指尖还没从锁链上拿开，血顺着锁链的符文往下淌：“给你有什么用？你现在劈了它，魔族是能打进仙门，可九州锁链全断，各方灵脉的灵气全散了，你们魔族也跟着陪葬。”"}, {"type": "narrate", "text": "阿蛮的脸色变了变，她确实不知道这一层。她爹死前只说锁链是仙门困魔族的枷锁，劈开了就能报仇，没人告诉她这锁链是撑九州的柱子。"}, {"type": "narrate", "text": "她身后的两个残党已经按捺不住，举着长矛往前凑，被她抬手拦住了。"}, {"type": "narrate", "text": "“那你想要什么？"}, {"type": "narrate", "text": "”阿蛮眯着眼，目光扫过她腕骨上那道月牙形的旧疤——那天在乱葬岗救她时，这女人腕子上就有这道疤，当时她以为是刀疤，现在才知道，那跟宗主和柳如烟腰间的玉佩碎片是一套的，都是当年斩魔剑主的信物。"}, {"type": "narrate", "text": "谢挽星没回答她，指尖猛地按在锁链上一个凹进去的节点上，那是她刚才听出来的弱点，浸过魔血的地方，符文已经松了。"}, {"type": "narrate", "text": "她刚想运力，远处忽然传来一声惨叫，是攻山的叛徒摸到了断层平台的另一侧，正往这边爬，手里举着的火把烧得旺，要把整个锁链点着。"}, {"type": "narrate", "text": "“想抢锁链？”谢挽星嗤了一声，断剑唰地出鞘，剑光扫过去，直接把那人的火把打飞了下去，“就凭这些杂碎？”"}, {"type": "narrate", "text": "阿蛮盯着她看了两秒，忽然笑了，把魔刀往地上一插，拍了下手，三个残党立刻转身去堵叛徒，刀剑碰撞声瞬间在断口炸开。她走到谢挽星身边，目光落在那道凹进去的节点上：“你要崩锁链？”"}, {"type": "narrate", "text": "“嗯。”"}, {"type": "narrate", "text": "“崩了之后呢？仙门那些老东西不会放过你，你一个外门杂役，就算有剑意也斗不过整个宗门。”"}, {"type": "narrate", "text": "“那就斗。”谢挽星的指尖已经蓄了力，剑意顺着断剑往锁链上引，锁链开始嗡鸣，震得她腕骨发疼，“我要的是九州归位，不是仙门独霸，也不是魔族涂炭。"}, {"type": "narrate", "text": "阿蛮，你爹当年不是输在我手上，是输给仙门那些勾结魔族的叛徒。你要是想报仇，就别跟我抢这锁链，跟我一起把当年的事翻出来，给所有死的人一个交代。”"}, {"type": "narrate", "text": "阿蛮的脸僵住了。"}, {"type": "narrate", "text": "她爹死前确实留过话，说当年仙魔大战不是魔族主动挑的，是仙门的人偷偷开了魔域的封印，引魔物进去，再反过来污蔑魔族。"}, {"type": "narrate", "text": "她一直不信，直到三天前她摸进宗主寝殿，看到他案上放着的当年和魔族的往来信笺，用的是她爹的私印。"}, {"type": "narrate", "text": "她低头看着谢挽星，这女人一身灰布衫，袖口磨破，脸上还沾着扫洒时蹭的灰，可说话的时候眼睛亮得很，像千年前那个站在锁链上挡着千军万马的斩魔剑主，她爹当年提起那个人，语气里都是佩服，说那人是唯一一个肯给魔族俘虏治伤的修士。"}, {"type": "narrate", "text": "“你别后悔。”阿蛮从怀里掏出一块紫色的令牌扔给她，上面刻着魔主的家徽，“魔族三百残部，以后听你调遣。"}, {"type": "narrate", "text": "但是我丑话说在前头，重建九州之后，魔族要有自己的峰，不许仙门那些老东西踩我们的地盘，更不许随便杀魔族的人。”"}, {"type": "narrate", "text": "谢挽星接住令牌，冰得她指尖一僵，她抬眼看了阿蛮一眼，没说话，只是点了下头。"}, {"type": "narrate", "text": "锁链的嗡鸣声越来越响，她忽然听见锁链深处传来一声叹息，是前世的谢流光的声音，说“师姐，我帮你压禁制”。"}, {"type": "narrate", "text": "她咬紧牙关，手腕上的月牙疤发烫，像有火在烧，断剑的剑身亮得刺眼，她低喝一声，狠狠劈在那个浸了魔血的节点上。"}, {"type": "narrate", "text": "咔嚓。"}, {"type": "narrate", "text": "一声脆响震得整个断层平台都晃了晃，第一道上古锁链从节点处断开，半截锁链往下跌去，砸在下方的云海里，溅起的云沫子像雪似的。"}, {"type": "narrate", "text": "磅礴的剑意顺着断开的口子涌进她的身体里，像千年的冰水灌进经脉，疼得她差点跪下去，阿蛮眼疾手快扶了她一把，感受到她身上炸出来的纯金色剑意，瞳孔猛地缩了缩。"}, {"type": "narrate", "text": "那是斩魔剑主的剑意，不带半点仙门的伪善，冷得像千年前的雪。"}, {"type": "narrate", "text": "远处的攻山声忽然弱了下去，本来已经冲到了断层下方的叛徒和魔族残党看见锁链断开的金光，吓得往后缩，以为仙门的护山大阵开了。"}, {"type": "narrate", "text": "碧落峰的方向忽然传来一声清越的剑鸣，是沈砚秋的剑，她站在峰顶的摘星台上，看着那道断开的光，指尖的剑穗晃了晃，她腕上挂着的那块玉佩碎片忽然发烫，烫得她一缩手，刚好看见断层平台上站着的人，腕骨上的月牙疤在金光里亮得扎眼。"}, {"type": "narrate", "text": "谢挽星扶着阿蛮的手站稳，感受着身体里涌进来的熟悉剑意，她知道，自己的三成前世实力恢复了。"}, {"type": "narrate", "text": "她转头看向阿蛮，刚才涌进来的剑意里还有一段尘封的记忆，是千年前她给还是小兵的阿蛮爹接骨的场景，那时候阿蛮爹还不是魔主，腿被仙门的暗箭射折了，她偷偷把他藏在山洞里治了三天，临走时塞给他半块玉佩，说“以后魔族要是愿意跟人修和平共处，拿这块玉佩来找我”。"}, {"type": "narrate", "text": "“你早知道了？”阿蛮的声音有点哑，她摸出腰间的玉佩碎片，跟谢挽星腕上的疤对了齐，两个都在发烫，亮得一模一样。"}, {"type": "narrate", "text": "“刚听剑听到的。”谢挽星抽回手，把断剑别回腰间，拍了拍灰布衫上根本不存在的灰，“走吧，去碧落峰，沈砚秋在山下挡着叛徒，我们得去会会那些老东西，顺便把宗主勾结魔族的证据掏出来。”"}, {"type": "narrate", "text": "阿蛮没说话，把魔刀扛在肩上，跟在她身后往碧落峰的方向走。"}, {"type": "narrate", "text": "风把她的红梅簪吹得晃，她看着谢挽星的背影，忽然想起三年前乱葬岗里，这女人把一块干巴巴的馍塞给她，说“以后别随便杀人，仇要报，但别伤无辜的人”。"}, {"type": "narrate", "text": "当时她只想杀了这女人灭口，现在才明白，那话是斩魔剑主跟魔族小兵说的，也是跟现在的她说的。"}, {"type": "narrate", "text": "断层平台下方的云海里，断裂的锁链还在往下沉，金色的符文和暗红色的魔血混在一起，亮得晃眼。远处的九峰好像活了过来，一道道的剑鸣声此起彼伏，沉寂了千年的斩魔剑意，终于醒过来第一声。"}, {"type": "narrate", "text": "谢挽星摸了摸腕上的月牙疤，又摸了摸怀里阿蛮给的魔族令牌，嘴角往上抬了点。"}, {"type": "narrate", "text": "第一根锁链断了，后面还有八根，那些把她们踩在脚底下的人，那些篡改史书污蔑她们的人，那些杀了她们师父家人的人，该还债了。"}, {"type": "goto", "target": "ch020"}]}, {"id": "ch020", "background": "bg/forest.webp", "checkpoint": true, "chars": [{"id": "c3", "pos": "left", "sprite": "normal"}, {"id": "c4", "pos": "center", "sprite": "normal"}, {"id": "c8", "pos": "right", "sprite": "normal"}], "script": [{"type": "narrate", "text": "谢挽星指尖按在断剑裂痕上的时候，谢流光的指腹刚好穿过她的手背，凉的像剑匣里封了千年的冰碴子，顺着指缝往骨头缝里钻。"}, {"type": "narrate", "text": "丹炉里的雷火炸得第三声的时候，谢流光的半张脸已经碎成了星子，鬓角的洗得发白的师弟服无风自动，他从前就爱穿这身，如今千年过去，还是当年桃林偷她种的绯桃时十六七岁的少年样。"}, {"type": "narrate", "text": "“最后这点剑意，你接着。”他声音也飘得像雾，指尖往断剑里送光，谢挽星猛地攥住他的手腕，却抓了空。"}, {"type": "narrate", "text": "“你疯了？散了就没了。"}, {"type": "narrate", "text": "”谢挽星的嗓子发紧，这十七年她醒过来的时候，谢流光总是在剑里陪着她，给她讲前世的事，给她递攒了九百年的桃核，上次她挨执法长老的鞭刑，谢流光还在剑里气得跳脚，说早晚要把执法殿的房顶掀了。"}, {"type": "narrate", "text": "谢流光却笑了，露出两个梨涡，和九百年前桃林里偷桃被抓时一模一样：“我陪了你十七年，够了，师姐，把这九峰守住，别忘了当初我们为什么战死。"}, {"type": "narrate", "text": "”末了指尖轻轻按了一下她手腕上的月牙形旧疤——那是他当年没刻完的护身符，仙魔大战前他说要给她刻个能挡三次魔气的护身符，才晚到了三天，没来得及和她一起铸锁链。"}, {"type": "narrate", "text": "那点温度很轻，像当年把偷来的桃塞给她时的温度，碰完就散了。"}, {"type": "narrate", "text": "光全没入断剑的瞬间，丹炉“砰”地一声开了，顶盖崩出去半尺远，江晚吟的声音带着熬了三天的哑，从丹灰后面飘过来：“成了。”"}, {"type": "narrate", "text": "谢挽星转头看过去，江晚吟的脸被丹火烤得通红，指腹上的三个血泡已经磨破，渗出的血混着丹灰沾在袖口，洗得发白的青衣上沾着点点灰，领口半块缺了的白玉佩滑出来。"}, {"type": "narrate", "text": "丹炉里滚着三颗淡金色的丹，还飘着丝丝缕缕的药香，是她熬了三天三夜把谢挽星之前给的指尖血滴进去时丹炉自己开的，那丹方是她爹娘临死前刻在丹炉底下的，这是她炼成的第一颗正儿八经的续魂丹。"}, {"type": "narrate", "text": "谢挽星接过来，直接塞进嘴里，暖意从喉咙滑到丹田，原本像被撕碎的纸片似的神魂突然稳稳归位，她能清晰感觉到九峰每一道剑意的波动——赤峰的刚如烈火烧过指骨，碧落的柔像春水漫过脚踝，青峰的润是拂面的柳风，黄峰的沉是踩在大地的踏实，全顺着断裂千年的锁链传过来，断剑在她手里震了一下，表面的裂痕开始泛出淡银色的光，像干涸了千年的河床突然见了水。"}, {"type": "narrate", "text": "屋外的喊杀声就是这时候撞进耳朵里的，苏砚慌慌张张地踹开门，洗得发白的灰衣下摆被门闩刮了个大口子，露出的脚踝上沾着泥，指腹上画符磨出来的茧还在抖，怀里攥的半块驱魔符边缘已经烧焦了：“师父！"}, {"type": "narrate", "text": "宗主把外门几百口杂役全赶去前山填魔族的口子了！他说杂役不值钱，死了也不心疼！”"}, {"type": "narrate", "text": "她的话还没说完，门又被撞开了，叶惊秋顶着一头乱蓬蓬的头发站在门口，发梢上还沾着锻炉里燎掉的焦痕，手上全是刚碰完陨铁的水泡，血顺着指缝往下滴，手里拎"}, {"type": "goto", "target": "ch021"}]}, {"id": "ch021", "background": "bg/forest.webp", "checkpoint": true, "chars": [{"id": "c1", "pos": "left", "sprite": "normal"}, {"id": "c2", "pos": "center", "sprite": "normal"}, {"id": "c3", "pos": "right", "sprite": "normal"}], "script": [{"type": "narrate", "text": "碧落峰的练剑场飘着碎玉似的桃花瓣，沈砚秋蹲在石阶上擦剑，指尖沾了灰，蹭得发间簪的白兰晃了晃。"}, {"type": "narrate", "text": "弟子服的袖子还是不合身，长出一截的袖口扫过剑刃，她指尖猛地一缩，一道小口子从左中指划到指腹，血珠渗出来，洇在洗得发白的剑穗上。"}, {"type": "narrate", "text": "“练剑都能走神，你这碧落峰继承人是骗来的俸禄？”"}, {"type": "narrate", "text": "声音从练剑场门口飘过来，沈砚秋猛地抬头，看见谢挽星叼着根狗尾巴草靠在石门框上，手里还拎着个药盒，灰扑扑的外门弟子服穿在她身上总有些松垮，混不在意地靠在门边，连发梢扫过的桃花都比别人顺眼几分。"}, {"type": "narrate", "text": "她慌慌张张要把受伤的手指藏到身后，却又想起自己前些日子刚签了给外门杂役补发薪水的条子，现在在谢挽星面前早就没了当年那个要躲着的碧落小公主的架子，只嘴硬地梗着脖子：“要你管，我乐意。"}, {"type": "narrate", "text": "今日是迎仙会前的最后一日演练，我若出了差错，丢的是碧落峰的脸。”"}, {"type": "narrate", "text": "谢挽星挑眉走过来，伸手拽过她藏在身后的小臂，指尖碰到她腕内侧那道月牙形的旧疤时顿了顿。"}, {"type": "narrate", "text": "那是六年前她被魔物追杀时摔的，当年谢挽星救她的时候，这疤就留着，她当时疼得直哭，还攥着谢挽星的袖子不肯撒手，塞了半袋自己攒的白兰干花给她做谢礼。"}, {"type": "narrate", "text": "“脸都丢六年了，也不差这一回。”谢挽星打开药盒，拎出棉布条给她缠手指，动作轻得像碰易碎的桃花瓣，沈砚秋盯着她低垂的眉眼，指尖偷摸往她手背上蹭了蹭，又飞快缩回去，耳尖红得快滴血。"}, {"type": "narrate", "text": "她腕上的旧疤旁边，还挂着半块磨得发毛的月牙形玉珏，是她当年在乱葬岗捡到谢挽星的时候，从她怀里摸出来的。"}, {"type": "narrate", "text": "当年宗主污蔑谢挽星偷了碧落的镇峰剑，要把她废灵根赶出去，她把这玉珏藏在衣服最里面，求了宗主三天，才把谢挽星留下来当扫洒杂役。"}, {"type": "narrate", "text": "这六年她偷偷给谢挽星塞了无数瓶修炼用的丹药，塞了能挡一次致命攻击的护身符，甚至偷偷把宗门藏着的谢挽星前世用过的断剑的下落透露给她，却从来不敢说，那玉珏是她当年从谢挽星怀里摸出来的，更不敢说，她早就认出她就是当年救了自己一命的人。"}, {"type": "narrate", "text": "“你这玉珏，磨得边都花了，也不舍得扔？"}, {"type": "narrate", "text": "”谢挽星突然开口，指尖点了点她腕上的玉珏，沈砚秋浑身一僵，刚要开口解释，就看见谢挽星从怀里掏出个一模一样的月牙形玉珏，只是质地更透，边缘还缠着她常用的青色的剑穗，递到她面前：“补了六年的裂痕，才磨成这个模样。"}, {"type": "narrate", "text": "你当年塞给我那半袋白兰干花，我也一直在身上揣着。”"}, {"type": "narrate", "text": "练剑场的桃花瓣被风卷着飞起来，沈砚秋盯着她掌心里的玉珏，突然就红了眼。"}, {"type": "narrate", "text": "她当年捡到谢挽星的时候，小姑娘浑身是伤地靠在乱葬岗的树底下，怀里还死死攥着半袋干白兰，问她是谁，她只哑着嗓子说“我叫挽星”，那时候她就知道，这个人是她的救命恩人，是宗主害了的人，是她放在心口藏了六年的人。"}, {"type": "narrate", "text": "“你……你什么时候知道的？"}, {"type": "narrate", "text": "”沈砚秋的声音发颤，接玉珏的时候指尖都在抖，谢挽星却突然伸手捏了捏她的耳尖，像逗猫似的，语气里带着点笑：“你每次给我塞丹药，都要偷偷在我练剑的纸条上画个月牙，画了三年，以为我没看见？"}, {"type": "narrate", "text": "”"}, {"type": "narrate", "text": "旁边的谢流光飘在半空中，手里的果子都差点掉下来，张着嘴看了半天，终于忍不住吐槽：“我说你俩能不能别磨蹭了？"}, {"type": "narrate", "text": "我当年和我小师妹谈恋爱都没你们能藏，三年前就戳破的事，硬生生拖到现在，我上次去黄峰的坟头，孟晚棠都问我你们俩什么时候办喜酒，我还得替你们打马虎眼。”"}, {"type": "narrate", "text": "谢挽星回头瞪了他一眼，手里的果子精准砸在他头上，谢流光嗷一声躲开，笑着飘远了，临走前还喊：“我就不打扰你们二人世界了啊！面我已经煮好了在厨房，别又像上次那样把汤烧干了！”"}, {"type": "narrate", "text": "谢挽星没理他，侧头看沈砚秋，她已经把玉珏攥在手里，眼泪砸在玉珏上，把玉珏砸得亮了几分。"}, {"type": "narrate", "text": "她伸手擦掉她的眼泪，指尖碰到她脸上软乎乎的热度，突然就想起六年前她把这个浑身是伤的小姑娘从乱葬岗捡出来的时候，小姑娘也是哭着拽她的袖子，说要给她摘整个碧落山的白兰。"}, {"type": "narrate", "text": "“哭什么。”谢挽星的声音放软，“我又没说不答应你。”"}, {"type": "narrate", "text": "沈砚秋吸了吸鼻子，突然伸手攥住她的手腕，把她往桃花林那边拖：“走，我带你去个地方。”"}, {"type": "narrate", "text": "碧落峰的桃花林底下埋着她去年酿的白兰酒，本是打算等谢挽星恢复身份了再挖出来喝，如今也不用等了。"}, {"type": "narrate", "text": "两个人蹲在桃树下刨土，沈砚秋的袖口沾了泥，发间的白兰掉了一根，谢挽星伸手给她捡起来，簪回她发间，说“你当年就总爱戴这个，我记得”。"}, {"type": "narrate", "text": "酒坛挖出来的时候，天已经快黑了，沈砚秋拍开泥封，酒香混着白兰的香气飘出来，她递了一杯给谢挽星，指尖碰到她的，没舍得松。"}, {"type": "narrate", "text": "谢挽星接过酒喝了一口，有点甜，比她当年在外门偷喝的酒酿好喝百倍。"}, {"type": "narrate", "text": "“宗主今日找了我，说想把碧落峰的继承权正式过给我。”沈砚秋突然开口，谢挽星挑了挑眉，没说话，听她接着说，“我没答应。"}, {"type": "narrate", "text": "等锁链修好了，我想跟你一起走，去九峰的每一个地方，给你摘九座山的白兰。”"}, {"type": "narrate", "text": "谢挽星笑了一声，伸手揉了揉她的发顶，动作自然得像做了无数次：“行啊，等把那些勾结魔族的杂种都收拾了，我先带你去赤峰看裴照夜练剑，再去青峰找江晚吟蹭药，然后去玄峰看苏砚画符，最后去黄峰找孟晚棠买情报，把九座山的白兰都给你摘回来，攒成一束，给你簪着。"}, {"type": "narrate", "text": "”"}, {"type": "narrate", "text": "沈砚秋被她揉得眯起眼睛，突然凑过去，在她脸上飞快地亲了一下，然后又飞快地退回去，脸涨得通红，嘴硬道：“谁要你摘的白兰了，我……我自己会摘。”"}, {"type": "narrate", "text": "谢挽星愣了两秒，突然笑出了声，伸手把她拉进怀里，桃花瓣落在两个人身上，远处传来苏砚喊她们吃饭的声音，谢流光飘在半空中挥着手里的帕子，喊得更大声：“嫂子！饭好了！再不来就凉了！”"}, {"type": "narrate", "text": "沈砚秋把脸埋在谢挽星肩膀上，闷着声音笑，谢挽星拍了拍她的背，低头看她发间的白兰，风一吹，花瓣落在她俩交握的手上，暖得很。"}, {"type": "narrate", "text": "厨房门口站着宗主独女柳如烟，手里端着刚做好的桂花糕，看见两个人牵着手出来，指尖顿了顿，又若无其事地把糕点放到桌上，转头去找孟晚棠商量下月的宗门重建事宜去了，眉眼里的温柔比当年在乱葬岗捡到谢挽星的时候，还软了些。"}, {"type": "narrate", "text": "远处的九道锁链在夕阳下泛着光，谢挽星知道，她前世没走完的路，如今有人陪着她一起走了。那些前世的冤，那些被栽赃的罪，那些被污名化的剑意，都会和眼前的桃花一样，明年开得比今年更盛。"}, {"type": "goto", "target": "ch022"}]}, {"id": "ch022", "background": "bg/sect_night.webp", "checkpoint": true, "chars": [{"id": "c1", "pos": "left", "sprite": "normal"}, {"id": "c2", "pos": "center", "sprite": "normal"}, {"id": "c3", "pos": "right", "sprite": "normal"}], "script": [{"type": "narrate", "text": "灰峰后院的梧桐叶落了一地时，谢挽星正蹲在锻造架前磨那截断了的碧落峰主令牌。"}, {"type": "narrate", "text": "磨刀石上沾着铁屑，她手腕上那道月牙形的疤蹭过石面，泛着点淡青的光，沈砚秋坐在旁边的小马扎上啃糖葫芦，糖霜沾了半张脸，发间簪的白兰掉了一瓣在袖子上，她也没察觉。"}, {"type": "narrate", "text": "“你这磨法，磨到下个月也磨不亮。”裴照夜抱剑靠在门框上，眉间的浅疤在阳光下格外明显，指节敲了敲赤色剑鞘，话里带着惯常的刺，“上个月你说的要跟我去赤峰演武场比试，推了三次了。”"}, {"type": "narrate", "text": "“等砚秋当了峰主就去。"}, {"type": "narrate", "text": "”谢挽星头也没抬，指尖推了推令牌，边缘的缺口被磨得平滑了些，沈砚秋就伸手扶了她一把，把坐了一半的小马扎往她那边挪了挪，把咬了一口的糖葫芦递到她嘴边，糖霜蹭在她的唇上，甜得发腻。"}, {"type": "narrate", "text": "裴照夜盯着她唇上的糖霜看了一秒，别过头去，把手里提着的赤峰特产的烧刀子放在石桌上，罐身还带着山里的寒气：“给沈砚秋的，她上次说要给碧落峰的弟子练剑用，我爹当年留的配方，能淬剑。”"}, {"type": "narrate", "text": "江晚吟端着一盆熬好的药从药房出来，指尖的青黛色药渍还没洗干净，苏砚攥着半张画歪的驱邪符跟在身后，指腹上全是画符磨出来的茧，小声嗫嚅：“师姐，我又画歪了……”"}, {"type": "narrate", "text": "江晚吟笑着拉她坐在石凳上，拿棉帕给她擦额角的汗，把符接过来，指尖沾着朱砂改了两笔，递回去的时候塞了颗桂花糖在她嘴里：“下次慢点画，不着急。”"}, {"type": "narrate", "text": "“我才不是着急！”苏砚含着糖，脸颊鼓鼓的，眼睛却偷偷往谢挽星那里瞟，见谢挽星咬了糖葫芦，她才弯起眼睛笑。"}, {"type": "narrate", "text": "燕轻舟这时候撞开门，玄色短打上还沾着灰，腰间的断铁剑哐当撞在门框上，把一壶自己也带的好酒拍在桌上，笑得满脸都是褶子：“我刚从山下执法堂回来，那几个当年污蔑挽星偷剑的狗东西，被温玉提出来审了，证据甩得他们脸都绿了，其中一个吓尿了裤子，哈哈哈哈。"}, {"type": "narrate", "text": "”"}, {"type": "narrate", "text": "墙头上突然探出个紫黑色的裙角，阿蛮撑着腮帮子坐在墙头，发间的红梅簪晃来晃去，手里攥着半块还热的栗子糕，见所有人都看过来，她才把糕扔过来，声音带着点别扭：“柳如烟那丫头让我带过来的，黄峰最近忙得脚不沾地，她爹被关在思过崖，魔族残党都收拾得差不多了，说过几天就过来。"}, {"type": "narrate", "text": "这是她特意给你买的，你说上次在城门口吃的好吃。”"}, {"type": "narrate", "text": "谢挽星伸手接住栗子糕，还热着，她掰了一半递给旁边的谢流光，残魂少年从断剑里飘出来，穿洗得发白的白衣，笑起来有两个梨涡，举着个糖人跟苏砚抢东西：“我也要吃！”"}, {"type": "narrate", "text": "“没你的份！”苏砚笑着躲到江晚吟身后，只露出个小脑袋。"}, {"type": "narrate", "text": "叶惊秋从锻造铺里出来，手上沾着黑乎乎的锻造灰，往粗布围裙上擦了擦，拎着一筐刚摘的梨走过来，筐里的梨还带着后山的露水，脆生生的：“刚摘的，甜。"}, {"type": "narrate", "text": "你这令牌的材质跟我爹当年炼的上古铁差不多，磨的时候得加一点赤峰的火山岩粉，不然磨不亮。”她蹲下来，从随身的布包里掏出一小包磨得细的火山岩粉，递给谢挽星。"}, {"type": "narrate", "text": "谢挽星接了，往磨刀石上倒了一点，刚磨了一下，令牌突然嗡的一声震起来，一道淡金色的剑意突然冒出来，在半空中凝成个穿碧色宫装的女修虚影，额间点着朱砂，是沈砚秋的娘，前任碧落峰峰主。"}, {"type": "narrate", "text": "她笑着看了沈砚秋一眼，声音很轻，像风刮过竹林：“等的就是你，丫头。”一道新的、刻着碧落峰云纹的令牌从虚影手里飘出来，落进沈砚秋的手里，暖乎乎的，带着前任峰主的剑意。"}, {"type": "narrate", "text": "虚影晃了晃，就散了，令牌在沈砚秋手里泛着温润的碧光。"}, {"type": "narrate", "text": "沈砚秋愣了半天，攥着令牌的手指都白了，眼眶一下子就红了，她把咬了一半的糖葫芦塞到谢挽星嘴里，声音带着点哑：“挽星，这是……”"}, {"type": "narrate", "text": "“你的峰，你当。”谢挽星咬着糖葫芦，甜得她眯起眼睛，伸手拍了拍她的肩膀，“你娘早就留好的，就等你呢。”"}, {"type": "narrate", "text": "沈砚秋就笑了，眼泪掉下来砸在令牌上，被令牌吸了进去，她伸手捏了捏谢挽星的脸，鼻尖还沾着糖霜：“我请你吃半个月的糖葫芦，山下张员外家新出的，比这个甜，放了好多蜜。”"}, {"type": "narrate", "text": "旁边的裴照夜把随身带的赤色披风解下来，兜头盖在谢挽星肩膀上，骂道：“入秋了还蹲在地上，你是铁打的？小心腿疼。"}, {"type": "narrate", "text": "”他别过头去，耳尖悄悄红了，手指下意识地摩挲着腰间的旧剑穗——那是他爹留给他的，以前他恨谢挽星身上有他爹的剑意碎片，现在却总忍不住往她身边靠。"}, {"type": "narrate", "text": "谢挽星拽了拽披风的带子，笑着抬头看他：“上次比试我让你三剑，下周去赤峰，行不行？”"}, {"type": "narrate", "text": "裴照夜瞬间就不装凶了，嗯了一声，耳尖红得要滴血，指尖攥着剑穗紧了紧：“谁让你，不许耍赖。”"}, {"type": "narrate", "text": "江晚吟给苏砚擦完嘴角的药渍，看着怀里的小徒弟把刚画好的符塞给她，符纸上还带着苏砚的温度，上面画着能挡致命伤的护身符，边缘画了个小小的月亮——跟谢挽星手腕上的疤一模一样。"}, {"type": "narrate", "text": "苏砚小声说：“师姐，你上次说要去乱葬岗找师祖的遗骨，带着它，危险。”江晚吟笑着接过来，摸了摸她的头：“好，师姐带着，你在灰峰乖乖画符，不许乱跑。”"}, {"type": "narrate", "text": "燕轻舟凑过来，伸手戳了戳谢挽星手里的断剑鞘，眼睛亮了：“你这剑，当年还是我爹用的！我爹是斩魔剑主的贴身侍卫，他说你家主子剑法特别厉害，上次比试我输了，这次等我练好了，一定要赢你！”"}, {"type": "narrate", "text": "谢挽星笑着点头：“等忙完这阵就去，到时候让你三剑。”"}, {"type": "narrate", "text": "燕轻舟瞪大了眼睛，刚要反驳，阿蛮已经把剩下的半块栗子糕递到她嘴边，凉凉地开口：“吃你的糕，上次你输给她的比试还少啊？你爹当年要是知道他女儿这么菜，能从棺材里跳出来。”"}, {"type": "narrate", "text": "燕轻舟脸一红，一把抢过栗子糕，咬了一大口，闷声闷气地不说话了。"}, {"type": "narrate", "text": "谢流光飘到阿蛮身边，摇了摇她的袖子，眼睛盯着她手里剩下的半块桂花糕：“阿蛮姐姐，我也要吃这个。”"}, {"type": "narrate", "text": "阿蛮笑着拍了一下他的脑袋，把糕递给他：“吃吧，就你嘴甜。”"}, {"type": "narrate", "text": "风一吹，后院的梧桐叶飘起来，落在谢挽星的披风上，金灿灿的，衬得她手腕上的月牙疤格外亮。远处的九根上古锁链亮了一下，细碎的斩魔剑意飘下来，落在每个人的肩膀上，暖乎乎的。"}, {"type": "narrate", "text": "叶惊秋在锻造铺里喊：“给赤峰修的那把剑好了！谁过来拿！”"}, {"type": "narrate", "text": "裴照夜应了一声，刚要过去，谢挽星拉住了他的袖子，把咬了一半的糖葫芦递到他嘴边：“甜。”"}, {"type": "narrate", "text": "裴照夜愣了两秒，低头咬了一口，甜味在嘴里散开，他耳尖红得要滴血，扔下一句“我去拿剑”，转身就走，脚步快得差点被门槛绊倒。"}, {"type": "narrate", "text": "沈砚秋笑着捏了捏谢挽星的手，晃了晃手里新得的碧落峰主令牌，令牌上的小月亮印记跟谢挽星手腕上的疤，跟阿蛮发间的红梅簪底端，跟柳如烟金步摇上缺的那块碎片，慢慢亮了一下，又暗下去：“等我把碧落峰整顿好，我请大家去山下吃火锅，放好多好多肉。"}, {"type": "narrate", "text": "”"}, {"type": "narrate", "text": "“哎——记得多放辣！”燕轻舟举手。"}, {"type": "narrate", "text": "“我要加香菜！”江晚吟笑着说。"}, {"type": "narrate", "text": "“不要香菜！”苏砚摇着头，辫子晃来晃去。"}, {"type": "narrate", "text": "“我要吃甜的锅底！”阿蛮举着手。"}, {"type": "narrate", "text": "“我也要去！”谢流光举着半块桂花糕，飘在半空中挥着手。"}, {"type": "narrate", "text": "谢挽星笑着点头，看着身边这些人，又抬头看了看天上连着的九根锁链，前世的血、前世的债、那些被她忘了千年的战友，好像都回来了。"}, {"type": "narrate", "text": "那些曾经污蔑她是魔头的谰言，那些被踩进泥里的女修的公道，都在慢慢回来。"}, {"type": "narrate", "text": "她咬了一口糖葫芦，甜味在嘴里散开，手腕上的月牙疤微微发烫，像是跟沈砚秋手里的令牌，跟阿蛮发间的红梅簪，跟那些散在九峰的神魂碎片，在轻轻应和。"}, {"type": "narrate", "text": "风又吹过来，把梧桐叶吹得满地都是，也把九峰的剑意，吹得越来越亮。"}, {"type": "goto", "target": "ch023"}]}, {"id": "ch023", "background": "bg/forest.webp", "checkpoint": true, "chars": [{"id": "c1", "pos": "left", "sprite": "normal"}, {"id": "c2", "pos": "center", "sprite": "normal"}, {"id": "c3", "pos": "right", "sprite": "normal"}], "script": [{"type": "narrate", "text": "谢挽星蹲在灰峰半山腰的铸剑炉边搅粥，柴火舔着锅底，米香混着铁锈味飘得满山都是，把灰峰常年飘着的浮灰都熏得软了。"}, {"type": "narrate", "text": "她昨儿帮叶惊秋扛了三筐淬火用的寒铁，腰现在还酸着，被按在这煮粥当报酬。"}, {"type": "narrate", "text": "锅里的灵米是沈砚秋刚才扛过来的，碧落峰的灵稻，颗粒大得能当小石子使，她特意留的最好的那批，搁在灶边的时候还假装不在意地抬了抬下巴，说是“碧落峰多出来的，没人要，扔了可惜”，挽着袖子的左手腕内侧那道月牙形旧疤蹭了点锅边的灰，被谢挽星伸手蹭掉的时候，脸一下子红到耳尖，连话都说不利索了。"}, {"type": "narrate", "text": "江晚吟是跟着沈砚秋一起来的，指尖还沾着青峰药草的渍，脖子上那半块缺了的白玉佩从领口露着边，她蹲在谢挽星旁边，把刚采的灵贝往她手里塞，另一只手却偷偷攥着个药膏，等谢挽星低头看粥的时候，才往她膝盖上蹭了点——昨天谢挽星扫外门的时候摔了，膝盖磨得渗血，她昨晚上熬了半宿的伤药，今早特意揣过来的。"}, {"type": "narrate", "text": "才把药膏塞回去，腿边就蹭过来个软乎乎的小团子，是苏砚，刚画完一摞驱邪符，指腹上的茧还沾着朱砂，怀里揣着半包山下买的麦芽糖，见谢挽星看她，眼睛亮了亮，把糖往前递了递，声音软乎乎的：“师父，甜，给你吃。"}, {"type": "narrate", "text": "”"}, {"type": "narrate", "text": "谢挽星接过来，摸了摸她的头，小姑娘头发软得像棉花，是她当年从乱葬岗捡回来的，那时候瘦得一把骨头，连说话都打颤，现在已经能独立画二阶的符了。"}, {"type": "narrate", "text": "灶台边蹲着的谢流光还在给烤红薯翻面，十六七岁的少年模样，穿洗得发白的白衣，笑起来两个梨涡，断剑就搁在他脚边，剑身还裂着道纹，是他当年战死的时候磕的。"}, {"type": "narrate", "text": "他把烤得流油的红薯递到谢挽星手里，烫得她嘶了一声，少年就笑，梨涡更深：“我特意放的灵蜜，你小时候最爱吃，当年在碧落峰偷摸着烤，还被执法堂的追了半条街。”"}, {"type": "narrate", "text": "谢挽星咬了一口，甜得她眯起眼睛，忽然听见铸剑铺子里传来吵吵声，是叶惊秋和燕轻舟，一个说“你那破铁剑早就该换了，上周给你打的新剑你为什么不收”，一个梗着脖子说“那是我爹留给我的，要换也必须你打，换别人的我不稀罕”。"}, {"type": "narrate", "text": "叶惊秋顶着一头铁屑钻出来，手上全是锻造磨出来的茧，手里攥着半挂剑穗，天蚕丝编的，上面缀了个铜铃，是谢挽星前世在剑上挂的那种，她往谢挽星手里一塞，下巴抬得比沈砚秋还高：“给你打的，比你那个烂了八百年的强，以后打架的时候晃起来，别人还没出招你就先吓他半死。"}, {"type": "narrate", "text": "”"}, {"type": "narrate", "text": "谢挽星捏着剑穗晃了晃，铜铃叮铃响，远处的裴照夜正扛着她的赤色劲装往这边走，眉间的浅疤在太阳底下亮得显眼，腰间的旧剑穗晃来晃去，是她爹当年留下的，她往灶台边一坐，把剑往地上一插，说“我刚把当年我爹被污蔑的通牒找出来了，现在就贴在执法堂门口，等吃了饭咱们去看，那老东西的脸今天绿得像青峰的解毒草，笑死我了。"}, {"type": "narrate", "text": "”"}, {"type": "narrate", "text": "“谁笑你？"}, {"type": "narrate", "text": "”阿蛮的声音从山脚下飘上来，她今天穿了件暗紫色的裙子，发间的红梅是谢挽星去年从碧落峰摘的，一直簪着，脸上的疤从眉骨划到下巴，是谢挽星当年在魔渊边划的，现在已经淡得只剩下条浅印了。"}, {"type": "narrate", "text": "她拎着一坛酒往灶台上一放，陶坛上还沾着点泥，见所有人都看着她，脸一下子板起来，别着头说“我爹当年埋的，千年陈酿，给你们尝尝，别误会，我不是来蹭饭的。”"}, {"type": "narrate", "text": "她话是这么说，眼睛却往谢挽星脸上瞟，见谢挽星笑着点头，才别扭地坐下来，指着谢挽星手里的烤红薯：“我要那个。”"}, {"type": "narrate", "text": "谢挽星递过去，她接过来咬了一口，烫得吐了吐舌头，忽然小声说：“日落我在山顶等，你要是不来，我就把灰峰的铸剑炉炸了。”"}, {"type": "narrate", "text": "旁边的沈砚秋噗嗤笑出声，阿蛮瞪她，她赶紧低头喝粥，肩膀抖得停不下来。"}, {"type": "narrate", "text": "柳如烟和温玉是后来到的，一个端着盐罐，一个抱着坛子调料，柳如烟发间的金步摇早就换成了半块月牙形的白玉佩，和沈砚秋的那块刚好凑成一对，她往粥里撒盐的时候，小声说：“我爹……"}, {"type": "narrate", "text": "哦不，前宗主当年私吞的盐矿，我已经收回来了，以后大家的盐都免费，不用再偷偷藏着了。"}, {"type": "narrate", "text": "”温玉穿着白色的执法服，发间的羊脂玉簪亮得晃眼，手里攥着苏砚给她画的平安符，点了点头：“我爹已经被关进刑堂了，等他招完供，我就把当年陷害青峰江家的罪证公之于众，再也没人敢随便给女修定罪了。"}, {"type": "narrate", "text": "”"}, {"type": "narrate", "text": "粥熬得稠，大家蹲在灶台边吃，柴火噼里啪啦地响，风里飘着米香、酒香还有烤红薯的甜。"}, {"type": "narrate", "text": "远处的九峰锁链晃了晃，从最高的白峰垂下来一缕淡金色的剑意，落在谢挽星发梢上，凉丝丝的，像当年她们一起守峰的时候，剑光落下来的温度。"}, {"type": "narrate", "text": "谢挽星咬了一口灵贝，鲜得她眯起眼睛，左边的沈砚秋偷偷看她，被抓包了脸一红，低头猛喝粥，右边的江晚吟把伤药往她手里塞了塞，指尖凉凉的。"}, {"type": "narrate", "text": "怀里的苏砚抱着糖睡着了，脑袋一点一点的，阿蛮抱着酒坛子靠在灶边，已经有点醉了，脸上的疤在太阳底下软得不像话，远处的裴照夜正在跟燕轻舟比划当年通魔案的细节，叶惊秋抱着剑蹲在边上听，时不时插两句嘴，谢流光蹲在灶边给苏砚烤第二块红薯，白衣上沾了点灰，梨涡里盛着光。"}, {"type": "narrate", "text": "风一吹，锁链上的铜铃叮铃响了一声。"}, {"type": "narrate", "text": "谢挽星低头看了看手里叶惊秋刚打的剑穗，铜铃晃了晃，像极了很多年前，她刚成为斩魔剑主的时候，三个小徒弟围在她身边，喊她“师姐”的声音。"}, {"type": "narrate", "text": "那时候她们就说好了，要一起守九峰，守所有想守的人。"}, {"type": "narrate", "text": "现在她们做到了。"}, {"type": "goto", "target": "ch024"}]}, {"id": "ch024", "background": "bg/forest.webp", "checkpoint": true, "chars": [{"id": "c1", "pos": "left", "sprite": "normal"}, {"id": "c2", "pos": "center", "sprite": "normal"}, {"id": "c3", "pos": "right", "sprite": "normal"}], "script": [{"type": "narrate", "text": "青石板缝里的狗尾草晃了晃，被谢挽星手里的扫帚尖扫得打了个滚，蹭到碧色弟子服的衣摆上。"}, {"type": "narrate", "text": "沈砚秋正蹲在院角浇她最喜欢的那丛剑兰，手里铜壶歪了一下，水洒了半壶在青石板上，听见动静抬头，手忙脚乱地抓过靠在墙角的扫帚：“我来我来，你刚练完剑歇着。”"}, {"type": "narrate", "text": "扫帚没拿稳，“啪”地砸在剑兰叶子上，断了两根最精神的剑叶。"}, {"type": "narrate", "text": "沈砚秋的脸瞬间白了，指尖捏着铜壶的梁都紧了：“我、我不是故意的，我明日去云峰给你寻最透的水灵石养着，肯定比原来长得还好。”"}, {"type": "narrate", "text": "谢挽星扫落叶的动作顿了顿，看着那两截断剑叶，忽然想起六年前乱葬岗外，她举着破扫帚打退缠着沈砚秋的魔物，扫帚扫飞了小姑娘攥在手里的白兰，小姑娘也是这般白的脸，咬着嘴唇哭，说那是她娘留给她最后的东西。"}, {"type": "narrate", "text": "她走过去，捡起那两截断叶，指尖摸了摸上面沾的泥：“没关系的，剑兰剪了才发新芽，比你浇的灵水管用。”"}, {"type": "narrate", "text": "沈砚秋愣了愣，随即笑起来，梨涡陷得深，发间簪着的白兰晃了晃，那是她今早从碧落峰顶摘的，沾着露水，香气缠着风往人鼻子里钻。"}, {"type": "narrate", "text": "她左手腕内侧的月牙形旧疤露在太阳底下，亮得晃眼，那是上辈子谢挽星给她系的信物，说等打完仗就带她去看九峰尽头的云海，她们都没死成，疤留下来了，信物也还在。"}, {"type": "narrate", "text": "“对了，裴照夜刚派人送信，说赤峰的新一批剑意碑刻好了，让我喊你去逛。”沈砚秋把铜壶放回廊下，从怀里摸出个油纸包，递到她眼前，“山下桂花糕铺新出的，加了桂花蜜，你上次说爱吃。”"}, {"type": "narrate", "text": "谢挽星接过油纸包，指尖碰到沈砚秋微凉的手背，没松，把人往自己这边拉了拉，避开院角刚冒出来的小笋：“你今日不是要开峰主议事会？怎么有空跑过来。”"}, {"type": "narrate", "text": "“议事会推迟了，张师弟说他媳妇要生了，先回去接生。”沈砚秋顺势靠在廊柱上，笑得狡黠，像以前偷偷给她塞进阶丹的小丫头，“反正我是宗主，我想什么时候开就什么时候开。”"}, {"type": "narrate", "text": "正说着，墙头冒出来个赤色的脑袋，裴照夜斜挎着剑，眉间的浅疤在太阳底下蹭得发亮，手里拎着个用芭蕉叶裹着的东西，见她们看过来，翻身跳下墙头，把芭蕉叶往石桌上一放，耳尖泛红：“谁、谁要等你，我路过顺便给你带个野兔，上次你说我家烤的比外面卖的好吃。"}, {"type": "narrate", "text": "”"}, {"type": "narrate", "text": "谢挽星打开芭蕉叶，烤得金黄酥脆的野兔，兔腿特意拆下来放在最上面，连骨头都剔得干干净净。"}, {"type": "narrate", "text": "她抬头看了裴照夜一眼，对方正盯着远处的剑兰看，眼神飘忽，指尖无意识地摩挲着腰间的旧剑穗——那是她爹留下的，前些日子她和魔族交手的时候剑穗断了，裴照夜熬夜编了个新的，用的是赤峰的赤绳，说能避魔。"}, {"type": "narrate", "text": "“上次比武我让了你三招。”谢挽星撕了半只兔腿递给沈砚秋，剩下的塞进嘴里，含糊不清地说，“下次我可不让了。”"}, {"type": "narrate", "text": "裴照夜的脸瞬间涨红，瞪她：“谁要你让！上次是我没站稳！等九月大比我一定赢你，把你上次欠我的三坛醉仙酿赢回来！”"}, {"type": "narrate", "text": "沈砚秋咬着兔腿笑，笑声脆生生的，惊飞了落在墙头的麻雀。"}, {"type": "narrate", "text": "没过多久，青石路上走来两个人，江晚吟手里拎着药箱，指尖还沾着药草的汁液，苏砚跟在她身后，怀里抱着个布袋子，上面画满了歪歪扭扭的符咒，见她们在吃饭，苏砚缩了缩脖子，往江晚吟身后躲了躲。"}, {"type": "narrate", "text": "“给你送这个月的丹药。”江晚吟把药箱放石桌上，取出个青瓷小罐，手指修长，指甲修剪得整整齐齐，沾着一丝黄芪的香气，“这次加了云峰的灵芝，对你的神魂有好处，我特意熬了两个时辰。”"}, {"type": "narrate", "text": "苏砚也从怀里掏出叠得整整齐齐的符纸，低着头递过来：“师姐，这是我新画的防御符，能挡元婴期的攻击，你上次和魔族打架的时候护身符用完了，这个给你备着。”"}, {"type": "narrate", "text": "谢挽星接过符纸，伸手揉了揉苏砚的头发，小姑娘的头发软乎乎的，指腹上还有画符磨出来的薄茧：“我家阿砚真厉害，等下次宗门大比，你肯定能拿头名。”"}, {"type": "narrate", "text": "苏砚的脸瞬间红了，指尖绞着衣角往江晚吟身后又躲了躲，江晚吟笑着瞪了谢挽星一眼，伸手把小姑娘拉到身前，帮她整理了一下歪掉的衣领：“你别逗她，她脸皮薄。"}, {"type": "narrate", "text": "对了，下个月我要去乱葬岗找一味药，她非要跟着去，你帮我盯着点，别让她往危险的地方跑。”"}, {"type": "narrate", "text": "“我哪敢让她去危险的地方。"}, {"type": "narrate", "text": "”谢挽星把符纸收进怀里，又看着江晚吟脖子上挂着的半块白玉佩，那玉佩缺了个角，和苏砚脖子上那块刚好能凑成一对，是她俩的娘留下来的，前阵子才认了亲，江晚吟把苏砚看得比什么都重，比她的药田还重。"}, {"type": "narrate", "text": "正说着，院门被“哐当”一声推开，叶惊秋扛着把嵌满补丁的铁锤，头发乱蓬蓬的，手里攥着个用黑布裹着的东西，一进门就把东西往石桌上一放，眼睛亮得像星星：“修好了！”"}, {"type": "narrate", "text": "黑布掀开，寒光凛凛的剑身露出来，上面还刻着细小的狗尾草纹，是上次谢挽星扫院子的时候说好看，叶惊秋记着了，偷偷刻上去的。"}, {"type": "narrate", "text": "剑身轻鸣了一声，像是认出了主人，谢挽星伸手握住剑柄，熟悉的凉意顺着掌心往上爬，是前世的斩魔剑，她握了十几万年的剑。"}, {"type": "narrate", "text": "“谢流光？”她轻声喊了一声。"}, {"type": "narrate", "text": "剑身震了震，淡青色的光散了，十六七岁的少年模样的人飘出来，穿了件洗得发白的白衣，笑起来有两个梨涡，手里还攥着半块没吃完的桂花糕，是沈砚秋带来的那包：“师姐你终于想起我了！"}, {"type": "narrate", "text": "我都在这破剑里睡了快三百年了，你再不来我还得继续睡！”"}, {"type": "narrate", "text": "众人都笑，沈砚秋递过去剩下的桂花糕，叶惊秋骄傲地抬着下巴：“剑鞘我也做好了，千年沉香木的，碧落峰库房里的，我磨了半个月，上面的桂花糕纹样是沈峰主帮我画的。”"}, {"type": "narrate", "text": "谢流光飘到谢挽星身边，抱着桂花糕啃，含糊不清地说：“师姐我还给你攒了好多地方的游记，等九州彻底稳了，我们一起去云游，我去凡间给你买糖葫芦吃。”"}, {"type": "narrate", "text": "正说着，墙头又翻下来个紫黑色的身影，阿蛮发间的红梅晃了晃，脸上那道从眉骨划到下巴的疤在太阳底下红得发亮，手里举着串糖葫芦，看见谢挽星，眼睛亮了亮，把糖葫芦递过去：“山下庙会的，特意给你买的酸口的，上次你说甜的太腻。"}, {"type": "narrate", "text": "”"}, {"type": "narrate", "text": "谢挽星接过糖葫芦，咬了一口，酸得她眯了眯眼，阿蛮笑得肩膀都抖，露出两个虎牙。她从怀里掏出个布袋子，递给苏砚：“给你带的符纸，魔族那边的，你说你要画高阶符，这个比你宗门的好用。"}, {"type": "narrate", "text": "”又递给江晚吟一株血灵芝：“上次你帮我治手下的伤，谢礼。”"}, {"type": "narrate", "text": "江晚吟接过血灵芝，点了点头，没说谢，阿蛮也不在意，拉了把椅子坐在谢挽星身边，歪头看她咬糖葫芦，耳尖悄悄红了。"}, {"type": "narrate", "text": "日头西斜的时候，温玉从院门外走进来，穿了身白色的执法服，发间的羊脂玉簪亮得晃眼，把个新的执法牌放在石桌上，看了谢挽星一眼，声音很轻：“宗主说，以后外门杂役不再随便罚人，女修也能参加大比了。"}, {"type": "narrate", "text": "”"}, {"type": "narrate", "text": "谢挽星抬头看她，温玉笑了笑，转身走了，背影挺拔，像她爹当年的执法长老，但是比她爹温柔。"}, {"type": "narrate", "text": "天快黑的时候，大家凑在石桌旁吃饭，裴照夜烤的野兔，沈砚秋带的桂花糕，江晚吟做的药膳，苏砚画的灯符挂在树枝上，亮得像漫天的星星。"}, {"type": "narrate", "text": "阿蛮喝了两杯酒，脸通红，说以后魔族都听谢挽星的，谁敢搞事她第一个上。裴照夜说赤峰的弟子也都听沈砚秋的，谁敢不服她把谁打趴下。"}, {"type": "narrate", "text": "江晚吟说青峰的药修都听苏砚的，苏砚红着脸不说话，只是点头。叶惊秋拍着铁锤说灰峰的锻造师都听她们的，以后要造最好的剑给她们用。"}, {"type": "narrate", "text": "谢流光飘在半空中啃桂花糕，说他也算九峰的，他帮她们守着剑。"}, {"type": "narrate", "text": "沈砚秋靠在谢挽星肩膀上，指尖玩着她发间的碎发，语气软乎乎的：“我爹...哦不，宗主今天又喊我，说要把宗主之位给我，我没要，我要当碧落峰的峰主，不当那腌臜"}, {"type": "goto", "target": "ch025"}]}, {"id": "ch025", "background": "bg/battle.webp", "checkpoint": true, "chars": [{"id": "c1", "pos": "left", "sprite": "normal"}, {"id": "c2", "pos": "center", "sprite": "normal"}, {"id": "c3", "pos": "right", "sprite": "normal"}], "script": [{"type": "narrate", "text": "碧落峰的听剑台刚修好不到三个月，檐角悬着的青铜铃还是新铸的，被穿峰而过的山风刮得叮铃乱响，铃舌上坠的斩魔剑意碎片晃得人眼眶发凉。"}, {"type": "narrate", "text": "谢挽星盘腿坐在台心的青石板上，膝上横着的断剑还泛着冷光，指腹顺着剑脊的裂痕蹭过，耳朵里除了山风入松的声音，还有谢流光在剑芯里叽叽喳喳的声音：“师姐师姐，蒸笼开了是不是有月饼香？"}, {"type": "narrate", "text": "我闻着像五仁的。”"}, {"type": "narrate", "text": "她抬眼，就看见沈砚秋端着个食盒从山道上走上来，发间簪的白兰被山风吹得晃，左手腕内侧的月牙形旧疤露在碧色弟子服的袖口外——那是六年前她为挡魔物的爪刺，凝了半成剑意做护盾磨出来的疤，当时她抱着浑身是血的谢挽星哭，说“我带你回碧落峰，我爹是宗主，他肯定能治好你”，后来她才知道，那个被她抱在怀里的小杂役，是千年前把斩魔剑插进她师父心口的魔头转世，也是她找了六年的救命恩人。"}, {"type": "narrate", "text": "“做了七次，苏砚吃了六次都拉肚子，这次放了炒过的芝麻，没加花生。”沈砚秋把食盒放在青石板上，耳尖泛着点粉，指尖还留着被月饼模具硌出来的红印子，“做多了，吃不完扔了也是浪费。”"}, {"type": "narrate", "text": "谢挽星捏了个压在食盒最边上的月饼，咬开的瞬间松子香混着芝麻香往嘴里钻，甜得她眉心跳了一下。断剑里的谢流光嗷的一声，馋得剑身都晃了晃：“给我留一口！我馋这个好久了！"}, {"type": "narrate", "text": "上辈子你每年中秋都做，我至少能吃三个大的！”谢挽星指尖对着断剑点了点，一缕温润的剑意飘进去，谢流光美滋滋地叼着那点月饼碎， satisfaction地哼哼起来。"}, {"type": "narrate", "text": "“ artefact 要成了？”谢挽星咬了一口月饼，抬眼看向沈砚秋手里攥着的半块白玉佩。"}, {"type": "narrate", "text": "那玉佩是沈砚秋的贴身信物，打从小时候被人捡回来就带着，右边缺了个角，像被什么利刃削过，这些年沈砚秋翻遍了整个宗门的典籍都没找到能补的玉，刚才谢挽星递给她那块月牙形暖玉的时候，两块玉磕在一起刚好严丝合缝，拼成了个完整的圆形。"}, {"type": "narrate", "text": "沈砚秋捏着那两块拼在一起的玉，指腹蹭过月牙玉上刻的白兰花，嗓子有点哑：“你哪来的这么好的玉？”"}, {"type": "narrate", "text": "“上次在赤峰岩浆里捡的，不戴就砸了当剑鞘的垫片。”谢挽星嘴硬，耳朵却悄悄红了。"}, {"type": "narrate", "text": "那哪里是岩浆里捡的，是她把剑心的碎片磨了半个月，才磨出这么个刚好能补上缺角的形状，雕的白兰花还是照着沈砚秋发间总簪的那种刻的，磨得指尖都起了血泡。"}, {"type": "narrate", "text": "沈砚秋没拆穿她，只是把暖玉串在原先的玉佩穗子上，挂在腰间的碧色弟子服带子上，晃来晃去地碰她的手腕，那道月牙疤蹭过暖玉的温度，烫得她指尖都发麻。"}, {"type": "narrate", "text": "旁边的锻造铺里突然叮叮当当响了起来，叶惊秋扛着个磨得发亮的剑鞘探出头，额头上全是汗：“谢挽星！你要的宽刃剑鞘打好了！下次去赤峰砍魔物的时候别再把剑身砍崩了！我打了半个月呢！"}, {"type": "narrate", "text": "”她话音刚落，江晚吟挎着药筐从药圃里走过来，手里拎着个冒热气的陶罐，指尖还沾着药草渍：“补灵汤熬好了，你上次在赤峰冻的旧伤没好，趁热喝，我加了三次百年雪莲，不苦。”"}, {"type": "narrate", "text": "苏砚蹲在台阶上画符，歪歪扭扭的引雷符画到一半，被房顶上扔下来的桃核砸了脑袋，她抬头瞪眼，就看见阿蛮叼着半块月饼蹲在房檐上，脸上那道从眉骨划到下巴的疤在夕阳下泛着红光——那是三年前谢挽星第一次跟她比武，不小心划出来的，当时阿蛮哭着说要把谢挽星碎尸万段，转头却又给她送了整筐的灵果。"}, {"type": "narrate", "text": "“小徒弟，你画的符连个火都点不着，还不如跟我回乱葬岗养猪。”阿蛮吐着桃核笑，顺手又扔了个桃核砸在刚好路过的裴照夜脑门上。"}, {"type": "narrate", "text": "裴照夜正抱着她爹留下的旧剑假装路过，腰间的剑穗晃来晃去，被砸了之后脸一黑，提剑就往房顶上蹿：“你上次偷我剑谱的事还没跟你算账！"}, {"type": "narrate", "text": "”阿蛮 bajau 腰间的弯刀迎上去，两个人转眼的功夫就打在了听剑台的柱子上，差点把刚挂上去的青铜铃撞下来。"}, {"type": "narrate", "text": "“别踩我刚晒的铁砂！踩坏了我让你们给我打一辈子铁！”叶惊秋在下面喊。"}, {"type": "narrate", "text": "“别踩药圃！那是给挽星种的清心草！”江晚吟在后面急得跳脚。"}, {"type": "narrate", "text": "“师父！我画完符了！”苏砚举着刚画好的防火符蹦蹦跳跳地跑过来，眼睛亮得像星星。"}, {"type": "narrate", "text": "谢挽星刚要开口喝止那俩打起来的人，就看见沈砚秋捂着嘴笑，眼睛弯得像浸了月光，左手腕的月牙疤在夕阳下泛着温润的光。"}, {"type": "narrate", "text": "她忽然想起前世，自己还没战死的时候，也是在中秋，三个徒弟围在听剑台等她做月饼，那时候沈砚秋还不叫沈砚秋，叫阿月，是她捡来的小孤儿，最爱吃五仁月饼，每次都要抢最大的那个，吃完了还要抱着她的胳膊撒娇，说“师父以后每年中秋都给我做好不好”。"}, {"type": "narrate", "text": "那时候她只当是徒弟的小脾气，应了，却没做到。"}, {"type": "narrate", "text": "“罚你们去劈一个月的柴，扫一个月的听剑台，每天给苏砚当画符的靶子。"}, {"type": "narrate", "text": "”谢挽星淡淡地扫了房顶上那俩一眼，裴照夜和阿蛮同时苦了脸，互相瞪了一眼才不情不愿地跳下来，抱着柴往柴房走，路过的时候还不忘拌一句嘴。"}, {"type": "narrate", "text": "月饼蒸好的时候天已经擦黑了，满山都飘着甜香。"}, {"type": "narrate", "text": "苏砚举着刚画好的防火符，小心翼翼地把蒸笼从炭炉上端下来，江晚吟给她递了个湿帕子擦汗，叶惊秋把刚打好的剑鞘摆在谢挽星脚边，裴照夜抱着剑靠在柱子上，假装不在意地往这边瞟，阿蛮蹲在台阶上啃着桃子，时不时瞟一眼谢挽星手里的月饼。"}, {"type": "narrate", "text": "谢挽星把最后一口月饼咽下去，才把藏在袖子里的锦囊递给沈砚秋。"}, {"type": "narrate", "text": "沈砚秋愣了愣，接过来打开，里面躺着那块月牙形的暖玉，边缘还带着点剑意的温度，玉身上刻的白兰花纹路清晰，是她前阵子说想要个玉坠子佩来着。"}, {"type": "narrate", "text": "“上次在赤峰岩浆里捡的，不戴就砸了当垫片。”谢挽星还是那副嘴硬的样子，指尖却悄悄蹭了蹭沈砚秋的手背。"}, {"type": "narrate", "text": "沈砚秋没说话，只是把暖玉摘下来，和腰间的半块白玉佩串在一起，两块玉拼成的圆形在月光下泛着温润的光。"}, {"type": "narrate", "text": "那是她找了千年的东西，当年仙魔大战，她师父把这半块玉佩塞给她，说“拿着它，去碧落峰找你将来的主人”，她当时不明白是什么意思，后来遇见谢挽星，看见她手腕上同样的月牙疤，突然就懂了。"}, {"type": "narrate", "text": "山风把青铜铃吹得叮铃响，远处的九座峰连着上古锁链，在月光下泛着银色的光。谢流光在断剑里哼着前世的童谣，声音轻得像风：“师姐，我们回家了。”"}, {"type": "narrate", "text": "以前她们熬了那么多年，在泥里摸爬滚打，在刀尖上舔血，等的也就是这一刻：炉火正暖，人在身边，剑意同鸣，再也不用躲躲藏藏，再也不用怕锁链崩断，九州碎成九座孤峰。"}, {"type": "narrate", "text": "谢挽星咬了一口沈砚秋塞过来的月饼，甜得她齁得慌，还是咽了下去。沈砚秋坐在她旁边，手指蹭过那块补好的玉佩，眉间的笑意藏都藏不住。"}, {"type": "narrate", "text": "房顶上，阿蛮把最后一块月饼塞给裴照夜，说“下次比武你要是赢了我，我就给你看我爹留下的魔族密典”，裴照夜咬着月饼點了點頭，说“成交，到时候你要是输了，得叫我一声师姐”。"}, {"type": "narrate", "text": "风把白兰的香气吹过来，混着月饼的甜香，谢挽星握着膝上的断剑，忽然觉得，那些血雨腥风的日子，好像已经过去很久了。"}, {"type": "narrate", "text": "而属于她们的好日子，才刚刚开始。"}, {"type": "end", "label": "结局·全书完"}]}]};

/* ================= 场景素材预加载 ================= */

  const sc = script.scenes[idx];

/* ================= 主执行循环 ================= */
/* 跳转解析："sceneId" | "sceneId:anchor" | ":anchor"（同场景内） → {si, li} 或 {dangling} */
function resolveJump(ref) {
  if (!ref) return null;
  const parts = String(ref).split(':');
  const sceneId = parts.length > 1 ? (parts[0] || null) : parts[0];
  const anchor = parts.length > 1 ? parts[1] : null;
  const si = sceneId ? script.scenes.findIndex(s => s.id === sceneId) : sceneIdx;
  if (si < 0) return { dangling: String(ref) };
  let li = 0;
  if (anchor) {
    const mi = (script.scenes[si].script || []).findIndex(c => c.type === 'mark' && c.id === anchor);
    if (mi < 0) return { dangling: String(ref) };
    li = mi + 1;   /* 跳到标记之后那条 */
  }

}
/* 统一跳转执行：跨场景走 enterScene（带演出），同场景直接改行号 */
let jumpStreak = 0;   /* 连续跳转计数：用户每次推进/选择时清零 */
function jumpTo(ref) {
  if (++jumpStreak > 30) {
    console.warn('检测到跳转死循环，已熔断（检查剧本 goto/锚点是否成环）:', ref);
    jumpStreak = 0;
    return false;
  }
  const r = resolveJump(ref);
  if (!r) return false;
  if (r.dangling) { console.warn('悬空跳转:', r.dangling); return false; }
  stopVoice();
  if (r.si !== sceneIdx) enterScene(r.si, 0, r.li);   /* 带锚点落位（含 0=场景头） */
  else { lineIdx = r.li; waiting = null; run(); }        /* 同场景内直接改行号 */
  return true;
}

function run() {
  if (sceneIdx >= script.scenes.length) return;
  const scene = script.scenes[sceneIdx];
  if (lineIdx >= scene.script.length) return;
  const cmd = scene.script[lineIdx];
  if (cmd.if !== undefined && !evalIf(cmd.if)) { lineIdx++; run(); return; }
  switch (cmd.type) {
    case 'narrate': {
      waiting = 'advance';
      const key = sceneIdx + ':' + lineIdx;
      const wasRead = getSeen().includes(key);
      pushHistory({ narrate:true, text:interp(cmd.text), s:sceneIdx, l:lineIdx });
      markSeen(key);
      if (skipMode && !wasRead) stopSkipAuto();
      if (skipAllMode && !cmd.stop_skip) { stopVoice(); lineIdx++; run(); return; }
      highlightSpeaker(null);
      showText(cmd.text, null, true);
      if (cmd.voice) playVoice(cmd.voice, cmd.voice_volume);
      break;
    }
    case 'say': {
      const who = cmd.who;
      if (!Object.values(slots).some(s => s && s.id === who) && !freeChars.some(c => c.id === who)) {
        const free = ['center','left','right'].find(p => !slots[p]) || 'center';
        slots[free] = { id:who, sprite:'normal' };
        renderSlot(free, 'fade', true);
      }
      waiting = 'advance';
      const key = sceneIdx + ':' + lineIdx;
      const wasRead = getSeen().includes(key);
      pushHistory({ who, text:interp(cmd.text), s:sceneIdx, l:lineIdx });
      markSeen(key);
      if (skipMode && !wasRead) stopSkipAuto();
      if (skipAllMode && !cmd.stop_skip) { stopVoice(); lineIdx++; run(); return; }
      highlightSpeaker(who);
      showText(cmd.text, who, false);
      if (cmd.voice) playVoice(cmd.voice, cmd.voice_volume);
      break;
    }
    case 'set':
      applySet(cmd.vars || {});
      lineIdx++; run(); break;
    case 'goto': {
      if (!jumpTo(cmd.target)) { lineIdx++; run(); }
      break;
    }
    case 'mark': { lineIdx++; run(); return; }   /* 场景内定位锚点：不占演出 */
    case 'choice': {
      waiting = 'choice';
      clearTimeout(autoTimer);
      if (skipAllMode || skipMode) stopSkipAuto();
      const box = $('choices'); box.innerHTML = '';
      cmd.options.forEach(opt => {
        const b = document.createElement('button');
        b.className = 'choice-btn';
        b.textContent = interp(opt.text);
        if (opt.if !== undefined && !evalIf(opt.if)) { b.classList.add('disabled'); }
        else b.onclick = ev => {
          ev.stopPropagation();
          jumpStreak = 0;
          choiceNav = null;
          box.innerHTML = '';
          if (opt.set) applySet(opt.set);
          if (opt.goto && jumpTo(opt.goto)) return;
          lineIdx++; waiting = null; run();
        };
        box.appendChild(b);
      });

      const enabled = [...box.children].filter(b => !b.classList.contains('disabled'));
      choiceNav = enabled.length ? { btns: enabled, sel: 0 } : null;
      if (choiceNav) choiceNav.btns[0].classList.add('kbd-sel');
      break;
    }
    case 'inspect': {
      waiting = 'inspect';
      if (skipAllMode || skipMode) stopSkipAuto();
      /* 引导：底部提示 + 可跳过小按钮，避免玩家卡在隐式热点上 */
      const hint = document.createElement('div');
      hint.id = 'inspect-hint';
      hint.style.cssText = 'position:absolute;left:0;right:0;bottom:31vh;text-align:center;z-index:9;' +
        'color:#ffd75e;font-size:.9em;text-shadow:0 1px 4px #000;animation:blink 1.2s infinite;pointer-events:none';
      hint.textContent = '🔍 点击画面中发光的区域调查';
      $('stage').appendChild(hint);
      const skip = document.createElement('button');
      skip.id = 'inspect-skip';
      skip.className = 'btn small';
      skip.style.cssText = 'position:absolute;right:2vw;bottom:31.5vh;z-index:11;opacity:.85';
      skip.textContent = '跳过调查 ▸';
      skip.onclick = ev => {
        ev.stopPropagation();
        hint.remove(); skip.remove();
        const h = $('hotspots').querySelector('.hotspot'); if (h) h.remove();
        waiting = null; lineIdx++; run();
      };
      $('stage').appendChild(skip);
      const hs = document.createElement('div');
      hs.className = 'hotspot';
      hs.style.cssText = `left:${cmd.x*100}%;top:${cmd.y*100}%;width:${cmd.w*100}%;height:${cmd.h*100}%`;
      hs.title = '此处可调查';
      let armed = false;
      hs.onclick = ev => {

          hs.remove();
          const h2 = $('inspect-hint'); if (h2) h2.remove();
          const s2 = $('inspect-skip'); if (s2) s2.remove();

    case 'show': {

      const layer = $('cglayer'), img = $('cg-img');
      img.style.display = '';

      img.src = assetUrl(cmd.image);
      unlockCg(cmd.image);
      layer.classList.remove('hidden');
      layer.onclick = () => { layer.classList.add('hidden'); waiting = null; lineIdx++; run(); };
      break;
    }
    case 'end': {
      waiting = 'end';
      stopSkipAuto();
      const list = JSON.parse(localStorage.getItem(lsKey('endings')) || '[]');
      if (!list.includes(cmd.label)) { list.push(cmd.label); localStorage.setItem(lsKey('endings'), JSON.stringify(list)); }
      $('end-label').textContent = '结局：' + cmd.label;
      $('end-time').textContent = '通关用时 ' + Math.round((Date.now() - startTime) / 1000) + ' 秒';

}
/* ================= 判定指令 check ================= */
/* check 是瞬时指令：结算（掷骰/比较 + success/fail 的 set）在进入时同步完成，
   存档语义同 set/goto；overlay 只是演出，继续后才走 goto 或推进下一条。 */
let pendingCheck = null;   // { finish, timer, rollTimer } —— 演出中才存在
function compareOp(a, op, b) {
  switch (op) {
    case '>=': return a >= b; case '<=': return a <= b;
    case '>': return a > b; case '<': return a < b;
    case '==': return a == b; case '!=': return a != b;
    default: return false;
  }
}
function runCheck(cmd) {
  const attrKey = cmd.attr || '';
  const decl = (attrDecls() || {})[attrKey];
  const cur = typeof vars[attrKey] === 'number' ? vars[attrKey] : (decl && decl.init || 0);
  const mode = cmd.mode === 'roll' ? 'roll' : 'judge';
  const target = typeof cmd.value === 'number' ? cmd.value : parseFloat(cmd.value) || 0;
  let success, dice = null, total = null;
  if (mode === 'roll') {
    dice = 1 + Math.floor(Math.random() * 20);
    total = dice + cur;
    success = total >= target;              /* roll：d20 + 属性当前值 vs 难度 */
  } else {
    success = compareOp(cur, cmd.op || '>=', target);  /* judge：直接比较 */
  }
  const outcome = (success ? cmd.success : cmd.fail) || {};
  if (outcome.set) applySet(outcome.set);   /* set 立即结算（存档一致） */
  const done = () => {
    pendingCheck = null; waiting = null;
    if (outcome.goto && jumpTo(outcome.goto)) return;
    lineIdx++; run();
  };
  /* 跳过/快进模式：不播演出直接结算 */
  if (skipMode || skipAllMode || ffMode) { done(); return; }
  waiting = 'check';
  showCheckOverlay(cmd, decl, attrKey, cur, { mode, target, success, dice, total }, done);
}
function showCheckOverlay(cmd, decl, attrKey, cur, r, done) {
  const layer = $('check-layer');
  $('check-title').textContent = cmd.text || ((decl && decl.name || attrKey) + '判定');
  $('check-detail').textContent = (decl && decl.name || attrKey) + ' 当前 ' + cur +
    (r.mode === 'roll' ? '　｜　掷骰：d20 + ' + cur + ' vs 难度 ' + r.target
                      : '　｜　直接判定：要求 ' + (cmd.op || '>=') + ' ' + r.target);
  const diceEl = $('check-dice'), resEl = $('check-result');
  resEl.textContent = ''; resEl.className = '';
  diceEl.classList.toggle('hidden', r.mode !== 'roll');
  layer.classList.remove('hidden');
  const pc = pendingCheck = { finish: done, timer: 0, rollTimer: 0 };
  const reveal = () => {
    if (pendingCheck !== pc) return;
    if (r.mode === 'roll') diceEl.textContent = '🎲 ' + r.dice + ' + ' + cur + ' = ' + r.total;
    resEl.textContent = r.success ? '判定成功' : '判定失败';
    resEl.className = r.success ? 'ok' : 'ng';
    pc.timer = setTimeout(finishCheck, 1600);   /* 1.6s 自动继续 */
  };
  if (r.mode === 'roll') {

    const t0 = Date.now();
    pc.rollTimer = setInterval(() => {
      if (Date.now() - t0 >= 800) { clearInterval(pc.rollTimer); pc.rollTimer = 0; reveal(); return; }
      diceEl.textContent = '🎲 ' + (1 + Math.floor(Math.random() * 20));

function advance() {
  jumpStreak = 0;
  if (waiting !== 'advance') return;
  if (typing) { completeText(); return; }
  clearTimeout(autoTimer);
  waiting = null; lineIdx++;
  run();
  if (skipMode && waiting && waiting !== 'advance') stopSkipAuto();
  if (skipAllMode && waiting && waiting !== 'advance') stopSkipAuto();
}
function enterScene(idx, _guard, _startLine) {
  if (idx >= script.scenes.length) return;
  const sc = script.scenes[idx];
  if (sc.require && !evalIf(sc.require)) {
    if ((_guard || 0) > 20) { console.warn('require 跳转链过长，中止'); return; }
    if (sc.require_else) {
      const t = script.scenes.findIndex(s => s.id === sc.require_else);
      if (t >= 0) { enterScene(t, (_guard || 0) + 1); return; }
      console.warn('悬空 require_else:', sc.require_else);
    }
    enterScene(idx + 1, (_guard || 0) + 1); return;
  }

  sceneIdx = idx; lineIdx = _startLine || 0;
  $('choices').innerHTML = '';
  $('hotspots').innerHTML = '';
  if (sc.background !== undefined) setBackground(sc.background);
  if (sc.bgm !== undefined) { curBgm = sc.bgm; startBgm(sc.bgm); }
  if (sc.sfx) playSfx(sc.sfx);
  if (sc.chars !== undefined) updateChars(sc.chars);
  if (sc.checkpoint) saveSlot('checkpoint', true);
  scheduleScenePreload(idx);
  run();
}

function openView(show, onClose) {
  const layer = $('viewlayer'), img = $('view-img');
  if (show.image) { unlockCg(show.image); img.classList.remove('hidden'); img.onerror = () => img.classList.add('hidden'); img.src = assetUrl(show.image); }
  else img.classList.add('hidden');
  $('view-text').textContent = interp(show.text || '');
  layer.classList.remove('hidden');
  layer.onclick = () => { layer.classList.add('hidden'); onClose(); };
}

/* ================= 存档 ================= */
function snapshot() {
  const sc = script.scenes[sceneIdx];
  return { sceneIdx, lineIdx, vars:{...vars}, bg:curBg, bgm:curBgm,
    slots:JSON.parse(JSON.stringify(slots)),
    freeChars:JSON.parse(JSON.stringify(freeChars)),
    version:script.meta.version, sceneId:sc ? sc.id : '', time:Date.now() };
}
function saveSlot(name, silent) {
  if (name === 'checkpoint') { const sc = script.scenes[sceneIdx]; if (!sc || !sc.checkpoint) return; }
  const data = snapshot(); data.lineIdx = lineIdx + 1;
  localStorage.setItem(lsKey('save_' + name), JSON.stringify(data));
  if (!silent) renderSavePanel();
}
function loadSlot(name) {
  const raw = localStorage.getItem(lsKey('save_' + name));
  if (!raw) return false;
  const d = JSON.parse(raw);
  if (d.version !== script.meta.version) alert('存档版本（' + d.version + '）与剧本版本（' + script.meta.version + '）不一致，可能不兼容。');
  vars = d.vars || {};
  setBackground(d.bg);
  curBgm = d.bgm; startBgm(d.bgm);
  slots = d.slots || { left:null, center:null, right:null };
  for (const p of ['left','center','right']) renderSlot(p, 'none', false);
  freeChars = d.freeChars || [];
  $('fchars').innerHTML = '';
  freeChars.forEach(c => renderFreeChar(c, 'none', false));
  sceneIdx = d.sceneIdx; lineIdx = d.lineIdx;
  $('choices').innerHTML = ''; $('hotspots').innerHTML = '';
  $('end-screen').classList.add('hidden');
  pendingCheck = null;   /* 读档丢弃进行中的判定演出（check 已瞬时结算，快照存的是下一行） */
  closeAllPanels();
  history = []; waiting = null;
  run(); return true;
}
function renderSavePanel(forSave) {
  const grid = $('save-slots'); grid.innerHTML = '';
  const names = ['checkpoint', ...Array.from({length:10}, (_, i) => 'slot' + (i + 1))];
  names.forEach(n => {

/* 主控显示名：玩家命名流程存在 vars.player_name，缺省「我」 */
const playerDisplayName = () => vars.player_name || '我';
/* 属性分组：主控（owner=player）/ 各归属角色 / 其它（无 owner，行为与旧版一致） */
function attrGroups() {
  const attrs = attrDecls() || {};
  const groups = { player: [], chars: {}, other: [] };
  Object.keys(attrs).forEach(k => {
    const a = attrs[k];
    if (a.owner === 'player') groups.player.push(k);
    else if (a.owner && script.characters && script.characters[a.owner]) {
      (groups.chars[a.owner] = groups.chars[a.owner] || []).push(k);
    } else groups.other.push(k);
  });
  /* 好感类属性排前（key 含 favor 或显示名含「好感」） */
  const favorFirst = arr => arr.sort((x, y) => {
    const fx = /favor|好感/.test(x + (attrs[x].name || '')) ? 0 : 1;
    const fy = /favor|好感/.test(y + (attrs[y].name || '')) ? 0 : 1;
    return fx - fy;
  });

  Object.values(groups.chars).forEach(favorFirst);

function renderAttrPanel() {
  const attrs = attrDecls() || {};

    const a = attrs[k]; const v = typeof vars[k] === 'number' ? vars[k] : (a.init || 0);
    const max = a.max !== undefined ? a.max : 100;

    return '<div class="attr-row"><div class="attr-head"><span>' + (a.name || k) + '</span><span>' +

  }
  Object.keys(g.chars).forEach(cid => {

  });

}

/* ================= 校验 ================= */
function validate(sc) {
  const warns = [], ids = new Set(sc.scenes.map(s => s.id));
  sc.scenes.forEach(s => {
    if (s.require_else && !ids.has(s.require_else)) warns.push(`场景 ${s.id}：require_else "${s.require_else}" 不存在`);
    (s.chars || []).forEach(c => { if (!sc.characters[c.id]) warns.push(`场景 ${s.id}：角色 "${c.id}" 未定义`); });
    (s.script || []).forEach((cmd, i) => {
      if (cmd.type === 'goto' && cmd.target) {
        const pr = String(cmd.target).split(':');
        const sid = pr.length > 1 ? (pr[0] || s.id) : pr[0];
        if (pr.length === 1 && !ids.has(sid)) warns.push(`场景 ${s.id} 第${i+1}行：goto 目标 "${cmd.target}" 不存在`);
        else if (pr.length > 1) {
          const ts = sc.scenes.find(x => x.id === sid);
          if (!ts) warns.push(`场景 ${s.id} 第${i+1}行：goto 目标场景 "${sid}" 不存在`);
          else if (!(ts.script || []).some(c => c.type === 'mark' && c.id === pr[1]))
            warns.push(`场景 ${s.id} 第${i+1}行：goto 锚点 "${pr[1]}" 在场景 "${sid}" 不存在`);
        }
      }
      if (cmd.type === 'mark' && !cmd.id) warns.push(`场景 ${s.id} 第${i+1}行：标记缺少 id`);
      if (cmd.type === 'say' && !sc.characters[cmd.who]) warns.push(`场景 ${s.id} 第${i+1}行：说话角色 "${cmd.who}" 未定义`);
      if (cmd.type === 'choice') cmd.options.forEach(o => {
        if (!o.goto) return;
        const pr = String(o.goto).split(':');
        const sid = pr.length > 1 ? (pr[0] || s.id) : pr[0];
        const ts = sc.scenes.find(x => x.id === sid);
        if (!ts) warns.push(`场景 ${s.id} 第${i+1}行：选项 "${o.text}" 的 goto "${o.goto}" 场景不存在`);
        else if (pr.length > 1 && !(ts.script || []).some(c => c.type === 'mark' && c.id === pr[1]))
          warns.push(`场景 ${s.id} 第${i+1}行：选项 "${o.text}" 的锚点 "${pr[1]}" 在场景 "${sid}" 不存在`);
      });
      if (cmd.type === 'check') {
        if (cmd.attr && sc.attrs && !sc.attrs[cmd.attr]) warns.push(`场景 ${s.id} 第${i+1}行：判定属性 "${cmd.attr}" 未在 attrs 声明`);
        ['success','fail'].forEach(k => { const o = cmd[k]; if (o && o.goto && !ids.has(o.goto)) warns.push(`场景 ${s.id} 第${i+1}行：判定${k==='success'?'成功':'失败'}分支 goto "${o.goto}" 不存在`); });
      }
    });
  });
  return warns;
}

/* ================= 标题页 / 玩家命名 ================= */
function showNameInput() {
