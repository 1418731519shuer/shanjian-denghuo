<style>
/* ========== 基础布局 ========== */
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { width:100%; height:100%; overflow:hidden; background:#000;
  font-family:"Microsoft YaHei","PingFang SC",sans-serif; color:#eee; user-select:none; }
#stage { position:fixed; inset:0; overflow:hidden; }

.bg { position:absolute; inset:0; background-size:cover; background-position:center;
  opacity:0; transition:opacity .5s; }
.bg.on { opacity:1; }
.bg.placeholder { background:linear-gradient(135deg,#1a2233,#3a4a63); }

.slot { position:absolute; bottom:0; width:33%; height:78%; display:flex;
  align-items:flex-end; justify-content:center; pointer-events:none; transition:opacity .4s; }
#slot-left   { left:0; }
#slot-center { left:33.5%; }
#slot-right  { right:0; }
.slot img { max-height:100%; max-width:95%; transition:opacity .15s, filter .2s, transform .4s; filter:brightness(.62); }
.slot.speaking img { filter:brightness(1.08) drop-shadow(0 0 14px rgba(255,220,120,.45)); transform:scale(1.02); }
.slot .silhouette { width:60%; height:80%; border-radius:40% 40% 0 0;
  background:linear-gradient(180deg,#555,#333); opacity:.6; transition:filter .2s; filter:brightness(.7); }
.slot.speaking .silhouette { filter:brightness(1.2); }
.slot.enter-fade img, .slot.enter-fade .silhouette { animation:fadeIn .5s; }
.slot.enter-slide-l img, .slot.enter-slide-l .silhouette { animation:slideL .5s; }
.slot.enter-slide-r img, .slot.enter-slide-r .silhouette { animation:slideR .5s; }
@keyframes fadeIn { from{opacity:0} to{opacity:1} }
@keyframes slideL { from{transform:translateX(-60vw);opacity:0} to{transform:none;opacity:1} }
@keyframes slideR { from{transform:translateX(60vw);opacity:0} to{transform:none;opacity:1} }

/* 橙光式对话框：半透明渐变、无边框、safe-area 适配 */
#dlg { position:absolute; left:0; right:0; bottom:0; height:30vh; min-height:130px;
  background:linear-gradient(to top, rgba(6,8,14,.97) 0%, rgba(8,11,20,.92) 45%, rgba(8,11,20,.68) 75%, rgba(8,11,20,.25) 92%, transparent 100%);
  padding:3vh 5vw calc(2.2vh + env(safe-area-inset-bottom, 0px)); cursor:pointer; z-index:10; }
/* 悬浮名字框 */
#namebox { position:absolute; top:-1.3em; left:6vw; padding:.28em 1.3em;
  background:linear-gradient(135deg, rgba(52,38,58,.92), rgba(22,26,44,.92));
  border:1px solid rgba(255,215,150,.35); border-radius:2em;
  box-shadow:0 3px 14px rgba(0,0,0,.55), 0 0 12px rgba(255,215,150,.18);
  font-weight:bold; font-size:clamp(14px,2.2vw,22px); letter-spacing:.08em; }
#dlgtext { font-size:clamp(15px,2.4vw,24px); line-height:1.7; white-space:pre-wrap;  text-shadow:0 1px 3px rgba(0,0,0,.9), 0 0 8px rgba(0,0,0,.6); }
#dlgtext.narrate { font-style:italic; color:#cfd6e4; }
#advance-hint { position:absolute; right:2vw; bottom:1vh; font-size:.9em; opacity:.6; animation:blink 1s infinite; }
@keyframes blink { 50%{opacity:.15} }
#voice-indicator { position:absolute; right:2vw; top:-1.5em; font-size:.8em; opacity:.7; color:#ffd75e; display:none; }
#voice-indicator.playing { display:block; animation:blink .8s infinite; }

#choices { position:absolute; left:0; right:0; bottom:34vh; display:flex; flex-direction:column;
  align-items:center; gap:1.4vh; z-index:11; padding:0 4vw; }
/* 选项：居中卡片式，带渐入动画与 hover 反馈 */
.choice-btn { min-width:min(60vw,480px); max-width:92vw; padding:.8em 1.6em; font-size:clamp(15px,2.2vw,22px);
  background:linear-gradient(180deg, rgba(34,40,64,.88), rgba(18,22,38,.88));
  color:#fff; border:1px solid rgba(180,200,255,.35); border-radius:.8em; cursor:pointer;
  box-shadow:0 4px 18px rgba(0,0,0,.45);
  transition:transform .18s, box-shadow .18s, border-color .18s, background .18s;
  animation:choiceIn .4s both; }
.choice-btn:nth-child(2) { animation-delay:.07s; }
.choice-btn:nth-child(3) { animation-delay:.14s; }
.choice-btn:nth-child(4) { animation-delay:.21s; }
.choice-btn:nth-child(5) { animation-delay:.28s; }
.choice-btn:nth-child(6) { animation-delay:.35s; }
@keyframes choiceIn { from{opacity:0; transform:translateY(16px)} to{opacity:1; transform:none} }
.choice-btn:hover { background:linear-gradient(180deg, rgba(52,62,96,.92), rgba(30,36,60,.92));

  box-shadow:0 6px 22px rgba(0,0,0,.5), 0 0 16px rgba(150,180,255,.35); }
.choice-btn.disabled { opacity:.35; cursor:not-allowed; border-color:#666; animation:none; }
.choice-btn.disabled:hover { transform:none; box-shadow:0 4px 18px rgba(0,0,0,.45); }
/* 键盘选中态（数字键/方向键/回车导航） */
.choice-btn.kbd-sel { border-color:#ffd75e; transform:translateY(-2px);
  box-shadow:0 6px 22px rgba(0,0,0,.5), 0 0 16px rgba(255,215,94,.45); }
.choice-btn { min-height:44px; }

.hotspot { position:absolute; z-index:9; border:2px solid rgba(255,220,100,.9); border-radius:.4em;
  background:rgba(255,220,100,.12); cursor:pointer; animation:hsGlow 1.2s infinite; }
@keyframes hsGlow { 50%{background:rgba(255,220,100,.3)} }

.overlay { position:fixed; inset:0; z-index:50; background:rgba(0,0,0,.72);
  display:flex; align-items:center; justify-content:center; flex-direction:column;
  transition:opacity .2s ease; }
.hidden { display:none !important; }
/* 弹层统一开合过渡：隐藏态不 display:none，而是透明+不响应，opacity 200ms 淡入淡出 */
.overlay.hidden { display:flex !important; opacity:0; visibility:hidden; pointer-events:none;
  transition:opacity .2s ease, visibility 0s linear .2s; }
.overlay .panel { transform:translateY(10px); transition:transform .2s ease; }
.overlay:not(.hidden) .panel { transform:none; }
/* 设计语言统一：rgba(10,12,20,.94) 底 + #3a4a63 边 + 10px 圆角 */
.panel { background:rgba(10,12,20,.94); border:1px solid #3a4a63; border-radius:10px;
  padding:1.6em 2em; max-width:92vw; max-height:86vh; overflow:auto; min-width:min(70vw,560px);
  box-shadow:0 8px 30px rgba(0,0,0,.55); }
.panel h2 { margin-bottom:.8em; font-size:1.15em; letter-spacing:.12em;

.btn { display:inline-block; margin:.3em; padding:.55em 1.4em; background:#263652; color:#fff;
  border:1px solid #5a7bb0; border-radius:.4em; cursor:pointer; font-size:1em;
  transition:background .15s, box-shadow .15s, transform .15s; }
.btn:hover { background:#33497a; }
.btn:focus-visible { outline:2px solid #7fa0d0; outline-offset:1px; }
.btn:active { transform:scale(.97); }
.btn[disabled] { opacity:.4; cursor:not-allowed; }
.btn[disabled]:hover { background:#263652; }
.btn.small { padding:.3em .8em; font-size:.85em; }

#viewlayer img, #cglayer img { max-width:70vw; max-height:60vh; border:1px solid #555; margin-bottom:1em; }
#cglayer { background:rgba(0,0,0,.85); }
#cglayer img { animation:cgIn .5s; }
@keyframes cgIn { from{opacity:0; transform:scale(.92)} to{opacity:1; transform:scale(1)} }
#view-text { max-width:70vw; line-height:1.8; font-size:1.1em; }

#menubar { position:fixed; top:calc(8px + env(safe-area-inset-top, 0px)); right:calc(8px + env(safe-area-inset-right, 0px)); z-index:40; display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; }
#menubar .btn { min-width:44px; min-height:44px; margin:0; padding:.3em .6em; font-size:.85em; }
@media (max-width:600px) {
  #menubar { gap:4px; }
  #menubar .btn { min-width:34px; min-height:34px; padding:.15em .4em; font-size:.72em; }
}
/* 手机横屏（矮屏）适配：对话框压扁、立绘放高、菜单紧凑 */
@media (orientation: landscape) and (max-height:520px) {
  #dlg { height:42vh; min-height:96px; padding:1.4vh 4vw calc(1.4vh + env(safe-area-inset-bottom, 0px)); }

  #namebox { font-size:clamp(12px, 2.4vh, 16px); }

  .choice-btn { padding:.5em 1.2em; font-size:clamp(13px, 2.6vh, 18px); min-height:36px; }
  #menubar .btn { min-width:32px; min-height:32px; padding:.1em .4em; font-size:.7em; }

}

.slotgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:.6em; }
.saveslot { border:1px solid #3a4a63; border-radius:.4em; padding:.6em; cursor:pointer; font-size:.85em; min-height:4.5em; }
.saveslot:hover { background:#1d2740; }
.saveslot .t { opacity:.6; font-size:.8em; }

.setrow { display:flex; align-items:center; gap:1em; margin:.7em 0; }

#title-screen { background-color:#05070d; background-size:cover; background-position:center; z-index:60; }

#history-panel { flex-direction:row; justify-content:flex-end; align-items:stretch; background:rgba(0,0,0,.45); }
#history-drawer { width:min(430px,88vw); height:100%; display:flex; flex-direction:column;
  padding:calc(1.2em + env(safe-area-inset-top, 0px)) calc(1.2em + env(safe-area-inset-right, 0px)) calc(1.2em + env(safe-area-inset-bottom, 0px)) 1.2em;
  background:rgba(10,12,20,.97);

/* ========== CG 画廊 / 结局收集 ========== */
.gallery-panel, .endings-panel { min-width:min(88vw,640px); }
#gallery-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:.7em; margin:.8em 0; }

#cg-viewer { z-index:80; background:rgba(0,0,0,.92); }

/* ========== 游戏内系统菜单 ========== */
#sys-menu { z-index:58; background:rgba(0,0,0,.55); }

  background:rgba(38,54,82,.6); min-height:44px; }

.fchar { position:absolute; pointer-events:none; transform-origin:50% 100%; transition:opacity .4s; }

.attr-row { margin:.8em 0; }

/* 场景编辑器 */

/* Timeline - 多轨道 */

#se-char-bar { height:26px; min-height:22px; background:#141a28; border-top:1px solid #3a4a63; display:flex; align-items:center; padding:0 6px; gap:3px; flex-shrink:0; }
#se-char-chips { display:flex; gap:3px; overflow-x:auto; }
.se-char-chip { padding:2px 8px; border-radius:10px; font-size:.65em; cursor:pointer; border:1px solid #3a4a63; white-space:nowrap; }
.se-char-chip.on { background:#2d5a3d; border-color:#4a8a5d; }
.se-char-chip.off { background:#2a2a3a; opacity:.6; }

.tl-char-row { display:flex; align-items:center; height:20px; margin:1px 0; }
.tl-char-row .tl-label { min-width:36px; font-size:.55em; opacity:.5; text-align:right; padding-right:4px; }
.tl-char-row .tl-blocks { flex:1; height:100%; position:relative; background:rgba(255,255,255,.02); border-radius:2px; }
.tl-char-row .tl-block { height:16px; line-height:16px; padding:0 4px; font-size:.5em; top:2px; }
.tl-track { display:flex; align-items:center; height:22px; margin:1px 0; position:relative; }
.tl-label { min-width:36px; font-size:.6em; opacity:.45; text-align:right; padding-right:4px; }
.tl-blocks { flex:1; height:100%; position:relative; background:rgba(255,255,255,.02); border-radius:2px; overflow:hidden; }
.tl-block { position:absolute; top:1px; bottom:1px; border-radius:3px; cursor:pointer; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; padding:0 5px; font-size:.6em; line-height:20px; transition:filter .12s; }
.tl-block:hover { filter:brightness(1.25); z-index:3; }
.tl-block.sel { outline:2px solid #fff; z-index:3; }
.tl-block.narrate { background:#4a5568; }
.tl-block.say { background:#2d5a3d; }
.tl-block.choice { background:#8b5e3c; }
.tl-block.set { background:#3d3d5a; }
.tl-block.goto { background:#5a2d2d; }
.tl-block.end { background:#5a2d4a; }
.tl-block.show { background:#2d4a5a; }
.tl-block.inspect { background:#5a4a2d; }
.tl-block.check { background:#6a5a1d; }
/* ---- 判定指令 check：全屏演出 overlay ---- */
#check-layer { z-index:60; background:rgba(0,0,0,.72); display:flex; align-items:center; justify-content:center; }
#check-box { min-width:min(80vw,380px); text-align:center; padding:1.6em 2.2em;
  background:rgba(12,16,28,.96); border:1px solid #7fa0d0; border-radius:.7em;
  animation:check-pop .25s ease-out; }
@keyframes check-pop { from { transform:scale(.85); opacity:0; } to { transform:scale(1); opacity:1; } }
#check-title { font-size:1.25em; letter-spacing:.12em; margin-bottom:.5em; }
#check-detail { font-size:.85em; opacity:.75; margin-bottom:.7em; }
#check-dice { font-size:2.6em; font-family:monospace; margin:.15em 0; color:#ffd75e; }
#check-result { font-size:2em; font-weight:bold; letter-spacing:.15em; min-height:1.4em;
  animation:check-pop .3s ease-out; }
#check-result.ok { color:#ffd75e; text-shadow:0 0 18px rgba(255,215,94,.5); }
#check-result.ng { color:#8a8f9a; }
#check-hint { font-size:.7em; opacity:.45; margin-top:.8em; }
/* ---- 属性面板分组 ---- */
.attr-group-head { margin:.9em 0 .3em; font-size:.9em; letter-spacing:.08em;
  border-bottom:1px solid #3a4a63; padding-bottom:.2em; }
.tl-block.bgm-block { background:#2d4a4a; }
.tl-block.sfx-block { background:#4a2d4a; }
.tl-block.char-block { background:#2a4a3a; }

/* Hotspot editing on canvas */
#se-canvas-hotspots { position:absolute; inset:0; z-index:3; pointer-events:none; }
.se-hotspot { position:absolute; border:2px solid rgba(255,220,100,.9); background:rgba(255,220,100,.15); pointer-events:auto; cursor:move; border-radius:2px; }
.se-hotspot:hover { background:rgba(255,220,100,.35); }
.se-hotspot::after { content:attr(data-label); position:absolute; top:-1.4em; left:0; font-size:.65em; color:#ffd75e; white-space:nowrap; background:rgba(0,0,0,.8); padding:0 .3em; border-radius:2px; }
.se-hotspot .hs-resize { position:absolute; right:-4px; bottom:-4px; width:10px; height:10px; background:#ffd75e; cursor:se-resize; border-radius:1px; }

/* Canvas layers */
#se-canvas-bg { position:absolute; inset:0; z-index:0; }
#se-canvas-chars { position:absolute; inset:0; z-index:1; }
#se-canvas-hotspots { position:absolute; inset:0; z-index:2; }
/* Preview overlay on canvas */
#se-preview-overlay { position:absolute; left:0; right:0; bottom:0; height:30%; z-index:10; background:rgba(10,12,20,.88); border-top:1px solid rgba(255,255,255,.2); padding:1em 2em; display:none; pointer-events:auto; overflow-y:auto; }
#se-preview-overlay.show { display:flex; flex-direction:column; }
#se-pv-namebox { font-weight:bold; font-size:.9em; margin-bottom:.3em; display:none; cursor:pointer; }
#se-pv-namebox.show { display:block; }
#se-pv-namebox:hover { text-decoration:underline; }
#se-pv-text { font-size:.85em; line-height:1.6; color:#ddd; font-style:italic; cursor:text; outline:none; min-height:1em; }
#se-pv-text.normal { font-style:normal; color:#fff; }
#se-pv-text:focus { background:rgba(255,255,255,.05); border-radius:3px; padding:2px 4px; }

/* Game preview iframe at bottom */
#se-game-preview { height:18vh; min-height:100px; border-top:2px solid #3a4a63; background:#000; }
#se-game-preview iframe { width:100%; height:100%; border:none; }

/* ---- 剪辑式时间轴：插入隙 / 指令选择盘 ---- */
#tl-insert-row { display:flex; align-items:center; height:16px; margin:1px 0; }
#tl-insert-row .tl-blocks { background:transparent; overflow:visible; }
.tl-gap { position:absolute; top:0; bottom:0; cursor:pointer; z-index:2; display:flex; align-items:center; justify-content:center; }
.tl-gap::after { content:'+'; font-size:10px; line-height:1; color:#7fa0d0; background:#141a28;
  border:1px solid #3a4a63; border-radius:50%; width:13px; height:13px; display:flex; align-items:center; justify-content:center;
  opacity:0; transition:opacity .15s; }
.tl-gap:hover::after { opacity:1; }
.tl-gap.drop-hi::after { opacity:1; color:#ffd75e; border-color:#ffd75e; }
.tl-block[draggable=true] { cursor:grab; }
.tl-block.dragging { opacity:.4; }

/* ---- 帧模式胶片条（🎬 帧 / 📊 轨道 切换） ---- */
#tl-mode-bar { display:flex; gap:4px; padding:2px 6px; flex-shrink:0; }
.tl-mode-btn { background:#141a28; color:#ccd5e0; border:1px solid #3a4a63; border-radius:4px;
  font-size:.65em; padding:1px 8px; cursor:pointer; }
.tl-mode-btn.on { border-color:#ffd75e; color:#ffd75e; }
#tl-frames { display:none; gap:6px; padding:6px; overflow-x:auto; overflow-y:hidden; min-height:118px; align-items:stretch; }
#se-timeline-wrap.frame-mode .tl-track, #se-timeline-wrap.frame-mode #tl-chars-container { display:none; }
#se-timeline-wrap.frame-mode #tl-frames { display:flex; }
.tl-frame { flex:0 0 auto; width:108px; cursor:pointer; }
.tl-frame .fr-shot { position:relative; width:108px; height:64px; background:#0c1120;
  border:1px solid #3a4a63; border-radius:4px; overflow:hidden; }
.tl-frame:hover .fr-shot { border-color:#7fa0d0; }
.tl-frame.sel .fr-shot { outline:2px solid #ffd75e; }
.tl-frame.dangling .fr-shot { border:2px solid #e74c3c; }
.tl-frame.dragging { opacity:.4; }
.fr-shot img.fr-bg { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:.85; }
.fr-shot .fr-nobg { position:absolute; inset:0; background:linear-gradient(135deg,#1a2233,#3a4a63); }
.fr-shot .fr-black { position:absolute; inset:0; background:#000; }
.fr-shot img.fr-char { position:absolute; bottom:0; height:88%; transform:translateX(-50%); }
.fr-shot .fr-text { position:absolute; left:0; right:0; bottom:0; font-size:8px; line-height:1.3;
  padding:1px 3px; background:rgba(6,8,14,.8); color:#dde3ee;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.fr-shot .fr-badges { position:absolute; top:1px; left:3px; font-size:9px; text-shadow:0 1px 2px #000; }
.fr-chips { margin-top:2px; display:flex; flex-wrap:wrap; gap:2px; }
.fr-chip { font-size:8px; line-height:1.5; padding:0 4px; border:1px solid #7fa0d0; border-radius:6px;
  color:#a8c4ff; cursor:pointer; white-space:nowrap; max-width:104px; overflow:hidden; text-overflow:ellipsis; }
.fr-chip:hover { background:#263652; }
.fr-chip.end { border-color:#c0a050; color:#ffd75e; cursor:default; }
.fr-chip:hover.end { background:none; }
.tl-fgap { flex:0 0 10px; align-self:stretch; cursor:pointer; position:relative; }
.tl-fgap::after { content:'+'; position:absolute; top:32px; left:50%; transform:translate(-50%,-50%);
  font-size:10px; line-height:1; color:#7fa0d0; background:#141a28; border:1px solid #3a4a63; border-radius:50%;
  width:13px; height:13px; display:flex; align-items:center; justify-content:center; opacity:0; transition:opacity .15s; }
.tl-fgap:hover::after, .tl-fgap.drop-hi::after { opacity:1; }
.tl-fgap.drop-hi::after { color:#ffd75e; border-color:#ffd75e; }

/* ---- 站位参考线（仅编辑器画布内显示） ---- */
#se-guides { position:absolute; inset:0; z-index:4; pointer-events:none; }
.se-guide-v { position:absolute; top:0; bottom:0; width:0; border-left:1px dashed rgba(127,160,208,.22); }
.se-guide-v.hi { border-left:1px solid rgba(255,215,94,.85); }
.se-guide-v::after { content:attr(data-name); position:absolute; top:2px; left:3px;
  font-size:9px; color:rgba(127,160,208,.45); white-space:nowrap; }
.se-guide-base { position:absolute; left:0; right:0; bottom:0; border-bottom:1px dashed rgba(127,160,208,.35); }
/* 点选角色后的缩放滑杆（se-char-bar 内） */
#se-scale-wrap { align-items:center; gap:4px; font-size:.65em; margin-left:6px; }
#se-scale-wrap.hidden { display:none; }
#se-scale-wrap:not(.hidden) { display:flex; }
#se-scale-slider { width:110px; }

/* 通用锚点弹层（chip 小面板） */
.se-pop { position:fixed; z-index:300; background:#141a28; border:1px solid #7fa0d0; border-radius:.5em;
  padding:.7em; box-shadow:0 6px 24px rgba(0,0,0,.65); font-size:.8em; max-width:min(92vw,420px); }
.se-pop h4 { margin:0 0 .5em; font-size:.95em; letter-spacing:.08em; }

/* 画布选项卡片（choice 可视化编辑） */
.opt-card { display:flex; flex-wrap:wrap; gap:4px; align-items:center; margin:4px 0;
  background:rgba(40,60,95,.45); border:1px solid rgba(127,160,208,.35); border-radius:6px; padding:5px 6px; }
.opt-card input.opt-text { flex:1 1 140px; min-width:120px; padding:4px 6px; background:#0c1120; color:#eee;
  border:1px solid #5a7bb0; border-radius:4px; font-size:.9em; }
.opt-chip { display:inline-block; padding:2px 8px; border-radius:10px; font-size:.72em; cursor:pointer;
  border:1px solid #3a4a63; background:#1a2040; white-space:nowrap; max-width:150px; overflow:hidden; text-overflow:ellipsis; }
.opt-chip:hover { filter:brightness(1.3); }
.opt-chip.goto { border-color:#7fa0d0; color:#a8c4ff; }
.opt-chip.set { border-color:#4a8a5d; color:#98FB98; }
.opt-chip.cond { border-color:#c0a050; color:#ffd75e; }
.opt-chip.empty { opacity:.55; border-style:dashed; }
.opt-del { color:#c44; cursor:pointer; font-size:.75em; padding:0 4px; }

/* 变量行 / 条件构造器 */
.set-row, .cb-row { display:flex; gap:4px; align-items:center; margin:3px 0; }
.set-row select, .set-row input, .cb-row select, .cb-row input {
  padding:3px 4px; background:#0c1120; color:#eee; border:1px solid #5a7bb0; border-radius:3px; font-size:.85em; }
.cb-join { font-size:.75em; color:#ffd75e; cursor:pointer; padding:1px 6px; border:1px dashed #c0a050; border-radius:8px; }

/* 上传素材面板 */
#upload-panel .up-row { display:flex; gap:.5em; align-items:center; margin:.5em 0; flex-wrap:wrap; }
#upload-panel select, #upload-panel input[type=text] { padding:.35em; background:#0c1120; color:#eee; border:1px solid #5a7bb0; border-radius:3px; }
#upload-preview { max-width:180px; max-height:110px; border:1px solid #3a4a63; border-radius:4px; }
.up-hint { font-size:.75em; opacity:.6; line-height:1.6; }
.up-err { color:#ff8a7a; font-size:.8em; min-height:1.2em; }

/* 编辑器：自动保存提示 + 画布快捷键提示行 */
#se-saved { opacity:0; transition:opacity .3s; color:#7fc97f; font-size:.75em; margin-left:.5em; }
#se-saved.show { opacity:1; }
#se-keys-hint { position:absolute; left:0; right:0; bottom:0; z-index:12; pointer-events:none;
  text-align:center; font-size:.62em; color:#8fa3c0; padding:2px 0;
  background:linear-gradient(transparent, rgba(5,7,12,.75)); }
/* 拖色块经过间隙时的落点高亮 */
.tl-gap.drop-hi { background:rgba(255,215,94,.14); border-radius:3px; }

@media (max-aspect-ratio: 3/4) {
  .slot { width:40%; height:60%; }
  #slot-center { left:30%; }
  #dlg { height:35vh; }
  #choices { bottom:38vh; }
}
</style>
</head>
<body>
<div id="stage">
  <div id="bg-a" class="bg"></div>
  <div id="bg-b" class="bg"></div>
  <div id="hotspots"></div>
  <div id="slot-left" class="slot"></div>
  <div id="slot-center" class="slot"></div>
  <div id="slot-right" class="slot"></div>
  <div id="fchars"></div>
  <div id="choices"></div>
  <div id="dlg">
    <div id="namebox" class="hidden"></div>
    <div id="dlgtext"></div>
    <div id="voice-indicator">🔊</div>
    <div id="advance-hint">▼ 点击继续</div>
  </div>
</div>

<div id="attr-toasts"></div>

<div id="menubar">
  <button class="btn hidden" id="mb-attrs" title="属性面板">属性</button>
  <button class="btn" id="mb-hist" title="历史回顾">历史</button>
  <button class="btn" id="mb-save" title="存档">存档</button>
  <button class="btn" id="mb-load" title="读档">读档</button>
  <button class="btn" id="mb-set" title="设置">设置</button>
  <button class="btn" id="mb-menu" title="系统菜单">菜单</button>
  <button class="btn" id="mb-auto" title="自动播放">自动</button>
  <button class="btn" id="mb-skip" title="跳过已读">跳过</button>
  <button class="btn" id="mb-skipall" title="全部跳过">全跳</button>
  <button class="btn" id="mb-title" title="回标题">标题</button>
</div>

<div id="title-screen" class="overlay">
  <canvas id="title-particles"></canvas>
  <div id="title-main">
    <h1 id="game-title">…</h1>
    <div class="author" id="game-author"></div>
    <div id="title-btns">
      <button class="tbtn hidden" id="btn-continue">继续游戏</button>
      <button class="tbtn" id="btn-start">开始游戏</button>
      <button class="tbtn" id="btn-gallery">CG画廊</button>

      <button class="tbtn" id="btn-text-demo">文字脚本示例</button>

    <div id="ending-info"></div>
    <div id="warnings"></div>
  </div>
</div>

<div id="name-input-overlay" class="overlay hidden" style="z-index:65">

    <h2>你的名字</h2>
    <p style="opacity:.7;margin:.8em 0">请输入主角的名字</p>
    <input type="text" id="name-input-field" maxlength="10" placeholder="灯" style="width:60%;padding:.5em;font-size:1.2em;text-align:center;background:#0c1120;color:#eee;border:1px solid #7fa0d0;border-radius:.4em">
    <br><br>
    <button class="btn" id="name-input-confirm">确认</button>
  </div>
</div>

<div id="history-panel" class="overlay hidden">
  <div id="history-drawer">
    <h2>对话回看</h2>
    <div id="history-list"></div>
    <button class="btn" id="hist-close">关闭</button>
  </div>
</div>

<div id="settings-panel" class="overlay hidden">
  <div class="panel">
    <h2>设置</h2>
    <div class="setrow"><label>文字速度</label>
      <input type="range" id="set-speed" min="0" max="80" step="1" value="30">
      <span id="speed-label" style="min-width:3em;text-align:right;font-size:.9em">30</span>

      <input type="range" id="set-autodelay" min="300" max="5000" step="100" value="1800">

<div id="attr-panel" class="overlay hidden">

<!-- 判定指令 check 的全屏演出层 -->
<div id="check-layer" class="overlay hidden">
  <div id="check-box">
    <div id="check-title">判定</div>
    <div id="check-detail"></div>
    <div id="check-dice" class="hidden">🎲</div>
    <div id="check-result"></div>
    <div id="check-hint">点击继续</div>

<!-- 场景转场黑场层 -->
<div id="transition-layer"></div>

  <div class="panel gallery-panel">

<script>
'use strict';
/* ================= 内嵌剧本 ================= */
const EMBEDDED_SCRIPT = {"meta": {"title": "《九峰听剑》", "author": "novel_writer + novel_to_game", "version": "1.0", "defaults": {"text_speed": 25, "bgm_volume": 0.5, "auto_delay": 1800}}, "characters": {"c1": {"name": "沈砚秋", "color": "#FFD9A0", "look": "身量高挑，总穿不合身的碧色弟子服，发间总簪着从山下摘的白兰，左手腕内侧有一道月牙形旧疤", "sprites": {"normal": "chars/c1_normal.webp", "smile": "chars/c1_smile.webp", "sad": "chars/c1_sad.webp"}}, "c2": {"name": "裴照夜", "color": "#9FC0FF", "look": "总穿赤色劲装，眉间有一道浅疤，握剑的手上满是老茧，腰间挂着她爹留下的旧剑穗", "sprites": {"normal": "chars/c2_normal.webp", "smile": "chars/c2_smile.webp", "sad": "chars/c2_sad.webp"}}, "c3": {"name": "江晚吟", "color": "#9FC0FF", "look": "总穿洗得发白的青衣，指尖沾着药草渍，脖子上挂着半块缺了的白玉佩", "sprites": {"normal": "chars/c3_normal.webp", "smile": "chars/c3_smile.webp", "sad": "chars/c3_sad.webp"}}, "c4": {"name": "苏砚", "color": "#9FC0FF", "look": "总穿洗得发白的灰衣，怯生生的，眼睛很大，指腹上有画符磨出来的茧", "sprites": {"normal": "chars/c4_normal.webp", "smile": "chars/c4_smile.webp", "sad": "chars/c4_sad.webp"}}, "c5": {"name": "燕轻舟", "color": "#9FC0FF", "look": "总穿玄色短打，头发总是乱蓬蓬的，腰间别着一把断了一半的铁剑", "sprites": {"normal": "chars/c5_normal.webp", "smile": "chars/c5_smile.webp", "sad": "chars/c5_sad.webp"}}, "c6": {"name": "阿蛮", "color": "#9FC0FF", "look": "总穿紫黑色的裙子，发间簪着红梅，脸上有一道从眉骨划到下巴的疤（是女主上次比武划的）", "sprites": {"normal": "chars/c6_normal.webp", "smile": "chars/c6_smile.webp", "sad": "chars/c6_sad.webp"}}, "c7": {"name": "温玉", "color": "#9FC0FF", "look": "总穿白色的执法服，发间簪着羊脂玉簪，看起来温温柔柔的，执法时却半点不留情", "sprites": {"normal": "chars/c7_normal.webp", "smile": "chars/c7_smile.webp", "sad": "chars/c7_sad.webp"}}, "c8": {"name": "谢流光", "color": "#9FC0FF", "look": "十六七岁的少年模样，总穿洗得发白的白衣，笑起来有两个梨涡，是女主前世的师弟", "sprites": {"normal": "chars/c8_normal.webp", "smile": "chars/c8_smile.webp", "sad": "chars/c8_sad.webp"}}, "c9": {"name": "叶惊秋", "color": "#9FC0FF", "look": "总穿粗布衣服，手上尽是锻造磨出来的茧，头发随便挽着，笑起来有两个虎牙", "sprites": {"normal": "chars/c9_normal.webp", "smile": "chars/c9_smile.webp", "sad": "chars/c9_sad.webp"}}, "c10": {"name": "柳如烟", "color": "#9FC0FF", "look": "总穿鹅黄色的弟子服，发间簪着金步摇，看起来娇滴滴的，其实心里门儿清", "sprites": {"normal": "chars/c10_normal.webp", "smile": "chars/c10_smile.webp", "sad": "chars/c10_sad.webp"}}, "c11": {"name": "孟晚棠", "color": "#9FC0FF", "look": "总穿黑色劲装，脸上蒙着面纱，笑起来很甜，说话却总带刺", "sprites": {"normal": "chars/c11_normal.webp", "smile": "chars/c11_smile.webp", "sad": "chars/c11_sad.webp"}}}, "assets_dir": "assets/", "scenes": [{"id": "ch001", "background": "bg/sect_day.webp", "checkpoint": true, "chars": [{"id": "c1", "pos": "left", "sprite": "normal"}], "script": [{"type": "narrate", "text": "草屑扎进膝盖的淤青里时，谢挽星正把压在身下的断剑往袖子里藏了藏。"}, {"type": "narrate", "text": "柴房里的霉味混着隔夜馊饭的酸气往鼻子里钻，铺在脚边的草席硬得像碎碗碴，她上半身被麻绳捆在房梁上，脚腕上的绳却早在进来半个时辰后就让她磨开半道口子。"}, {"type": "narrate", "text": "没人防着一个灵根下五品的扫茅房杂役，她装乖装了快两年，太知道这些看守的内门弟子有多眼高于顶，连多看她一眼都觉得脏了自己的眼。"}, {"type": "narrate", "text": "两天前她刚从茅房回来，就被执法堂的人按在房门口，说宗主独女的佩剑丢在了她屋里。她看着枕头底下那把镶着东珠的漂亮剑，连什么时候被放进去的都不知道。"}, {"type": "narrate", "text": "执法堂的长老连审都没审，直接定了她偷盗宗门重宝的罪，三天后废灵根，逐出九峰。"}, {"type": "narrate", "text": "她没争辩。争了也没用，仙门的规矩腌臜了千年，外门杂役的命比茅房的草还贱。"}, {"type": "narrate", "text": "手腕上的淤青是抓她的时候蹭在石阶上弄的，火辣辣地疼。"}, {"type": "narrate", "text": "她动了动被捆在梁上的手，指尖摸到袖口里断剑的凉意——那是一年前她在乱葬岗捡的，剑身锈得看不出原本的纹路，只有半截，比她平时砍柴的柴刀还钝，她捡回来当割草刀用了快一年，没人要，她就没上交。"}, {"type": "narrate", "text": "出乎意料地，那截铁剑今天摸起来有点烫。"}, {"type": "narrate", "text": "不像被太阳晒的那种暖，是烧到发红的铁块捂在怀里似的，烫得她指尖一缩。还没等她反应过来，那股热度顺着指尖往腕子里钻，紧接着她就听见了声音。"}, {"type": "narrate", "text": "不是从外面来的，是从断剑里面传出来的。"}, {"type": "narrate", "text": "先是一声极轻的剑鸣，像铁器撞在玉石上的动静，接着是无数细碎的嘈杂声，有刀剑砍在骨头上的闷响，有人的喊杀声，还有风刮过九座悬浮孤峰时的呼啸声。"}, {"type": "narrate", "text": "她以为是脑袋被执法堂的人打坏了，刚想甩甩头，就听见一个更清晰的声音，像贴着耳朵说的：“剑是被人放到你屋里的，他们要动碧落峰的人。”"}, {"type": "narrate", "text": "谢挽星猛地睁大了眼。"}, {"type": "narrate", "text": "她一个连主峰都没资格上的外门杂役，除了每个月上交茅房的清洁符，没人会跟她搭半句话，更别提什么碧落峰。可那个声音清清楚楚，不是幻听，是从她怀里的断剑里钻出来的。"}, {"type": "narrate", "text": "她不动声色地动了动脚，磨开的麻绳顺着脚腕滑到地上。"}, {"type": "narrate", "text": "看守的两个内门弟子靠在柴房门口打盹，其中一个还抱着个酒葫芦，满嘴的酒气喷出来，说话含糊：“也不知道为了个杂役，宗主这么兴师动众，平白耽误我练剑的时间。”"}, {"type": "narrate", "text": "另一个嗤笑，手里的剑鞘敲得地面咚咚响：“你懂什么，宗主这是给碧落峰那个小公主下马威呢。"}, {"type": "narrate", "text": "听说这小杂役上次帮沈砚秋挡了执法堂的鞭子，宗主这是要敲山震虎，让沈砚秋识相点，别总跟个外门杂役搅在一起。”"}, {"type": "narrate", "text": "沈砚秋。谢挽星的手指猛地攥紧了怀里的断剑。"}, {"type": "narrate", "text": "是那个碧落峰的继承人？宗主要对碧落峰动手？"}, {"type": "narrate", "text": "她以前只见过沈砚秋两次。"}, {"type": "narrate", "text": "一次是她扫完茅房下山，在巷子里被人抢了仅有的半块玉饼，是沈砚秋帮她抢回来的，穿一身洗得发白的碧色弟子服，发间簪着刚摘的白兰，左手腕内侧有一道月牙形的旧疤，递给她玉饼的时候还笑，说“以后有人抢你就喊我”。"}, {"type": "narrate", "text": "第二次是她被同门欺负，推下荷花池，是沈砚秋路过把她捞上来。"}, {"type": "narrate", "text": "那天秋雨下得急，池水凉得刺骨，推她的弟子早就跑没了影，是沈砚秋毫不犹豫跳下来，攥着她的手腕往池边拖，发间的那支白兰泡得花瓣全散了，浑身的弟子服透得能看见里衣，还把自己唯一的干外袍裹在她身上，回去就烧了三天，烧得迷迷糊糊还在喊她的名字。"}, {"type": "narrate", "text": "后来她才知道，沈砚秋在碧落峰的日子不好过，宗主早把她师父——也就是前任峰主——软禁在了后山，峰里的资源全被宗主的独女抢了去，连月例都发不下来，她穿得洗得发白，是因连像样的膏药都买不起，上次替她挡执法堂的鞭子，左胳膊现在还留着没消的疤。"}, {"type": "narrate", "text": "“宗主已经把碧落峰的外门执事全撤了，就等这小杂役被定了偷盗的罪，转头就治沈砚秋勾结外门、意图谋逆的罪，到时候碧落峰的东西全是宗主的。"}, {"type": "narrate", "text": "”抱酒葫芦的弟子打了个酒嗝，手里的剑鞘敲得更响，“我听说沈砚秋昨天还在峰门口跪了三个时辰，求宗主放了这个杂役，宗主连面都没露。”"}, {"type": "narrate", "text": "谢挽星的指尖猛地掐进了掌心里，贴身藏在里衣袋里的半块羊脂玉玦硌得她胸口发疼。"}, {"type": "narrate", "text": "那是她娘临终前塞给她的，上面刻着小小的“谢”字，十年前九峰宗主带人闯进她家，说她爹私藏禁术、意图谋反，当场就杀了她爹，把她家烧了个干净，她是被家仆偷偷抱出来，才捡了条命。"}, {"type": "narrate", "text": "她爹当年是九峰的客卿长老，发现了宗主偷偷修炼魔功，才招了杀身之祸，她的灵根下五品是爹当年给她改的，怕宗主干掉他这个独女，她才装了两年杂役，等的就是查清真相、报仇的机会。"}, {"type": "narrate", "text": "“我当年跟着峰主上过你家，你爹死的时候，手里还攥着你半块的玉玦。"}, {"type": "narrate", "text": "”断剑里的声音突然又响起来，比刚才清晰了些，“我是你爹的佩剑，叫断霜，当年那一战被他打碎，残魂封在剑里，十年了才醒过来。"}, {"type": "narrate", "text": "宗主要碧落峰，是因为你爹当年把谢家的藏宝图跟你娘的玉玦合成了一块，另一半就在沈砚秋她师父手里，也就是你爹的旧部周眠，宗主独女缺的那味淬魂丹的主药，就在藏宝图里。”"}, {"type": "narrate", "text": "谢挽星的呼吸猛地顿住了。"}, {"type": "narrate", "text": "原来她和沈砚秋的缘分，早就扯在上一辈的恩怨里。"}, {"type": "narrate", "text": "她本来想等三天后废灵根的时候，暴起杀了执法堂的长老，再慢慢查真相，可现在宗主要动碧落峰，动沈砚秋，她做不到袖手旁观。"}, {"type": "narrate", "text": "脚腕上剩下的麻绳已经被她磨得只剩薄薄一层，她脚趾轻轻一挣，绳子就彻底断了。她刚把脚踩在冰冷的草席上，就听见柴房外面传来一阵喧哗，有人喊：“碧落峰的沈师姐来了！"}, {"type": "narrate", "text": "她带着峰里的弟子闯执法堂的门口了！说要见谢挽星！”"}, {"type": "narrate", "text": "抱酒葫芦的弟子猛地站起来，酒都醒了大半：“你说什么？沈砚秋敢闯执法堂？”"}, {"type": "narrate", "text": "另一个弟子也慌了神，手忙脚乱地去拔腰里的剑：“快进去看看那杂役还在不在！要是跑了，宗主怪罪下来我们俩都吃不了兜着走！”"}, {"type": "narrate", "text": "木门被撞得哐哐响，谢挽星攥紧了怀里的断剑，指节泛白。沈砚秋的声音隔着门板飘进来，带着点跑急了的喘，却还是亮得吓人，像十年前递给她玉饼的时候一样：“谢挽星！你在里面吗？"}, {"type": "narrate", "text": "我来了，你别怕。”"}, {"type": "goto", "target": "ch002"}]}, {"id": "ch002", "background": "bg/sect_day.webp", "checkpoint": true, "chars": [{"id": "c1", "pos": "left", "sprite": "normal"}, {"id": "c4", "pos": "center", "sprite": "normal"}, {"id": "c8", "pos": "right", "sprite": "normal"}], "script": [{"type": "narrate", "text": "谢挽星攥着断了半截的竹扫帚站在外门院角，扫帚尖上沾的泥混着冰碴子往她破布鞋的缝隙里钻，三四个穿蓝外门服的弟子正围着她骂偷剑贼，唾沫星子喷到她冻得发皴的脸颊上，痒得她抬手蹭了一下，指尖沾了点冰碴子。"}, {"type": "narrate", "text": "带头的是个胖的，叫王虎，去年偷摸给人碧落峰外门弟子塞香囊被谢挽星撞见，记恨到现在，手指戳着她的胸口骂：“偷了宗门的传音剑还嘴硬？"}, {"type": "narrate", "text": "你一个扫洒的杂役，碰那灵剑的资格都没有，不是你偷的还能是谁？”"}, {"type": "narrate", "text": "谢挽星把扫帚往雪地里杵了杵，冻得通红的指尖懒得抬：“你们翻遍我柴房连个剑穗都没找着，倒是昨儿个王师兄塞给人姑娘的香囊，掉我这了，上面还绣着人家‘阿桃’的小名，要不要我现在掏出来给大家念念？"}, {"type": "narrate", "text": "”"}, {"type": "narrate", "text": "王虎的脸瞬间涨成猪肝色，身后跟着的两个弟子哄笑出声，他臊得慌，抬脚就踹谢挽星的扫帚，竹扫帚断了的茬子划在她的虎口上，拉出个血口子，谢挽星没躲，血珠滴在雪地上，晕开小小的红梅， she 把血蹭在破棉裤上，连眉头都没皱一下。"}, {"type": "narrate", "text": "“等著吧，明日演武场，宗主亲自下令废你灵根，把你逐出宗门，到时候看你嘴硬到什么时候！”王虎骂骂咧咧地带着人走了，周围的弟子都躲得远远的，看谢挽星的眼神像看个瘟神。"}, {"type": "narrate", "text": "谢挽星蹲下来，用破袖子擦了擦手背蹭到的血，柴房的门板被撬得稀烂，被褥扔在雪地里，翻得乱七八糟，连她藏半块剩馒头的小陶罐都被砸碎了。"}, {"type": "narrate", "text": "她蹲在雪地里翻了半天，翻出半块没被踩脏的馒头，塞进怀里——那是苏砚昨天偷偷给她留的，小徒弟画符画到半夜才想起给她留的，馒头皮上还按着个歪歪扭扭的小兔指甲印，是苏砚每次给她留吃食都爱做的小标记，怕被人抢了 her 的，要是知道被砸了，估计要蹲在柴房后面偷偷哭。"}, {"type": "narrate", "text": "她得查清楚剑到底是谁偷的，栽赃到她头上，明日的废灵根之刑，她挨不起。"}, {"type": "narrate", "text": "她前世是斩魔剑主，神魂碎裂转世，灵根就是她的命，没了灵根，她根本找不回散在九峰的剑意，更别谈推翻宗门、找回那些和她一起被冤枉的女修的公道了。"}, {"type": "narrate", "text": "外门的人都在传她偷了碧落峰的传音剑，可她连那把剑的影子都没见过。"}, {"type": "narrate", "text": "她能听懂所有剑的声响，所有剑在她耳朵里都是有呼吸的，只要她摸到那把剑，就能知道是谁拿了它，又为什么要把罪名按在她头上。"}, {"type": "narrate", "text": "夜幕降下来的时候，外门弟子都去了宗门的演武场看新晋弟子的比试，谢挽星揣着半块馒头，猫着腰往西北角的赃物库摸。"}, {"type": "narrate", "text": "她扫洒三年，摸熟了外门所有的路线，连巡逻弟子换岗的间隙都掐得准，可刚转过回廊，就听见前面有人说话，两个炼气期的巡逻弟子挑着灯笼，正往赃物库这边走。"}, {"type": "narrate", "text": "谢挽星心一沉，刚想往旁边的假山后面躲，就看见穿碧色弟子服的姑娘从回廊那头走过来，发间簪的白兰蔫了一半，袖子长得堆在手腕上，露出手腕内侧那道月牙形的旧疤——是沈砚秋。"}, {"type": "narrate", "text": "她今天怎么来外门了？谢挽星还没反应过来，就看见沈砚秋脚下故意踩了块松动的石头，哎哟一声摔在地上，手里的帕子掉在地上，滚出去老远。"}, {"type": "narrate", "text": "“那边的师弟！”沈砚秋的声音清凌凌的，刻意带着点慌，抬手指往东边的灵兽房方向指了指，“我刚才看见有只大老鼠窜到灵兽房那边了，你们快去看看，别让那东西咬了灵兽的腿！”"}, {"type": "narrate", "text": "两个巡逻弟子对视一眼，笑着打哈哈：“沈师姐怎么这么不小心？行，我们去看看，您也小心点。”"}, {"type": "narrate", "text": "沈砚秋点点头，蹲下来捡帕子，故意磨蹭到两个弟子的脚步声走远了，才抬眼往假山阴影这边瞟了一眼，耳尖红得像要滴血，把帕子往怀里揣了揣，摸出个碧玉令牌，捏着边角往假山的方向轻轻扔了扔，转身快步走了，走出十几步还回头瞥了一眼，怕人看见她的小动作。"}, {"type": "narrate", "text": "谢挽星接住那硬邦邦的令牌，是碧落峰的入门令，上面刻着剑纹，还沾着点沈砚秋常用的白兰香气，温温的，揣在怀里刚好能暖冻僵的手。"}, {"type": "narrate", "text": "她早就知道沈砚秋在帮她，六年前她在乱葬岗救的那个浑身是伤的小姑娘，如今是宗主身边的红人，每次她被罚，都是沈砚秋偷偷求情，给她塞修炼资源，可她不敢认，怕宗主对沈砚秋下手，更怕自己现在的身份连累她。"}, {"type": "narrate", "text": "她攥着令牌，猫着腰进了赃物库。赃物库里堆了乱七八糟的器物，都是外门弟子犯事罚没的，她摸黑挨个翻，指尖碰到冰冷的剑鞘时，耳朵忽然动了动。是那把传音剑。"}, {"type": "narrate", "text": "她把剑抽出来贴在耳边，先是呼呼的风声，紧接着是银铃晃动的叮当声，然后是轻柔的脚步声，穿的是缎面的绣鞋，踩在落叶上没什么声响。"}, {"type": "narrate", "text": "有个姑娘的声音带着哭腔，软软的：“爹爹要我这么做，我不能不这么做，对不住了……”然后是剑被塞进竹筐的闷响，还有指甲刮到剑柄的刺啦声。"}, {"type": "narrate", "text": "谢挽星的后颈瞬间竖起了汗毛，这个声音她太熟了，是宗主女儿柳如烟。柳如烟总穿鹅黄色的弟子服，发间簪金步摇，练剑的时候喜欢在剑柄上挂个缀着银铃的香囊，整个宗门只有她这么娇惯的做派。"}, {"type": "narrate", "text": "她摸到剑柄上有个指甲盖大的划痕，旁边沾了点银铃掉的金箔，还有好闻的龙涎香味——是宗主库房里才有的香料，只有柳如烟能随意进出。"}, {"type": "narrate", "text": "她又摸到剑鞘内侧有个极小的月牙形刻痕，是她前世剑鞘上特有的纹路，刻的是她第一个亲传弟子的名字。"}, {"type": "narrate", "text": "她指尖不小心抠到剑鞘的缝隙里，抠出来个小小的碎玉片，月牙形的，温温的，和她左手腕内侧的旧疤边缘刚好吻合。"}, {"type": "narrate", "text": "这玉片她前世刻过三个，分别给了三个亲传弟子，刻的时候特意把边缘磨出了个小缺口，柳如烟那个她磨成了和腕上疤一样的月牙形，说碧落峰以后交给她。怎么会在这里？"}, {"type": "narrate", "text": "她捏着碎玉片的指尖有些发颤，柳如烟偷剑栽赃她，却带着她给的信物，说明什么？说明柳如烟知道她的身份？还是说，柳如烟是被逼的？"}, {"type": "narrate", "text": "刚把剑放回原位，就听见外面有人喊她的名字，声音压得低，是苏砚的小动静。"}, {"type": "narrate", "text": "她出了赃物库，就看见苏砚躲在雪地里，灰衣的领子被雪打湿了，脸冻得通红，看见她出来，赶紧跑过来，塞给她个热馒头，手心冻得裂了的小口子渗着血珠。"}, {"type": "narrate", "text": "“师姐，我白天给执法堂送符，看见柳如烟偷偷来赃物库了，她走的时候掉了个东西。"}, {"type": "narrate", "text": "”苏砚摊开冻得发僵的手心，里面是个小小的银铃碎片，和她刚才在剑柄上摸到的一模一样，“我偷偷捡起来了，没敢跟别人说，在这等了你一个时辰。”"}, {"type": "narrate", "text": "谢挽星摸了摸她的头，把馒头塞回给她：“你回去吧，别乱跑，记得把门闩好。”"}, {"type": "narrate", "text": "苏砚点点头，踩着雪跑远了，身上洗得发白的灰衣晃来晃去，跑出十几步还回头看了一眼，怕她出事。谢挽星站在雪地里，抬头看天，月亮被云遮了一半，冷风刮得脸疼。"}, {"type": "narrate", "text": "明日演武场，宗主就要在所有人面前废她灵根，她现在有证据证明剑是柳如烟偷的，可她不敢说。柳如烟是宗主唯一的女儿，宗主手里捏着柳如烟母亲的命，柳如烟肯定是被迫的。"}, {"type": "narrate", "text": "就算她说出去，别人也不会信，只会说她诬陷宗主女儿，罪加一等。而且柳如烟是她前世最疼的弟子，她舍不得让她受罚，更舍不得让她继续被她爹拿捏。"}, {"type": "narrate", "text": "她摸了摸怀里沈砚秋给的碧玉令牌，指尖碰到凉丝丝的玉面，转身往柴房走。"}, {"type": "narrate", "text": "刚推开门，就看见断剑放在床头，泛着淡青色的光，一个穿洗得发白白衣的少年虚影浮在剑身上，头发上还沾着点竹屑——是她今天下午扫地的时候沾在剑上的。"}, {"type": "narrate", "text": "“师姐你怎么才回来！"}, {"type": "narrate", "text": "”谢流光飘过来，指尖戳了戳她的手背，凉飕飕的，掉了几片竹屑在她手背上，“宗主那个老东西已经在赃物库设了追踪禁制，刚才你碰传音剑触发了，他现在已经调了执法堂的弟子过来，要提前子时半个时辰把你抓去地牢，逼你交出来斩魔剑的断剑！"}, {"type": "narrate", "text": "”"}, {"type": "narrate", "text": "谢挽星的手一顿，窗外更鼓敲了两下，离子时还有半个时辰。"}, {"type": "narrate", "text": "她摸了摸腰间的断剑，指尖碰到冰凉的剑身，又摸了摸怀里温着的碧玉令牌，还有那块月牙形碎玉片，眼尾压着冷，像乱葬岗雪地里埋了三年的断刃，刚出鞘就要见血。"}, {"type": "narrate", "text": "她前世被穿心钉钉在九峰锁链上，魂飞魄散的时候都没怕过，怕的从来不是废灵根，是那些和她一样的女修，永远翻不了身，永远被仙门的高层踩在脚下，连修剑的资格都没有。"}, {"type": "narrate", "text": "她得活着，得把斩魔剑拼起来，得把那些冤枉人的事查清楚，得把沈砚秋、苏砚、柳如烟，还有那些被踩的女修都拉出来。"}, {"type": "narrate", "text": "院角的积雪被风卷着拍在窗棂上，像极了她前世被穿心钉钉在锁链上的那晚，雷声碾着云层滚过来，她摸了摸袖袋里沈砚秋塞的暖玉，指尖终于没那么凉了。"}, {"type": "narrate", "text": "她把柴房的破桌子推到门后面，把断剑握在手里，指节绷得发白，等着脚步声靠近。"}, {"type": "narrate", "text": "才没过多久，院外就亮起了好几盏灯笼，光晃得雪地发亮，有人扯着嗓子喊她的名字，语气里带着不耐烦：“谢挽星，出来！”"}, {"type": "goto", "target": "ch003"}]}, {"id": "ch003", "background": "bg/sect_day.webp", "checkpoint": true, "chars": [{"id": "c1", "pos": "left", "sprite": "normal"}, {"id": "c3", "pos": "center", "sprite": "normal"}, {"id": "c8", "pos": "right", "sprite": "normal"}], "script": [{"type": "narrate", "text": "茅草蹭得后颈发痒，谢挽星蹲在柴房最里的墙角，后背刚挨了三十戒尺的伤口还没结痂，被背后的干茅草扎得一阵阵疼，她指尖捏着半块没化的冷麦饼，那是昨天偷偷藏起来的，打算留给断剑里睡醒的谢流光当口粮，外门弟子的踹门声撞得门板哐哐响，震得梁上的灰簌簌往下掉，落了她一肩膀。"}, {"type": "narrate", "text": "三天限期的最后半日，她算准了执法堂卯时才开堂，提前半个时辰摸过来，要拿三个月前偷偷塞在柴堆底下的油纸包。"}, {"type": "narrate", "text": "那是她拼着挨三十戒尺的罚，从执法堂的旧案堆里抄出来的宗门交易账册副本，前半本记着李长老私运的灵矿数量，后半本墨迹晕开，是她用血混着朱砂写的宗主私通魔族的暗记——只要这本册子交出去，栽赃她偷斩魔剑的罪名不攻自破，灵根也保得住。"}, {"type": "narrate", "text": "她昨天还摸过那油纸包裹得严实，塞在柴堆最底下，上面还压了她攒了半月的碎柴，这会儿指尖往下掏，先碰到的是一层烧得发硬的焦炭，她指尖猛地顿住，柴堆被整个掏空，连最底下的土都被人浇了水铲走，连个纸边都没剩下。"}, {"type": "narrate", "text": "心一下子沉到崖底，连呼吸都停了半拍，还没等她反应过来，门板被一脚踹得晃了晃，两个执法堂弟子揪着她的衣领往外拖，她攥着空空的掌，剩下的半块麦饼掉在地上，碎渣簌簌往下掉。"}, {"type": "narrate", "text": "为首的那个斜睨她一眼，抬脚踢了踢她的小腿胫骨，语气里带着明明白白的恶意：“谢挽星，你藏在这里！宗主有令，提审提前，今日就废了你偷剑的贼胚子灵根。”"}, {"type": "narrate", "text": "青石板硌得膝盖疼，她被拖到提审堂的时候，正撞上堂前站着的人。"}, {"type": "narrate", "text": "沈砚秋今日穿的是碧色弟子服，下摆短了一截，露出半截洗得发白的里衣，发间簪着从山下摘的白兰，被穿堂风刮得晃来晃去，左手腕内侧的月牙形旧疤从袖口露出来一点，凉冰冰的，和她手腕上幼时被废剑划的那道疤，刚好对着。"}, {"type": "narrate", "text": "她心脏猛地跳了一下，随即攥紧了藏在袖里的断剑——那是谢流光在里面睡觉的宝贝，剑格上还刻着她当年随手刻的白兰花瓣，要是被宗主看见，又该说她是偷来的。"}, {"type": "narrate", "text": "执法长老坐在堂上，手里的惊堂木拍得震天响：“谢挽星，你可知偷盗宗门至宝，该当何罪？”"}, {"type": "narrate", "text": "她刚想开口说没偷，就看见沈砚秋侧过身，从怀里掏出个油纸包，指尖捏得发白，指节上还沾着点朱砂印，递到执法长老面前的时候，指尖轻轻发颤，只有离得近的谢挽星能看见。"}, {"type": "narrate", "text": "“长老息怒，这本册子是弟子昨日在练武场捡到的，瞧着像是外门杂役的物件，正要交去执法堂，恰巧赶上提审，或许是她昨日打扫练武场的时候不小心落下的。”"}, {"type": "narrate", "text": "执法长老拆开油纸包的瞬间，脸上原本带着的不耐烦的笑一下子僵住，指尖抖了抖，差点没拿稳那本册子——那上面的血字朱砂混着灵识，除了谢挽星没人能写出来，内容和之前她供述的偷藏的账册分毫不差。"}, {"type": "narrate", "text": "他偷偷抬眼看了一眼坐在上位的宗主，看见对方微微颔首，才顺着台阶往下走，语气都软了几分：“原来如此。”"}, {"type": "narrate", "text": "堂上安静了半炷香，宗主坐在上位，指尖敲了敲扶手上的虎头，眼尾扫过沈砚秋，又扫过谢挽星，语气听不出喜怒：“既是没有偷盗斩魔剑，偷藏宗门机密的罪，却是做实了。"}, {"type": "narrate", "text": "罚去后山扫地三年，即刻动身，不得留在宗门半步。”"}, {"type": "narrate", "text": "惊堂木拍下的瞬间，谢挽星听见沈砚秋的呼吸顿了一下。她知道这是宗主故意保的命——要是真按偷盗至宝的罪，早就被当众斩了，扫地三年，后山连个鬼影都少见，正好能神不知鬼不觉地处理掉。"}, {"type": "narrate", "text": "她没有辩解，弯腰接过那本册子，指尖蹭过沈砚秋的手背，对方的手凉得渗人，攥了油纸包一路倒是揣热了，暖得扎人。"}, {"type": "narrate", "text": "她抬起头，对上沈砚秋的眼神，那眼神里有她看不懂的情绪，像攒了六年的雨，压得人喘不过气，却又在看到她手腕上的疤时，猛地软了下来，像破了冰的春水。"}, {"type": "narrate", "text": "谢挽星低声道了句“多谢沈师姐”，声音压得极低，哑得像砂纸磨过，只有两个人能听见。"}, {"type": "narrate", "text": "沈砚秋没说话，只是塞了个瓷瓶到她手里，触手温温的，瓶身上画着细碎的白兰纹样，是治内伤用的丹药。"}, {"type": "narrate", "text": "她转身往堂外走的时候，碧色弟子服的下摆扫过青石板，发间的白兰落了一瓣在谢挽星脚边，沾着点刚摘的晨露，香得很。"}, {"type": "narrate", "text": "人群散了之后，谢挽星被人押着往后山走，刚转过提审堂的影壁，就被一双手拉进了旁边的暗巷。"}, {"type": "narrate", "text": "沈砚秋靠在爬满苔藓的青墙上，脸上还带着堂上那种温温柔柔的笑，指尖却把个油纸包塞到她怀里，里面是整本的交易记录，比刚才那本多了半本，记着宗主和魔族的联络暗号，还夹着两包磨得细细的药粉和两块碎银子，是她攒了半年的月例。"}, {"type": "narrate", "text": "“烧的那本是李长老放的，我提前抄了真的。"}, {"type": "narrate", "text": "”她的声音压得很低，眼睛盯着巷口的人影，不敢看谢挽星，指尖无意识地摩挲着自己手腕上的月牙疤，“后山的药庐有个姓江的药修，你要是冻疮疼得厉害，就说是我让你去的，她会给你药。"}, {"type": "narrate", "text": "还有，扫地的时候别去北边的崖边，那里有魔物出没。”"}, {"type": "narrate", "text": "谢挽星攥着怀里的油纸包，又摸了摸手里温的瓷瓶，看到她发间已经没了那朵白兰，想必是怕被人看见。"}, {"type": "narrate", "text": "她刚想说自己知道分寸，就看见沈砚秋抬起眼，目光扫过她的手腕，又扫过她腰上别的断剑，嘴唇动了动，终究没把“我找了你好多年”的话说出口。"}, {"type": "narrate", "text": "“你别一个人扛。”沈砚秋最后说了一句，舌尖顶了顶腮帮子，把翻涌上来的酸意压下去，转身就融进了巷口的光里，碧色的影子晃了晃，就看不见了。"}, {"type": "narrate", "text": "谢挽星站在暗巷里，指尖摸着断剑的剑身，里面传来谢流光睡意惺忪的声音：“当年你给内门的三个弟子刻平安符，每个碎片的边角都刻着月牙纹，那丫头手腕上的那道疤，和你当年刻碎平安符时被刻刀划的那道，位置都对着，你藏了六年的人，终于冒出来给你送账册了？"}, {"type": "narrate", "text": "”"}, {"type": "narrate", "text": "她没回答，只是指尖摩挲过断剑的剑格，那里刻着小小的白兰花瓣，是她当年随手刻的，和沈砚秋发间簪的那种一模一样。"}, {"type": "narrate", "text": "低头看手里沈砚秋塞的瓷瓶，瓶身上画着白兰的纹样，和她脚边那瓣落下的花，刚好对上。"}, {"type": "narrate", "text": "风卷着巷口的碎叶飘过来，她摸了摸脖子上的半块白玉佩，上面也刻着个小小的月牙，那是前世斩魔剑的剑穗碎片，也是当年沈砚秋被魔物追杀时，她塞给小姑娘的报酬。"}, {"type": "narrate", "text": "小姑娘当时攥着玉佩，眼睛亮得像浸了星星的泉，说“姐姐，我以后一定会找到你的”。"}, {"type": "narrate", "text": "后山的土路还沾着霜，她踩着枯枝往前走，掌心的瓷瓶还带着沈砚秋的体温。"}, {"type": "narrate", "text": "执法堂的人把她扔在扫地的竹扫帚边就走了，连个水都不给一口，临走前还踢了扫帚一脚，啐了一句“贼胚子，少扫一片叶子就饿你三天”。"}, {"type": "narrate", "text": "她把账册塞进怀里最贴的地方，刚要弯腰捡扫帚，就听见药庐的方向飘来苦药香，混着青峰特有的白芷和艾草的味道，飘得老远，和以前江晚吟偷偷塞给她金疮药时的味道一模一样。"}, {"type": "narrate", "text": "她知道那是江晚吟的地界，那个总穿洗得发白青衣的药修，每次她受罚偷偷塞给她的金疮药，都带着这股苦香，沈砚秋说的没错，她是真的会给她药。"}, {"type": "goto", "target": "ch004"}]}, {"id": "ch004", "background": "bg/sect_day.webp", "checkpoint": true, "chars": [], "script": [{"type": "narrate", "text": "谢挽星趴在后山禁制边缘的石缝里，指尖刚碰到埋在狗尾草下的断剑，怀里那截缺了半个剑刃的本命剑就嗡地震了一声，震得她肋下被戒律堂棍子凿出的旧伤突突跳，像有三只耗子在后腰里啃骨头。"}, {"type": "narrate", "text": "戒律堂给她的最后通牒还捏在袖袋里：三日后废灵根，逐出宗门。"}, {"type": "narrate", "text": "她那把被污蔑是从碧落峰偷来的断剑，是这破地方唯一肯认她的东西，刚才入山的时候断剑就在震，像渴了半辈子的酒鬼闻见了酒香，震得她心口发慌。"}, {"type": "narrate", "text": "她翻进来之前特意算过巡逻弟子换岗的间隙，可还是撞见了第二批人，两个扛着棍子的外门弟子骂骂咧咧从拐角过来，领头的脚边踢着个石子，擦着她藏身的狗尾草丛飞过去，草屑落了她一脸。"}, {"type": "narrate", "text": "她赶紧把断剑往怀里塞了塞，后背的冷汗顺着脊梁骨往下滑，禁制的凉波纹刚好扫过她的后颈，那是元婴期长老下的封印，上次她不知死活碰了碰，疼了三天拿不住扫帚，手背现在还留着道浅疤，像个小月牙。"}, {"type": "narrate", "text": "等人走远了，她才敢继续往前爬。后山的土是红的，混着碎了的断剑刃，她以前扫地的时候偷偷捡过几片，摸着比以前在外门扫的凡铁韧，断剑挨着那些碎刃的时候总是发烫，像在跟老熟人打招呼。"}, {"type": "narrate", "text": "爬过三丛灌木，她的膝盖被藏在土里的碎刃划了道小口子，渗出血珠，可断剑在她怀里发着热，那点疼也不觉得怎样。"}, {"type": "narrate", "text": "她能听见剑鸣声了，不是那种细碎的、像虫子在叫的声音，是沉得像山体的低响，从地底透上来，震得她脚踩的土都在颤，连脚底板都麻酥酥的。"}, {"type": "narrate", "text": "她摸到那块被雷劈得焦黑的石头，石头缝里卡着个巴掌大的金属片，泛着冷蓝色的光，边缘还带着细碎的裂纹，像是什么东西断下来的碎片。"}, {"type": "narrate", "text": "她指尖刚碰到那金属片，怀里的断剑突然炸了似的嗡鸣，震得她差点拿不住。"}, {"type": "narrate", "text": "指甲下意识抠进了断剑上个月被戒律堂砸出来的缺口，那是她护着剑的时候被人按着砸的，血珠渗出来，滴在那金属片上，那碎片突然亮得晃眼睛，九座山的剑鸣声同时撞进了她的脑子里。"}, {"type": "narrate", "text": "不像平时听见的断剑哭诉求饶的声音，是千万把剑撞在一起的锐响，是有人在烽火里喊“锁住魔渊”，是甲胄碰撞的声响，是锁链崩断的脆响。"}, {"type": "narrate", "text": "她看见九座亮得晃眼的峰连在一起，银色的锁链像巨蛇缠在峰腰上，穿碧色衣服的女修跟穿赤色劲装的男修御剑擦肩而过，连药峰上的小药童都能踩着自己的药筐飞着追蝴蝶。"}, {"type": "narrate", "text": "然后画面猛地碎了，锁链一根一根崩断，九座峰像断了线的风筝往天上飞，一道血淋淋的剑光劈在她胸口，本命剑断成两截，神魂碎成九片，像蒲公英似的散进了九座峰里。"}, {"type": "narrate", "text": "有个穿白衣的小少年哭着喊“师姐！”，还有个带着笑的声音，苍老得像隔着千年的雪，说“挽星，锁链还没断，剑意都在，你来找我们啊”。"}, {"type": "narrate", "text": "指尖的暖流顺着胳膊往心口窜，她肋下的旧伤居然不疼了。她攥着那块还发烫的碎片，想起师父死前塞给她断剑时说的话：“星儿，剑在人在，剑亡人亡。"}, {"type": "narrate", "text": "”当时她还不懂，为什么师父握着断剑的手在抖，为什么宗门的人闯进来的时候，看她的眼神像看一个死物。"}, {"type": "narrate", "text": "她想起偷剑那日戒律堂的人搜她身，把那断剑扔在地上踩，说“贱婢也配碰碧落峰的剑”，想起她翻过宗门禁书的时候，上面写着“上古仙魔大战，九峰剑主殉道，魔渊封印”，可那页被人撕了，只留下个半片“九”字的边角。"}, {"type": "narrate", "text": "原来的碎片突然拼在了一起——什么仙魔大战，什么魔头，都是编的。有人故意弄断了锁链，把守峰的剑主污名成魔头，把九峰里的剑意一点一点抽走，才让九座峰飘成了现在这副半死不活的样子。"}, {"type": "narrate", "text": "宗门改过的史书里连“九峰相连”四个字都没提，所有的剑修典籍都被烧了大半，女修连摸顶级剑诀的资格都没有，为的就是让没人记得当年的事，让没人能集齐九道剑意，把锁链接回去。"}, {"type": "narrate", "text": "“那边有没有人？”"}, {"type": "narrate", "text": "谢挽星猛地抬头，下意识把断剑往怀里塞，就看见个穿洗得发白的青衣的女修站在三米外，手里举着个药锄，药篓歪在胳膊上，碎星草撒了半篓。"}, {"type": "narrate", "text": "对方指尖沾着药草的绿渍，发间别着朵刚采的碎星花，脖子上的半块缺角的白玉佩晃得人眼熟，正瞪着乌溜溜的眼睛看她，见她不说话，又补了一句：“我听见这边有剑鸣，你刚才是碰了那锁链碎片？”"}, {"type": "narrate", "text": "谢挽星刚想编瞎话说自己是扫洒的来捡扫帚，就看见对方从怀里掏出个白瓷药瓶，扔到她怀里，药瓶滚到她手边，撞在手背的伤口上，疼得她嘶了一声。"}, {"type": "narrate", "text": "那药瓶上画着药峰的青竹纹，是药峰独有的清创散，她上次被戒律堂打伤，求了药峰的外门弟子三天，都没人舍得给她一瓶。"}, {"type": "narrate", "text": "女修的目光扫过她怀里的断剑，又扫过她不知什么时候露在衣襟外的一角玉佩，嘴唇动了动，声音压得更低：“别捡那碎片了，这后山到处都是巡逻弟子的暗桩，你拿了它，戒律堂能追杀你到落魂涯。”"}, {"type": "goto", "target": "ch005"}]}, {"id": "ch005", "background": "bg/cliff.webp", "checkpoint": true, "chars": [{"id": "c1", "pos": "left", "sprite": "normal"}, {"id": "c8", "pos": "center", "sprite": "normal"}], "script": [{"type": "narrate", "text": "破草席吸了她掌心的血，腥甜味混着陈年霉味往鼻子里钻，谢挽星咬着牙把指尖往断剑的裂口上按。这是外门最偏的杂役屋，漏风的窗棂刮着雪粒子，打在脸上比执法堂的戒尺还疼。"}, {"type": "narrate", "text": "她把断剑攥得死紧，昨天在洗剑池边听见这破铁片子嗡了半宿，像噎了半辈子的老人在哭，偏生震得她耳膜疼，脑仁里塞满碎光影，全是她没见过的穿玄甲的修士举着剑，嘶声喊“谢挽星”的名字。"}, {"type": "narrate", "text": "断剑突然烫得吓人，裂口里浮出个半透明的少年影子，穿洗得发白的白衣，发梢还沾着点碎冰，笑起来俩梨涡，和十六岁那年她在乱葬岗捡到他的时候一模一样。是谢流光，在断剑里陪了她十六年的残魂。"}, {"type": "narrate", "text": "“师姐又作死，”少年影子的指尖虚虚碰了碰她掌心的伤口，声音轻得像雪粒子砸在瓦上，“指尖的伤刚结痂，知不知道疼？”"}, {"type": "narrate", "text": "谢挽星没应，把断剑举到眼前，指腹蹭过剑身上暗红的锈迹，那是十年前她被栽赃偷剑时，执法堂弟子砍出来的印子：“你最好现在就交代，那些影子里的人是谁，喊的谢挽星是谁，别跟我装哑巴。”"}, {"type": "narrate", "text": "谢流光的笑意淡了点，梨涡收了，身影晃了晃：“你记着，我是你师弟，这就够了。”"}, {"type": "narrate", "text": "“师弟？"}, {"type": "narrate", "text": "”谢挽星嗤笑，后槽牙的酸意往上顶，昨天她听剑的时候，分明听见碧落峰的剑意里夹着沈砚秋的哭腔，说宗主把她关在后山思过崖，还说宗主和魔物勾结，要把能听剑的杂役杀了，拿去补上古锁链。"}, {"type": "narrate", "text": "她把这话抖给谢流光听：“你既然说是我师弟，怎么连碧落峰沈峰主的女儿被关在后山都不知道？昨天执法堂的弟子去搜她居所，抢了她爹留给她的归元剑谱，你也不管？”"}, {"type": "narrate", "text": "谢流光的脸色白了。指尖的影子晃了晃，像被风吹的烛火。他本来不想说的，想让她忘了那些血，忘了站在九峰之巅时喊过她的名字。"}, {"type": "narrate", "text": "可她偏生能听剑，能听见碧落峰剑意的哭，赤峰剑意的怒——躲了十六年，终究是躲不过去的。"}, {"type": "narrate", "text": "“好，我跟你说。”谢流光的声音哑了，身影慢慢凝实了点，指尖点了点断剑的剑身，“我叫谢流光，是你前世的小师弟。"}, {"type": "narrate", "text": "前世你是守九峰的斩魔剑主，我叫你师姐，跟着你打了十年仙魔大战，最后锁链崩的时候，我们被叛徒暗算，你神魂碎裂，我被封在这把剑里，陪了你十六年。”"}, {"type": "narrate", "text": "窗外的雪粒子忽然停了，风卷着远处锁链的嗡鸣往屋里钻，谢挽星的后槽牙咬得发酸。她小时候被人骂野种，骂她是偷剑的贼，说她娘是魔修，所以她才生来晦气，只能当外门杂役。"}, {"type": "narrate", "text": "原来那些骂她的话全是假的，是她把剑偷回来的？是那帮杂碎抢了她的剑，还要把脏水泼到她身上？"}, {"type": "narrate", "text": "“叛徒是谁？”她的声音稳得自己都怕。"}, {"type": "narrate", "text": "谢流光垂下眼，视线落在她手腕的月牙形旧疤上——那是前世她给三个亲传弟子的信物，刻在每个人手腕内侧的剑纹，如今碎成了四块，散在四个她这辈子还没见过的人身上：“如今的玄暮宗主，萧沉。"}, {"type": "narrate", "text": "当年就是他勾结魔族，暗算的你，把上古斩魔剑折断，把你神魂打碎，又改了史书，说你勾结魔族，污了所有守峰修士的名声。"}, {"type": "narrate", "text": "他还杀了碧落峰的前任峰主，夺了碧落峰的剑意，把沈砚秋当成控制碧落峰的筹码，养在身边当人质。"}, {"type": "narrate", "text": "你神魂里的碎片散在九峰，每座峰的剑意里都有一块，只有集齐了，你才能恢复全部实力，才能打开上古锁链，重建完整的九州。”"}, {"type": "narrate", "text": "手腕上的月牙印凹凹凸凸，是小时候在柴房挨饿时的旧伤。那次穿碧色裙子的小丫头塞给她半块玉珏，说“给你吃糖”，一口咬在了同一个位置。"}, {"type": "narrate", "text": "后来紫裙子的小霸王抢馒头，咬的是手腕另一侧，说“以后你是我罩着的”。还有那次替人顶罪被打得扔在巷子里，穿鹅黄衣服的小姐塞伤药，腰上的玉佩碎了一半，形状和这疤严丝合缝。"}, {"type": "narrate", "text": "原来那都是前世刻下的印子，是她亲手给三个徒弟的信物，碎了，散在了她们身上。"}, {"type": "narrate", "text": "“萧沉已经知道你能听剑了，”谢流光的声音把她拉回现实，“三日后宗内大典，他就要来废你的灵根，拿你的神魂补锁链。"}, {"type": "narrate", "text": "还有魔族的余党，知道你是斩魔剑主转世，想借你的手打开锁链，放魔物出来，你要是落在他们手里，比死在萧沉手里还惨。”"}, {"type": "narrate", "text": "谢挽星没说话，把断剑从地上捡起来，指尖蹭过剑鞘上的裂痕。断剑的壳子里还浮着点淡金色的光，是刚才她喂的血引出来的剑意，和她脑仁里那些碎光影里的剑芒一模一样。"}, {"type": "narrate", "text": "她站起来拍了拍身上的灰草屑，推开门，雪粒子忽然又刮了起来，打在脸上凉得像醒神的酒。远处九座悬浮峰隔着锁链若隐若现，风里飘着若有若无的剑鸣，像无数人在喊她的名字，喊她归位。"}, {"type": "narrate", "text": "混着风的声音里，她还听见青峰的药香，听见赤峰的剑风，听见黄峰的铃铛响——那些剑意还在，还在等她回去，等她把断了千年的锁链重新接上。"}, {"type": "narrate", "text": "“师姐，”谢流光的影子飘在她耳边，声音里带着点笑，和前世最后一眼，他挡在她面前被魔物穿心的时候，声音一模一样，“这次我陪你再战一次，这一次，我们一定能把所有脏东西都扫干净。”"}, {"type": "narrate", "text": "谢挽星把断剑别在腰上，指尖蹭了蹭剑鞘上的裂痕，嗯了一声。她想起乱葬岗的风，想起洗剑池的冰水，想起执法堂的戒尺，想起沈砚秋上次塞给她的碧落峰令牌，藏在怀里，还带着点兰花的香气。"}, {"type": "narrate", "text": "她不是孤身一人，前世有并肩的师弟，今世有藏在暗处给她塞药的人，有偷偷给她塞修炼资源的碧落峰小公主，有抢她馒头却护着她的紫衣丫头，有给了她伤药的鹅黄衣小姐。"}, {"type": "narrate", "text": "远处的玄暮峰大殿亮起了灯，像是有人醒着，等着三日后的大典。谢挽星摸了摸怀里硬邦邦的令牌，后槽牙咬了咬，之前她总躲，总想着熬过这三年就能出宗门，就能找个没人认识的地方过日子。"}, {"type": "narrate", "text": "现在才知道，这天下就没有她能躲的地方，那些躲在她背后的人的债，该她去讨了。"}, {"type": "narrate", "text": "风卷着雪粒往她领子里钻，她扯了扯身上洗得发白的灰衣，抬脚往柴房走——明日起她要开始攒灵石，要去九峰里找自己的神魂碎片，要去把沈砚秋从思过崖捞出来，要把萧沉勾结魔族的证据公之于众。"}, {"type": "narrate", "text": "断剑在她腰上轻轻嗡了一声，像在应和她。谢流光的声音很轻，飘在风里，只有她能听见：“师姐，我信你。”"}, {"type": "narrate", "text": "她张了张嘴，想说什么，最终只把脖子上的灰领子扯高了一点，挡住往脖子里钻的雪。乱葬岗的风，洗剑池的冰水，执法堂的戒尺，前世能守住的九峰——她什么时候让信任她的人失望过？"}, {"type": "narrate", "text": "今世一样能守住。"}, {"type": "goto", "target": "ch006"}]}, {"id": "ch006", "background": "bg/cliff.webp", "checkpoint": true, "chars": [{"id": "c3", "pos": "left", "sprite": "normal"}], "script": [{"type": "narrate", "text": "谢挽星蹲在药峰后山的药圃墙根，裤腿上沾了半干的泥点子，手里攥着的杂粮饼硬得像块压仓的石头，她咬了两下没咬动，干脆揣回怀里，耳朵贴上了粗陶墙缝。"}, {"type": "narrate", "text": "药峰的药香混着几个女修压低的说话声飘出来，江晚吟的声音带着点疲累：“宗主又给我派了活，三天内要炼一百颗筑基丹，完不成就罚去思过崖挨三十雷鞭。"}, {"type": "narrate", "text": "”谢挽星指尖猛地掐进掌心里，江晚吟后背上次替她挨的雷鞭还没好全，那地方每回阴天就钻心疼，这三十鞭下去，非得打散了她一半修为不可。"}, {"type": "narrate", "text": "她正琢磨着要不要翻进去给江晚吟送点疗伤的草药，忽然听见“锵”的一声脆响，像是重剑砸在青石板上的动静，紧跟着就是几声惊呼，有人喊“周师姐！”"}, {"type": "narrate", "text": "药圃附近的药修弟子都噤了声，谢挽星顺着墙缝往里面看，就见青石板路上躺着个穿碧色弟子服的女子，左手按着右胳膊，脸色惨白如纸，手指缝隙里渗出来的血都是黑的，她脚边扔着一柄通体碧绿的短剑，剑身上还沾着未干的毒液。"}, {"type": "narrate", "text": "江晚吟蹲在旁边，指尖按着周芷的脉门，眉头皱得死紧，身后站着几个药修弟子，谁都不敢上前。"}, {"type": "narrate", "text": "她看见江晚吟领口露出来的后颈上，雷鞭的疤痕还没消，红得发亮，刚才起身的时候还微微蹙了眉，显然是后背的伤牵扯到了。"}, {"type": "narrate", "text": "周芷是宗主的外甥女，跋扈得很，上个月才把一个顶嘴的药修弟子抽得半个月下不来床。"}, {"type": "narrate", "text": "她醒过神来的第一件事就是抬脚踹在江晚吟的心口上，踹得江晚吟往后趔趄了一步，腰撞在身后的竹架上，撞得竹叶簌簌往下掉，嘴角渗出血来：“废物！你炼的什么破丹药，把我的剑淬毒了？"}, {"type": "narrate", "text": "救不活我，我姨父第一个拿你问罪，把你扔去乱葬岗喂魔！”江晚吟咬着唇没说话，指尖还在颤抖，她昨天刚去求宗主开解药库的门，宗主说除非她三天内炼出一百颗上品筑基丹，不然钥匙想都别想。"}, {"type": "narrate", "text": "她刚想说自己没炼过淬毒的丹药，周芷的脚又踹了过来，正正踹在她按着脉门的手腕上，疼得她手指一麻，血蹭在了周芷的碧色弟子服上，晕开一小片暗红。"}, {"type": "narrate", "text": "“你个贱人也敢碰我？”周芷尖叫着又踹了她一脚，“我告诉你，你爹当年勾结魔修的罪名一辈子都洗不白，要不是我姨父可怜你，你早就去乱葬岗跟你爹娘团聚了，还敢跟我摆谱？"}, {"type": "narrate", "text": "我今天就把话放这了，你今天要是不给我解毒，我就告诉我姨父，说你故意给我下毒，把你的丹方全部烧了，让你们江家彻彻底底绝后！"}, {"type": "narrate", "text": "”这话像刀子似的扎在江晚吟心上，她手指蜷了蜷，没躲第三脚，声音哑得厉害：“周师姐要是觉得我炼的丹药有问题，不如去宗主面前对质，看看是你私自闯禁地偷拿碧鳞蛇毒淬剑对，还是我没给你炼丹对。"}, {"type": "narrate", "text": "”"}, {"type": "narrate", "text": "这话一出，周芷的脸瞬间白了。她上月偷拿了宗主藏在禁地的碧鳞蛇毒淬剑，就是为了参加下月的宗门大比，这事要是捅到宗主面前，她不仅得被罚三十雷鞭，还得关三年水牢。"}, {"type": "narrate", "text": "她气得浑身发抖，伸手就要扇江晚吟的耳光，指尖都擦到了江晚吟的脸颊，江晚吟闭着眼没躲。"}, {"type": "narrate", "text": "就在这时候，墙根那边忽然传来“啪嗒”一声轻响，像是有什么东西掉在青石板上。"}, {"type": "narrate", "text": "周芷的动作猛地顿住，转头看向墙缝，就见墙根底下躺着一株碧绿色的药草，叶子边缘带着细锯齿，是她从来没见过的品种。刚要开口骂，她就看见墙缝里闪过一抹红，是左手虎口上的朱砂痣，红得扎眼。"}, {"type": "narrate", "text": "她浑身一僵，瞬间想起十几年前去过江家，见过江晚吟身边那个扎羊角辫的小丫鬟，那丫鬟的虎口上就有一模一样的朱砂痣，是江晚吟亲自给她点的，说可以保平安。"}, {"type": "narrate", "text": "她当时还笑那小丫鬟长得丑，江晚吟还跟她吵了一架。"}, {"type": "narrate", "text": "“墙根有人？”周芷的声音顿时尖利起来，她顾不得胳膊上的疼，指着墙根喊，“你们俩，过去给我把人抓出来，我倒要看看，是谁敢在药峰偷窥！"}, {"type": "narrate", "text": "”两个药修弟子应声往墙根跑，谢挽星早就蹲着往后退了，脚踩在落叶上连个声响都没敢出，她刚才故意露了朱砂痣，就是知道周芷见过她，周芷自己偷拿禁药的事见不得光，不敢把今天的事闹大，更不敢说看见了她，不然宗主一查，第一个查到她自己头上。"}, {"type": "narrate", "text": "两个弟子翻过墙去找了半圈，回来禀报说墙根那边除了几棵杂草什么都没找到。"}, {"type": "narrate", "text": "周芷的脸青一阵白一阵，她毒已经发得厉害了，胳膊已经开始发麻，知道再耗下去自己要栽，只能狠狠瞪了江晚吟一眼：“江晚吟，你今天要是不把筑基丹炼出来，我就让你好看！"}, {"type": "narrate", "text": "”说完带着人骂骂咧咧地走了，临走之前还回头往墙根的方向看了一眼，眼神阴沉得像淬了毒。"}, {"type": "narrate", "text": "药圃里一下子就静了下来，剩下的几个药修弟子都散了，江晚吟还蹲在地上没动。"}, {"type": "narrate", "text": "她伸手捡起脚边那株碧心草，指尖刚碰到叶子就顿住了——这碧心草的培育方法是她当年特意教给星儿的，叶子边缘要削出细锯齿，浇水要用晨露浇，不能多也不能少，整个药峰只有她和星儿知道这个法子，旁的药修种的碧心草叶子都是圆的。"}, {"type": "narrate", "text": "她攥着药草的手紧了紧，看见药草上还沾着没干的晨露，还有一点杂粮饼的碎渣，是星儿最爱吃的杂粮饼的味道，她昨天才给星儿留了一块，星儿总说自己炼丹熬不住饿，天天揣着杂粮饼。"}, {"type": "narrate", "text": "她的喉咙像被什么堵住了，眼泪砸在药草的叶子上，把上面的露珠都砸得滚了下来。"}, {"type": "narrate", "text": "她记得星儿左手上有个朱砂痣，去年星儿采药的时候被树枝划伤了手腕，疤现在还留在虎口上，刚才扔药草的那只手，虎口处好像也有一道浅浅的疤。"}, {"type": "narrate", "text": "她抬头看向墙外，风把后山的竹叶吹得沙沙响，她好像看见十多年前那个扎着羊角辫的小丫头，举着碧心草跑过来，裙摆沾了泥，嘴里还喊着“小姐我种出来了”，眼睛亮得像星星。"}, {"type": "narrate", "text": "墙外的谢挽星蹲在树丛里，听见里面的脚步声远了才敢挪动身子。她的左手虎口处被树枝刮破了，血蹭在朱砂痣上，把痣的颜色染得更深了。"}, {"type": "narrate", "text": "她刚才看见江晚吟掉眼泪了，江晚吟的腰比上次她见的时候细了好多，领口露出来的疤痕一道接着一道，都是雷鞭和旧伤的痕迹。"}, {"type": "narrate", "text": "她攥了攥怀里剩下的半块杂粮饼，上次她留的蜜沾在上面，暖了一路，现在还软乎乎的。"}, {"type": "narrate", "text": "她知道现在不是相认的时候，宗主的眼线到处都是，周芷 already 盯上江晚吟了，她得等，等她把宗主陷害江家的证据找齐，等她把江晚吟身上的伤都养好，等她能光明正大走到江晚吟面前，不用再躲躲藏藏，不用再让江晚吟替她挨雷鞭，不用再让江晚吟受欺负。"}, {"type": "narrate", "text": "她摸了摸怀里揣着的其他几株碧心草，是她这些年跑遍了三个山脉才找齐的，本来想等哪天见面了，亲手交给江晚吟，告诉她自己记得当年说的话，记得江晚吟教她种的每一株药草，记得江晚吟说的“星儿要平平安安的”。"}, {"type": "narrate", "text": "她最后看了一眼药圃的方向，转身往自己的外门弟子宿舍走，风把她的衣角吹得晃了晃，像当年那个跟着江晚吟跑的小丫头的裙摆。"}, {"type": "goto", "target": "ch007"}]}, {"id": "ch007", "background": "bg/sect_day.webp", "checkpoint": true, "chars": [{"id": "c7", "pos": "left", "sprite": "normal"}, {"id": "c8", "pos": "center", "sprite": "normal"}], "script": [{"type": "narrate", "text": "谢挽星蹲在偏房的土灶边擦剑，断剑上的缺口蹭过粗布，锈屑簌簌掉在灶台上，像把千年积的灰都抖了出来。灶里没生火，冷风从破窗缝钻进来，刮得她耳尖发疼。"}, {"type": "narrate", "text": "“密库的锁是当年剑主亲手铸的，只有执法长老的令牌能开。”谢流光的声音在断剑里发闷，像隔着一层水，“我上次飘出去的时候看见宗主带人往密库里搬箱子，封条上盖的是勾结魔族的暗印。”"}, {"type": "narrate", "text": "谢挽星擦剑的手顿了顿。她已被栽赃偷了碧落峰的镇峰宝剑，三日后就要被废去灵根赶出宗门，连外门弟子的身份牌都要被收走，别说进密库，她连执法堂的门都靠近不得。"}, {"type": "narrate", "text": "她把断剑别在腰后，拍了拍粗布衣下摆的灰，推开门往外走。"}, {"type": "narrate", "text": "外门的扫帚横在墙根，她顺手拎了一把，低着头往执法堂的方向去，路过演武场的时候，几个内门弟子凑在一块儿说笑，扫帚帚毛扫过青石板，带起的灰迷了他们的眼，他们骂了一句，也没多看她这个扫洒杂役一眼。"}, {"type": "narrate", "text": "梅林绕在执法堂后面，她找了个背风的石头蹲下，把扫帚横在腿上，假装在拣枯枝。"}, {"type": "narrate", "text": "风卷着白梅瓣往她脸上扑，她抬手拂开，就看见温玉穿了一身素白的执法服走过来，发间的羊脂玉簪晃得稳，袖口绣着的执法堂云纹在日光下亮得扎眼。"}, {"type": "narrate", "text": "温玉是执法长老的独女，从小被宠得金尊玉贵，上次她因为擅闯演武场被罚跪，还是温玉路过，说了一句“外门杂役不得擅入演武场，带下去，下次再犯重罚”，才免了她三十棍的责打。"}, {"type": "narrate", "text": "温玉走到她面前三步远的地方停了，左右看了看没人，才从袖子里摸出一枚令牌，往她怀里一塞，指尖凉得吓人，还沾着点未干的墨，袖口蹭了点墙灰。“执法堂的令牌，我爹昨天闭关，我从他书房拿的。"}, {"type": "narrate", "text": "”她的声音压得很低，眼睛盯着地面的梅瓣，不敢看谢挽星，攥着执法服袖口的指节泛得发白，“密库在执法堂后面的山洞里，有两个守门的弟子，丑时三刻会换岗，那时候进去最保险。”"}, {"type": "narrate", "text": "谢挽星攥着怀里的令牌，铜质的边硌得掌心生疼，还带着点温玉指尖的梅香。她抬头看温玉，温玉的嘴唇抿得发白，左耳尖红得快要滴血，左脸颊露出个浅浅的梨涡，是每次撒谎的时候才会有的反应。"}, {"type": "narrate", "text": "“你爹知道？”谢挽星问。"}, {"type": "narrate", "text": "温玉摇了摇头，又快速点了点，喉结滚了滚，像是压着什么情绪：“我偷翻了他的暗格，看到了当年谢峰主的案宗，我爹当年是主审，佘锋——”她说到宗主名字的时候顿了顿，声音发颤，“他逼我爹改了证词，把通魔的罪名扣在谢峰主头上。"}, {"type": "narrate", "text": "我爹这些年一直良心不安，但他不敢说，佘锋手里攥着整个执法堂的把柄。”"}, {"type": "narrate", "text": "风忽然大了些，温玉往后退了一步，装作打哈欠的样子，抬手揉了揉眼睛，音量提了些：“还有，你这几天别乱跑，省得被人抓去当替死鬼。要是敢偷执法堂东西，我第一个办你。"}, {"type": "narrate", "text": "”说完她转身就走，执法服的衣摆扫过地上的梅瓣，发间的羊脂玉簪晃了晃，没回头，走了两步又偷偷侧头看了一眼谢挽星的方向，被风卷起的梅瓣扑了她一脸。"}, {"type": "narrate", "text": "谢挽星坐在石头上没动，掌心攥着那枚令牌，直到边角的铜纹硌得掌心生疼，才松开手。"}, {"type": "narrate", "text": "令牌上还带着温玉指尖的凉意和一点淡梅香，她低头看，令牌的边缘被磨得发亮，想来温玉在手里攥了很久才敢给她。"}, {"type": "narrate", "text": "丑时三刻果然没人，谢挽星拎着扫帚晃到执法堂后面的山洞，守门的两个弟子果然在打瞌睡，脑袋一点一点的。"}, {"type": "narrate", "text": "她把断剑抽出来半寸，剑身上残留的剑意轻轻震了一下，那两个弟子腰间的佩剑同时嗡鸣了一声，其中一人的剑穗晃了晃，差点掉下来，他猛地抬头，左右看了看，嘟囔了一句“风真大”，又低下了头。"}, {"type": "narrate", "text": "密库的门被她用令牌开了，铁门发出沉闷的吱呀声，里面飘出来陈旧的檀香气，混着一股极淡的腥甜味。谢挽星吸了吸鼻子，那味道和她前世战死时闻到的魔气味一模一样，让她胃里有点发紧。"}, {"type": "narrate", "text": "她走进去，转身把门掩上，断剑在腰里发烫，谢流光的声音带着点急：“往最里面的暗格里走，宗主把他和魔族往来的证据都放在那里。”"}, {"type": "narrate", "text": "暗格在密库的最里面，被她用一块砚台压着，上面落了薄薄的一层灰。"}, {"type": "narrate", "text": "她伸手把砚台拿开，暗格里面放着厚厚的一沓书信，最上面的一封写着“佘锋亲启”，落款是魔族长老的印，还有一本账本，封皮上写着“碧落峰灵脉册”，她翻开第一页，就看见写着“前任峰主谢明昭，于仙魔大战后第三年暴毙，实为佘锋下毒，嫁祸魔族，碧落峰如今由佘锋掌控，灵脉收益三成上缴魔族，换魔兵相助，待锁链崩断，便攻入九州，重掌魔界”。"}, {"type": "narrate", "text": "谢挽星捏着账本的手紧了紧，指节泛出青白。她指尖碰到账本封皮的瞬间，耳尖那道前世战死时被魔气灼出来的旧疤突然发烫，断剑在腰里震得发麻，谢流光的魂影晃得更淡了，声音轻得像快碎掉：“……"}, {"type": "narrate", "text": "当年他们也是这么栽赃峰主的。”"}, {"type": "narrate", "text": "她把书信和账本往怀里塞，指尖不小心碰了暗格的机关，厚重的铁闸突然从头顶砸下来，风声贴着耳尖过去，她侧身躲的时候胳膊还是被划了一道大口子，血瞬间渗出来，滴在断剑的剑身上。"}, {"type": "narrate", "text": "“挽星！”谢流光的魂影突然从断剑里飘出来，透明的身子挡在她面前，铁闸砸在他身上，他的魂影晃了晃，淡得快看不见，“你没事吧？”"}, {"type": "narrate", "text": "谢挽星看着胳膊上的伤口，没吭声，只是抬手摸了摸断剑，剑身上还带着谢流光的余温，恍惚间看见个穿玄色劲装的少年挡在她前面，剑光晃得她眼睛疼，还没等看清轮廓，就听见谢流光的声音：“我没事，别分心。"}, {"type": "narrate", "text": "”"}, {"type": "narrate", "text": "她把书信和账本塞进怀里最贴身的衣袋，用布条把胳膊上的伤口裹了紧，转身往密库门口走。"}, {"type": "narrate", "text": "刚开门，就看见温玉靠在梅树上，脚边扔着一堆被她踩得乱七八糟的枯枝，手里攥着一叠黄纸，见着她出来，立刻迎了上来，把黄纸塞给她一张，指尖凉得像冰：“避尘符，能挡半刻钟，我爹已经发现令牌丢了，派了人到处找，你快走，去外门的后山躲着，我哥明天会去后山查逃犯，你别出来。"}, {"type": "narrate", "text": "”"}, {"type": "narrate", "text": "谢挽星捏着避尘符，指尖的伤口还在渗血，滴在符纸上，晕开一小点红。“你怎么办？”她问。"}, {"type": "narrate", "text": "温玉笑了笑，左脸颊露出个小梨涡，眼尾沾了点梅林的冷气，亮得晃眼，抬手把被风吹乱的鬓发别到耳后：“我爹就算怀疑，也怀疑不到我头上，你快走，别被人抓着。"}, {"type": "narrate", "text": "”她转身往执法堂走，走了两步又回头，冲她挥了挥手，执法服的衣摆扫过地上的梅瓣，发间的羊脂玉簪晃了晃，这次没再回头，脚步快得像是在躲什么。"}, {"type": "narrate", "text": "谢挽星站在梅林里没动，直到温玉的背影进了执法堂，才拎着扫帚往偏房走。"}, {"type": "narrate", "text": "风卷着梅瓣往她怀里扑，她摸了摸怀里的书信和账本，又摸了摸腰里的断剑，断剑在暖着，谢流光的声音很轻，带着点笑：“挽星，等这一切结束，我带你去看前世的梅林，我们种的梅树，现在应该结果了。"}, {"type": "narrate", "text": "”"}, {"type": "narrate", "text": "回到偏房，她把书信和账本藏在土灶的灰底下，用破瓦片盖好，刚做完这些，就听见外面传来杂役弟子的喊声：“都出来！"}, {"type": "narrate", "text": "宗主今天要查外门，偷了镇峰宝剑的贼就在你们中间，要是主动交出来，还能饶你们一命！”"}, {"type": "narrate", "text": "谢挽星站在门边，看着佘锋穿着绣着金线的白袍，带着一群人往这边来，他的眼睛扫过人群，最后落在她脸上，露出个笑，像吐着信子的蛇，袖口上还沾着点未干的墨，是刚从案宗上沾的。"}, {"type": "narrate", "text": "她摸了摸怀里的令牌，又摸了摸腰里的断剑，指尖的伤口还在疼，可她眼底一点碎火亮得吓人。三天后的废灵根大会，她会把所有的证据摆到所有人面前，让那些污了她的名，害了同袍的人，都付出代价。"}, {"type": "narrate", "text": "风从破窗吹进来，卷起灶台上没扫干净的锈屑，在空中打了个旋，像前世斩魔剑出鞘时的寒光。"}, {"type": "narrate", "text": "她握紧了扫帚，指节泛白，帚毛扎得掌心的伤口发疼，血渗出来，沾了一点在扫帚的柄上，和怀里的账本上的墨迹混在一起，沉得像压了九峰的雪。"}, {"type": "goto", "target": "ch008"}]}, {"id": "ch008", "background": "bg/sect_night.webp", "checkpoint": true, "chars": [{"id": "c1", "pos": "left", "sprite": "normal"}, {"id": "c2", "pos": "center", "sprite": "normal"}, {"id": "c8", "pos": "right", "sprite": "normal"}], "script": [{"type": "narrate", "text": "谢挽星蹲在执法堂后墙根的阴影里，帚梢还沾着扫到一半的冷灰，指尖已经把沈砚秋塞来的碧色令牌捏出了潮汗。"}, {"type": "narrate", "text": "戌时的风卷着雪粒子往领子里钻，她才在冰水里泡完三个时辰的罚，指节冻得发僵，掌心的冻疮裂了口子，蹭到令牌上的碧落峰云纹时，疼得她后槽牙都咬了半刻，才没闷哼出声。"}, {"type": "narrate", "text": "令牌是沈砚秋今早塞给她扫帚的时候一起塞进来的，冰凉的玉身上还带着点白兰的香气，是沈砚秋发间常戴的那种。"}, {"type": "narrate", "text": "她知道沈砚秋的意思，执法堂密库昨夜刚运进来一批和魔族往来的罪证，宗主要赶在三峰试炼之前把这些烧了，她若再晚两天，就永远拿不到当年她全家被诬陷的证据。"}, {"type": "narrate", "text": "沈砚秋塞令牌的时候，指尖在她腕上的月牙疤上划了一下，那是六年前她救沈砚秋被魔物划的，当时小姑娘死死攥着她的手腕，指甲掐得她腕上渗了血，眼睛红得像兔子，说以后碧落峰的东西，她想要什么都能拿。"}, {"type": "narrate", "text": "墙根的雪已经被她蹲得化了一小片，混着扫帚带出来的灰，黑褐色的。她等了两刻钟，终于等到裴照夜的巡逻队往东边去了。"}, {"type": "narrate", "text": "她翻过墙，悄无声息落在执法堂后院的雪地里，脚底碾过碎雪的声响比猫跳还轻。密库的铁门泛着冷硬的铁锈味，门上贴着七道高阶剑意禁制，换个人来，碰一下就要被削去半条胳膊。"}, {"type": "narrate", "text": "她抬手按在铁门上，屏息听那剑意的波动——是熟悉的斩魔剑意，残的，但调门她熟，前世她设下的禁制，每一道剑意的间隙她都记得，指尖顺着门上的纹路游走，稍一偏灵气方向，铁门“吱呀”一声开了条缝，没有触发任何警报。"}, {"type": "narrate", "text": "她闪身进去，反手把门合上，鼻尖先撞进一阵陈年的墨混着铁锈的血味，架子上摆满了卷宗和匣子，每走三步就有一道隐形的剑意扫过，她听着那剑意的频率往左偏半步，脚下的地砖刚好是空的，踩下去就会触发响箭。"}, {"type": "narrate", "text": "绕过第三道禁制时，袖口被架子的边角勾了一下，外门的粗布弟子服撕开道口子，露出左腕上个月牙形的浅疤，和沈砚秋划的那道对称，是她当年被魔物抓的时候，谢流光拼着魂飞魄散给她挡的，谢流光那时候攥着她手腕说，师姐要好好活，碧落峰的东西，以后都是你的。"}, {"type": "narrate", "text": "她走到密库最里面的架子前，乌木匣子就放在第三个隔层上，上面果然贴了层薄薄的感应禁制，动一下就会响。刚才蹲墙根的时候，她特意把扫帚里的灰抹在指尖，就是等着封禁制用。"}, {"type": "narrate", "text": "她刚指尖碰到匣子边，门外突然传来了脚步声，是裴照夜巡逻回来了，赤色的靴底踩在青石板上，声响又沉又稳，每一步都踩在她绷紧的呼吸上。她来不及躲，只能把匣子往怀里一塞，攥着扫帚站在原地。"}, {"type": "narrate", "text": "裴照夜推门进来时，手里提着的赤色长灯晃了晃，眉间那道浅疤在灯光下格外明显，腰间的靛蓝色剑穗随着动作晃了晃。"}, {"type": "narrate", "text": "他看见是她，先是愣了愣，随即眉头拧得死紧，手按在了腰间的佩剑上：“外门杂役谢挽星？你半夜闯执法堂密库，该当何罪？”"}, {"type": "narrate", "text": "“我扫洒落了个扫帚在这儿。”她声音很稳，指尖已经扣住了腰里断剑的剑柄，那是叶惊秋偷偷给她锻的，断口磨得发亮，是她前世用的斩魔剑的残片。"}, {"type": "narrate", "text": "裴照夜没理她的借口，目光扫到她握着的令牌，又落在她怀里的乌木匣子上，眼神暗了暗：“碧落峰的令牌你也敢偷？那是沈砚秋的东西吧？她居然敢给你？”"}, {"type": "narrate", "text": "“跟你没关系。”她往后退了半步，身后的架子刚好挡住了感应禁制的位置，刚才封禁制的灰还没干，暂时把波动遮住了。"}, {"type": "narrate", "text": "就在这时，密库门口的警报铃突然晃了晃，发出了细微的声响，是刚才她躲第三道禁制的时候碰到的暗格触发的。"}, {"type": "narrate", "text": "裴照夜几乎是瞬间出手，一道赤色剑气擦着警报铃的边缘飞过去，“叮”的一声脆响，把铃铛打得歪了半圈，警报声卡到一半，硬生生憋了回去，连个回音都没敢冒。"}, {"type": "narrate", "text": "他转头看她，眼神里带着点看不懂的情绪：“左边第三个架子上的乌木匣子，别碰，上面有宗主亲自设的感应禁制，碰了整座执法堂的警报都会响，到时候你跑都跑不掉。”"}, {"type": "narrate", "text": "谢挽星愣了愣，没动，目光落在他腰间的剑穗上。那编法是三股辫加个剑扣，是她前世教谢流光的，特意把个小小的“谢”字刻在穗芯，只有斜着光才能看见。这穗子，怎么会在裴照夜身上？"}, {"type": "narrate", "text": "“你不是要抓我？”她问，指尖无意识蹭了蹭腰里的断剑。"}, {"type": "narrate", "text": "裴照夜别过脸，把长灯往架子上一放，语气硬邦邦的：“抓你？我哥的命还在宗主手里，我要是现在抓你，宗主得把我一起毙了。还有，你刚才躲禁制的步法，是我爹教过我的，你到底是谁？"}, {"type": "narrate", "text": "普通杂役可躲不过执法堂的七道禁制。”"}, {"type": "narrate", "text": "谢挽星没接话，走过去把怀里的乌木匣子拿过来，打开，里面摞着十几张交易帛书，最上面那张就是宗主和魔族残党往来的书信，落款是宗主的私印，下面压着的，是伪造的裴先锋通敌叛国的文书，她指尖拂过裴先锋的签名，上面有个极小的墨点，是她当年给裴先锋送印泥的时候，故意加的三星草荧光粉，只有对着光才会泛紫，再下面，是裴照明的关押地点，密牢最西边的水牢，旁边还标了个褪色的“活”字。"}, {"type": "narrate", "text": "她把写有裴照明下落的那张帛书抽出来，递给裴照夜：“你找了六年的哥，没死。”"}, {"type": "narrate", "text": "裴照夜的手猛地抖了一下，帛书从他指尖掉下去，落在雪地上，他盯着那上面的字看了很久，喉结滚了滚，才抬起头，声音哑得厉害：“你怎么会有这些东西？”"}, {"type": "narrate", "text": "“这不该你问。”谢挽星把帛书塞回匣子里，把匣子塞进怀里，抬眼看他，“你刚才为什么帮我打坏警报？要是你真的想抓我，刚才那一下，你就该把我按在地上。”"}, {"type": "narrate", "text": "裴照夜嗤了一声，把腰里的佩剑按了按，指尖蹭过剑穗上的小“谢”字，语气还是硬：“少自作多情，我只不过是看你不像个偷鸡摸狗的杂役。"}, {"type": "narrate", "text": "还有，下次演武场见，我定要废了你那条偷摸闯禁地的胳膊，省得你总给我找麻烦。”"}, {"type": "narrate", "text": "他说完，转身就往外走，走到门口又停了一下，头也不回地说：“巡逻的弟子还有一刻钟换班，左边那扇暗门通后山，守门的弟子是我的人，不会查你。"}, {"type": "narrate", "text": "还有，你腰里的剑，我爹当年铸的，要是敢弄坏，我跟你没完。”"}, {"type": "narrate", "text": "谢挽星看着他赤色的背影消失在门后，才抬手摸了摸腰里的断剑。"}, {"type": "narrate", "text": "断剑里传来谢流光的声音，弱得像蚊子叫，带着点懒洋洋的笑：“师姐，那个裴照夜腰里的剑穗，是我当年编的，我教他爹的，他爹当年是爹的副将，仙魔大战之后一直在找你的下落，宗主把裴家满门抄斩的时候，他把他儿子藏在地窖里才逃过一劫。"}, {"type": "narrate", "text": "”"}, {"type": "narrate", "text": "她攥了攥怀里的乌木匣子，掌心的冻疮被匣子的边角硌得生疼，但是她没松手。"}, {"type": "narrate", "text": "雪已经下大了，她推开左边的暗门，冷风裹着雪粒子灌进来，她回头看了一眼执法堂的密库，刚才裴照夜站的地方，还留着一道淡淡的赤色剑气余韵。"}, {"type": "narrate", "text": "她翻过后山的松林时，正好撞见换班的巡逻队，裴照夜站在最前面，手里提着灯，目光扫过她，像是没看见一样，侧身让开了路。"}, {"type": "narrate", "text": "她低着头往外走，听见裴照夜在身后跟旁边的弟子说：“刚才密库警报响了一下，是机关坏了，别声张，省得惊动宗主。”"}, {"type": "narrate", "text": "她脚步顿了顿，没回头，继续往柴房走。怀里的交易帛书焐得热乎，上面宗主的私印红得像血，还有裴照明的名字，清清楚楚。"}, {"type": "narrate", "text": "谢流光在断剑里哼着前世的小调，声音越来越轻：“师姐，裴照夜他爹当年也被宗主骗了，以为你是魔头，杀了谢家满门，后来知道真相之后，一直在找你的转世，那张伪造的通敌文书上，裴先锋的签名是他被人用刀按着手印签的，他右手的食指缺了个小口子，和文书上的印子对得上。"}, {"type": "narrate", "text": "”"}, {"type": "narrate", "text": "她推开柴房的破门，点燃桌上的油灯，把帛书摊开在桌上。"}, {"type": "narrate", "text": "烛火晃了晃，映出宗主和魔族往来的字迹，还有裴先锋当年夹在最里面的帛书里的墨迹，淡得快看不见：“谢挽星非魔，乃九峰剑主，裴某死不足惜，惟愿照夜能寻到剑主，重还九州清平。”"}, {"type": "narrate", "text": "她指尖敲了敲那行字，没扯嘴角，只是指尖微微松了松。"}, {"type": "narrate", "text": "刚才裴照夜嘴硬说下次演武场要废她胳膊，其实他攥剑柄的时候，指尖都在抖，打警报铃的剑气偏了半寸，就是怕她拿了东西跑不掉，还是怕宗主发现她闯密库？"}, {"type": "narrate", "text": "管他呢，反正这桩结了一辈子的旧案，总算有人能一起翻了。"}, {"type": "narrate", "text": "她弯腰去拿旁边温着的热粥，是沈砚秋刚才偷偷塞给她的，塞的时候还瞪了她一眼，说下次再敢泡三个时辰冰水，就把她逐出碧落峰。"}, {"type": "narrate", "text": "粥香混着雪粒子的冷气飘过来，她舀了一勺塞进嘴里，烫得她眯了眯眼。断剑里的谢流光还在碎碎念，说裴照夜刚才看她的眼神，跟当年看谢流光的时候一模一样，都是藏着话不敢说的怂样。"}, {"type": "narrate", "text": "她没搭话，指尖摸着帛书上宗主的私印，红得像滴血。"}, {"type": "goto", "target": "ch009"}]}, {"id": "ch009", "background": "bg/peak.webp", "checkpoint": true, "chars": [{"id": "c1", "pos": "left", "sprite": "normal"}, {"id": "c3", "pos": "center", "sprite": "normal"}, {"id": "c8", "pos": "right", "sprite": "normal"}], "script": [{"type": "narrate", "text": "我缩在外门柴房的柴堆后面，左胳膊的伤口被柴枝蹭得发疼，血已经把半片袖子浸成了暗红色。"}, {"type": "narrate", "text": "远处执法弟子的靴子踏在青石板上的声音由远及近，佩剑的嗡鸣顺着风往我耳朵里钻——是三队搜捕的人，绕到后巷去了。"}, {"type": "narrate", "text": "我屏着气把断剑往怀里又按了按，指尖蹭到剑身上刻的“谢”字，谢流光的声音在识海里闷闷的：“师姐，他们搜完这边就要进柴房了，你撑不住的话，我把残魂聚起来帮你挡一下。”"}, {"type": "narrate", "text": "挡什么？挡了之后你又得睡三个月。我没理他，闭着眼听剑意的方位，直到那队人的脚步声彻底消失，才敢动了动僵得发麻的腿。"}, {"type": "narrate", "text": "柴房的门吱呀一声被推开，我瞬间绷紧肌肉，手已经摸向了藏在柴堆里的半块砖头。"}, {"type": "narrate", "text": "进来的是个穿碧色弟子服的人，袖口短了一截，露出的手腕内侧有一道月牙形的旧疤，发间簪着两朵蔫了吧唧的白兰，手里提着的食盒还冒着热气，看见我劈头盖脸就压低了声音：“别拿砖头砸我，是我。"}, {"type": "narrate", "text": "”"}, {"type": "narrate", "text": "沈砚秋。"}, {"type": "narrate", "text": "我愣了愣，手上的砖头没松，也没放。她是碧落峰的继承人，宗主的养女，上次我被污蔑偷斩魔剑，就是她带人搜的我的屋子，我现在看见她就想绕道走。"}, {"type": "narrate", "text": "“你怎么来了？”我声音哑得厉害，这几日躲搜捕，我连水都没喝几口。"}, {"type": "narrate", "text": "她没回答，先把手里的食盒塞给我，是热的炊饼和一碗温的灵米粥，我扫了一眼，没动。她也不恼，蹲下来拉我的袖子，指尖碰到我胳膊上的伤口，猛地抖了一下，眉头皱得死紧：“你伤成这样怎么不说？"}, {"type": "narrate", "text": "他们用禁制搜你？”"}, {"type": "narrate", "text": "“执法堂的规矩，搜嫌犯之前要先封灵脉，用禁制扫灵根。”我抽回胳膊，把砖头藏在身后，“你一个碧落峰的大小姐，来我们外门柴房干什么？莫不是来抓我回去领赏的？”"}, {"type": "narrate", "text": "她沉默了两秒，从怀里摸出个青瓷小罐，塞到我手里，我闻着味儿就知道是碧落峰的金疮药，整个宗门只有碧落峰有，往常我连见都见不到。"}, {"type": "narrate", "text": "她抬眼看我，眼里有红血丝，像是好几日没睡了：“我要是想抓你，刚才进来的时候就喊人了。跟我走，我带你躲去碧落峰。”"}, {"type": "narrate", "text": "我盯着她，没动。碧落峰是宗主的地盘，我去了等于自投罗网。"}, {"type": "narrate", "text": "她像是看出了我在想什么，忽然笑了，抬起左手，把那道月牙形的旧疤露给我看，然后从怀里摸出半块雕刻成月牙形状的玉玦，玉玦的边缘有个小小的缺口，和我左手手腕内侧的月牙疤对在一起，严丝合缝。"}, {"type": "narrate", "text": "“六年前乱葬岗，你救了我，还给我喂了你自己的伤药，忘了？”她的声音很轻，却像一道雷劈在我天灵盖上。"}, {"type": "narrate", "text": "六年前我确实去过乱葬岗，捡了个被魔物追得浑身是伤的小姑娘，给她喂了药，还把自己的半块玉玦掰给她当信物，谢流光也说，那半块玉玦是我前世亲手刻的，给三个亲传弟子的信物，只有三个人有，缺口是我故意刻的，三块合起来才是完整的斩魔剑纹路。"}, {"type": "narrate", "text": "“你……”我张了张嘴，手里的砖头哐当掉在地上。"}, {"type": "narrate", "text": "“我知道你是谁。”她忽然压低了声音，环顾四周，见没人来，才继续说道，“你是斩魔剑主转世，宗主污蔑你偷剑，是想把你赶出宗门，拿斩魔剑的认主权。"}, {"type": "narrate", "text": "他勾结魔族，等我爹死了，就要把九峰的锁链崩断，放魔族进来。”"}, {"type": "narrate", "text": "我没说话。这些事我隐约知道，但是我从没想过，碧落峰的大小姐会知道。"}, {"type": "narrate", "text": "“我爹是被宗主害死的。”她指尖蹭了蹭眼尾，把那股子酸气压了下去，碧色弟子服的袖口被她攥得发皱，“他死之前给我留了信，说斩魔剑主会转世，让我等着你，护着你。"}, {"type": "narrate", "text": "这些年我给你塞的疗伤药，还有剑诀残页，都是我让外门的同乡带给你的，你不知道吧？”"}, {"type": "narrate", "text": "我想起来，前几个月我每次受了罚，第二天总能收到伤药，还有几页残破的剑诀，我以为是以前一起在外门扫洒的同乡给的，没想到是沈砚秋。"}, {"type": "narrate", "text": "“你为什么现在才说？”我声音有点哑，不是伤的原因，是堵得慌。"}, {"type": "narrate", "text": "“之前不敢。”她抬眼看我，眼里有细碎的光，“宗主一直盯着我，我要是暴露了对你的心思，他第一个就会对你下手。上次他污蔑你偷剑，要把你废灵根赶出去，我实在没办法了，才来找你。”"}, {"type": "narrate", "text": "我沉默了两秒，把怀里的断剑掏出来，递到她面前。断剑的剑身嗡的一声，谢流光的声音在识海里炸开：“师姐，这是前峰的剑！是她爹当年给师父锻造的斩魔剑！”"}, {"type": "narrate", "text": "沈砚秋的眼睛瞬间红了，指尖碰到断剑的剑身，抖得厉害：“我爹当年是给师父锻造这柄剑的，仙魔大战的时候，他跟着师父一起守碧落峰，被宗主捅了后背，死之前把这柄剑的碎片塞给我，说要是能等到你，就交给你。"}, {"type": "narrate", "text": "”"}, {"type": "narrate", "text": "我接过断剑，指腹蹭过剑身上的一道裂痕，那是我前世和魔主决战的时候，被魔气腐蚀的，当年沈砚秋的爹就是为了给我修这柄剑，才被宗主抓住把柄害死的。"}, {"type": "narrate", "text": "“你信我吗？”她忽然问我，声音很轻，像是怕惊碎了空气。"}, {"type": "narrate", "text": "我没说话，把手腕举起来，那道月牙形的疤在阳光下泛着淡红色的光，和她手里的玉玦对在一起，纹路完全吻合。我把断剑收回怀里，抬眼看她：“我信你。”"}, {"type": "narrate", "text": "她猛地松了口气，像是卸下了千斤重担，伸手拉我的手腕，指尖很凉：“走，我带你去密室里，碧落峰的剑意最近因为锁链松动，异动得厉害，你可以去听碧落峰的剑意，说不定能找回你的一丝神魂碎片。"}, {"type": "narrate", "text": "江晚吟的药我也有存，给你疗伤用。”"}, {"type": "narrate", "text": "我跟着她往密室的走，路过碧落峰的弟子，看见我们都恭恭敬敬地喊“沈师姐”，她拉着我的手，走得很稳。"}, {"type": "narrate", "text": "密室的门口有前任峰主的牌位，沈砚秋进去先拜了三拜，然后按下墙上的机关，一道暗格露出来，里面放着几页残破的剑诀，还有一罐碧落峰的灵泉。"}, {"type": "narrate", "text": "“宗主最近在找上古锁链的钥匙。”她把灵泉递给我，眉头皱得很紧，“我听他说，锁链最多还有三个月就要崩断了，到时候魔族进来，整个九州都要乱。"}, {"type": "narrate", "text": "我们必须赶在这之前，把宗主的罪证找出来，联合其他被他害过的人，一起推翻他。”"}, {"type": "narrate", "text": "我点了点头，刚要说话，就听见外面传来执法长老的声音，是宗主的声音，带着怒意：“沈砚秋在哪里？今日搜捕那个魔头，怎么没见过她的人？”"}, {"type": "narrate", "text": "沈砚秋的脸色瞬间白了，她拉着我的手，把我往暗格里塞：“你躲在这里，别出来，我去应付他。暗格后面有条密道，直通外门的乱葬岗，要是被发现，你就从密道走，去找江晚吟，她信得过。”"}, {"type": "narrate", "text": "我抓住她的手腕，没让她关门：“你小心点，别暴露。”"}, {"type": "narrate", "text": "她笑了笑，发间的白兰晃了晃，抬手把我塞进暗格，合上了门。我听见她整理了一下弟子服的衣领，然后推开门，声音清亮：“弟子沈砚秋，正在闭关修炼，不知宗主有何吩咐？”"}, {"type": "narrate", "text": "我缩在暗格里，掌心的断剑忽然嗡鸣了一声，谢流光的语气很急：“师姐，宗主在门上下了搜魂禁制，她一动，就能感知到你在碧落峰！”"}, {"type": "narrate", "text": "我瞬间绷紧了神经，指尖摸向怀里的符纸，沈砚秋，你可千万别露馅。"}, {"type": "goto", "target": "ch010"}]}, {"id": "ch010", "background": "bg/sect_day.webp", "checkpoint": true, "chars": [{"id": "c1", "pos": "left", "sprite": "normal"}, {"id": "c3", "pos": "center", "sprite": "normal"}, {"id": "c4", "pos": "right", "sprite": "normal"}], "script": [{"type": "narrate", "text": "谢挽星蹲在柴房的草垛上，把腕骨上被戒尺打出的血痕蹭掉时，苏砚正攥着半张残符蹲在门口，脸憋得通红，指腹上画符磨出的茧被符纸边缘蹭得发白。"}, {"type": "narrate", "text": "昨日她偷闯藏经阁被执法堂抓了现行，挨了二十戒尺，现在还疼得抬不起手，却还是把藏了三天的符纸塞了过来。离宗门大典还有三天，宗主已经下了死令，大典上当众废她灵根，扔去乱葬岗喂魔物。"}, {"type": "narrate", "text": "她原本算着靠听剑的能力摸进藏经阁找锁链的解法，没想到苏砚先找上了门。"}, {"type": "narrate", "text": "“昨天外门有个杂役偷偷给青峰的女修传了张求救的便条，被执法堂的人抓住，吊在思过崖示众了三天，两只耳朵都被割下来喂了乌鸦。"}, {"type": "narrate", "text": "”谢挽星把符纸接过来，指尖扫过上面的隐匿药粉，是她熟悉的青峰药修的手法，.nowy所有传讯符的符纸都被执法堂收走了，外门弟子不准下山，不准私自传信，违者杖责三十，再敢乱传的直接废灵根。"}, {"type": "narrate", "text": "宗门的护山大阵开了禁飞令，所有的传讯手段都被堵死了，她昨天刚翻墙就被执法堂的箭射中了右肩，现在还一扯就疼。"}, {"type": "narrate", "text": "“我把符纸偷出来了。"}, {"type": "narrate", "text": "”苏砚把符纸往她怀里塞了塞，声音压得极低，袖口还沾着偷闯藏经阁蹭的墨，黑一道白一道的，怀里露出来的半块缺了的白玉佩晃了晃，那是她娘留给她的唯一的东西，“我画的时候加了青峰药修的隐匿粉，只有我们自己人才看得见内容，执法堂的人就算搜到，也只当是没用的废符。"}, {"type": "narrate", "text": "”"}, {"type": "narrate", "text": "“别费那劲，符纸太容易被查了。"}, {"type": "narrate", "text": "”墙头上突然露出个乱蓬蓬的脑袋，叶惊秋手里攥着个铁皮做的小鸟，鸟翅膀上还沾着锻造的焦痕，指节上全是锻造磨出来的茧，“我做了机关鸟，用玄铁边角料做的，护山大阵查不出来，能飞遍九峰，每个峰撒十只，鸟嘴里衔着符纸，到地方自己就掉下来，跟普通的山雀一模一样，巡山的弟子根本不会注意。"}, {"type": "narrate", "text": "”"}, {"type": "narrate", "text": "外面突然传来执法弟子的靴子声，骂骂咧咧的，说刚才有只山雀飞过禁飞阵，肯定是哪个杂役传信，让把所有乱飞的鸟都打下来。"}, {"type": "narrate", "text": "三人立刻屏住呼吸，叶惊秋手一翻，把机关鸟塞到草垛里，苏砚把符纸往怀里按了按，谢挽星攥着扫帚假装扫地上的草，扫帚柄上缠着的半片断剑碎片硌得她手心疼。"}, {"type": "narrate", "text": "执法弟子敲了敲门，靴子底沾着泥，声音凶得很：“里面有没有人？敢传信出来，老子把你们的灵根都挖了喂魔物！”骂了几句没听见动静，才骂骂咧咧地走了。"}, {"type": "narrate", "text": "苏砚的脸都白了，但是手还死死攥着符纸，指节都捏红了。谢挽星本来不想让这丫头参与，她才十二岁，灵根都没开，要是被宗主抓住，肯定没活路。"}, {"type": "narrate", "text": "苏砚却先开口了，声音抖但是稳：“师父，我知道你要做什么。我娘当年是青峰的医修，被宗主冤枉通魔，打死在牢里，我躲进乱葬岗，是你捡我回来的。"}, {"type": "narrate", "text": "我知道你是斩魔剑主转世，你要为所有被宗主害死的女修报仇，我也要。我画的符里还藏了我娘当年被陷害的证据，宗主当年给我娘下了毒，才让她认罪的，我早就准备好了，就等这一天。”"}, {"type": "narrate", "text": "她往前爬了半步，眼睛亮得惊人，像乱葬岗里 lone 的萤火虫：“我不想再躲了，师父，你让我跟着你好不好？我认你为主，以后你让我做什么我就做什么，赴汤蹈火，我绝不皱一下眉头。”"}, {"type": "narrate", "text": "谢挽星顿了顿，伸手把苏砚发梢沾的纸屑摘下来，指尖碰到她冻得发红的耳尖，没说话，只是把扫帚柄上缠着的半片断剑碎片蹭了蹭苏砚的符纸，剑意顺着碎片渗进去，符纸瞬间亮了一下，又暗下去。"}, {"type": "narrate", "text": "她从来不想收徒弟，前世死得太惨，连亲传弟子都护不住，转世之后也是独来独往，怕连累别人。"}, {"type": "narrate", "text": "可看着苏砚的眼睛，她想起前世她的小弟子，也是这么个年纪，也是这么亮着眼睛跟她说，师父，我跟你一起打魔族。"}, {"type": "narrate", "text": "“好。”她说，声音哑得厉害，“以后我就是你的靠山，谁敢欺负你，我先废了他的灵根。”"}, {"type": "narrate", "text": "叶惊秋在墙头上挠了挠头，铁皮机关鸟在她手里转了个圈，发出吱呀的声响：“那、那我呢？我也算帮忙了吧？我也认你当老大？以后有人欺负我，你也帮我出头？”"}, {"type": "narrate", "text": "谢挽星看了她一眼，没说话，把怀里揣的半块铁片扔给她。那是她上次在锻造房捡的，玄铁的边角料，上面还带着锻造的痕迹，她知道是叶惊秋她爹当年锻造斩魔剑剩下的。"}, {"type": "narrate", "text": "叶惊秋捏着那半块铁片，眼睛一下子亮了，忙不迭地点头， says “老大你放心，我以后天天给你锻造东西，你要剑我给你铸剑，要符纸我给你裁纸，谁都别想欺负我们。”"}, {"type": "narrate", "text": "当天晚上，成百上千的机关鸟从外门的墙头飞出去，像撒了一把黑色的星子，分头往九峰各个方向飞。鸟翅膀拍打的声音很轻，混在夜风里，根本没人注意。"}, {"type": "narrate", "text": "谢挽星靠在柴房的墙头上，听着远处传来的鸟鸣声，知道消息已经传出去了：三日之后宗门大典，所有被宗主压迫的女修都来翻案，人证物证俱全，要么推翻伪善仙门，要么死在大典上。"}, {"type": "narrate", "text": "没过一个时辰，宗主就带着执法堂的人冲进外门，把所有的杂役都赶到广场上，火把把广场照得亮如白昼。"}, {"type": "narrate", "text": "宗主的脸黑得像锅底，他原本算着大典上废了谢挽星的灵根，就能把她手里的斩魔剑碎片抢过来，没想到消息居然走漏了。"}, {"type": "narrate", "text": "“是谁传的信？”宗主的声音像淬了冰，扫过人群的时候，所有人都吓得低下了头，“谁敢去大典闹事，我当场斩杀，株连九族！”"}, {"type": "narrate", "text": "苏砚躲在谢挽星身后，攥着她的衣角，小声说：“师父，江晚吟姐姐说她已经把宗主勾结魔族的药方准备好了，沈砚秋姐姐说她把宗主陷害碧落峰前任峰主的书信也藏好了，阿蛮姐姐已经把仙魔大战时宗主通魔的证据带来了，还有玄峰的、黄峰的、灰峰的所有被宗主害过的女修，都答应来大典。"}, {"type": "narrate", "text": "温玉姐姐说，她爹执法堂关押的所有被冤枉的女修，她也都安排好了。”"}, {"type": "narrate", "text": "谢挽星把苏砚往身后拉了拉，手按在腰间的断剑上，断剑里的谢流光也出声了，声音很轻，只有她能听见：“当年锁链已经崩了三道，宗主早就想打开锁链放魔族进来，他手里的魔物已经上万了，大典那天肯定会有埋伏。"}, {"type": "narrate", "text": "机关鸟飞出去的时候，我感受到了魔物的气息，就藏在宗门的后山。”"}, {"type": "narrate", "text": "谢挽星抬头看天，月亮被乌云遮住，只露出一点尖。风刮过她的脸，带着柴房的霉味和远处机关鸟的铁锈味。她知道，三日之后的大典，没有退路。"}, {"type": "narrate", "text": "要么她们翻案，拿回属于斩魔剑主的荣耀，给所有死去的女修一个交代，要么她们所有人，都死在大典上。"}, {"type": "narrate", "text": "“放心。”她低头对苏砚和叶惊秋说，指尖摸了摸苏砚的发顶，又按了按叶惊秋的肩膀，“我既然敢传信，就肯定有把握。谁也别想挡住我们的路。”"}, {"type": "narrate", "text": "远处的山头上，几点火星亮了起来，是收到消息的女修们在传信回应。风把火星吹得晃了晃，像一把刚出鞘的剑，亮得刺眼。"}, {"type": "goto", "target": "ch011"}]}, {"id": "ch011", "background": "bg/cliff.webp", "checkpoint": true, "chars": [{"id": "c1", "pos": "left", "sprite": "normal"}, {"id": "c8", "pos": "center", "sprite": "normal"}], "script": [{"type": "narrate", "text": "后山的试剑崖长满枯草，谢挽星握着竹扫帚站在崖边，身后两柄执法剑硌得她后颈发凉。"}, {"type": "narrate", "text": "今天是执法队跟着她扫洒的第三天，也是宗主给的废灵根期限前最后一日，她得摸清楚碧落峰剑意残响的方位，若能直接收了碎片，省得大比时跟一群天之骄子抢——那群人劈过来的剑风，她现在的残魂挨不过两下。"}, {"type": "narrate", "text": "风卷着枯草屑往她脸上扑，她佝偻着腰慢慢扫，身后杨林的声音飘过来：“动作麻利点，莫要躲懒，宗主说了，你那偷剑的贼心还没死，我们盯着你呢。"}, {"type": "narrate", "text": "”她嗯了一声，装作被风迷了眼抬手揉了揉，耳尖却猛地一动——那不是普通的风声，是剑鸣，钝得像蒙了灰的旧剑出鞘，还裹着点极淡的白兰香，是她三年前在乱葬岗闻过的味道。"}, {"type": "narrate", "text": "她假装蹲下来系鞋带，指甲悄悄在扫帚柄上划了一道，记下声音传来的方位：试剑崖东边的石缝里，剑意最浓。看来听剑的能力是真的，神魂碎裂千年，这天下唯一能听懂所有剑意的人，还是她。"}, {"type": "narrate", "text": "风突然大了，演武场的方向炸开一片碧色剑光，沈砚秋的声音隔着半座山飘过来，清凌凌的：“今日的剑阵演练，都收着点，莫要毁了我峰的东西。"}, {"type": "narrate", "text": "”谢挽星抬头看过去，那姑娘身量高挑，碧色弟子服穿在身上总有点空荡，发间簪着个新鲜的白兰，是刚从山下摘的，和她记忆里乱葬岗那个头发上别着蔫了白兰的小姑娘叠在了一起。"}, {"type": "narrate", "text": "身后杨林和赵虎对视一眼，刚要说什么，就见个外门弟子连滚带爬地跑过来，喊他们去抓偷溜进藏经阁的贼。"}, {"type": "narrate", "text": "俩人骂了一句，捏着执法剑转身就走，谢挽星听着他们的脚步声远了，刚要往石缝那边挪，就听见剑鸣声骤然大了起来。"}, {"type": "narrate", "text": "是沈砚秋在拔剑。"}, {"type": "narrate", "text": "碧色的剑光劈开云层，整个试剑崖都在震，谢挽星耳尖发烫，那剑鸣里裹着个极细的求救信号，是只有听剑人能读懂的频率，像个小姑娘拽着她的袖子小声说：“姐姐，我在试你，剑意就在石缝里。”"}, {"type": "narrate", "text": "她猛地抬头，正看见沈砚秋挥剑往她这边扫，故意偏了半寸，手腕撞在旁边凸起的剑鞘上，一道月牙形的旧疤露了出来，被剑风吹得发红。"}, {"type": "narrate", "text": "谢挽星攥着扫帚的手指瞬间僵了。"}, {"type": "narrate", "text": "那疤的形状，和她腕上自己当年被剑划出来的月牙疤一模一样。"}, {"type": "narrate", "text": "三年前乱葬岗，她从魔物堆里救出个摔进泥里的小姑娘，浑身是伤，手腕上就刻着这么一道疤，她给人家包扎草药的时候，往疤上按了个碎玉片，说是信物，等以后小姑娘有能力了，拿着这个来找她。"}, {"type": "narrate", "text": "那小姑娘拽着她的袖子，头上簪着个蔫了的白兰，说“姐姐我以后要当碧落峰的峰主，保护你”。"}, {"type": "narrate", "text": "原来她没忘。"}, {"type": "narrate", "text": "沈砚秋已经收剑转身走了，发间的白兰晃了一下，飘过来个花瓣落在她脚边。"}, {"type": "narrate", "text": "谢挽星盯着那道移开的背影，半天没动，指尖蹭了蹭自己腕上的疤，和刚才沈砚秋露出来的那道，刚好能拼成一个完整的碎玉，和她前世的斩魔剑剑柄上的标记分毫不差。"}, {"type": "narrate", "text": "身后传来脚步声，杨林和赵虎抓完人回来了，拧着眉毛走过来：“刚才沈师姐是不是往这边看了？你刚才鬼鬼祟祟看什么？”"}, {"type": "narrate", "text": "谢挽星刚要低头，就听见沈砚秋的声音又飘过来，带着点继承人的骄矜：“我的人，也是你们能随便盘问的？”"}, {"type": "narrate", "text": "那姑娘走过来，碧色衣摆扫过枯草，伸手把执法队的人推到一边，扫了谢挽星一眼，语气淡淡的：“她是我派来扫洒试剑崖的，大比用的剑意碎片我都要留着练剑阵，她要敢碰一针一线，我拿你们是问。”"}, {"type": "narrate", "text": "执法队的人敢怒不敢言，躬身退到一边，临走前偷偷捏了传音符，往宗主峰的方向送了信。谢挽星埋着头，看见沈砚秋的指尖勾了勾腰间的白玉佩，那佩上缺了个角，刚好是月牙形的。"}, {"type": "narrate", "text": "等人都散了，沈砚秋才慢吞吞走过来，弯腰把脚边的那片白兰花瓣捡起来，塞到谢挽星手里，指尖碰了碰她的手背，极轻地说了句“别怕”，转身就走，发间的白兰晃得人眼晕，左手腕的月牙疤露在袖口外面，被太阳晒得发亮。"}, {"type": "narrate", "text": "谢挽星捏着那瓣还带着点温度的白兰，抬头看沈砚秋的背影，那姑娘走得很稳，头却微微侧着，像在确认她有没有事。"}, {"type": "narrate", "text": "她低头看自己掌心的花瓣，又摸了摸腕上的疤，前世的记忆碎片像潮水似的涌上来——她给自己的三个亲传弟子每人一个碎玉信物，刻着“谢”字，沈砚秋腰上那个缺了角的佩，就是当年她给大弟子戴的那个。"}, {"type": "narrate", "text": "断剑里的谢流光突然冒了头，声音压得很低，带着点急：“宗主已经收到执法队的传音符了，大比的剑阵里埋了陷阱，他要借大比的机会收走碧落峰的所有剑意碎片，还要污你偷练禁术，直接废了你的灵根。"}, {"type": "narrate", "text": "沈砚秋已经被他盯上了，你不能连累她。”"}, {"type": "narrate", "text": "谢挽星把白兰塞进怀里，指尖蹭过那瓣花瓣上的纹路，抬头看已经走到演武场门口的沈砚秋，那姑娘突然回头，冲她眨了眨眼，很快又转过去了，像是什么都没发生。"}, {"type": "narrate", "text": "风又刮过来，试剑崖东边的石缝里，剑鸣声又响了一声，比刚才更亮，像在催她过去拿本属于她的东西。她攥了攥手里的扫帚，指甲掐得掌心生疼。"}, {"type": "narrate", "text": "原来不是只有她在找碎裂的神魂，也不是只有她在翻旧案。三年前乱葬岗那个拽着她袖子说要当峰主的小姑娘，早就站在她这边了。"}, {"type": "narrate", "text": "身后执法队的人已经又凑过来了，杨林皮笑肉不笑地开口：“谢姑娘，宗主说了，大比的日子快到了，你这样的杂役，还是离演武场远点好，省得被剑意误伤，说不出个所以然来。”"}, {"type": "narrate", "text": "谢挽星低下头，看着扫帚上划的那道记号的墨迹被风吹得慢慢淡了，嘴角往上抬了点。大比啊，到时候别说剑意碎片，就连宗主的乌纱帽，她也一并掀了。"}, {"type": "narrate", "text": "她得加快速度了，不仅要拿回属于她的剑，还要把沈砚秋从宗主的棋局里拉出来。"}, {"type": "narrate", "text": "风卷着白兰的香气往她鼻子里钻，她摸了摸怀里的花瓣，又摸了摸腕上的月牙疤，第一次觉得这腌臜的仙门，也不是那么难啃。"}, {"type": "goto", "target": "ch012"}]}, {"id": "ch012", "background": "bg/sect_night.webp", "checkpoint": true, "chars": [{"id": "c3", "pos": "left", "sprite": "normal"}, {"id": "c4", "pos": "center", "sprite": "normal"}, {"id": "c8", "pos": "right", "sprite": "normal"}], "script": [{"type": "narrate", "text": "演武场的青石板浸着昨夜未化的霜，冷气顺着膝头往骨头缝里钻，谢挽星被两名执法弟子按着肩胛跪在上面，腕间锁灵绳勒得前日受的板疮发疼，渗出来的血染红了麻绳，顺着绳纹往下滴，在青石板上砸出小小的红印。"}, {"type": "narrate", "text": "左前方的宗主座上，柳归鸿捏着那卷所谓的“人证物证”，声音裹着金丹期的灵力砸得在场每个外门弟子耳膜发疼，震得她内伤都在泛疼，嘴角渗出一丝血沫：“谢挽星，上月十五子时偷闯藏剑阁，盗取斩魔剑残片，认还是不认？"}, {"type": "narrate", "text": "”"}, {"type": "narrate", "text": "她抬眼扫过人群，那几个上月刚领过柳归鸿私赏的聚灵丹的外门弟子立马站出来，眼神飘忽着不敢跟她对视，声音亮得刺耳：“我亲眼看见她子时摸进藏剑阁！"}, {"type": "narrate", "text": "”“她袖袋里掉出来的剑穗和斩魔剑的配穗一模一样，那云纹我化成灰都认得！”柳归鸿指尖一弹，几张画着她深夜出入藏剑阁的画像浮在半空，线条歪歪扭扭，全是伪造的痕迹。"}, {"type": "narrate", "text": "就在“斩魔剑”三个字落下的瞬间，谢挽星怀里的断剑猛地烫了一下，像块烙铁贴在胸口，她眉角几不可察地跳了跳——柳归鸿感应到了断剑散出的微弱剑息，所以才故意把罪名安在“残片”上，不然根本不可能凭空指认她藏了斩魔剑的东西。"}, {"type": "narrate", "text": "“藏剑阁的锁是上古寒铁铸的，我没那个本事撬。宗主要是非说是我偷的，不如把守阁弟子叫来问问，我谢挽星自进外门起，连藏剑阁的台阶都没踏上去过。"}, {"type": "narrate", "text": "”谢挽星梗着脖子笑，嘴角的血沫子沾在洗得发白的衣领上，晕开一小片暗红。"}, {"type": "narrate", "text": "“冥顽不灵！”柳归鸿一拍扶手，执法堂刻满禁制符的噬灵棍已经抬了上来，棍身亮得瘆人，“偷盗宗门重宝，按规矩废去灵根，逐出山门，行刑！”"}, {"type": "narrate", "text": "前排的苏砚猛地往前窜了一步，却被旁边的大师兄死死拽住胳膊，她嘴都咬出了血，眼泪啪嗒砸在手里攥了半天的桂花糕上，把那块点心的边角泡得发软，却连半个求情的字都没敢吐出来。"}, {"type": "narrate", "text": "两名执法弟子拎着棍往她这边走，谢挽星指尖掐进掌心，怀里的断剑发着微温。"}, {"type": "narrate", "text": "她刚才摸过柳归鸿扔下来的 accusation 腰牌，上面被悄无声息地加了追踪符，只要她出山门半里，对方就能找到她的位置——可这正合她意，前世的斩魔剑碎片，有一片就在乱葬岗的乱石堆里，还有上古锁链的断片，也落在那里，她正愁找不到机会进去。"}, {"type": "narrate", "text": "柳归鸿这惩罚，简直是给她递梯子。"}, {"type": "narrate", "text": "“等一下。”"}, {"type": "narrate", "text": "人群里挤出来个穿洗得发白青衣的姑娘，指尖沾着药草的黄渍，指腹还有常年捣药磨出来的薄茧，是青峰的药修江晚吟。"}, {"type": "narrate", "text": "她攥着个朱红色的采药凭证，指节捏得发白，指尖都掐破了渗出血珠，声音抖得不成调，却字字清晰：“宗主，我有凭证，上月十五子时谢挽星在南崖帮我采雪见草，根本没去过藏剑阁，这是青峰的采药凭证，有朱砂印，有执事弟子的签字，绝对造不得假。"}, {"type": "narrate", "text": "”"}, {"type": "narrate", "text": "她把凭证举过头顶，风吹得凭证哗哗响，上面的字和朱砂印清清楚楚，连子时三刻谢挽星背着她下山的记录都写得明明白白。"}, {"type": "narrate", "text": "柳归鸿的脸色瞬间沉了下来，指尖的灵力捏得凭证的边缘都焦了：“江晚吟，你胆敢为了个外门杂役伪造凭证？要知道伪造宗门凭证是什么罪！”"}, {"type": "narrate", "text": "“我没伪造。”江晚吟抬起头，眼睛里带着血丝，却一步都没退，“上月十五我在南崖摔断了腿，是谢挽星把我背回来的，山脚下守着关卡的外门弟子都看得见，宗主要是不信，可以去问他们。”"}, {"type": "narrate", "text": "她这一句话堵得柳归鸿说不出话来，那日江晚吟摔断腿整个青峰都有传言，只是没人会把这事和偷剑联系起来。"}, {"type": "narrate", "text": "柳归鸿盯着她看了半晌，突然笑了，笑声里带着冷意，目光扫过谢挽星怀里的方向，像在打量跑不掉的猎物：“好，好得很。既然凭证是真的，那偷剑的罪名暂且不算，但是死罪可免活罪难饶——”"}, {"type": "narrate", "text": "他顿了顿，指尖的灵力有意无意扫过谢挽星攥着绳子的手腕：“即日起罚去乱葬岗采药，采不满三株还魂草，永远不用回宗门，腰牌没收，不准带任何储物袋，只准带一把镰刀。”"}, {"type": "narrate", "text": "乱葬岗是宗门的禁地，里面除了长着稀有的药草，还有当年仙魔大战留下的瘴气和魔修残党，进去的外门弟子十个有九个回不来。"}, {"type": "narrate", "text": "人群里瞬间传来抽气声，苏砚挤在前排，手里攥着的桂花糕已经化得差不多了，只剩下一点糕底黏在指腹，听见惩罚的内容，她死死咬着嘴唇，想喊却发不出声，眼眶红得快滴血。"}, {"type": "narrate", "text": "谢挽星却突然笑了，她慢慢从地上爬起来，拍掉膝盖上的灰，伸手接过执法弟子扔过来的木牌，指尖捏着木牌边缘，抬头看向柳归鸿，目光坦然得没有半分畏缩：“谢宗主赏。”"}, {"type": "narrate", "text": "她当然想去乱葬岗。前世的斩魔剑碎片，有一片就在乱葬岗的乱石堆里，还有上古锁链的断片，也落在那里，她正愁找不到机会进去。柳归鸿这惩罚，简直是给她递梯子。"}, {"type": "narrate", "text": "她怀里的断剑轻轻震了一下，像是在应和她，她悄悄捏了捏剑鞘，没说话。"}, {"type": "narrate", "text": "人群散得很快，江晚吟等在外门的拐角，背靠着剥落的墙皮，看见她过来，立刻把手里攥着的油纸包塞到她手里，指尖碰了碰她的手腕，凉得像冰，碰到她腕上的月牙形旧疤的时候，顿了一下，立马缩了回去。"}, {"type": "narrate", "text": "她脖子上挂着的半块白玉佩顺着领口滑出来，月牙形的缺口，刚好和谢挽星腕上的疤对得上，谢挽星瞳孔一缩，想说什么，江晚吟却已经低着头转身走了，混进人群里，眨眼就不见了。"}, {"type": "narrate", "text": "她低头打开油纸包，里面装着三颗清心丹，还有一小瓶金疮药，清心的味道飘出来，和她前几日内伤莫名好转的时候闻到的味道一模一样。她之前还以为是苏砚偷偷给她塞的，没想到一直是江晚吟。"}, {"type": "narrate", "text": "她指尖捏着清心丹，没急着吃，先揣进了怀里，打算等进了乱葬岗再服。"}, {"type": "narrate", "text": "怀里的断剑突然震了一下，比之前任何一次都烫，耳边响起个少年带了点喘的声音，很轻，只有她能听见，带着点熟悉的懒散：“师姐，剑意我帮你震散了，柳归鸿暂时拿你没办法。"}, {"type": "narrate", "text": "乱葬岗里有一片你的神魂碎片，还有我当年埋的线索，你小心点，我陪着你。”"}, {"type": "narrate", "text": "谢挽星指尖摸了摸断剑的剑身，嘴角往上抬了抬。"}, {"type": "narrate", "text": "她前世的小师弟谢流光，仙魔大战的时候为了给她断后，被魔物撕成了碎片，神魂封在她的断剑里，陪了她一千多年，她一直以为只有她自己记得前世的事，原来他一直都在。"}, {"type": "narrate", "text": "她把油纸包揣进怀里，攥着手里的禁地准入腰牌，往山门走的时候，看见苏砚还站在那棵老槐树下，手里攥着的桂花糕已经化得差不多了，只剩下一点糕底黏在指腹，看见她看过来，立马把剩下的糕底塞进嘴里，慌慌张张从口袋里掏出块麦芽糖递过来，举着的手抖得厉害，眼圈红红的，却不敢上来。"}, {"type": "narrate", "text": "谢挽星朝她笑了笑，抬手揉了揉自己发顶的槐花——是刚才风刮下来的，也是苏砚以前总爱塞给她的那种。她没接糖，只是摆了摆手，转身往乱葬岗的方向走。"}, {"type": "narrate", "text": "风卷着枯叶往她身上扑，她腕上的月牙疤在太阳底下亮得发光，远处乱葬岗的方向飘着一缕若有若无的黑气，她动了动耳朵，听见风里传来锁链晃动的轻响，那是上古锁链的声音，她的剑意，终于要碰到第一片碎片了。"}, {"type": "goto", "target": "ch013"}]}, {"id": "ch013", "background": "bg/battle.webp", "checkpoint": true, "chars": [{"id": "c5", "pos": "left", "sprite": "normal"}, {"id": "c6", "pos": "center", "sprite": "normal"}, {"id": "c7", "pos": "right", "sprite": "normal"}], "script": [{"type": "narrate", "text": "腐臭味漫上来的时候，谢挽星指尖刚被肋骨茬划破。血珠蹭在腰侧铜环上，那是指引神魂碎片的罗盘——师尊咽气前攥着她的手按进去的，指节冰凉，铜面里封着斩魔剑主的残片。"}, {"type": "narrate", "text": "她蹲在第十三具烂席子旁，眼都没抬，听着坡下王执法的骂声顺着风飘：\"那小杂役跑这来了？偷了斩魔剑，还敢往乱葬岗躲...\""}, {"type": "narrate", "text": "她早就听见温玉故意放慢的脚步声了。执法队里，就那小姑娘是燕家的人。"}, {"type": "narrate", "text": "断剑只有半截，磨得发乌。她手指刚按上剑柄，身后的尸傀已经扑过来，指甲是黑的，抓在地上冒白烟。谢挽星没动，头顶的玄衣姑娘先动了——半把断铁剑脱手飞出去，直接把尸傀劈成两半。"}, {"type": "narrate", "text": "姑娘跳下来，拍掉剑上的血，视线钉在谢挽星腰上。\"我叫燕轻舟。\"眉峰皱着，\"你这剑，哪来的？\""}, {"type": "narrate", "text": "谢挽星没答。她看燕轻舟腰上挂的剑穗，燕翅纹，和她从骷髅手里摸到的青铜铃铛上的一模一样。师尊说过，那铃铛是燕骁将军贴身的东西。"}, {"type": "narrate", "text": "\"你爹的遗骨在西槐树下，斩魔碎片也在那。\"她往西指了指，\"你去把执法队引到东边深处，里面的筑基期尸傀能困他们半个时辰。我拿到东西，给你送过去。\""}, {"type": "narrate", "text": "\"你一个外门杂役，怎么知道我爹的遗骨在这？\""}, {"type": "narrate", "text": "谢挽星视线扫过她指腹上的旧疤——那是锻造时磨的。\"你剑柄上缠的灰布，是我师尊给的。他当年是你爹的副官，亲手把遗体运回来的。\""}, {"type": "narrate", "text": "燕轻舟眼神变了。宗主说她爹通魔叛逃，全族覆灭，她逃出来隐姓埋名找了六年。她没有再问，翻身上树，丢下半块燕翅令。\"我引开他们。半个时辰后在这棵槐树下见。你要是敢骗我——\""}, {"type": "narrate", "text": "\"我这断剑，你尽管砍。\""}, {"type": "narrate", "text": "燕轻舟几个起跳消失在林子里，故意弄出响动，尸傀嘶吼声朝东边去了。"}, {"type": "narrate", "text": "谢挽星立刻摸到西槐树下，挖开烂席子。完整的骷髅胸口插着半把断剑，剑身刻着燕翅纹。手边碎荷包里露着半片剑穗，和燕轻舟腰上的正好凑成一对。"}, {"type": "narrate", "text": "她把东西揣进怀里，摸了摸骷髅头骨：\"燕将军，我找到您女儿了。\""}, {"type": "narrate", "text": "腰间铜环比血更烫。她咬破指尖把血滴上去，银光窜出来，直直往她断剑里钻。疼得她闷哼一声跪在地上，指甲抠进泥里。像是有什么冰封的东西碎了。"}, {"type": "narrate", "text": "疼劲过去后，她听见灵力涨起来，从练气初期跳到了后期。断剑上的燕翅印亮得清晰。"}, {"type": "narrate", "text": "树上的口哨声。燕轻舟头发沾着蜘蛛网下来，断铁剑还滴着血。"}, {"type": "narrate", "text": "谢挽星把断剑和剑穗丢过去。燕轻舟接住，手指摸着纹路，眼睛有点红，还是梗着脖子：\"算你说话算话。接下来去哪？我跟你走，找宗主报仇。\""}, {"type": "narrate", "text": "\"好。\"谢挽星接过她递来的燕翅令揣进怀里，抬眼看见天边泛白。乱葬岗的腐臭味里，飘来一丝极淡的魔气。"}, {"type": "narrate", "text": "\"有魔修盯着。\"她摸了摸断剑，谢流光的声音从剑里飘出来，极小，\"阿蛮的人。\""}, {"type": "say", "who": "c5", "text": "下次比武，我要是赢了你，得教我燕家剑法。"}, {"type": "narrate", "text": "谢挽星没说话，嗯了一声，转身往宗门走。燕轻舟跟在后头，断铁剑擦了擦"}, {"type": "narrate", "text": "\"行啊。\"她扯了扯嘴角，
