<style>
/* ========== 基础布局 ========== */
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { width:100%; height:100%; overflow:hidden; background:#000;
  font-family:"Microsoft YaHei","PingFang SC",sans-serif; color:#eee; user-select:none; }
#stage { position:fixed; inset:0; overflow:hidden; }

.bg { position:absolute; inset:0; background-size:cover; background-position:center;
  opacity:0; transition:opacity .5s; }
.bg.on { opacity:1; }
.bg.placeholder { background:linear-gradient(135deg,#1a2233,#3a4a63); }

.slot { position:absolute; bottom:0; width:33%; height:78%; display:flex;
  align-items:flex-end; justify-content:center; pointer-events:none; transition:opacity .4s; }
#slot-left   { left:0; }
#slot-center { left:33.5%; }
#slot-right  { right:0; }
.slot img { max-height:100%; max-width:95%; transition:opacity .15s, filter .2s, transform .4s; filter:brightness(.7); }
.slot.speaking img { filter:brightness(1); }
.slot .silhouette { width:60%; height:80%; border-radius:40% 40% 0 0;
  background:linear-gradient(180deg,#555,#333); opacity:.6; transition:filter .2s; filter:brightness(.7); }
.slot.speaking .silhouette { filter:brightness(1.2); }
.slot.enter-fade img, .slot.enter-fade .silhouette { animation:fadeIn .5s; }
.slot.enter-slide-l img, .slot.enter-slide-l .silhouette { animation:slideL .5s; }
.slot.enter-slide-r img, .slot.enter-slide-r .silhouette { animation:slideR .5s; }
@keyframes fadeIn { from{opacity:0} to{opacity:1} }
@keyframes slideL { from{transform:translateX(-60vw);opacity:0} to{transform:none;opacity:1} }
@keyframes slideR { from{transform:translateX(60vw);opacity:0} to{transform:none;opacity:1} }

/* 橙光式对话框：半透明渐变、无边框、safe-area 适配 */
#dlg { position:absolute; left:0; right:0; bottom:0; height:30vh; min-height:130px;
  background:linear-gradient(to top, rgba(6,8,14,.95) 0%, rgba(8,11,20,.82) 45%, rgba(8,11,20,.45) 75%, transparent 100%);
  padding:3vh 5vw calc(2.2vh + env(safe-area-inset-bottom, 0px)); cursor:pointer; z-index:10; }
/* 悬浮名字框 */
#namebox { position:absolute; top:-1.3em; left:6vw; padding:.28em 1.3em;
  background:linear-gradient(135deg, rgba(52,38,58,.92), rgba(22,26,44,.92));
  border:1px solid rgba(255,215,150,.35); border-radius:2em;
  box-shadow:0 3px 14px rgba(0,0,0,.55), 0 0 12px rgba(255,215,150,.18);
  font-weight:bold; font-size:clamp(14px,2.2vw,22px); letter-spacing:.08em; }
#dlgtext { font-size:clamp(15px,2.4vw,24px); line-height:1.7; white-space:pre-wrap; }
#dlgtext.narrate { font-style:italic; color:#cfd6e4; }
#advance-hint { position:absolute; right:2vw; bottom:1vh; font-size:.9em; opacity:.6; animation:blink 1s infinite; }
@keyframes blink { 50%{opacity:.15} }
#voice-indicator { position:absolute; right:2vw; top:-1.5em; font-size:.8em; opacity:.7; color:#ffd75e; display:none; }
#voice-indicator.playing { display:block; animation:blink .8s infinite; }

#choices { position:absolute; left:0; right:0; bottom:34vh; display:flex; flex-direction:column;
  align-items:center; gap:1.4vh; z-index:11; padding:0 4vw; }
/* 选项：居中卡片式，带渐入动画与 hover 反馈 */
.choice-btn { min-width:min(60vw,480px); max-width:92vw; padding:.8em 1.6em; font-size:clamp(15px,2.2vw,22px);
  background:linear-gradient(180deg, rgba(34,40,64,.88), rgba(18,22,38,.88));
  color:#fff; border:1px solid rgba(180,200,255,.35); border-radius:.8em; cursor:pointer;
  box-shadow:0 4px 18px rgba(0,0,0,.45);
  transition:transform .18s, box-shadow .18s, border-color .18s, background .18s;
  animation:choiceIn .4s both; }
.choice-btn:nth-child(2) { animation-delay:.07s; }
.choice-btn:nth-child(3) { animation-delay:.14s; }
.choice-btn:nth-child(4) { animation-delay:.21s; }
.choice-btn:nth-child(5) { animation-delay:.28s; }
.choice-btn:nth-child(6) { animation-delay:.35s; }
@keyframes choiceIn { from{opacity:0; transform:translateY(16px)} to{opacity:1; transform:none} }
.choice-btn:hover { background:linear-gradient(180deg, rgba(52,62,96,.92), rgba(30,36,60,.92));
  border-color:#a8c4ff; transform:translateY(-2px) scale(1.02);
  box-shadow:0 6px 22px rgba(0,0,0,.5), 0 0 16px rgba(150,180,255,.35); }
.choice-btn.disabled { opacity:.35; cursor:not-allowed; border-color:#666; animation:none; }
.choice-btn.disabled:hover { transform:none; box-shadow:0 4px 18px rgba(0,0,0,.45); }

.hotspot { position:absolute; z-index:9; border:2px solid rgba(255,220,100,.9); border-radius:.4em;
  background:rgba(255,220,100,.12); cursor:pointer; animation:hsGlow 1.2s infinite; }
@keyframes hsGlow { 50%{background:rgba(255,220,100,.3)} }

.overlay { position:fixed; inset:0; z-index:50; background:rgba(0,0,0,.72);
  display:flex; align-items:center; justify-content:center; flex-direction:column; }
.overlay.hidden, .hidden { display:none !important; }
.panel { background:#141a28; border:1px solid #3a4a63; border-radius:.6em;
  padding:2em; max-width:92vw; max-height:86vh; overflow:auto; min-width:min(70vw,560px); }
.panel h2 { margin-bottom:.8em; font-size:1.3em; }
.btn { display:inline-block; margin:.3em; padding:.55em 1.4em; background:#263652; color:#fff;
  border:1px solid #5a7bb0; border-radius:.4em; cursor:pointer; font-size:1em; }
.btn:hover { background:#33497a; }

#menubar { position:fixed; top:calc(8px + env(safe-area-inset-top, 0px)); right:calc(8px + env(safe-area-inset-right, 0px)); z-index:40; display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; }

.slotgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:.6em; }
.saveslot { border:1px solid #3a4a63; border-radius:.4em; padding:.6em; cursor:pointer; font-size:.85em; min-height:4.5em; }
.saveslot:hover { background:#1d2740; }
.saveslot .t { opacity:.6; font-size:.8em; }

.setrow { display:flex; align-items:center; gap:1em; margin:.7em 0; }

.setrow input[type=range] { flex:1; }

#history-list { flex:1; overflow-y:auto; text-align:left; line-height:1.8; margin:.6em 0; }

/* ========== 标题页（橙光化） ========== */
#title-screen { background-color:#05070d; background-size:cover; background-position:center; z-index:60; }
#title-particles { position:absolute; inset:0; width:100%; height:100%; z-index:0; pointer-events:none; }

  gap:clamp(8px,1.8vw,22px); margin:1.5em 0 .5em; }
.tbtn { writing-mode:vertical-rl; letter-spacing:.4em; padding:1.1em .6em;
  font-family:"STKaiti","KaiTi","STSong","SimSun",serif; font-size:clamp(15px,2vw,20px);
  color:#f0e2c6; background:rgba(18,15,26,.58); border:1px solid rgba(255,215,150,.32);
  border-radius:.55em; cursor:pointer;
  transition:box-shadow .25s, border-color .25s, transform .25s, color .25s; }
.tbtn:hover { color:#fff; border-color:#ffd78a; transform:translateY(-4px);
  box-shadow:0 0 20px rgba(255,205,120,.55), inset 0 0 14px rgba(255,205,120,.22); }
#ending-info { margin-top:1.2em; opacity:.78; font-size:.9em; }

/* ========== 对话回看（右侧滑抽屉） ========== */
#history-panel { flex-direction:row; justify-content:flex-end; align-items:stretch; background:rgba(0,0,0,.45); }
#history-drawer { width:min(430px,88vw); height:100%; display:flex; flex-direction:column;
  padding:calc(1.2em + env(safe-area-inset-top, 0px)) calc(1.2em + env(safe-area-inset-right, 0px)) calc(1.2em + env(safe-area-inset-bottom, 0px)) 1.2em;
  background:linear-gradient(180deg, rgba(16,20,34,.97), rgba(10,13,22,.97));
  border-left:1px solid rgba(255,215,150,.25); box-shadow:-8px 0 30px rgba(0,0,0,.6);
  transform:translateX(102%); transition:transform .3s ease; }

/* ========== CG 画廊 / 结局收集 ========== */
.gallery-panel, .endings-panel { min-width:min(88vw,640px); }
#gallery-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:.7em; margin:.8em 0; }
.cg-thumb { aspect-ratio:16/10; background:#0c1120 center/cover; border:1px solid #3a4a63; border-radius:.5em;
  cursor:pointer; display:flex; align-items:center; justify-content:center;
  transition:transform .2s, box-shadow .2s; }
.cg-thumb:hover { transform:scale(1.03); box-shadow:0 0 14px rgba(150,180,255,.35); }

.ending-card { padding:.7em 1.1em; border:1px solid rgba(255,215,150,.4); border-radius:.5em;

#cg-viewer { z-index:80; background:rgba(0,0,0,.92); }

#sys-menu { z-index:58; background:rgba(0,0,0,.55); }
#sys-menu .panel { min-width:min(84vw,320px); text-align:center;
  background:linear-gradient(180deg, rgba(22,26,44,.97), rgba(12,15,26,.97));
  border:1px solid rgba(255,215,150,.3); }
.sysbtn { display:block; width:100%; margin:.35em 0; padding:.7em 0; font-size:1.05em; letter-spacing:.2em;
  background:rgba(38,54,82,.6); }
.sysbtn:hover { background:rgba(51,73,122,.8); box-shadow:0 0 12px rgba(150,180,255,.3); }

/* ========== 场景转场（黑场淡入淡出） ========== */
#transition-layer { position:fixed; inset:0; background:#000; opacity:0; pointer-events:none; z-index:75; }

@keyframes sceneFade { 0%{opacity:0} 35%{opacity:1} 100%{opacity:0} }

#end-screen { background:#000; z-index:70; transition:opacity 1.5s; }
#end-label { font-size:clamp(1.6em,5vw,3em); letter-spacing:.15em; margin-bottom:1em; }

.fchar { position:absolute; pointer-events:none; transform-origin:50% 100%; transition:opacity .4s; }
.fchar img { height:72vh; max-width:45vw; transition:opacity .15s, filter .2s; filter:brightness(.7); }
.fchar.speaking img { filter:brightness(1); }
.fchar .silhouette { width:26vh; height:62vh; border-radius:40% 40% 0 0;
  background:linear-gradient(180deg,#555,#333); opacity:.6; transition:filter .2s; filter:brightness(.7); }
.fchar.speaking .silhouette { filter:brightness(1.2); }
.fchar.enter-fade img, .fchar.enter-fade .silhouette { animation:fadeIn .5s; }
.fchar.enter-slide-l img, .fchar.enter-slide-l .silhouette { animation:slideL .5s; }

#attr-toasts { position:fixed; top:60px; right:8px; z-index:45; display:flex;

.attr-row { margin:.8em 0; }

#name-input-field { width:60%; padding:.5em; font-size:1.2em; text-align:center;
  background:#0c1120; color:#eee; border:1px solid #7fa0d0; border-radius:.4em; }

/* 场景编辑器 */
#scene-editor { position:fixed; inset:0; z-index:55; background:#0a0e18; display:flex; flex-direction:column; }
#se-top { display:flex; align-items:center; gap:1em; padding:.5em 1em; background:#141a28; border-bottom:1px solid #3a4a63; }
#se-top h3 { font-size:1.1em; }
#se-body { display:flex; flex:1; overflow:hidden; }
#se-scenes { width:220px; min-width:150px; background:#0f1420; border-right:1px solid #3a4a63; overflow-y:auto; padding:.5em; }
.se-scene-card { background:#1a2040; border:1px solid #3a4a63; border-radius:.4em; margin-bottom:.4em; padding:.6em; cursor:pointer; font-size:.85em; transition:border-color .2s; }
.se-scene-card:hover { border-color:#7fa0d0; }
.se-scene-card.sel { border-color:#ffd75e; background:#252d4a; }
.se-scene-card .id { font-weight:bold; font-size:.9em; }
.se-scene-card .preview { opacity:.5; font-size:.75em; margin-top:.2em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

#se-main { flex:1; display:flex; flex-direction:column; overflow:hidden; }
#se-toolbar { display:flex; gap:.3em; padding:.4em .8em; background:#141a28; border-bottom:1px solid #3a4a63; flex-wrap:wrap; }

#se-edit-area { flex:1; display:flex; overflow:hidden; }
#se-canvas-wrap { flex:1; position:relative; overflow:hidden; min-width:300px; min-height:250px; }
#se-canvas-bg { position:absolute; inset:0; background-size:cover; background-position:center; }
#se-canvas-bg.placeholder { background:linear-gradient(135deg,#1a2233,#3a4a63); }
.se-ed-char { position:absolute; transform-origin:50% 100%; cursor:grab; z-index:2; }
.se-ed-char img { height:62vh; max-width:38vw; pointer-events:none; transition:filter .2s; filter:brightness(.55); object-fit:contain; }

  padding:.1em .5em; font-size:.75em; white-space:nowrap; }
#se-script-panel { width:300px; min-width:200px; background:#0f1420; border-left:1px solid #3a4a63; overflow-y:auto; padding:.5em; }
.se-cmd-card { background:#1a2040; border:1px solid #3a4a63; border-radius:.4em; margin-bottom:.3em; padding:.5em; font-size:.8em; cursor:pointer; }

.se-cmd-card .type-tag.narrate { background:#4a5568; }
.se-cmd-card .type-tag.say { background:#2d5a3d; }

.se-cmd-card .type-tag.set { background:#3d3d5a; }

.se-cmd-card .type-tag.end { background:#5a2d4a; }
#se-preview { height:25vh; min-height:120px; border-top:1px solid #3a4a63; background:#000; }

/* Timeline - 多轨道 */
#se-timeline-wrap { min-height:80px; max-height:35vh; background:#080c14; border-top:2px solid #3a4a63; display:flex; flex-direction:column; padding:2px 0; flex-shrink:0; overflow-y:auto; }

.tl-char-row { display:flex; align-items:center; height:20px; margin:1px 0; }

#se-canvas-bg { position:absolute; inset:0; z-index:0; }
#se-canvas-chars { position:absolute; inset:0; z-index:1; }

/* Preview overlay on canvas */
#se-preview-overlay { position:absolute; left:0; right:0; bottom:0; height:30%; z-index:10; background:rgba(10,12,20,.88); border-top:1px solid rgba(255,255,255,.2); padding:1em 2em; display:none; pointer-events:auto; }
#se-preview-overlay.show { display:flex; flex-direction:column; }
#se-pv-namebox { font-weight:bold; font-size:.9em; margin-bottom:.3em; display:none; cursor:pointer; }

#se-pv-namebox:hover { text-decoration:underline; }
#se-pv-text { font-size:.85em; line-height:1.6; color:#ddd; font-style:italic; cursor:text; outline:none; min-height:1em; }
#se-pv-text.normal { font-style:normal; color:#fff; }

/* Game preview iframe at bottom */
#se-game-preview { height:18vh; min-height:100px; border-top:2px solid #3a4a63; background:#000; }

}

<div id="viewlayer" class="overlay hidden">

  </div>
    </div>

</div>

<script>
'use strict';
/* ================= 内嵌剧本 ================= */

/* ================= 主执行循环 ================= */
function run() {
  if (sceneIdx >= script.scenes.length) return;
  const scene = script.scenes[sceneIdx];
  if (lineIdx >= scene.script.length) return;
  const cmd = scene.script[lineIdx];
  if (cmd.if !== undefined && !evalIf(cmd.if)) { lineIdx++; run(); return; }
  switch (cmd.type) {
    case 'narrate': {
      waiting = 'advance';
      const key = sceneIdx + ':' + lineIdx;
      const wasRead = getSeen().includes(key);
      pushHistory({ narrate:true, text:interp(cmd.text) });
      markSeen(key);
      if (skipMode && !wasRead) stopSkipAuto();
      if (skipAllMode && !cmd.stop_skip) { stopVoice(); lineIdx++; run(); return; }
      highlightSpeaker(null);
      showText(cmd.text, null, true);
      if (cmd.voice) playVoice(cmd.voice, cmd.voice_volume);
      break;
    }
    case 'say': {
      const who = cmd.who;
      if (!Object.values(slots).some(s => s && s.id === who) && !freeChars.some(c => c.id === who)) {
        const free = ['center','left','right'].find(p => !slots[p]) || 'center';
        slots[free] = { id:who, sprite:'normal' };
        renderSlot(free, 'fade', true);
      }
      waiting = 'advance';
      const key = sceneIdx + ':' + lineIdx;
      const wasRead = getSeen().includes(key);
      pushHistory({ who, text:interp(cmd.text) });
      markSeen(key);
      if (skipMode && !wasRead) stopSkipAuto();
      if (skipAllMode && !cmd.stop_skip) { stopVoice(); lineIdx++; run(); return; }
      highlightSpeaker(who);
      showText(cmd.text, who, false);
      if (cmd.voice) playVoice(cmd.voice, cmd.voice_volume);
      break;
    }
    case 'set':
      applySet(cmd.vars || {});
      lineIdx++; run(); break;
    case 'goto': {
      const t = script.scenes.findIndex(s => s.id === cmd.target);
      if (t < 0) { console.warn('悬空 goto:', cmd.target); lineIdx++; run(); return; }
      stopVoice(); enterScene(t); break;

      if (skipAllMode || skipMode) stopSkipAuto();
      const box = $('choices'); box.innerHTML = '';
      cmd.options.forEach(opt => {
        const b = document.createElement('button');
        b.className = 'choice-btn';
        b.textContent = interp(opt.text);
        if (opt.if !== undefined && !evalIf(opt.if)) { b.classList.add('disabled'); }
        else b.onclick = ev => {
          ev.stopPropagation();
          box.innerHTML = '';
          if (opt.set) applySet(opt.set);
          if (opt.goto) {
            const t = script.scenes.findIndex(s => s.id === opt.goto);
            if (t >= 0) { stopVoice(); enterScene(t); return; }

      break;

    case 'inspect': {

      const hs = document.createElement('div');
      hs.className = 'hotspot';
      hs.style.cssText = `left:${cmd.x*100}%;top:${cmd.y*100}%;width:${cmd.w*100}%;height:${cmd.h*100}%`;
      hs.title = '此处可调查';

  }

    (s.chars || []).forEach(c => { if (!sc.characters[c.id]) warns.push(`场景 ${s.id}：角色 "${c.id}" 未定义`); });
    (s.script || []).forEach((cmd, i) => {
      if (cmd.type === 'goto' && !ids.has(cmd.target)) warns.push(`场景 ${s.id} 第${i+1}行：goto 目标 "${cmd.target}" 不存在`);
      if (cmd.type === 'say' && !sc.characters[cmd.who]) warns.push(`场景 ${s.id} 第${i+1}行：说话角色 "${cmd.who}" 未定义`);
      if (cmd.type === 'choice') cmd.options.forEach(o => { if (o.goto && !ids.has(o.goto)) warns.push(`场景 ${s.id} 第${i+1}行：选项 "${o.text}" 的 goto "${o.goto}" 不存在`); });
    });
  });
  return warns;
}

function showNameInput() {
  return new Promise(resolve => {
    $('name-input-field').value = '';
    $('name-input-overlay').classList.remove('hidden');
    $('name-input-field').focus();
    const confirm = () => {
      const val = $('name-input-field').value.trim() || '灯';
      $('name-input-overlay').classList.add('hidden');
      $('name-input-confirm').removeEventListener('click', confirm);
      resolve(val);
    };
    $('name-input-confirm').onclick = confirm;
    $('name-input-field').onkeydown = ev => { if (ev.key === 'Enter') confirm(); };
  });
}

let edCharsList = [];

function refreshEditorScenes() {
  const box = $('se-scenes');
  box.innerHTML = '<div style="font-size:.75em;opacity:.6;margin-bottom:.3em">拖拽卡片排序 | 点击编辑 | <button class="btn small" id="se-show-branch">分支图</button></div>';

  box.appendChild(branchDiv);
  script.scenes.forEach((sc, i) => {
    const card = document.createElement('div');
    card.className = 'se-scene-card' + (i === edSceneIdx ? ' sel' : '');

    // Thumbnail
    const bgPath = sc.background;
    const thumbHTML = bgPath && bgPath !== 'none'
      ? `<div style="height:40px;background:url('${assetUrl(bgPath)}') center/cover;border-radius:3px;margin-bottom:3px;opacity:.7"></div>`
      : '<div style="height:40px;background:linear-gradient(135deg,#1a2233,#3a4a63);border-radius:3px;margin-bottom:3px;opacity:.5"></div>';
    card.innerHTML = thumbHTML + `<div class="id">${sc.id}${cp}</div><div class="preview">${firstText}…</div>`;
    card.onclick = () => selectEditorScene(i);
    card.draggable = true;
    card.ondragstart = ev => { ev.dataTransfer.setData('text/plain', String(i)); };
    card.ondragover = ev => { ev.preventDefault(); };
    card.ondrop = ev => {
      ev.preventDefault();
      const from = parseInt(ev.dataTransfer.getData('text/plain'),10);
      if (from === i || isNaN(from)) return;
      const [moved] = script.scenes.splice(from, 1);
      script.scenes.splice(i, 0, moved);
      refreshEditorScenes();
      selectEditorScene(i);
    };
    box.appendChild(card);
  });
  // Branch graph button
  setTimeout(() => {
    const btn = box.querySelector('#se-show-branch');
    if (btn) btn.onclick = () => {
      const g = $('se-branch-graph');
      if (g.style.display === 'none') { g.style.display = 'block'; g.innerHTML = buildBranchGraph(); }
      else g.style.display = 'none';
    };
  }, 0);
}
function buildBranchGraph() {
  const ids = script.scenes.map(s=>s.id);
  const lines = [];
  script.scenes.forEach((sc, i) => {
    const targets = [];
    (sc.script||[]).forEach(cmd => {
      if (cmd.type==='goto' && cmd.target) targets.push(cmd.target);
      if (cmd.type==='choice') (cmd.options||[]).forEach(o => { if (o.goto) targets.push(o.goto); });
    });
    if (targets.length === 0 && i+1 < ids.length) targets.push(ids[i+1]);
    targets.forEach(t => {
      const cond = '';
      lines.push(`<span style="color:#7fa0d0">${sc.id}</span> → <span style="color:#ffd75e">${t}</span>${cond}`);
    });
  });
  return lines.join('<br>') || '(无分支)';
}

  if (sc.bgm) { const bsrc = typeof sc.bgm==='object'?sc.bgm.src:sc.bgm; bgmSel.value = bsrc; }

  // SFX

  script.scenes.forEach(s=>{(s.sfx?Array.isArray(s.sfx)?s.sfx:[s.sfx]:[]).forEach(x=>{const p=typeof x==='object'?x.src:x;if(p)allSfx.add(p);})});
  allSfx.forEach(p=>{const o=document.createElement('option');o.value=p;o.textContent=p;sfxSel.appendChild(o);});
  sfxSel.value = '';
  // Background
  const bg = $('se-canvas-bg');

  if (isVideo) {
    bg.className = ''; bg.style.backgroundImage = '';
    let vid = bg.querySelector('video');
    if (!vid) { vid = document.createElement('video'); vid.loop = true; vid.muted = true; vid.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;object-fit:cover'; bg.appendChild(vid); }
    vid.src = assetUrl(sc.background); vid.play().catch(()=>{});
  } else if (sc.background && sc.background !== 'none') {

  } else {

  // Characters

  edCharsList = (sc.chars||[]).map(c => ({
    id: c.id, sprite: c.sprite||'normal', effect: c.effect||'fade',

    scale: c.scale!==undefined?c.scale:1
  }));
  renderEditorChars();
  renderCanvasHotspots(sc);
  renderEditorScript(sc);
  renderTimeline(sc);
  renderCharChips(sc);
  if ((sc.script||[]).length) previewLine(sc, 0); // auto-preview first line
  setTimeout(enableInlineEdit, 100);
}
function renderEditorChars() {
  const box = $('se-canvas-chars'); box.innerHTML = '';

      img.alt = c.id + ':' + c.sprite;

      charClickEdit(c.id);
      const cv = $('se-canvas-wrap');

        const r = cv.getBoundingClientRect();
        c.x = Math.round(Math.min(1,Math.max(0,(e2.clientX-r.left)/r.width))*1000)/1000;
        c.y = Math.round(Math.min(1.2,Math.max(0,(e2.clientY-r.top)/r.height))*1000)/1000;
        d.style.left=(c.x*100)+'%'; d.style.top=(c.y*100)+'%';
      };
      const up = () => { document.removeEventListener('mousemove',move); document.removeEventListener('mouseup',up); syncEditorChars(); };
      document.addEventListener('mousemove',move); document.addEventListener('mouseup',up);
    };
    d.onwheel = ev => { ev.preventDefault(); edCharSel=i; c.scale=Math.round(Math.min(2,Math.max(0.3,c.scale+(ev.deltaY<0?0.05:-0.05)))*1000)/1000; d.style.transform=`translate(-50%,-100%) scale(${c.scale})`; syncEditorChars(); };
    box.appendChild(d);
  });
}
function syncEditorChars() {
  if (edSceneIdx<0) return;

  sc.chars = edCharsList.map(c => ({ id:c.id, x:c.x, y:c.y, scale:c.scale, sprite:c.sprite, effect:c.effect }));

        hs.style.width=(cmd.w*100)+'%'; hs.style.height=(cmd.h*100)+'%';

let edPreviewLine = -1; // which line the preview is showing (-1 = scene start)

function renderTimeline(sc) {
  const total = (sc.script||[]).length || 1;
  // Dialog track: narrate, say, choice
  const dBlocks = document.querySelector('#tl-dialog .tl-blocks'); dBlocks.innerHTML = '';
  (sc.script||[]).forEach((cmd, idx) => {
    if (!['narrate','say','choice'].includes(cmd.type)) return;
    const b = document.createElement('div'); b.className = 'tl-block ' + cmd.type;
    b.style.left = (idx/total*100)+'%'; b.style.width = Math.max(4, (100/total))+'%';
    b.textContent = cmd.type==='narrate'?'📖'+(cmd.text||'').slice(0,8):cmd.type==='say'?'💬'+(script.characters[cmd.who]||{}).name:cmd.type==='choice'?'🔀'+(cmd.options||[]).length+'选':'';
    b.title = (cmd.text||'').slice(0,40);
    b.dataset.idx = idx;
    b.onclick = (ev) => { ev.stopPropagation(); previewLine(sc, idx); };
    b.oncontextmenu = ev => { ev.preventDefault(); sc.script.splice(idx,1); selectEditorScene(edSceneIdx); return false; };
    dBlocks.appendChild(b);
  });
  // Character matrix: dynamic rows per character, 3-state cells
  ensureMatrix(sc);
  const charContainer = $('tl-chars-container');
  if (charContainer) {
    charContainer.innerHTML = '';
    const cellW = Math.max(4, (100/total));
    (sc.chars||[]).forEach(function(c) {
      const row = document.createElement('div'); row.className = 'tl-char-row';
      row.innerHTML = '<span class="tl-label">'+(script.characters[c.id]||{}).name+'</span><div class="tl-blocks"></div>';
      const blocks = row.querySelector('.tl-blocks');
      for (var idx = 0; idx < total; idx++) {
        const cell = document.createElement('div');
        cell.className = 'tl-block';
        cell.style.left = (idx/total*100)+'%'; cell.style.width = cellW+'%';
        const state = sc._charMatrix[c.id]?.[idx] ?? 0;
        const cmd = sc.script[idx];
        const isSpeaking = cmd && cmd.type==='say' && cmd.who===c.id;
        cell.style.background = state===2 ? (isSpeaking?'#2d6a3d':'rgba(200,200,255,.15)') : state===1 ? 'rgba(100,100,120,.12)' : 'transparent';
        cell.style.border = state>=1 ? '1px solid rgba(255,255,255,.2)' : '1px dotted rgba(80,80,80,.3)';
        cell.textContent = isSpeaking ? '💬' : (state===2?'●':state===1?'○':'·');
        cell.title = (script.characters[c.id]||{}).name+' 第'+idx+'条 | '+(['不出现','暗色','出现'][state])+' | 点击切换';
        cell.style.cursor = 'pointer';
        cell.onclick = (function(cid, ix) { return function(ev) {
          ev.stopPropagation();
          sc._charMatrix[cid][ix] = ((sc._charMatrix[cid]?.[ix] ?? 0) + 1) % 3;
          edActiveChar = cid;
          renderTimeline(sc);
        };})(c.id, idx);
        blocks.appendChild(cell);
      }
      charContainer.appendChild(row);
    });
    // Unmatched speakers row
    var unmatched = new Set();
    (sc.script||[]).forEach(function(cmd) { if (cmd.type==='say' && !(sc.chars||[]).some(function(c){return c.id===cmd.who;})) unmatched.add(cmd.who); });
    if (unmatched.size) {
      var urow = document.createElement('div'); urow.className = 'tl-char-row'; urow.style.opacity = '0.5';
      urow.innerHTML = '<span class="tl-label">+添加</span><div class="tl-blocks"></div>';
      var ublocks = urow.querySelector('.tl-blocks');
      unmatched.forEach(function(who) {
        var b = document.createElement('div'); b.className = 'tl-block char-block';
        b.style.border = '1px dashed #fa0'; b.style.left = '0%'; b.style.width = 'auto';
        b.textContent = ' +'+script.characters[who].name;
        b.onclick = function() { ensureCharInScene(sc, who, 'normal'); selectEditorScene(edSceneIdx); };
        ublocks.appendChild(b);
      });
      charContainer.appendChild(urow);
    }
  }
  // Audio track: BGM, SFX
  const aBlocks = document.querySelector('#tl-audio .tl-blocks'); aBlocks.innerHTML = '';
  if (sc.bgm) {
    const b = document.createElement('div'); b.className = 'tl-block bgm-block';
    b.style.left = '0%'; b.style.width = '100%';
    const bsrc = typeof sc.bgm==='object'?sc.bgm.src:sc.bgm;
    b.textContent = '🎵'+(bsrc||'').replace('bgm/','').replace('.mp3','');
    aBlocks.appendChild(b);
  }
  const sfxList = sc.sfx ? (Array.isArray(sc.sfx)?sc.sfx:[sc.sfx]) : [];
  sfxList.forEach((sfx, si) => {
    const b = document.createElement('div'); b.className = 'tl-block sfx-block';
    b.style.left = (si*8)+'%'; b.style.width = '8%';
    const ssrc = typeof sfx==='object'?sfx.src:sfx;
    b.textContent = '🔊'+(ssrc||'').replace('sfx/','').replace('.wav','');
    aBlocks.appendChild(b);
  });
  // Other track: set, goto, end, show, inspect
  const oBlocks = document.querySelector('#tl-other .tl-blocks'); oBlocks.innerHTML = '';
  (sc.script||[]).forEach((cmd, idx) => {
    if (!['set','goto','end','show','inspect'].includes(cmd.type)) return;
    const b = document.createElement('div'); b.className = 'tl-block ' + cmd.type;
    b.style.left = (idx/total*100)+'%'; b.style.width = Math.max(4, (100/total))+'%';
    b.textContent = cmd.type==='set'?'⚙'+Object.keys(cmd.vars||{}).join(','):cmd.type==='goto'?'⏭'+cmd.target:cmd.type==='end'?'🏁'+cmd.label:cmd.type==='show'?'🖼CG':cmd.type==='inspect'?'🔍':'';
    b.dataset.idx = idx;
    b.onclick = (ev) => { ev.stopPropagation(); previewLine(sc, idx); };
    b.oncontextmenu = ev => { ev.preventDefault(); sc.script.splice(idx,1); selectEditorScene(edSceneIdx); return false; };
    oBlocks.appendChild(b);
  });
}

function previewLine(sc, idx) {
  edPreviewLine = idx;
  const cmd = sc.script[idx];
  if (!cmd) return;

  // -- 画布上的文本预览叠加层 --
  const overlay = $('se-preview-overlay');
  const namebox = $('se-pv-namebox');
  const textel = $('se-pv-text');

  if (cmd.type === 'say') {
    overlay.classList.add('show');
    namebox.classList.add('show');
    namebox.textContent = (script.characters[cmd.who]||{}).name;
    namebox.style.color = (script.characters[cmd.who]||{}).color || '#fff';
    textel.className = 'normal';
    textel.textContent = cmd.text || '';
    textel.contentEditable = 'true';
  } else if (cmd.type === 'narrate') {
    overlay.classList.add('show');
    namebox.classList.remove('show');
    textel.className = '';
    textel.textContent = cmd.text || '';
  } else if (cmd.type === 'choice') {
    overlay.classList.add('show'); namebox.classList.remove('show');
    textel.className = ''; textel.contentEditable = 'false';
    buildChoiceInline(cmd);
  } else if (cmd.type === 'set') {
    overlay.classList.add('show'); namebox.classList.remove('show');
    textel.className = ''; textel.contentEditable = 'false';
    buildSetInline(cmd);
  } else if (cmd.type === 'end') {
    overlay.classList.add('show');
    namebox.classList.remove('show');
    textel.className = '';
    textel.innerHTML = `<div style="text-align:center;font-size:1.3em;letter-spacing:.1em">🏁 ${cmd.label||'结局'}</div>`;
  } else if (cmd.type === 'goto') {
    overlay.classList.add('show');
    namebox.classList.remove('show');
    textel.className = '';
    textel.contentEditable = 'false';
    buildGotoInline(cmd);
  } else {
    overlay.classList.remove('show');
  }

  // -- 说话角色高亮，其他人变暗 --
  let highlightWho = null;
  for (let i = 0; i <= idx; i++) {
    const c = sc.script[i];
    if (c && c.type === 'say') highlightWho = c.who;
    else if (c && c.type === 'narrate') highlightWho = null;
  }
  // Apply speaking class to all editor characters
  document.querySelectorAll('.se-ed-char').forEach(el => {
    const cid = el.dataset.cid;
    if (highlightWho && cid === highlightWho) {
      el.classList.add('speaking');
      el.style.outline = '';
    } else {
      el.classList.remove('speaking');
      el.style.outline = '';
    }
  });

  // -- 高亮所有相关UI --
  $('se-audio-info').textContent = '▶ 第'+idx+'条 ' + cmd.type;
  document.querySelectorAll('.tl-block').forEach(b => b.classList.remove('sel'));
  document.querySelectorAll(`.tl-block[data-idx="${idx}"]`).forEach(b => b.classList.add('sel'));
  document.querySelectorAll('.se-cmd-row').forEach(r => r.classList.remove('sel'));
  const row = document.querySelector(`.se-cmd-row[data-idx="${idx}"]`);
  if (row) { row.classList.add('sel'); row.scrollIntoView({block:'nearest'}); }
}

function buildGotoInline(cmd) {
  var box = $('se-pv-text'); box.innerHTML = '';

  div.appendChild(hdr);

  brs.forEach(function(b, i) {

    inpIf.onchange = function(){ saveGotoInline(); };
    var arr = document.createElement('span'); arr.textContent = '→';
    var sel = document.createElement('select');
    sel.style.cssText = 'flex:1;padding:3px;background:#0c1120;color:#eee;border:1px solid #5a7bb0;border-radius:3px;font-size:.8em';
    ids.forEach(function(s){ var o=document.createElement('option'); o.value=s; o.textContent=s; if(s===b.target) o.selected=true; sel.appendChild(o); });

  ids.forEach(function(s){ var o=document.createElement('option'); o.value=s; o.textContent=s; if(s===cmd.else_target) o.selected=true; elseSel.appendChild(o); });
  elseSel.onchange = function(){ saveGotoInline(); };
  elseRow.appendChild(elseLbl); elseRow.appendChild(elseSel);
  div.appendChild(elseRow);
  box.appendChild(div);
}

function saveGotoInline() {
  if (edSceneIdx<0 || edPreviewLine<0) return;
  var sc = script.scenes[edSceneIdx];
  var cmd = sc.script[edPreviewLine];
  if (!cmd || cmd.type!=='goto') return;
  var box = $('se-pv-text');
  var divs = box.querySelectorAll('div[style*="display:flex"]');
  var branches = [];
  divs.forEach(function(d) {
    var inp = d.querySelector('input');
    var sel = d.querySelector('select');
    if (inp && sel && sel.parentNode === d) {
      var ifv = inp.value || '';
      var tv = sel.value || '';
      if (tv) branches.push({if: ifv || undefined, target: tv});
    }
  });
  // Find else select (the one with empty option)
  var allSelects = box.querySelectorAll('select');
  var elseSel = null;
  allSelects.forEach(function(s) { if (s.querySelector('option[value=""]')) elseSel = s; });
  if (branches.length) { cmd.branches = branches; delete cmd.target; delete cmd.if; }
  else { cmd.target = branches[0] ? branches[0].target : ''; delete cmd.branches; }
  if (elseSel) { cmd.else_target = elseSel.value || undefined; if (!cmd.else_target) delete cmd.else_target; }
}

function edAddGotoBranch() {
  if (edSceneIdx<0 || edPreviewLine<0) return;
  var sc = script.scenes[edSceneIdx];
  var cmd = sc.script[edPreviewLine];
  if (!cmd.branches) { cmd.branches = [{if:cmd.if||'', target:cmd.target||''}]; delete cmd.target; delete cmd.if; }
  cmd.branches.push({if:'', target:''});
  selectEditorScene(edSceneIdx);
  previewLine(sc, edPreviewLine);
}

function edDelGotoBranch(i) {
  if (edSceneIdx<0 || edPreviewLine<0) return;
  var sc = script.scenes[edSceneIdx];
  var cmd = sc.script[edPreviewLine];
  if (cmd.branches) { cmd.branches.splice(i, 1); }
  selectEditorScene(edSceneIdx);
  previewLine(sc, edPreviewLine);
}

function navPreview(delta) {
  if (edSceneIdx < 0) return;
  const sc = script.scenes[edSceneIdx];
  const newIdx = Math.max(0, Math.min(sc.script.length-1, (edPreviewLine>=0?edPreviewLine:0) + delta));
  previewLine(sc, newIdx);
}

/* -- 可视化表单脚本编辑 -- */
function renderEditorScript(sc) {
  const panel = $('se-script-panel');
  panel.innerHTML = `<div style="font-size:.75em;opacity:.5;margin-bottom:.3em">指令列表 (${sc.script.length}条) — 点击预览，双击编辑</div>`;
  sc.script.forEach((cmd, i) => {
    const row = document.createElement('div');
    row.className = 'se-cmd-card se-cmd-row' + (i === edPreviewLine ? ' sel' : '');
    row.dataset.idx = i;
    row.style.cssText = 'position:relative;cursor:pointer';
    // Summary text
    let summary = '';
    switch(cmd.type) {
      case 'narrate': summary = '📖 '+(cmd.text||'').slice(0,45); break;
      case 'say': summary = '💬 <b>'+(script.characters[cmd.who]||{}).name+'</b>: '+(cmd.text||'').slice(0,35); break;
      case 'choice': summary = '🔀 选择 ('+(cmd.options||[]).length+'个分支)'; break;
      case 'set': summary = '⚙ '+Object.keys(cmd.vars||{}).map(k=>k+'='+(cmd.vars[k])).join(', '); break;
      case 'goto': summary = '⏭ 跳转到 → <b>'+cmd.target+'</b>'; break;
      case 'end': summary = '🏁 结局: '+cmd.label; break;
      case 'show': summary = '🖼 CG展示: '+cmd.image; break;
      case 'inspect': summary = '🔍 调查: '+((cmd.show||{}).text||'').slice(0,40); break;
      default: summary = cmd.type;
    }
    row.innerHTML = `<span class="type-tag ${cmd.type}" style="font-size:.7em">${i}</span>${summary}
      <span style="position:absolute;right:4px;top:2px;cursor:pointer;opacity:.4;font-size:.75em" data-del="${i}">✕</span>`;
    // Click = preview, double-click = edit
    row.onclick = (ev) => {
      if (ev.target.dataset.del !== undefined) { sc.script.splice(i,1); selectEditorScene(edSceneIdx); return; }
      previewLine(sc, i);
    };
    row.ondblclick = (ev) => {
      if (ev.target.dataset.del !== undefined) return;
      showCmdForm(sc, i);
    };
    panel.appendChild(row);
  });
  // Add buttons
  const addBar = document.createElement('div');
  addBar.style.cssText = 'margin-top:.4em;display:flex;flex-wrap:wrap;gap:2px';
  const btns = [
    ['💬对白','say'],['📖旁白','narrate'],['🔀选择','choice'],['⚙变量','set'],['⏭跳转','goto'],['🏁结局','end'],['🖼CG','show'],['🔍调查','inspect']
  ];
  btns.forEach(([label, type]) => {
    const b = document.createElement('button');
    b.className = 'btn small'; b.textContent = label;
    b.style.cssText = 'padding:.15em .4em;font-size:.68em';
    b.onclick = () => {
      const defaults = {
        narrate:{type:'narrate',text:''}, say:{type:'say',who:Object.keys(script.characters)[0]||'',text:''},
        choice:{type:'choice',options:[{text:'选项1',goto:''}]}, set:{type:'set',vars:{}},
        goto:{type:'goto',target:''}, end:{type:'end',label:''}, show:{type:'show',image:''},
        inspect:{type:'inspect',x:0.5,y:0.5,w:0.1,h:0.1,show:{text:''}}
      };
      sc.script.push(defaults[type]||{type:type});
      if (type === 'say') ensureCharInScene(sc, defaults.say.who, 'normal');
      selectEditorScene(edSceneIdx);
    };
    addBar.appendChild(b);
  });
  panel.appendChild(addBar);
}

      formHTML += `x:<input id="cf-x" type="number" value="${cmd.x||0.5}" step="0.01" min="0" max="1" style="width:60px"> y:<input id="cf-y" type="number" value="${cmd.y||0.5}" step="0.01" style="width:60px"> w:<input id="cf-w" type="number" value="${cmd.w||0.1}" step="0.01" style="width:60px"> h:<input id="cf-h" type="number" value="${cmd.h||0.1}" step="0.01" style="width:60px"><br>`;
      formHTML += `文本:<textarea id="cf-text" rows="2" style="width:100%;padding:.3em;background:#0c1120;color:#eee;border:1px solid #3a4a63">${((cmd.show||{}).text||'').replace(/</g,'&lt;')}</textarea>`;
      formHTML += `图片:<input id="cf-image" value="${((cmd.show||{}).image||'').replace(/"/g,'&quot;')}" placeholder="cg/xxx.png" style="width:100%;margin:.3em 0;padding:.3em;background:#0c1120;color:#eee;border:1px solid #3a4a63">`;
      break;
  }
  formHTML += '<div style="margin-top:.8em;text-align:right"><button class="btn" id="cf-cancel">取消</button> <button class="btn" id="cf-save" style="background:#4a6da0">保存</button></div>';
  box.innerHTML = formHTML;
  overlay.appendChild(box);
  document.body.appendChild(overlay);

  const close = () => overlay.remove();
  box.querySelector('#cf-cancel').onclick = close;
  box.querySelector('#cf-save').onclick = () => {
    switch(cmd.type) {
      case 'say': case 'narrate':
        cmd.text = box.querySelector('#cf-text').value;
        cmd.if = box.querySelector('#cf-if')?.value || undefined;
        if (cmd.type==='say') {
          cmd.who = box.querySelector('#cf-who').value;
          ensureCharInScene(sc, cmd.who, 'normal');
        }
        break;
      case 'choice': {
        const opts = [];
        box.querySelectorAll('#cf-options > div').forEach(div => {
          const o = {};
          div.querySelectorAll('input,select').forEach(inp => {
            const f = inp.dataset.f;
            if (f==='text') o.text = inp.value;
            else if (f==='goto' && inp.value) o.goto = inp.value;
            else if (f==='set' && inp.value) { try { o.set = JSON.parse(inp.value); } catch(e) { /* keep raw */ } }
            else if (f==='if' && inp.value) o.if = inp.value;
          });
          if (o.text) opts.push(o);
        });
        cmd.options = opts;
        break;
      }
      case 'set': {
        cmd.vars = {};
        box.querySelectorAll('#cf-vars > div').forEach(div => {
          const k = div.querySelector('[data-f="key"]')?.value;
          const v = div.querySelector('[data-f="val"]')?.value;
          if (k) { try { cmd.vars[k] = JSON.parse(v); } catch(e) { cmd.vars[k] = v; } }
        });
        cmd.if = box.querySelector('#cf-if')?.value || undefined;
        break;
      }
      case 'goto': cmd.target = box.querySelector('#cf-target').value; cmd.if = box.querySelector('#cf-if')?.value || undefined; break;
      case 'end': cmd.label = box.querySelector('#cf-label').value; break;
      case 'show': cmd.image = box.querySelector('#cf-image').value; break;
      case 'inspect':
        cmd.x = parseFloat(box.querySelector('#cf-x').value)||0.5;
        cmd.y = parseFloat(box.querySelector('#cf-y').value)||0.5;
        cmd.w = parseFloat(box.querySelector('#cf-w').value)||0.1;
        cmd.h = parseFloat(box.querySelector('#cf-h').value)||0.1;
        cmd.show = { text: box.querySelector('#cf-text').value };
        if (box.querySelector('#cf-image').value) cmd.show.image = box.querySelector('#cf-image').value;
        break;
    }
    close(); selectEditorScene(edSceneIdx);
  };
  // Choice: add option button
  const addOpt = box.querySelector('#cf-add-opt');
  if (addOpt) addOpt.onclick = () => {
    const div = document.createElement('div');
    div.style.cssText = 'border:1px solid #3a4a63;margin:.2em 0;padding:.3em;border-radius:3px';
    div.innerHTML = `<input data-oi="new" data-f="text" placeholder="选项文本" style="width:100%;margin:.2em 0;padding:.2em;background:#0c1120;color:#eee;border:1px solid #3a4a63">
      <select data-oi="new" data-f="goto" style="width:48%;margin:.1em;padding:.2em;background:#0c1120;color:#eee;border:1px solid #3a4a63"><option value="">(无跳转)</option>${ids.map(s=>`<option>${s}</option>`).join('')}</select>
      <input data-oi="new" data-f="set" placeholder="set" style="width:48%;margin:.1em;padding:.2em;background:#0c1120;color:#eee;border:1px solid #3a4a63">
      <input data-oi="new" data-f="if" placeholder="条件(可选)" style="width:100%;margin:.1em;padding:.2em;background:#0c1120;color:#eee;border:1px solid #3a4a63">
      <button data-del="1" style="font-size:.7em;color:#c44">✕删除</button>`;
    addOpt.parentElement.appendChild(div);
    div.querySelector('[data-del]').onclick = () => div.remove();
  };
  // Set: add var button
  const addVar = box.querySelector('#cf-add-var');
  if (addVar) addVar.onclick = () => {
    const div = document.createElement('div');
    div.style.cssText = 'display:flex;gap:.3em;margin:.2em 0';
    div.innerHTML = '<input data-f="key" placeholder="变量名" style="flex:1;padding:.2em;background:#0c1120;color:#eee;border:1px solid #3a4a63"><input data-f="val" placeholder="值" style="flex:1;padding:.2em;background:#0c1120;color:#eee;border:1px solid #3a4a63"><button data-del="1" style="color:#c44">✕</button>';
    addVar.parentElement.appendChild(div);
    div.querySelector('[data-del]').onclick = () => div.remove();
  };
  // Delete buttons
  box.querySelectorAll('[data-del]').forEach(b => b.onclick = () => b.closest('div[style*="border"]')?.remove());
}

// -- 角色管理 --
let edActiveChar = null;
function ensureMatrix(sc) {
  if (!sc._charMatrix) sc._charMatrix = {};
  var total = (sc.script||[]).length || 1;
  (sc.chars||[]).forEach(function(c) {
    if (!sc._charMatrix[c.id] || sc._charMatrix[c.id].length !== total) {
      sc._charMatrix[c.id] = new Array(total).fill(0);
      (sc.script||[]).forEach(function(cmd, idx) {
        if (cmd && cmd.type==='say' && cmd.who===c.id) sc._charMatrix[c.id][idx] = 2;
      });
    }
  });
}
function renderCharChips(sc) {
  var box = $('se-char-chips'); if (!box) return;
  box.innerHTML = '';
  var activeChars = (sc.chars||[]).filter(function(c){return c.id;});
  activeChars.forEach(function(c) {
    var chip = document.createElement('span');
    chip.className = 'se-char-chip on';

    chip.onclick = function() { sc.chars = (sc.chars||[]).filter(function(x){return x.id!==c.id;}); selectEditorScene(edSceneIdx); };
    box.appendChild(chip);
  });
  var addBtn = document.createElement('span');
  addBtn.className = 'se-char-chip off'; addBtn.textContent = '+ 加角色'; addBtn.style.cursor = 'pointer';
  addBtn.onclick = function() {
    var avail = Object.keys(script.characters||{}).filter(function(cid){return !(sc.chars||[]).some(function(c){return c.id===cid;});});
    if (!avail.length) return;
    var menu = document.createElement('div');
    menu.style.cssText = 'position:fixed;z-index:300;background:#141a28;border:1px solid #7fa0d0;border-radius:.4em;padding:.2em;max-height:40vh;overflow-y:auto';
    avail.forEach(function(cid) {
      var item = document.createElement('div');
      item.style.cssText = 'padding:.3em .6em;cursor:pointer;border-radius:3px;font-size:.8em';
      item.textContent = script.characters[cid].name;

        var posXY = [{x:0.85,y:1,scale:1.1},{x:0.15,y:1,scale:1.1},{x:0.5,y:1,scale:1},{x:0.3,y:0.95,scale:0.95},{x:0.7,y:0.95,scale:0.95}];
        var p = posXY[list.length] || posXY[4];

        menu.remove(); selectEditorScene(edSceneIdx);
      };
      item.onmouseenter = function(){item.style.background='#263652';};
      item.onmouseleave = function(){item.style.background='';};
      menu.appendChild(item);
    });
    document.body.appendChild(menu);
    var r = addBtn.getBoundingClientRect();
    menu.style.left = r.left+'px'; menu.style.top = (r.top-menu.offsetHeight-4)+'px';
    setTimeout(function(){document.addEventListener('click',function(){menu.remove();},{once:true});},0);
  };
  box.appendChild(addBtn);
  if (Object.keys(script.characters||{}).length > activeChars.length + 1) {
    var allBtn = document.createElement('span');
    allBtn.className = 'se-char-chip off'; allBtn.textContent = '全部'; allBtn.style.fontSize = '.6em';
    allBtn.onclick = function() {
      var posXY = [{x:0.85,y:1,scale:1.1},{x:0.15,y:1,scale:1.1},{x:0.5,y:1,scale:1},{x:0.3,y:0.95,scale:0.95},{x:0.7,y:0.95,scale:0.95}];
      var pi = sc.chars.length;
      Object.keys(script.characters||{}).forEach(function(cid) {
        if (!(sc.chars||[]).some(function(c){return c.id===cid;})) {
          var p = posXY[pi] || posXY[4];

          pi++;
        }
      });
      selectEditorScene(edSceneIdx);
    };
    box.appendChild(allBtn);
  }
}

/* ================= Z键/键盘 ================= */
function handleKeyboard(ev) {
  if (ev.target.tagName === 'INPUT' || ev.target.tagName === 'TEXTAREA' || ev.target.tagName === 'SELECT') return;
  // Editor navigation
  if (!$('scene-editor').classList.contains('hidden')) {
    if (ev.key === 'ArrowDown') { ev.preventDefault(); navPreview(1); return; }
    if (ev.key === 'ArrowUp') { ev.preventDefault(); navPreview(-1); return; }
    if (ev.key === 'Escape') { exitEditor(); return; }
    if ((ev.key==='a'||ev.key==='A') && edActiveChar && edPreviewLine>=0 && edSceneIdx>=0) {
      ev.preventDefault(); var scA=script.scenes[edSceneIdx]; ensureMatrix(scA);
      scA._charMatrix[edActiveChar][edPreviewLine]=2; renderTimeline(scA); navPreview(1); return;
    }
    if ((ev.key==='s'||ev.key==='S') && edActiveChar && edPreviewLine>=0 && edSceneIdx>=0) {
      ev.preventDefault(); var scS=script.scenes[edSceneIdx]; ensureMatrix(scS);
      scS._charMatrix[edActiveChar][edPreviewLine]=1; renderTimeline(scS); navPreview(1); return;
    }
    if ((ev.key==='d'||ev.key==='D') && edActiveChar && edPreviewLine>=0 && edSceneIdx>=0) {
      ev.preventDefault(); var scD=script.scenes[edSceneIdx]; ensureMatrix(scD);
      scD._charMatrix[edActiveChar][edPreviewLine]=0; renderTimeline(scD); navPreview(1); return;
    }
    if (ev.key==='Tab' && edSceneIdx>=0) {
      ev.preventDefault();
      var scT=script.scenes[edSceneIdx]; var chars=(scT.chars||[]).map(function(c){return c.id;});
      if (chars.length) { var ci=chars.indexOf(edActiveChar); edActiveChar=chars[(ci+1)%chars.length];
        $('se-audio-info').textContent='⌨ '+script.characters[edActiveChar].name+' A=出现 S=暗色 D=不出现 Q=跳过 Tab=跳转'; }
      return;
    }
    if ((ev.key==='q'||ev.key==='Q') && edPreviewLine>=0 && edSceneIdx>=0) {
      ev.preventDefault(); navPreview(1); return;
    }
    return;
  }
  // Game shortcuts
  if (ev.key === 'z' || ev.key === 'Z') {
    ev.preventDefault();
    if (!skipAllMode && !skipMode && !autoMode) { skipAllMode = true; $('mb-skipall').style.background = '#c06040'; }
    else stopSkipAuto();
  }
  if (ev.key === 'a' || ev.key === 'A') {
    autoMode = !autoMode; skipMode = false; skipAllMode = false;
    $('mb-auto').style.background = autoMode ? '#4a6da0' : '';
    $('mb-skip').style.background = ''; $('mb-skipall').style.background = '';
    if (autoMode && waiting === 'advance' && !typing) onTextDone();
  }
  if (ev.key === 'F5') { ev.preventDefault(); saveSlot('quicksave'); }
  if (ev.key === 'F9') { ev.preventDefault(); loadSlot('quicksave'); }
  if (ev.key === 'Escape') {
    if (skipAllMode||skipMode||autoMode) { stopSkipAuto(); return; }
    if (!$('sys-menu').classList.contains('hidden')) { $('sys-menu').classList.add('hidden'); return; }
    if (inGameNow()) openSysMenu();
  }
}
function loadScript(sc) {
  try {
    if (!sc.meta || !Array.isArray(sc.scenes)) throw new Error('缺少 meta 或 scenes');
    script = sc;
    settings.speed = sc.meta.defaults && sc.meta.defaults.text_speed !== undefined ? sc.meta.defaults.text_speed : 30;
    settings.bgm = sc.meta.defaults && sc.meta.defaults.bgm_volume !== undefined ? sc.meta.defaults.bgm_volume : 0.6;
    settings.auto_delay = sc.meta.defaults && sc.meta.defaults.auto_delay !== undefined ? sc.meta.defaults.auto_delay : 1800;
    $('set-speed').value = settings.speed; $('speed-label').textContent = settings.speed === 0 ? '瞬间' : settings.speed;
    $('set-bgm').value = settings.bgm;
    $('set-autodelay').value = settings.auto_delay; $('autodelay-label').textContent = (settings.auto_delay/1000).toFixed(1)+'s';
    $('mb-attrs').classList.toggle('hidden', !(sc.attrs && Object.keys(sc.attrs).length));
    refreshTitle();
  } catch (e) { alert('剧本文件无效：' + e.message); }
}

function sceneTransition() {

function inGameNow() {

  const ids = ['history-panel','settings-panel','save-panel','viewlayer','cglayer','attr-panel',
    'sys-menu','gallery-screen','endings-screen','end-screen','name-input-overlay','cg-viewer','attr-editor-overlay'];
  return ids.every(i => { const el = $(i); return !el || el.classList.contains('hidden'); });
}
/* 对话回看（侧滑抽屉） */
function renderHistory() {
  $('history-list').innerHTML = history.map(h => h.narrate
    ? '<div class="h-narrate">' + h.text + '</div>'
    : '<div><span class="h-who" style="color:' + ((script.characters[h.who] || {}).color || '#fff') + '">' +
      ((script.characters[h.who] || {}).name || h.who) + '</span>' + h.text + '</div>').join('')
    || '<div style="opacity:.5;padding:1em 0">暂无回看记录</div>';
}
function openHistory() {
  stopSkipAuto();
  renderHistory();
  const p = $('history-panel');
  p.classList.remove('hidden');
  /* 等 display 生效后再加 open，触发滑入动画 */
  requestAnimationFrame(() => requestAnimationFrame(() => p.classList.add('open')));
}
function closeHistory() {
  const p = $('history-panel');
  p.classList.remove('open');
  setTimeout(() => p.classList.add('hidden'), 300);
}
/* CG 画廊 */
function collectCgs() {
  const all = [];
  script.scenes.forEach(s => (s.script || []).forEach(c => {
    if (c.type === 'show' && c.image && !all.includes(c.image)) all.push(c.image);
    if (c.type === 'inspect' && c.show && c.show.image && !all.includes(c.show.image)) all.push(c.show.image);
  }));
  return all;
}
function renderGallery() {
  const all = collectCgs(), unlocked = getUnlockedCgs();
  const grid = $('gallery-grid'); grid.innerHTML = '';
  if (!all.length) { grid.innerHTML = '<div class="empty-state">本作暂无可收集的 CG</div>'; return; }
  all.forEach(p => {
    const un = unlocked.includes(p);
    const d = document.createElement('div');
    d.className = 'cg-thumb' + (un ? '' : ' locked');
    if (un) {
      d.style.backgroundImage = 'url("' + assetUrl(p) + '")';
      d.onclick = () => { $('cg-viewer-img').src = assetUrl(p); $('cg-viewer').classList.remove('hidden'); };
    } else {
      d.textContent = '?';
      d.title = '未解锁';
    }
    grid.appendChild(d);
  });
}
/* 结局收集 */
function renderEndings() {
  const got = JSON.parse(localStorage.getItem(lsKey('endings')) || '[]');
  const all = [];
  script.scenes.forEach(s => (s.script || []).forEach(c => {
    if (c.type === 'end' && c.label && !all.includes(c.label)) all.push(c.label);
  }));
  const box = $('endings-list'); box.innerHTML = '';
  if (!all.length) { box.innerHTML = '<div class="empty-state">本作暂无结局收集</div>'; return; }
  all.forEach(label => {
    const un = got.includes(label);
    const d = document.createElement('div');
    d.className = 'ending-card' + (un ? '' : ' locked');
    d.textContent = un ? '🏮 ' + label : '？？？';
    box.appendChild(d);
  });
}
/* 游戏内系统菜单 */
function openSysMenu() { $('sys-menu').classList.remove('hidden'); }

/* ================= UI 事件 ================= */
function bindUI() {
  document.addEventListener('keydown', handleKeyboard);
  $('btn-start').onclick = () => { unlockAudio(); startNewGame(); };
  $('btn-continue').onclick = () => { unlockAudio(); loadSlot('checkpoint'); };
  $('btn-end-title').onclick = backToTitle;
  $('mb-title').onclick = () => { if ($('scene-editor') && !$('scene-editor').classList.contains('hidden')) exitEditor(); else backToTitle(); };
  $('btn-load-script').onclick = () => $('script-file').click();
  $('btn-editor').onclick = enterEditor;
  $('script-file').onchange = ev => {
    const f = ev.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => { try { loadScript(JSON.parse(r.result)); } catch (e) { alert('JSON 解析失败：' + e.message); } };
    r.readAsText(f);
  };
  const onAdvanceClick = ev => { unlockAudio(); if (waiting === 'advance') advance(); };
  $('dlg').onclick = onAdvanceClick;
  $('stage').onclick = ev => { if (ev.target === $('stage') || ev.target.classList.contains('bg') || ev.target.classList.contains('slot')) onAdvanceClick(ev); };
  const ffStart = ev => { if (waiting === 'advance' && !typing) { ffMode = true; advance(); } };
  $('dlg').addEventListener('mousedown', ffStart);
  $('dlg').addEventListener('touchstart', ffStart, { passive:true });
  const ffEnd = () => { if (ffMode) { ffMode = false; clearTimeout(autoTimer); } };
  document.addEventListener('mouseup', ffEnd);
  document.addEventListener('touchend', ffEnd);
  $('mb-hist').onclick = openHistory;
  $('mb-save').onclick = () => { renderSavePanel(true); $('save-panel-title').textContent = '存档'; $('save-panel').classList.remove('hidden'); };
  $('mb-load').onclick = () => { renderSavePanel(false); $('save-panel-title').textContent = '读档'; $('save-panel').classList.remove('hidden'); };
  $('mb-set').onclick = () => $('settings-panel').classList.remove('hidden');
  /* ---- 橙光化扩展绑定 ---- */
  $('mb-menu').onclick = () => { stopSkipAuto(); openSysMenu(); };
  $('hist-close').onclick = closeHistory;
  $('history-panel').onclick = ev => { if (ev.target === $('history-panel')) closeHistory(); };
  $('sm-resume').onclick = () => $('sys-menu').classList.add('hidden');
  $('sm-save').onclick = () => { $('sys-menu').classList.add('hidden'); renderSavePanel(true); $('save-panel-title').textContent = '存档'; $('save-panel').classList.remove('hidden'); };
  $('sm-load').onclick = () => { $('sys-menu').classList.add('hidden'); renderSavePanel(false); $('save-panel-title').textContent = '读档'; $('save-panel').classList.remove('hidden'); };
  $('sm-set').onclick = () => { $('sys-menu').classList.add('hidden'); $('settings-panel').classList.remove('hidden'); };
  $('sm-hist').onclick = () => { $('sys-menu').classList.add('hidden'); openHistory(); };
  $('sm-title').onclick = () => { $('sys-menu').classList.add('hidden'); backToTitle(); };
  $('btn-gallery').onclick = () => { renderGallery(); $('gallery-screen').classList.remove('hidden'); };
  $('btn-endings').onclick = () => { renderEndings(); $('endings-screen').classList.remove('hidden'); };
  /* AI 生成入口：模块由独立文件提供，不存在则按钮保持隐藏 */
  $('btn-ai-gen').onclick = () => { if (window.AutoNovel && typeof window.AutoNovel.open === 'function') window.AutoNovel.open(); };
  $('cg-viewer').onclick = () => $('cg-viewer').classList.add('hidden');
  /* 移动端手势：上滑开回看、下滑开菜单 */
  let gTouchY = null, gTouchX = null;
  $('stage').addEventListener('touchstart', ev => {
    if (ev.touches.length === 1) { gTouchY = ev.touches[0].clientY; gTouchX = ev.touches[0].clientX; }
  }, { passive:true });
  $('stage').addEventListener('touchend', ev => {
    if (gTouchY === null) return;
    const dy = ev.changedTouches[0].clientY - gTouchY;
    const dx = ev.changedTouches[0].clientX - gTouchX;
    gTouchY = null;
    if (Math.abs(dy) < 70 || Math.abs(dy) < Math.abs(dx) * 1.2) return;
    if (!inGameNow()) return;
    if (dy < 0) openHistory(); else { stopSkipAuto(); openSysMenu(); }
  }, { passive:true });
  $('mb-attrs').onclick = () => { renderAttrPanel(); $('attr-panel').classList.remove('hidden'); };
  $('mb-auto').onclick = () => {
    autoMode = !autoMode; skipMode = false; skipAllMode = false;
    $('mb-auto').style.background = autoMode ? '#4a6da0' : '';
    $('mb-skip').style.background = ''; $('mb-skipall').style.background = '';
    if (autoMode && waiting === 'advance' && !typing) onTextDone();
  };
  $('mb-skip').onclick = () => {
    skipMode = !skipMode; skipAllMode = false; autoMode = false;
    $('mb-skip').style.background = skipMode ? '#4a6da0' : '';
    $('mb-auto').style.background = ''; $('mb-skipall').style.background = '';
    if (skipMode && waiting === 'advance' && !typing) onTextDone();
    if (skipMode && waiting === 'choice') stopSkipAuto();
  };
  $('mb-skipall').onclick = () => {
    skipAllMode = !skipAllMode; skipMode = false; autoMode = false;
    $('mb-skipall').style.background = skipAllMode ? '#c06040' : '';
    $('mb-skip').style.background = ''; $('mb-auto').style.background = '';
    if (skipAllMode && waiting === 'advance' && !typing) advance();
  };
  document.querySelectorAll('[data-close]').forEach(b => b.onclick = () => $(b.dataset.close).classList.add('hidden'));
  $('set-speed').oninput = ev => {
    settings.speed = parseInt(ev.target.value, 10);
    $('speed-label').textContent = settings.speed === 0 ? '瞬间' : settings.speed;
    persistSettings();
  };
  $('set-autodelay').oninput = ev => {
    settings.auto_delay = parseInt(ev.target.value, 10);
    $('autodelay-label').textContent = (settings.auto_delay/1000).toFixed(1)+'s';
    persistSettings();
  };
  $('set-bgm').oninput = ev => { settings.bgm = parseFloat(ev.target.value); if (curAudio) curAudio.volume = settings.bgm; persistSettings(); };
  $('set-sfx').oninput = ev => { settings.sfx = parseFloat(ev.target.value); persistSettings(); };
  $('set-voice').oninput = ev => { settings.voice = parseFloat(ev.target.value); persistSettings(); };
  $('set-voice-mode').onchange = ev => { settings.voice_mode = ev.target.value; if (settings.voice_mode === 'off') stopVoice(); persistSettings(); };
  // Scene editor
  $('se-attrs').onclick = showAttrEditor;
  $('se-exit').onclick = exitEditor;
  ['say','narrate','choice','set','goto','end'].forEach(function(t) {
    var btn = $('se-qadd-'+t); if (!btn) return;
    btn.onclick = function() {
      if (edSceneIdx<0) return;
      var sc = script.scenes[edSceneIdx];
      var defs = {say:{type:'say',who:Object.keys(script.characters)[0]||'',text:''},narrate:{type:'narrate',text:''},choice:{type:'choice',options:[{text:'选项1',goto:''}]},set:{type:'set',vars:{}},goto:{type:'goto',target:''},end:{type:'end',label:''}};
      var newCmd = defs[t]||{type:t};
      var insertAt = edPreviewLine>=0 ? edPreviewLine+1 : sc.script.length;
      sc.script.splice(insertAt, 0, newCmd);
      selectEditorScene(edSceneIdx);
      previewLine(sc, insertAt);
    };
  });
  $('se-add-scene').onclick = () => {
    const newId = prompt('场景 ID (如 s_new):', 's_new');
    if (!newId) return;
    script.scenes.push({id:newId, background:'', chars:[], script:[{type:'narrate',text:'新场景'}]});
    refreshEditorScenes(); selectEditorScene(script.scenes.length-1);
  };
  $('se-play-scene').onclick = () => {
    if (edSceneIdx<0) return;
    syncEditorChars();
    exitEditor();
    sceneIdx = edSceneIdx; lineIdx = 0;
    $('title-screen').classList.add('hidden');
    $('end-screen').classList.add('hidden');
    enterScene(edSceneIdx);
  };
  $('se-export-json').onclick = exportEditorJSON;
  $('se-bg-select').onchange = ev => {
    if (edSceneIdx<0) return;
    script.scenes[edSceneIdx].background = ev.target.value;
    const bg = $('se-canvas-bg');
    if (ev.target.value && ev.target.value !== 'none') { bg.className=''; bg.style.backgroundImage=`url("${assetUrl(ev.target.value)}")`; }
    else { bg.className='placeholder'; bg.style.backgroundImage=''; }
  };
  $('se-bgm-select').onchange = ev => {
    if (edSceneIdx<0) return;
    const v = ev.target.value;
    script.scenes[edSceneIdx].bgm = v ? {src:v, loop:true, volume:0.5} : undefined;
    $('se-audio-info').textContent = v ? 'BGM:'+(v||'').replace('bgm/','') : '';
    renderTimeline(script.scenes[edSceneIdx]);
  };
  $('se-sfx-select').onchange = ev => {
    if (edSceneIdx<0 || !ev.target.value) return;
    const sc = script.scenes[edSceneIdx];
    const sfxList = sc.sfx ? (Array.isArray(sc.sfx)?sc.sfx:[sc.sfx]) : [];
    sfxList.push(ev.target.value);
    sc.sfx = sfxList;
    renderTimeline(sc);
  };
  $('se-checkpoint').onchange = ev => {
    if (edSceneIdx<0) return;
    script.scenes[edSceneIdx].checkpoint = ev.target.checked;
  };
}
function persistSettings() { localStorage.setItem('wenyou_settings', JSON.stringify(settings)); }
function restoreSettings() {
  const raw = localStorage.getItem('wenyou_settings');
  if (raw) { const s = JSON.parse(raw); Object.assign(settings, s); }
  $('set-speed').value = settings.speed; $('speed-label').textContent = settings.speed === 0 ? '瞬间' : settings.speed;
  $('set-bgm').value = settings.bgm;
  $('set-sfx').value = settings.sfx;
  $('set-voice').value = settings.voice;
  $('set-voice-mode').value = settings.voice_mode;
  $('set-autodelay').value = settings.auto_delay; $('autodelay-label').textContent = (settings.auto_delay/1000).toFixed(1)+'s';
}

/* ================= 标题页粒子（花瓣/灯笼，纯手写 canvas，无依赖） ================= */
const TitleFx = {
  cv:null, ctx:null, parts:[], W:0, H:0,
  init() {
    this.cv = $('title-particles');
    if (!this.cv) return;
    this.ctx = this.cv.getContext('2d');
    this.resize();
    window.addEventListener('resize', () => this.resize());
    for (let i = 0; i < 34; i++) this.parts.push(this.petal(true));
    for (let i = 0; i < 6; i++) this.parts.push(this.lantern(true));
    const loop = () => {
      requestAnimationFrame(loop);
      /* 标题页隐藏时不绘制，省电 */
      if ($('title-screen').classList.contains('hidden')) return;
      this.step();
    };
    loop();
  },
  resize() { this.W = this.cv.width = window.innerWidth; this.H = this.cv.height = window.innerHeight; },
  petal(any) {
    return { k:'p', x:Math.random()*this.W, y:any ? Math.random()*this.H : -20 - Math.random()*40,
      s:4+Math.random()*7, vy:.35+Math.random()*.8, ph:Math.random()*6.28, sw:.4+Math.random()*.8,
      r:Math.random()*6.28, vr:(Math.random()-.5)*.03, a:.35+Math.random()*.45 };
  },
  lantern(any) {
    return { k:'l', x:Math.random()*this.W, y:any ? Math.random()*this.H : this.H + 30,
      s:2.5+Math.random()*3.5, vy:.15+Math.random()*.3, ph:Math.random()*6.28, a:.25+Math.random()*.35 };
  },
  step() {
    const c = this.ctx;
    c.clearRect(0, 0, this.W, this.H);
    this.parts.forEach((p, i) => {
      p.ph += .012;
      if (p.k === 'p') {
        /* 花瓣：飘落 + 左右摇摆 + 自旋 */
        p.y += p.vy; p.x += Math.sin(p.ph) * p.sw; p.r += p.vr;
        if (p.y > this.H + 30 || p.x < -40 || p.x > this.W + 40) this.parts[i] = this.petal(false);
        c.save(); c.translate(p.x, p.y); c.rotate(p.r);
        c.fillStyle = 'rgba(255,183,197,' + p.a + ')';
        c.beginPath();
        c.moveTo(0, -p.s);
        c.bezierCurveTo(p.s*.9, -p.s*.5, p.s*.7, p.s*.7, 0, p.s);
        c.bezierCurveTo(-p.s*.7, p.s*.7, -p.s*.9, -p.s*.5, 0, -p.s);
        c.fill(); c.restore();
      } else {
        /* 灯笼光点：缓缓上升 + 暖光闪烁 */
        p.y -= p.vy; p.x += Math.sin(p.ph) * .3;
        if (p.y < -30) this.parts[i] = this.lantern(false);
        c.save();
        c.globalAlpha = p.a * (.7 + .3 * Math.sin(p.ph * 2));
        c.shadowColor = 'rgba(255,170,80,.9)'; c.shadowBlur = 14;
        c.fillStyle = '#ffc373';
        c.beginPath(); c.ellipse(p.x, p.y, p.s, p.s * 1.25, 0, 0, 6.29); c.fill();
        c.restore();
      }
    });
  }
};

/* ================= 启动 ================= */
bindUI();
restoreSettings();
loadScript(EMBEDDED_SCRIPT);
TitleFx.init();
document.addEventListener('click', unlockAudio, { once:false });
</script>
